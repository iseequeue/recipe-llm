ка варится рыба, подготовить овощи. Очистить картофель, морковь и лук. Картофель нарезать кубиками, морковь - кружочками, лук мелко порубить.\n4. Когда рыба сварится, вынуть ее из кастрюли шумовкой, бульон процедить через сито или марлю.\n5. Бульон вернуть в кастрюлю, добавить нарезанные овощи и варить еще 15 минут.\n6. Добавить лаврушку, перец горошком, кусочки рыбы и зелень. Варить еще 5 минут.\n7. Готовую уху разлить по тарелкам, посыпать зеленью и подать к столу. Приятного аппетита!", "right": "### Уха\n\n**Описание:** уха — это традиционный русский суп из рыбы, который отличается насыщенным вкусом и ароматом. Это простое в приготовлении блюдо, которое порадует вас и ваших близких.\n\n**Время приготовления:** 40–60 минут.\n\n**Количество порций:** зависит от размера кастрюли и аппетита едоков. Например, из указанного количества ингредиентов получается примерно 5–6 порций.\n\n### Ингредиенты\n* Вода — 2 литра.\n* Рыба (например, судак, окунь или щука) — 500 г.\n* Картофель — 3–4 средних клубня.\n* Морковь — 1 штука.\n* Репчатый лук — 1 штука.\n* Лавровый лист — 2 штуки.\n* Чёрный перец горошком — 5–7 штук.\n* Соль — по вкусу.\n* Зелень (укроп, петрушка) — для подачи.\n* Лимон — для подачи (по желанию).\n\n### Шаги приготовления\n1. Подготовьте все необходимые ингредиенты. Очистите картофель, морковь и лук.\n2. В кастрюлю налейте воду и поставьте её на огонь. Доведите воду до кипения.\n3. Пока вода нагревается, нарежьте картофель кубиками среднего размера, морковь кружочками, а лук — мелкими кусочками.\n4. Когда вода закипит, добавьте в кастрюлю рыбу. Если используете целую рыбу, предварительно нарежьте её на порционные куски. Варите рыбу 5–7 минут после повторного закипания воды.\n5. Добавьте в кастрюлю нарезанный картофель, морковь и лук.\n6. Посолите бульон по вкусу, добавьте лавровый лист и чёрный перец горошком.\n7. Варите всё вместе ещё 15–20 минут, пока картофель не станет мягким.\n8. Снимите кастрюлю с огня и дайте ухе немного настояться под крышкой.\n9. Подавайте уху горячей, посыпав зеленью укропа и петрушки. При желании можно добавить ломтик лимона."}, {"id": "ingr_09", "prompt": "У меня есть: фарш, томатная паста и спагетти. Что можно приготовить? Напиши рецепт.", "a_left": false, "left": "# Спагетти \"Болоньезе\"\n\n**Время приготовления:** 60 минут \n**Порций:** 4\n\n## Ингредиенты\n- Фарш мясной — 500 г\n- Лук репчатый — 1 шт\n- Морковь — 2 шт\n- Сельдерей черешковый — 3 шт\n- Чеснок — 2 зуб.\n- Томатная паста — 2 ст. л.\n- Вино белое сухое — 1 стак.\n- Бульон — 1 стак.\n- Масло оливковое — 2 ст. л.\n- Соль\n- Перец черный\n- Базилик\n- Орегано\n- Макаронные изделия\n\n## Приготовление\n1. На оливковом масле обжарить мелко нарезанный лук до золотистого цвета.\n2. Добавить морковь, нарезанную кубиками, сельдерей (нарезанный кубиками) и чеснок (измельченный). Обжаривать еще 5 минут.\n3. Добавить фарш и готовить, помешивая, пока он не подрумянится.\n4. Влить вино и бульон, добавить томатную пасту, соль, перец, базилик и орегано. Довести до кипения, уменьшить огонь и тушить около 30 минут.\n5. Отварить спагетти в подсоленной воде до готовности.\n6. Выложить спагетти на тарелку, сверху выложить соус болоньезе.\n7. Приятного аппетита!", "right": "### Спагетти с фаршем в томатной пасте\n\n**Описание:** это простое и вкусное блюдо, которое подойдёт для быстрого ужина или обеда. Сочные кусочки фарша в сочетании с ароматным соусом из томатной пасты создают насыщенный вкус.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** зависит от размера вашей кастрюли и аппетита участников трапезы (например, из указанных количеств получится примерно на 4 порции).\n\n### Ингредиенты\n* Фарш — 400 г.\n* Томатная паста — 2 столовые ложки.\n* Спагетти — 200 г.\n* Соль — по вкусу.\n* Чёрный перец молотый — по вкусу.\n* Чеснок — 1–2 зубчика (по желанию).\n* Оливковое масло — 1 столовая ложка (для жарки).\n\n### Шаги приготовления\n1. Поставьте кастрюлю с водой на огонь и доведите воду до кипения. Подготовьте ёмкость с холодной водой и солью для последующего охлаждения спагетти после варки (если вы планируете использовать этот метод).\n2. В сковороде разогрейте оливковое масло на среднем огне.\n3. Измельчите чеснок и добавьте его в сковороду. Обжаривайте чеснок в течение нескольких секунд до появления аромата.\n4. Добавьте фарш в сковороду и обжаривайте, разбивая комочки вилкой, пока фарш не станет коричневым. Это займёт около 5–7 минут.\n5. Добавьте томатную пасту в сковороду и перемешайте с фаршем. Обжаривайте ещё пару минут, чтобы томатная паста равномерно распределилась и немного загустела.\n6. Посолите и поперчите соус по вкусу.\n7. Тем временем вода в кастрюле закипела. Отварите спагетти согласно инструкции на упаковке до состояния аль денте. Слейте воду через дуршлаг.\n8. Переложите спагетти в сковороду с соусом, тщательно перемешайте.\n9. Подавайте готовое блюдо горячим, украсив свежей зеленью по желанию."}, {"id": "ingr_08", "prompt": "Что приготовить из таких продуктов: яблоки, тыква и корица? Нужен подробный рецепт.", "a_left": false, "left": "# Яблочно-тыквенный пирог\n\n**Время приготовления:** 60 минут \n**Порций:** 8\n\n## Ингредиенты\n- Мука пшеничная\n- Сахар — 1 стак.\n- Масло сливочное — 250 г\n- Яйцо куриное — 3 шт\n- Разрыхлитель теста — 1 ч. л.\n- Корица — 1/4 ч. л.\n- Ванилин — 1/4 ч. л.\n- Соль — 1 щепот.\n- Молоко — 1 ст. л.\n- Яблоко — 3 шт\n- Тыква — 300 г\n- Сок лимонный — 1 ст. л.\n\n## Приготовление\n1. Муку просеять в миску, добавить сахар, разрыхлитель, соль, ванилин и корицу. Перемешать.\n2. Добавить холодное масло, нарезанное кубиками. Перетереть руками до состояния крошки.\n3. Влить молоко и замесить тесто. Скатать его в шар, завернуть в пленку и убрать в холодильник на 30 мин.\n4. Яблоки очистить от кожуры и сердцевины, нарезать небольшими кусочками.\n5. Тыкву натереть на крупной терке.\n6. Тесто раскатать между двумя листами пергамента или пищевой пленки. Выложить в форму (диаметр 24 см), сформировав бортики высотой около 2 см. Наколоть вилкой по всей поверхности.\n7. Выпекать при температуре 190 градусов 10-15 мин., пока края не зарумянятся.\n8. Тем временем смешать тыкву, яблоки, сок лимона и 2 ст. л. сахара. Выложить начинку на корж.\n9. Взбить яйца с сахаром до пышной массы.\n10. Залить начинку яичной смесью.\n11. Выпекать еще 30-35 мин. при той же температуре. Готовность проверить деревянной шпажкой.", "right": "### Яблочно-тыквенный пирог с корицей\n\n**Описание:** ароматный и вкусный пирог с начинкой из тыквы и яблок, приправленный корицей. Это отличный выбор для чаепития или десерта.\n\n**Время приготовления:** 1 час 30 минут (не включая время на охлаждение).\n\n**Количество порций:** 6–8.\n\n### Ингредиенты\n* **Тыква** — 400 г;\n* **Яблоки** — 2 шт.;\n* **Сахар** — 150 г (75 г в начинку, 75 г для посыпки);\n* **Мука** — 200 г;\n* **Разрыхлитель теста** — 1 ч. л.;\n* **Корица** — 1 ч. л.;\n* **Гвоздика молотая** — щепотка (по желанию);\n* **Масло сливочное** — 100 г (50 г в начинку, 50 г для смазывания формы);\n* **Яйца** — 2 шт.;\n* **Ванильный сахар** — 1 ч. л.\n\n### Шаги приготовления\n1. Разогрейте духовку до 180 °C. Подготовьте форму для пирога, смажьте её сливочным маслом.\n2. Очистите тыкву от кожуры и семян, нарежьте небольшими кубиками. Яблоки очистите от сердцевины и нарежьте тонкими ломтиками.\n3. В миске смешайте муку, разрыхлитель, корицу и гвоздику.\n4. В другой миске взбейте яйца, добавьте сахар, ванильный сахар и растопленное сливочное масло. Хорошо перемешайте.\n5. Постепенно добавляйте сухие ингредиенты к яичной смеси, перемешивая до однородности.\n6. Добавьте тыкву и яблоки в тесто, аккуратно перемешайте.\n7. Вылейте тесто в подготовленную форму.\n8. Посыпьте сверху сахаром (для карамелизации).\n9. Поставьте форму в разогретую духовку и выпекайте примерно 40–50 минут, пока зубочистка, вставленная в центр пирога, не будет выходить чистой.\n10. Дайте пирогу немного остыть перед подачей. Приятного аппетита!"}, {"id": "dish_15", "prompt": "Напиши рецепт: Драники", "a_left": false, "left": "# Драники\n\n**Время приготовления:** 30 минут \n**Порций:** 4\n\n## Ингредиенты\n- Картофель — 5 шт\n- Лук репчатый — 1 шт\n- Яйцо куриное — 2 шт\n- Мука пшеничная\n- Соль\n- Перец черный\n- Масло растительное\n\n## Приготовление\n1. Натираем картофель на мелкой терке (я натираю в комбайне).\n2. Добавляем лук, яйца, муку, соль, перец.\n3. Все перемешиваем.\n4. Жарим на растительном масле с двух сторон до золотистой корочки.\n5. Подавать со сметаной или майонезом. Приятного аппетита!", "right": "### Драники\n\n**Описание:** драники — это популярное блюдо белорусской кухни, представляющее собой оладьи из тёртого картофеля. Они имеют золотистую корочку и нежную текстуру внутри. Подаются горячими со сметаной, сливочным маслом или другими добавками по вкусу.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** зависит от размера сковороды и желаемого количества драников. Обычно получается около 6–8 штук среднего размера.\n\n### Ингредиенты\n* Картофель — 500 г;\n* Лук репчатый — 1 шт.;\n* Мука пшеничная — 2 ст. л.;\n* Яйцо куриное — 1 шт.;\n* Соль — по вкусу;\n* Перец чёрный молотый — по вкусу;\n* Масло растительное для жарки.\n\n### Приготовление\n1. Очистите картофель и лук. Натрите их на мелкой тёрке.\n2. Отожмите натёртый картофель и лук руками, чтобы удалить лишний сок.\n3. В миске смешайте картофельную массу, муку, яйцо, соль и перец. Хорошо перемешайте все ингредиенты до однородной консистенции.\n4. Разогрейте сковороду на среднем огне и добавьте растительное масло.\n5. Выкладывайте картофельную смесь на сковороду ложкой, формируя оладьи.\n6. Жарьте драники с каждой стороны до золотистой корочки, примерно по 2–3 минуты с каждой стороны.\n7. Готовые драники выкладывайте на бумажное полотенце, чтобы удалить излишки масла.\n8. Подавайте драники горячими со сметаной, сливочным маслом, зеленью или другими добавками по вкусу."}, {"id": "ingr_18", "prompt": "У меня есть: овсянка, банан и молоко. Что можно приготовить? Напиши рецепт.", "a_left": false, "left": "# Овсяная каша \"Нежная\"\n\n**Время приготовления:** 10 минут \n**Порций:** 2\n\n## Ингредиенты\n- Хлопья овсяные — 3 ст. л.\n- Молоко — 250 мл\n- Банан — 1 шт\n- Сахар коричневый — по вкусу\n- Соль — по вкусу\n\n## Приготовление\n1. Вскипятить молоко (или воду). Добавить соль и сахар по вкусу.\n2. Всыпать хлопья.\n3. Варить до готовности хлопьев, помешивая.\n4. Пока варится каша, очистить банан и нарезать его кусочками.\n5. Готовую кашу выложить в тарелку, добавить кусочки банана и перемешать.\n6. Приятного аппетита!", "right": "### Овсяная каша с бананом и молоком\n\n**Описание:** нежная овсяная каша с кусочками спелого банана — это идеальный завтрак или перекус в течение дня. Простое и полезное блюдо, которое понравится всей семье.\n\n**Время приготовления:** 10–15 минут.\n\n**Количество порций:** 1–2 порции.\n\n### Ингредиенты\n* Овсяные хлопья — 4–5 столовых ложек;\n* Молоко — 200 мл;\n* Банан — 1 шт.;\n* Соль — щепотка;\n* Сахар или мёд — по вкусу (по желанию).\n\n### Шаги приготовления\n1. Вскипятите молоко в небольшой кастрюле.\n2. Добавьте овсяные хлопья в кипящее молоко, перемешайте и убавьте огонь.\n3. Варите кашу на медленном огне, помешивая, около 5–7 минут до загустения. Время варки зависит от желаемой консистенции каши.\n4. Очистите банан и нарежьте его кружочками.\n5. Когда каша будет готова, добавьте кусочки банана, соль, сахар или мёд по вкусу. Перемешайте.\n6. Подавайте кашу горячей, при желании можно добавить ещё немного мёда или сахара. Приятного аппетита!"}, {"id": "ingr_07", "prompt": "Придумай рецепт, в котором используются капуста, морковь и свинина.", "a_left": false, "left": "# Капуста со свининой\n\n**Время приготовления:** 60 минут \n**Порций:** 4\n\n## Ингредиенты\n- Свинина — 500 г\n- Лук репчатый — 1 шт\n- Морковь — 2 шт\n- Перец болгарский — 1 шт\n- Чеснок — 3 зуб.\n- Томатная паста — 2 ст. л.\n- Соль — по вкусу\n- Сахар — 1 ч. л.\n- Масло растительное — 3 ст. л.\n- Вода — 1 стак.\n- Капуста белокочанная\n\n## Приготовление\n1. Мясо нарезать небольшими кусочками.\n2. Обжарить мясо до золотистой корочки.\n3. Добавить нарезанный полукольцами лук и тертую на крупной терке морковь.\n4. Жарить еще 5 минут.\n5. Затем добавить нарезанный соломкой перец и измельченный чеснок.\n6. Влить воду, довести до кипения.\n7. Добавить томатную пасту, соль, сахар.\n8. Тушить под крышкой на медленном огне 15 минут.\n9. Затем выложить капусту (у меня замороженная), перемешать.\n10. Тушить до готовности капусты.\n11. Приятного аппетита!", "right": "### Тушёная капуста с морковью и свининой\n\n**Описание:** это сытное и ароматное блюдо, которое сочетает в себе нежность свинины, сладость моркови и хрустящую текстуру капусты. Отличный выбор для семейного ужина или обеда.\n\n**Время приготовления:** 40–50 минут.\n\n**Количество порций:** 4.\n\n### Ингредиенты\n* Свинина (мякоть) — 300 г.\n* Капуста белокочанная — 400 г.\n* Морковь — 1 шт. (среднего размера).\n* Лук репчатый — 1 шт. (среднего размера).\n* Томатная паста — 2 ст. л.\n* Растительное масло — 2 ст. л.\n* Соль — по вкусу.\n* Чёрный перец молотый — по вкусу.\n* Лавровый лист — 2 шт.\n* Вода — 100 мл.\n\n### Шаги приготовления\n1. Нарежьте свинину небольшими кусочками. Очистите лук и нарежьте его кубиками. Морковь очистите и натрите на крупной тёрке.\n2. Разогрейте растительное масло в глубокой сковороде или кастрюле. Обжарьте кусочки свинины до золотистой корочки. Выньте мясо из сковороды.\n3. В той же сковороде обжарьте нарезанный лук до прозрачности. Добавьте натёртую морковь и обжаривайте ещё несколько минут, пока морковь не станет мягкой.\n4. Верните свинину обратно в сковороду. Добавьте томатную пасту, соль, чёрный перец и лавровый лист. Перемешайте.\n5. Нашинкуйте капусту и добавьте её к остальным ингредиентам. Влейте воду.\n6. Тушите всё вместе под крышкой на среднем огне около 20–30 минут, пока капуста не станет мягкой. При необходимости можно добавить немного воды.\n7. Подавайте тушёную капусту с морковью и свининой горячей, посыпав свежей зеленью по вкусу."}, {"id": "ingr_00", "prompt": "У меня есть: курица, рис и морковь. Что можно приготовить? Напиши рецепт.", "a_left": true, "left": "### Куриный плов с морковью\n\n**Описание:** ароматный и насыщенный плов из курицы с добавлением моркови. Это блюдо порадует вас своим вкусом и станет отличным обедом или ужином.\n\n**Время приготовления:** 40–60 минут (время может варьироваться в зависимости от вашей плиты и посуды).\n\n**Количество порций:** 4 порции.\n\n### Ингредиенты\n* Курица (филе или кусочки) — 500 г.\n* Рис — 2 стакана.\n* Морковь — 2 штуки (примерно 150–200 г).\n* Репчатый лук — 1 штука (среднего размера).\n* Растительное масло — 3–4 столовые ложки.\n* Соль — по вкусу.\n* Специи для плова (например, куркума, зира, паприка) — по вкусу.\n\n### Шаги приготовления\n1. Подготовьте все ингредиенты. Курицу нарежьте небольшими кусочками. Морковь очистите и нарежьте соломкой или кубиками. Лук очистите и нарежьте полукольцами.\n2. Разогрейте сковороду или казан с растительным маслом на среднем огне.\n3. Обжарьте курицу до золотистой корочки. Выложите кусочки курицы на разогретую сковороду и обжаривайте, помешивая, до золотистого цвета.\n4. Добавьте нарезанный лук и обжарьте вместе с курицей до прозрачности лука.\n5. Добавьте морковь и жарьте всё вместе ещё несколько минут, пока морковь не станет мягкой.\n6. Промойте рис под проточной водой, чтобы удалить лишний крахмал. Затем добавьте промытый рис к курице и овощам.\n7. Посолите по вкусу и добавьте специи для плова. Перемешайте.\n8. Влейте необходимое количество горячей воды так, чтобы она покрывала содержимое сковороды примерно на палец.\n9. Доведите воду до кипения, затем уменьшите огонь до минимума, накройте крышкой и готовьте плов около 20–25 минут, пока вся вода не впитается, а рис не станет мягким.\n10. Готовый плов перемешайте и подавайте горячим. Приятного аппетита!", "right": "# Курица в мультиварке\n\n**Время приготовления:** 60 минут \n**Порций:** 4\n\n## Ингредиенты\n- Курица — 1 шт\n- Лук репчатый — 2 шт\n- Морковь — 1 шт\n- Рис — 3 стак.\n- Вода — 5 стак.\n- Соль\n- Перец черный\n- Масло растительное\n\n## Приготовление\n1. Курицу разделываем на порционные куски (у меня была домашняя курочка).\n2. В чашу мультиварки наливаем немного растительного масла, выкладываем курицу и обжариваем ее до золотистой корочки.\n3. Пока жарится курица, чистим лук и морковь. Нарезаем их кубиками или соломкой - как вам больше нравится.\n4. Добавляем овощи к курице и перемешиваем.\n5. Засыпаем промытый рис, солим, перчим по вкусу, заливаем водой и ставим режим \"Плов\".\n6. Через час наш вкусный ужин готов! Приятного аппетита!!!"}, {"id": "ingr_10", "prompt": "Придумай рецепт, в котором используются нут, чеснок и лимон.", "a_left": true, "left": "### Нут с чесноком и лимоном\n\n**Описание:** это ароматное и сытное блюдо из нута, которое станет отличным дополнением к вашему столу. Чеснок придаёт пикантность, а лимон — свежесть и лёгкость.\n\n**Время приготовления:** около 1 часа 20 минут.\n\n**Количество порций:** 4–5.\n\n### Ингредиенты\n* Нут — 200 г;\n* Вода — 600 мл;\n* Соль — по вкусу;\n* Чеснок — 3 зубчика;\n* Лимон — ½ шт.;\n* Оливковое масло — 2 ст. л.;\n* Свежая зелень (например, петрушка или кинза) — для подачи.\n\n### Шаги приготовления\n1. Промойте нут под проточной водой. Переложите его в кастрюлю и залейте водой. Оставьте на 1 час для замачивания.\n2. После замачивания переложите нут обратно в кастрюлю, добавьте соль по вкусу и залейте свежей водой так, чтобы она покрывала нут примерно на 5 см. Варите на среднем огне около 40–50 минут до мягкости.\n3. Пока варится нут, очистите чеснок и мелко нарежьте его.\n4. Разогрейте оливковое масло на сковороде. Обжарьте нарезанный чеснок на среднем огне до золотистого цвета. Это займёт несколько минут.\n5. Когда нут будет готов, слейте лишнюю воду и переложите его на сковороду с обжаренным чесноком. Перемешайте.\n6. Выдавите сок половины лимона прямо на нут. Перемешайте ещё раз. Попробуйте на вкус и при необходимости добавьте немного соли.\n7. Подавайте готовое блюдо, украсив свежей зеленью.", "right": "# Нут по-турецки\n\n**Время приготовления:** 120 минут \n**Порций:** 4\n\n## Ингредиенты\n- Нут — 350 г\n- Лук репчатый — 1 шт\n- Чеснок — 2 зуб.\n- Перец болгарский — 1 шт\n- Лимон — 1/2 шт\n- Масло оливковое — 6 ст. л.\n- Соль — по вкусу\n- Перец черный — по вкусу\n- Петрушка — 1 пуч.\n\n## Приготовление\n1. Нут замочить на ночь в холодной воде (на 8 часов). Воду слить, залить свежей водой и варить до готовности около часа.\n2. Пока варится нут, мелко нарезать лук и обжарить его в оливковом масле до золотистого цвета.\n3. Добавить к луку нарезанный кубиками перец и измельченный чеснок, обжаривать еще пару минут.\n4. Слить воду из кастрюли с нутом, добавить овощи и перемешать.\n5. Посолить, поперчить, полить соком лимона и подавать, посыпав петрушкой."}, {"id": "dish_23", "prompt": "Дай рецепт блюда «Салат Цезарь с курицей».", "a_left": true, "left": "### Салат «Цезарь» с курицей\n\n**Описание:** изысканный салат с нежными кусочками куриного филе, хрустящими листьями салата, ароматными сухариками и соусом на основе яиц, оливкового масла и горчицы. Это блюдо станет отличным выбором для праздничного стола или повседневного ужина.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** 4.\n\n### Ингредиенты\n* Куриное филе — 400 г.\n* Листья салата (например, романо) — 150 г.\n* Белый хлеб — 100 г.\n* Сыр пармезан — 70 г.\n* Яйца — 2 шт.\n* Оливковое масло — 3 ст. л.\n* Горчица дижонская — 1 ч. л.\n* Лимонный сок — 1 ст. л.\n* Чеснок — 1 зубчик.\n* Соль — по вкусу.\n* Чёрный перец молотый — по вкусу.\n\n### Приготовление\n1. Нарежьте куриное филе небольшими кубиками и посолите, поперчите по вкусу. Обжарьте на сковороде до готовности. Готовое мясо остудите и нарежьте ломтиками.\n2. Приготовьте сухарики: нарежьте белый хлеб кубиками, обжарьте их на сковороде с измельчённым чесноком до золотистой корочки.\n3. Отварите яйца вкрутую (около 7–8 минут), затем охладите их под холодной водой и отделите желтки от белков. Желтки понадобятся для соуса.\n4. Для соуса смешайте оливковое масло, горчицу, лимонный сок, соль и перец. Взбейте блендером до однородной консистенции.\n5. Натрите сыр пармезан на мелкой тёрке.\n6. На тарелку выложите листья салата, сверху разместите кусочки курицы, сухарики и посыпьте всё сыром.\n7. Полейте салат приготовленным соусом и подавайте к столу.", "right": "# Салат Цезарь с курицей\n\n**Время приготовления:** 30 минут \n**Порций:** 4\n\n## Ингредиенты\n- Филе куриное — 1 шт\n- Листья салата\n- Сыр твердый — 50 г\n- Хлеб — 2 ломт.\n- Яйцо куриное — 1 шт\n- Чеснок — 1 зуб.\n- Масло оливковое — 6 ст. л.\n- Горчица — 1 ч. л.\n- Сок лимонный — 1 ст. л.\n- Соль\n- Перец черный\n\n## Приготовление\n1. Куриное филе нарезать небольшими кусочками.\n2. Обжарить в небольшом количестве растительного масла до готовности.\n3. Остудить.\n4. Приготовить соус для заправки. Для этого смешать яйцо, горчицу, сок лимона, чеснок пропущенный через пресс, соль и перец по вкусу.\n5. Добавить оливковое масло и взбить венчиком.\n6. Нарезать хлеб кубиками и обжарить на сухой сковороде до золотистого цвета.\n7. Выложить обжаренные сухарики в миску к куриному мясу.\n8. Добавить тертый сыр (я использовала пармезан).\n9. Заправить салат соусом.\n10. Перемешать.\n11. Выложить листья салата на тарелку, сверху выложить салат \"Цезарь\".\n12. Приятного аппетита!"}, {"id": "cat_04", "prompt": "Предложи рецепт быстрого завтрака, который готовится за 15 минут.", "a_left": true, "left": "### Омлет с сыром и зеленью\n\n**Описание:** быстрый и сытный завтрак, который можно приготовить всего за 15 минут. Нежный омлет с расплавленным сыром и свежей зеленью станет отличным началом дня.\n\n**Время приготовления:** 15 минут.\n\n**Количество порций:** 1.\n\n### Ингредиенты\n* Яйца — 2 шт.\n* Молоко — 50 мл.\n* Сыр твёрдый (например, голландский) — 30 г.\n* Соль — по вкусу.\n* Перец чёрный молотый — по вкусу.\n* Зелень свежая (укроп, петрушка) — 1–2 веточки.\n* Масло растительное или сливочное для жарки — по желанию.\n\n### Шаги приготовления\n1. Разбейте яйца в миску.\n2. Добавьте молоко и взболтайте смесь вилкой или венчиком до однородности.\n3. Посолите и поперчите яичную смесь по вкусу.\n4. Натрите сыр на мелкой тёрке.\n5. Мелко нарежьте зелень.\n6. Разогрейте сковороду на среднем огне. Если используете растительное масло, смажьте им дно сковороды. Если предпочитаете сливочное масло, растопите его на сковороде.\n7. Вылейте яичную смесь на сковороду.\n8. Жарьте омлет на среднем огне примерно 5–7 минут, пока он не начнёт схватываться сверху.\n9. Посыпьте омлет натёртым сыром и зеленью.\n10. Аккуратно перемешайте сыр и зелень в омлете лопаткой или ложкой.\n11. Продолжайте жарить ещё 2–3 минуты, чтобы омлет полностью приготовился.\n12. Переложите готовый омлет на тарелку и подавайте к столу.", "right": "# Омлет \"Быстрый\"\n\n**Время приготовления:** 15 минут \n**Порций:** 2\n\n## Ингредиенты\n- Яйцо куриное — 4 шт\n- Молоко — 0,5 стак.\n- Соль\n- Масло сливочное\n\n## Приготовление\n1. Яйца взбить венчиком или вилкой (не миксером!) с молоком и солью до однородной массы.\n2. На сковороде растопить масло и вылить яичную смесь. Накрыть крышкой и жарить на среднем огне около 7-8 минут.\n3. Вот такой омлетик получается! Приятного аппетита!!!"}, {"id": "ingr_14", "prompt": "Что приготовить из таких продуктов: шпинат, яйца и сыр? Нужен подробный рецепт.", "a_left": false, "left": "# Омлет со шпинатом\n\n**Время приготовления:** 20 минут \n**Порций:** 4\n\n## Ингредиенты\n- Шпинат — 1 пуч.\n- Яйцо куриное — 6 шт\n- Молоко — 3 ст. л.\n- Сыр твердый — 50 г\n- Соль\n- Перец черный\n- Масло растительное\n\n## Приготовление\n1. Яйца взбить венчиком с молоком, посолить, поперчить по вкусу.\n2. Шпинат промыть, обсушить, нарезать полосками.\n3. На сковороде разогреть масло, выложить шпинат, слегка обжарить (около минуты).\n4. Влить яичную смесь, накрыть крышкой и готовить около 7 минут.\n5. Затем посыпать тертым сыром, накрыть крышкой и выключить огонь. Дать постоять омлету еще пару минут.\n6. Приятного аппетита!", "right": "### Омлет со шпинатом и сыром\n\n**Описание:** нежный и ароматный омлет с добавлением свежего шпината и сыра — это отличный завтрак или лёгкий ужин. Блюдо готовится быстро и просто, а его вкус порадует вас и ваших близких.\n\n**Время приготовления:** 20 минут.\n\n**Количество порций:** 2.\n\n### Ингредиенты\n* Яйца — 4 штуки;\n* Шпинат свежий — 100 г;\n* Сыр (например, твёрдый сыр типа пармезан или голландский) — 50 г;\n* Молоко — 60 мл;\n* Соль — по вкусу;\n* Перец чёрный молотый — по вкусу;\n* Масло растительное или сливочное для жарки — по желанию.\n\n### Шаги приготовления\n1. Подготовьте все необходимые ингредиенты. Шпинат промойте и обсушите. Сыр нарежьте мелкими кубиками или натрите на тёрке.\n2. В миске взбейте яйца с молоком до однородной массы. Добавьте соль и перец по вкусу.\n3. Разогрейте сковороду на среднем огне. Если используете растительное масло, смажьте им дно сковороды. Если предпочитаете сливочное масло, растопите его в сковороде.\n4. Вылейте яичную смесь на сковороду и равномерно распределите её по поверхности.\n5. Когда нижняя часть омлета начнёт схватываться, выложите сверху шпинат и кусочки сыра.\n6. Аккуратно перемешайте содержимое сковороды лопаткой, чтобы сыр расплавился, а шпинат равномерно распределился.\n7. Жарьте омлет ещё несколько минут, пока верх не станет золотистым и готовым.\n8. Готовый омлет переложите на тарелку и подавайте горячим. Приятного аппетита!"}, {"id": "dish_09", "prompt": "Напиши рецепт: Плов с говядиной", "a_left": false, "left": "# Плов с говядиной\n\n**Время приготовления:** 120 минут \n**Порций:** 6\n\n## Ингредиенты\n- Рис — 3 стак.\n- Говядина — 500 г\n- Морковь — 4 шт\n- Лук репчатый — 2 шт\n- Чеснок — 1 шт\n- Масло растительное — 1/2 стак.\n- Соль — по вкусу\n- Перец черный — по вкусу\n- Зира — 1 ч. л.\n- Барбарис — 1 ст. л.\n- Куркума — 1 ч. л.\n- Вода — 7 стак.\n\n## Приготовление\n1. Мясо нарезать небольшими кусочками.\n2. В казане разогреть масло и обжарить мясо до румяной корочки.\n3. Добавить нарезанный полукольцами лук и жарить еще 5 минут.\n4. Затем добавить морковь, нарезанную соломкой или брусочками. Жарить все вместе еще 5 минут.\n5. Залить водой так, чтобы она покрывала содержимое казана примерно на 1 см. Посолить, поперчить, добавить специи и тушить под крышкой на медленном огне около часа.\n6. Пока готовится зирвак (основа плова), промыть рис в холодной воде несколько раз, пока вода не станет прозрачной.\n7. Когда зирвак будет готов, выложить сверху рис ровным слоем, воткнуть головку чеснока целиком и залить кипятком так, чтобы он только слегка прикрывал рис. Довести до кипения, убавить огонь до минимума и готовить плов под крышкой около 20 минут.\n8. Затем аккуратно перемешать плов, накрыть крышкой и дать настояться еще 10 минут.", "right": "### Плов с говядиной\n\n**Описание:** ароматный плов с нежной говядиной, который станет отличным ужином для всей семьи. Рис получается рассыпчатым, а мясо — мягким и сочным.\n\n**Время приготовления:** около 1 часа 20 минут.\n\n**Количество порций:** зависит от размера казана или кастрюли, обычно хватает на 4–6 порций.\n\n### Ингредиенты\n* Говядина — 500 г.\n* Рис длиннозёрный — 500 г.\n* Морковь — 3–4 шт.\n* Лук репчатый — 2 шт.\n* Чеснок — 1 головка.\n* Растительное масло — 100 мл.\n* Специи для плова (зира, куркума, паприка, чёрный перец) — по вкусу.\n* Соль — по вкусу.\n\n### Шаги приготовления\n1. Подготовьте все ингредиенты. Мясо нарежьте небольшими кусочками.\n2. Очистите лук и морковь. Лук нарежьте полукольцами, морковь — соломкой или брусочками.\n3. Разогрейте казан или кастрюлю с толстым дном на сильном огне. Добавьте растительное масло и дайте ему нагреться.\n4. Обжарьте кусочки говядины до золотистой корочки. Убавьте огонь до среднего и добавьте нарезанный лук. Обжаривайте до прозрачности лука.\n5. Добавьте морковь и обжаривайте всё вместе ещё несколько минут, пока морковь не станет мягкой.\n6. Посолите и добавьте специи для плова. Перемешайте.\n7. Промойте рис под проточной водой несколько раз, пока вода не станет прозрачной.\n8. Выложите рис ровным слоем поверх мяса и овощей. Воткните в рис головку чеснока.\n9. Залейте горячей водой так, чтобы она покрывала рис примерно на палец. Доведите до кипения, затем уменьшите огонь и готовьте под крышкой около 20–30 минут, пока рис не впитает всю воду.\n10. Проверьте готовность риса. Если вода полностью испарилась, а рис стал мягким, плов готов. Дайте блюду настояться под крышкой ещё 10–15 минут."}, {"id": "cat_03", "prompt": "Предложи рецепт из раздела «Закуски».", "a_left": false, "left": "# Закуска \"А-ля канапе\"\n\n**Время приготовления:** 15 минут \n**Порций:** 4\n\n## Ингредиенты\n- Хлебцы — 8 шт\n- Сыр творожный — 2 ст. л.\n- Огурец — 0,5 шт\n- Укроп — по вкусу\n- Соль — по вкусу\n- Перец черный — по вкусу\n\n## Приготовление\n1. На хлебцы намазать творожный сыр.\n2. Сверху выложить нарезанный тонкими слайсами огурец.\n3. Присыпать мелко нарезанным укропом, солью и перцем по вкусу.\n4. Приятного аппетита!", "right": "### Закуска «Сырные шарики в панировке»\n\n**Описание:** нежные сырные шарики в хрустящей панировке — это отличная закуска для любого случая. Они идеально подойдут как для праздничного стола, так и для повседневного перекуса. Сырные шарики имеют приятный сливочный вкус и аппетитный внешний вид.\n\n**Время приготовления:** 30 минут.\n\n**Количество порций:** 4–6.\n\n### Ингредиенты\n* твёрдый сыр — 200 г;\n* яйцо куриное — 1 шт.;\n* мука пшеничная — 50 г;\n* сухари панировочные — 50 г;\n* растительное масло для жарки — 50 мл;\n* соль — по вкусу;\n* перец чёрный молотый — по вкусу;\n* специи (по желанию) — по вкусу.\n\n### Шаги приготовления\n1. Натрите сыр на мелкой тёрке.\n2. В глубокой миске взбейте яйцо.\n3. Добавьте к яйцу муку, соль, перец и специи. Перемешайте до однородности.\n4. Сформируйте из сыра небольшие шарики.\n5. Обмакните каждый шарик сначала в яичную смесь, затем обваляйте в панировочных сухарях.\n6. Разогрейте растительное масло на сковороде.\n7. Выложите шарики на сковороду и обжарьте их до золотистой корочки с обеих сторон.\n8. Готовые шарики выложите на бумажное полотенце, чтобы удалить излишки масла.\n9. Подавайте закуску тёплой или комнатной температуры."}, {"id": "ingr_03", "prompt": "У меня есть: картофель, грибы и лук. Что можно приготовить? Напиши рецепт.", "a_left": true, "left": "### Картофельно-грибная запеканка\n\n**Описание:** это вкусное и сытное блюдо, которое понравится всей семье. Запеканка из картофеля и грибов под золотистой корочкой.\n\n**Время приготовления:** 1 час.\n\n**Количество порций:** 4–6.\n\n### Ингредиенты\n* Картофель — 800 г;\n* Грибы (например, шампиньоны) — 300 г;\n* Лук репчатый — 1 шт.;\n* Масло сливочное — 50 г;\n* Сыр твёрдый — 100 г;\n* Сливки (20%) — 100 мл;\n* Мука пшеничная — 2 ст. л.;\n* Соль — по вкусу;\n* Перец чёрный молотый — по вкусу;\n* Специи (по желанию) — по вкусу.\n\n### Шаги приготовления\n1. Очистите картофель и нарежьте его тонкими ломтиками или кружочками.\n2. Грибы промойте, обсушите и нарежьте пластинками.\n3. Лук очистите и нарежьте мелкими кубиками.\n4. Разогрейте духовку до 180 °C.\n5. В форме для запекания распределите слой картофеля, затем слой грибов и лука. Повторяйте слои, пока не закончатся ингредиенты.\n6. Растопите сливочное масло и смешайте его со сливками, мукой, солью, перцем и специями. Полученным соусом залейте содержимое формы.\n7. Твёрдый сыр натрите на крупной тёрке и посыпьте сверху.\n8. Накройте форму фольгой и поставьте в разогретую духовку на 30–40 минут. Затем снимите фольгу и дайте запеканке подрумяниться ещё 10–15 минут.\n9. Готовую запеканку достаньте из духовки и дайте немного остыть перед подачей на стол.", "right": "# Картофельные зразы с грибами\n\n**Время приготовления:** 60 минут \n**Порций:** 4\n\n## Ингредиенты\n- Картофель — 1 кг\n- Грибы — 300 г\n- Лук репчатый — 2 шт\n- Яйцо куриное — 1 шт\n- Мука пшеничная\n- Масло растительное\n\n## Приготовление\n1. Отварить картофель в подсоленной воде до готовности.\n2. Пока варится картошка, обжарить мелко нарезанный лук на растительном масле до золотистого цвета.\n3. Добавить к луку порезанные шампиньоны (у меня были замороженные) и жарить еще минут 5.\n4. С готового картофеля слить воду, добавить яйцо и размять толкушкой.\n5. Всыпать муку и хорошо перемешать.\n6. Из картофельного теста сформировать лепешку, положить начинку из грибов и слепить котлетку.\n7. Обжарить зразы на растительном масле до золотистой корочки.\n8. Приятного аппетита!"}, {"id": "cat_06", "prompt": "Предложи рецепт десерта без выпечки.", "a_left": false, "left": "# Десерт \"Нежность\"\n\n**Время приготовления:** 30 минут \n**Порций:** 6\n\n## Ингредиенты\n- Печенье — 250 г\n- Масло сливочное — 180 г\n- Молоко сгущенное — 4 ст. л.\n- Шоколад темный — 70 г\n- Орехи грецкие — 1 горст.\n- Сахарная пудра — 1 ч. л.\n\n## Приготовление\n1. Для начала растопим шоколад в микроволновке или на водяной бане.\n2. В чашу блендера выкладываем печенье, масло комнатной температуры, сгущенку и измельчаем до однородной массы.\n3. Добавляем растопленный шоколад и еще раз хорошо перемешиваем.\n4. Выкладываем массу в форму (у меня силиконовая), сверху посыпаем орехами и отправляем в холодильник минимум на час.\n5. Перед подачей посыпаем сахарной пудрой. Приятного аппетита!", "right": "### Рецепт: «Фруктовый салат с йогуртом»\n\n**Описание:** лёгкий и освежающий десерт, который можно приготовить за считанные минуты. Идеально подходит для жаркого летнего дня.\n\n**Время приготовления:** 15 минут.\n\n**Количество порций:** 4 порции.\n\n### Ингредиенты\n* Банан — 1 шт.\n* Клубника — 200 г.\n* Киви — 2 шт.\n* Манго (можно заменить другим фруктом) — 200 г.\n* Йогурт без добавок — 200 мл.\n* Мёд или сахар — по вкусу (примерно 1–2 ст. л.).\n* Лимонный сок — 1 ст. л. (по желанию).\n\n### Шаги приготовления\n1. Очистите банан, киви и нарежьте фрукты кубиками среднего размера.\n2. Клубнику промойте, удалите плодоножки и нарежьте ягоды на половинки или четвертинки в зависимости от размера ягод.\n3. Нарежьте манго кубиками. Если у вас другой фрукт, нарежьте его соответствующим образом.\n4. В глубокой миске смешайте все нарезанные фрукты.\n5. Добавьте йогурт к фруктам. При желании добавьте мёд или сахар для сладости и лимонный сок для свежести. Хорошо перемешайте.\n6. Разложите фруктовый салат по порционным тарелкам и подавайте сразу же после приготовления."}, {"id": "dish_24", "prompt": "Напиши рецепт: Картофельное пюре", "a_left": true, "left": "**Название:** картофельное пюре\n\n**Описание:** воздушное и нежное картофельное пюре — это классическое блюдо, которое может стать отличным гарниром к мясу, рыбе или овощам. Оно легко готовится и имеет приятный вкус.\n\n**Время приготовления:** 30–40 минут\n\n**Количество порций:** зависит от размера кастрюли и желаемого количества пюре. Например, из 1 кг картофеля получится примерно 4–6 порций.\n\n**Ингредиенты:**\n* Картофель — 1 кг;\n* Молоко (или сливки) — 200 мл;\n* Сливочное масло — 50 г;\n* Соль — по вкусу;\n* Перец чёрный молотый — по вкусу.\n\n**Шаги приготовления:**\n1. Очистите картофель и нарежьте его на кусочки одинакового размера. Это поможет ему свариться равномерно.\n2. Вскипятите в кастрюле подсоленную воду и добавьте туда нарезанный картофель. Варите на среднем огне до готовности (примерно 20 минут). Готовность можно проверить вилкой или ножом — если они легко входят в картофель, он готов.\n3. Слейте воду из кастрюли, оставив немного для дальнейшего разбавления пюре.\n4. В отдельной посуде разогрейте молоко (или сливки) и сливочное масло.\n5. Разомните горячий картофель толкушкой до однородной массы. Если пюре получается слишком густым, постепенно добавляйте оставленную воду или горячее молоко до нужной консистенции.\n6. Добавьте разогретое молоко (сливки) и сливочное масло в размятый картофель, тщательно перемешайте.\n7. Посолите и поперчите пюре по вкусу. Ещё раз хорошо перемешайте.\n8. Подавайте горячим как гарнир к основному блюду.", "right": "# Картофельное пюре\n\n**Время приготовления:** 30 минут \n**Порций:** 4\n\n## Ингредиенты\n- Картофель — 1 кг\n- Молоко — 250 мл\n- Масло сливочное — 70 г\n- Соль\n- Перец черный\n\n## Приготовление\n1. Отварить картофель в подсоленной воде до готовности (я варю в мундире). Слить воду, добавить молоко, масло, соль, перец и размять толкушкой. Если хотите получить более воздушное пюре, то можно воспользоваться миксером или блендером. Но я предпочитаю делать это вручную - так получается вкуснее!"}, {"id": "ingr_13", "prompt": "Придумай рецепт, в котором используются говядина, картофель и морковь.", "a_left": true, "left": "### Рагу из говядины с картофелем и морковью\n\n**Описание:** это сытное и ароматное блюдо, которое идеально подходит для семейного ужина. Нежное мясо, мягкие овощи и насыщенный бульон создают гармоничный вкус.\n\n**Время приготовления:** 1 час 30 минут.\n\n**Количество порций:** 4–6.\n\n### Ингредиенты\n* Говядина (мякоть) — 500 г.\n* Картофель — 4 средних клубня.\n* Морковь — 2 средние моркови.\n* Репчатый лук — 1 большая луковица.\n* Томатная паста — 2 ст. л.\n* Растительное масло — 2 ст. л.\n* Вода — 2 стакана.\n* Лавровый лист — 2 шт.\n* Чёрный перец горошком — 5–7 шт.\n* Соль — по вкусу.\n* Специи (например, паприка, тимьян, розмарин) — по вкусу.\n\n### Шаги приготовления\n1. Нарежьте говядину небольшими кусочками.\n2. Очистите и нарежьте картофель кубиками среднего размера.\n3. Морковь нарежьте кружочками или полукружочками.\n4. Лук очистите и нарежьте мелкими кубиками.\n5. Разогрейте растительное масло в глубокой сковороде или кастрюле.\n6. Обжарьте кусочки говядины на среднем огне до золотистой корочки.\n7. Добавьте нарезанный лук и обжаривайте до прозрачности.\n8. Добавьте томатную пасту, перемешайте и обжарьте ещё пару минут.\n9. Влейте воду, добавьте лавровый лист, чёрный перец горошком, соль и специи. Доведите до кипения.\n10. Уменьшите огонь и тушите под крышкой около 30 минут.\n11. Добавьте картофель и морковь, аккуратно перемешайте.\n12. Тушите всё вместе ещё 30–40 минут до готовности овощей и мяса.\n13. Попробуйте рагу на вкус и при необходимости добавьте соль или специи.\n14. Подавайте горячим, посыпав свежей зеленью.", "right": "# Суп \"Бозбаш\"\n\n**Время приготовления:** 120 минут \n**Порций:** 6\n\n## Ингредиенты\n- Говядина — 500 г\n- Картофель — 3 шт\n- Морковь — 1 шт\n- Лук репчатый — 1 шт\n- Перец болгарский — 1 шт\n- Нут — 1 стак.\n- Петрушка — 1 пуч.\n- Кинза — 1 пуч.\n- Чеснок — 4 зуб.\n- Соль — по вкусу\n- Перец черный — по вкусу\n- Лист лавровый — 2 шт\n- Масло растительное — 2 ст. л.\n\n## Приготовление\n1. Замочить нут на ночь в холодной воде.\n2. Мясо нарезать небольшими кусочками.\n3. В кастрюле разогреть масло и обжарить мясо до румяной корочки.\n4. Добавить нарезанный лук и жарить еще пару минут.\n5. Затем добавить нарезанную соломкой морковь и перец. Жарить все вместе еще около 5 минут.\n6. Добавить воду (около 2 литров), довести до кипения и варить на медленном огне около часа.\n7. Тем временем очистить и нарезать кубиками картофель.\n8. Слить воду из замоченного нута и промыть его под проточной водой.\n9. Когда бульон будет готов, добавить в него нут и картофель. Варить до готовности картофеля.\n10. Мелко нарезать зелень петрушки и кинзы, измельчить чеснок.\n11. За 5 минут до окончания варки добавить соль, перец, лавровый лист, зелень и чеснок. Дать супу настояться под крышкой около 15 минут."}, {"id": "ingr_06", "prompt": "У меня есть: лосось, лимон и рис. Что можно приготовить? Напиши рецепт.", "a_left": false, "left": "# Рис \"Ароматный\"\n\n**Время приготовления:** 30 минут \n**Порций:** 4\n\n## Ингредиенты\n- Лосось — 250 г\n- Лук репчатый — 1 шт\n- Морковь — 1 шт\n- Перец болгарский — 1/2 шт\n- Чеснок — 2 зуб.\n- Лимон — 1/2 шт\n- Масло растительное — 2 ст. л.\n- Соль — по вкусу\n- Перец черный — по вкусу\n- Зелень — по вкусу\n- Рис — 1 стак.\n- Вода — 2 стак.\n\n## Приготовление\n1. Подготовить продукты для гарнира. Овощи вымыть, обсушить.\n2. Лук нарезать полукольцами, морковь натереть на крупной терке, перец - соломкой.\n3. В сковороде разогреть масло, обжарить лук до прозрачности, добавить морковь и перец, жарить еще пару минут.\n4. Добавить чеснок, нарезанный пластинками, посолить, поперчить, перемешать.\n5. Рыбу нарезать небольшими кусочками, сбрызнуть соком лимона, перемешать.\n6. К овощам выложить рыбу, перемешать, накрыть крышкой и тушить на небольшом огне 7-8 минут.\n7. Пока готовится рыба, отварить рис в подсоленной воде согласно инструкции на упаковке.\n8. Выложить готовый рис к рыбе с овощами, аккуратно перемешать, снять с огня, накрыть крышкой и дать настояться 5 минут.\n9. Подавать горячим, посыпав зеленью.", "right": "### Лосось, запечённый с лимоном, с рисом на гарнир\n\n**Описание:** это простое и вкусное блюдо, которое подойдёт как для повседневного ужина, так и для праздничного стола. Нежный лосось, пропитанный лимонным соком, прекрасно сочетается с рассыпчатым рисом.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** зависит от размера формы для запекания и аппетита участников трапезы. Например, из указанных количеств получится около 4 порций.\n\n### Ингредиенты\n* Лосось (филе) — 500 г.\n* Лимон — 1 шт.\n* Соль — по вкусу.\n* Чёрный перец молотый — по вкусу.\n* Специи для рыбы (по желанию) — по вкусу.\n* Рис — 200 г.\n* Вода — 400 мл.\n* Масло растительное или сливочное (для варки риса) — по желанию.\n\n### Шаги приготовления\n1. Подготовьте все ингредиенты. Филе лосося промойте под холодной водой и обсушите бумажным полотенцем.\n2. Нарежьте лимон кружочками или дольками.\n3. Посолите и поперчите лосось с обеих сторон. При желании добавьте специи для рыбы.\n4. Выложите ломтики лимона на дно формы для запекания. Сверху положите филе лосося.\n5. Запекайте в предварительно разогретой до 180 °C духовке примерно 20–25 минут. Время может варьироваться в зависимости от толщины филе. Рыба должна стать золотистой и легко отделяться вилкой.\n6. Пока запекается рыба, займитесь рисом. Промойте его несколько раз в холодной воде, пока вода не станет прозрачной.\n7. В кастрюле доведите воду до кипения, добавьте соль по вкусу и масло (если используете).\n8. Всыпьте промытый рис в кипящую воду и варите на среднем огне согласно инструкции на упаковке (обычно это занимает около 15–20 минут).\n9. Когда рис будет готов, снимите кастрюлю с огня и дайте рису немного постоять под крышкой.\n10. Подавайте запечённого лосося с рисом и дольками лимона. Приятного аппетита!"}, {"id": "ingr_19", "prompt": "Придумай рецепт, в котором используются фасоль, фарш и помидоры.", "a_left": false, "left": "# Фасоль по-турецки\n\n**Время приготовления:** 60 минут \n**Порций:** 4\n\n## Ингредиенты\n- Фарш мясной — 500 г\n- Лук репчатый — 1 шт\n- Морковь — 2 шт\n- Перец болгарский — 1 шт\n- Помидоры — 3 шт\n- Томатная паста — 2 ст. л.\n- Масло растительное — 2 ст. л.\n- Соль — по вкусу\n- Сахар — 1 ч. л.\n- Вода — 1 стак.\n- Фасоль консервированная — 1 бан.\n- Зелень — 1 пуч.\n\n## Приготовление\n1. В сковороде разогреть масло и обжарить лук до золотистого цвета.\n2. Добавить морковь и жарить еще 5 минут.\n3. Затем добавить перец и готовить еще 5 минут.\n4. Добавить фарш и обжаривать все вместе около 10 минут.\n5. Добавить томатную пасту, сахар, соль и воду. Перемешать и тушить под крышкой на медленном огне 15 минут.\n6. Затем добавить нарезанные кубиками помидоры и тушить еще 10 минут.\n7. Добавить фасоль (жидкость предварительно слить) и зелень. Тушить еще 5 минут.\n8. Приятного аппетита!", "right": "### Тушёная фасоль с фаршем и помидорами\n\n**Описание:** это сытное и ароматное блюдо, которое сочетает в себе вкус фасоли, сочность помидоров и нежность фарша. Отличный выбор для обеда или ужина.\n\n**Время приготовления:** 40–50 минут.\n\n**Количество порций:** 4.\n\n### Ингредиенты\n* Фасоль (сухая) — 200 г.\n* Фарш (любой по вкусу, например, свиной, говяжий или куриный) — 300 г.\n* Помидоры — 2 шт.\n* Репчатый лук — 1 шт.\n* Морковь — 1 шт.\n* Растительное масло — 2 ст. л.\n* Томатная паста — 1 ст. л.\n* Соль — по вкусу.\n* Чёрный перец молотый — по вкусу.\n* Специи (например, паприка, кориандр, чеснок порошок) — по вкусу.\n\n### Шаги приготовления\n1. Замочите фасоль в холодной воде на несколько часов (можно на ночь), затем отварите до готовности согласно инструкции на упаковке. Откиньте на дуршлаг и дайте стечь лишней жидкости.\n2. Очистите и мелко нарежьте лук. Морковь очистите и натрите на крупной тёрке.\n3. Разогрейте растительное масло в сковороде. Обжарьте нарезанный лук до золотистого цвета. Затем добавьте морковь и обжарьте ещё пару минут.\n4. Добавьте к овощам фарш и обжаривайте, разбивая комочки фарша лопаткой, до изменения цвета.\n5. Добавьте томатную пасту, соль, чёрный перец и специи. Перемешайте и жарьте ещё минуту.\n6. Верните фасоль в сковороду, перемешайте.\n7. Нарежьте помидоры кубиками и добавьте к остальным ингредиентам.\n8. Влейте немного воды (если нужно), чтобы добиться желаемой консистенции блюда. Тушите всё вместе под крышкой на медленном огне 10–15 минут.\n9. Попробуйте на вкус и при необходимости добавьте соль или специи. Подавайте горячим, украсив свежей зеленью."}, {"id": "dish_18", "prompt": "Напиши рецепт: Вареники с картошкой", "a_left": true, "left": "**Название:** вареники с картошкой\n\n**Описание:** нежные вареники с картофельной начинкой — это вкусное блюдо, которое понравится всей семье. Картофельная начинка имеет насыщенный вкус, а тесто получается мягким и эластичным. Подавайте вареники со сметаной или сливочным маслом.\n\n**Время приготовления:** 1 час 20 минут (без учёта времени на заморозку)\n\n**Количество порций:** зависит от размера вареников, примерно 6–8 порций\n\n**Ингредиенты:**\n* мука пшеничная — 500 г;\n* вода — 250 мл;\n* яйцо куриное — 1 шт.;\n* соль — 0,5 ч. л.;\n* картофель — 1 кг;\n* лук репчатый — 2 шт.;\n* масло растительное — 3 ст. л.;\n* перец чёрный молотый — по вкусу;\n* соль — по вкусу.\n\n**Шаги приготовления:**\n1. Подготовьте все необходимые ингредиенты. Картофель тщательно вымойте щёткой или жёсткой стороной губки, очистите и нарежьте кубиками среднего размера. Лук очистите и нарежьте мелкими кубиками.\n2. В глубокой миске смешайте муку, соль и яйцо. Постепенно вливая воду, замесите тесто. Тесто должно быть упругим и не липнуть к рукам. Накройте тесто полотенцем и оставьте отдохнуть на 20 минут.\n3. Пока тесто отдыхает, приготовьте начинку. Отварите картофель в подсоленной воде до готовности. Слейте воду, разомните картофель толкушкой, добавьте обжаренный на растительном масле до золотистого цвета лук, поперчите и посолите по вкусу. Хорошо перемешайте.\n4. Раскатайте тесто толщиной около 2 мм. Вырежьте кружочки диаметром примерно 7–8 см. На середину каждого кружка положите немного начинки.\n5. Соедините края кружочка, формируя полумесяц или другой желаемый вид вареника. Защипните края, чтобы начинка не выпала во время варки.\n6. Варите вареники в кипящей подсолённой воде 5–7 минут после того, как они всплывут. Готовые вареники достаньте шумовкой и подавайте горячими.", "right": "# Вареники с картошкой\n\n**Время приготовления:** 60 минут \n**Порций:** 4\n\n## Ингредиенты\n- Мука пшеничная\n- Яйцо куриное — 1 шт\n- Вода — 250 мл\n- Соль — 1 ч. л.\n- Картофель — 3 шт\n- Лук репчатый — 1 шт\n- Масло растительное — 2 ст. л.\n- Перец черный — по вкусу\n- Зелень — по вкусу\n\n## Приготовление\n1. В миску просеять муку, добавить соль, яйцо и воду. Замесить тесто. Накрыть полотенцем и оставить на 30 мин.\n2. Пока тесто отдыхает, приготовим начинку. Для этого картофель очистить, отварить в подсоленной воде до готовности. Слить воду, размять толкушкой, добавить мелко нарезанный лук, масло, перец и зелень (по желанию). Перемешать.\n3. Тесто разделить на две части. Одну часть раскатать в тонкий пласт толщиной 2 мм. Вырезать кружочки диаметром 7 см. На каждый кружок положить немного начинки.\n4. Защипнуть края вареников. Варить в кипящей подсоленной воде 5-7 мин. после всплытия. Подавать со сметаной или сливочным маслом. Приятного аппетита!"}, {"id": "dish_19", "prompt": "Как приготовить «Гречка по-купечески»? Дай подробный рецепт.", "a_left": false, "left": "# Гречка по-купечески\n\n**Время приготовления:** 60 минут \n**Порций:** 4\n\n## Ингредиенты\n- Крупа гречневая — 2 стак.\n- Свинина — 500 г\n- Лук репчатый — 1 шт\n- Морковь — 1 шт\n- Чеснок — 3 зуб.\n- Томатная паста — 2 ст. л.\n- Соль\n- Перец черный\n- Масло растительное\n\n## Приготовление\n1. Мясо нарезать небольшими кусочками.\n2. Обжарить мясо до золотистой корочки.\n3. Добавить лук, нарезанный кубиками, морковь, натертую на крупной терке. Жарить еще 5 минут.\n4. Затем добавить томатную пасту, соль, перец, перемешать.\n5. Всыпать гречку, залить водой (воды должно быть в два раза больше, чем крупы).\n6. Тушить под крышкой на медленном огне 30 минут.\n7. За 5 минут до готовности добавить измельченный чеснок.\n8. Приятного аппетита!", "right": "### Гречка по-купечески\n\n**Описание:** это вкусное и сытное блюдо, которое сочетает в себе рассыпчатую гречку и ароматные овощи с мясом. Идеальное решение для обеда или ужина.\n\n**Время приготовления:** 40–50 минут.\n\n**Количество порций:** зависит от объёма используемой посуды и аппетита участников трапезы (например, из указанного количества ингредиентов получается примерно 4 порции).\n\n### Ингредиенты\n* Гречневая крупа — 200 г.\n* Свинина (можно использовать курицу или индейку) — 300 г.\n* Морковь — 1 шт. среднего размера.\n* Репчатый лук — 1 шт. среднего размера.\n* Томатная паста — 2 ст. л.\n* Растительное масло — 3 ст. л.\n* Вода — 400 мл.\n* Соль — по вкусу.\n* Чёрный перец молотый — по вкусу.\n* Лавровый лист — 1–2 шт.\n* Чеснок — 2 зубчика.\n\n### Приготовление\n1. Подготовьте все необходимые ингредиенты. Мясо нарежьте небольшими кусочками.\n2. Очистите морковь и лук. Морковь натрите на крупной тёрке, а лук нарежьте кубиками.\n3. Разогрейте растительное масло в глубокой сковороде или кастрюле. Обжарьте мясо на среднем огне до золотистой корочки.\n4. Добавьте нарезанный лук и морковь. Обжаривайте всё вместе до мягкости овощей.\n5. Добавьте томатную пасту, соль, чёрный перец и измельчённый чеснок. Перемешайте и обжаривайте ещё пару минут.\n6. Промойте гречневую крупу под проточной водой. Добавьте гречку в сковороду, равномерно распределив её по поверхности.\n7. Влейте воду, чтобы она покрывала содержимое сковороды. Добавьте лавровый лист.\n8. Доведите до кипения, затем уменьшите огонь и готовьте под крышкой около 20–25 минут, пока вода не впитается, а гречка не станет мягкой.\n9. Подавайте гречку по-купечески горячей, можно добавить свежую зелень по вкусу."}, {"id": "dish_17", "prompt": "Дай рецепт блюда «Торт Наполеон».", "a_left": false, "left": "# Торт Наполеон\n\n**Время приготовления:** 120 минут \n**Порций:** 8\n\n## Ингредиенты\n- Мука пшеничная\n- Масло сливочное — 350 г\n- Вода — 1 стак.\n- Уксус — 1 ст. л.\n- Соль — 1 ч. л.\n- Молоко — 400 мл\n- Сахар — 160 г\n- Яйцо куриное — 1 шт\n- Ванильный сахар — 1 пакет.\n- Крахмал кукурузный — 2 ст. л.\n- Сливки — 200 мл\n- Маскарпоне — 250 г\n- Сахарная пудра — 70 г\n- Шоколад молочный\n\n## Приготовление\n1. В муку добавить соль, перемешать.\n2. Добавить холодное масло, нарезанное кубиками.\n3. Перетереть руками в крошку.\n4. Добавить ледяную воду и уксус. Замесить тесто.\n5. Разделить его на 9 частей (примерно по 80 гр). Каждую часть скатать в шар, завернуть в пленку и убрать в холодильник на 1 час.\n6. Приготовить крем. В сотейник налить молоко, добавить яйцо, сахар, ванилин, крахмал. Хорошо размешать венчиком.\n7. Поставить на средний огонь и варить до загустения, постоянно помешивая. Остудить.\n8. Взбить маскарпоне и сливки с сахарной пудрой.\n9. Соединить обе массы, хорошо перемешать.\n10. Тесто раскатать тонко, вырезать круг диаметром 24 см. Выпекать при температуре 180 градусов примерно 5-7 минут. Обрезки выпечь отдельно.\n11. Собрать торт, смазывая коржи кремом. Верхний корж и бока торта смазать кремом и обсыпать крошкой из обрезков теста.\n12. Украсить тертым шоколадом. Дать пропитаться не менее 12 часов.", "right": "### Торт «Наполеон»\n\n**Описание:** нежный слоёный торт с кремом из сгущённого молока и сливочного масла. Классический десерт, который порадует вас и ваших близких.\n\n**Время приготовления:** около 2 часов (не учитывая время охлаждения).\n\n**Количество порций:** зависит от размера торта (примерно 8–10 порций).\n\n### Ингредиенты\n* **Для коржей:**\n    * мука — 500 г;\n    * сливочное масло (холодное) — 200 г;\n    * вода холодная — 150 мл;\n    * уксус столовый 9% — 1 ч. л.;\n    * соль — щепотка.\n* **Для крема:**\n    * молоко — 500 мл;\n    * сахар — 150 г;\n    * яйцо — 1 шт.;\n    * ванильный сахар — 10 г;\n    * кукурузный крахмал — 3 ст. л.;\n    * сливочное масло (размягчённое) — 100 г.\n\n### Приготовление\n1. Для коржей просейте муку в большую миску. Добавьте нарезанное кубиками холодное сливочное масло, перетрите руками до состояния крошки.\n2. В холодной воде растворите уксус и добавьте к масляно-мучной крошке, быстро замесите тесто. Сформируйте шар, заверните в пищевую плёнку и уберите в холодильник минимум на 30 минут.\n3. Охлаждённое тесто раскатайте в тонкий пласт толщиной примерно 2 мм и вырежьте круг нужного диаметра. Обрезки теста снова раскатайте и используйте для следующего коржа.\n4. Выпекайте коржи в предварительно разогретой до 200 °C духовке около 15–20 минут до золотистого цвета. Повторите процесс с оставшимся тестом. Всего должно получиться 4–6 коржей.\n5. Для крема в небольшой кастрюле смешайте молоко, сахар, яйцо, ванильный сахар и крахмал. Перемешайте венчиком до однородности.\n6. Поставьте кастрюлю на средний огонь и, постоянно помешивая, доведите смесь до загустения. Снимите с огня и остудите.\n7. Размягчённое сливочное масло взбейте миксером до пышности, затем постепенно введите остывшую молочную смесь, продолжая взбивать.\n8. Соберите торт, промазывая каждый корж кремом. Верхний корж и бока также смажьте кремом.\n9. Уберите торт в холодильник минимум на 2 часа для пропитки."}, {"id": "cat_10", "prompt": "Предложи рецепт из раздела «Соусы».", "a_left": false, "left": "# Соус \"Ароматный\"\n\n**Время приготовления:** 10 минут \n**Порций:** 4\n\n## Ингредиенты\n- Чеснок — 2 зуб.\n- Масло оливковое — 3 ст. л.\n- Уксус — 1 ч. л.\n- Соль — по вкусу\n- Перец черный — по вкусу\n- Зелень — 1 пуч.\n\n## Приготовление\n1. В чашу блендера налить масло, уксус, добавить соль, перец, чеснок (очищенный).\n2. Измельчить до однородной массы.\n3. Добавить мелко нарезанную зелень, перемешать.\n4. Соус готов! Приятного аппетита!!!", "right": "### Рецепт соуса песто\n\n**Описание:** ароматный соус песто идеально подходит для пасты, салатов или как добавка к различным блюдам. Его свежий вкус и яркий аромат сделают ваше блюдо незабываемым.\n\n**Время приготовления:** 10 минут.\n\n**Количество порций:** зависит от объёма посуды, в которой вы готовите соус, обычно хватает на несколько порций.\n\n### Ингредиенты\n* Базилик свежий — 50 г.\n* Кедровые орехи — 30 г.\n* Пармезан (или другой твёрдый сыр) — 30 г.\n* Чеснок — 2 зубчика.\n* Оливковое масло extra virgin — 70 мл.\n* Соль — по вкусу.\n* Перец чёрный молотый — по вкусу.\n\n### Шаги приготовления\n1. Подготовьте все ингредиенты. Листья базилика тщательно промойте и обсушите бумажным полотенцем. Чеснок очистите.\n2. В ступке или блендере измельчите кедровые орехи до состояния крошки.\n3. Добавьте чеснок и продолжайте измельчать.\n4. Натрите пармезан на мелкой тёрке и добавьте к орехам и чесноку.\n5. Постепенно вливайте оливковое масло, продолжая измельчать смесь до получения однородной консистенции.\n6. Посолите и поперчите по вкусу. Попробуйте соус и при необходимости скорректируйте количество соли и перца.\n7. Переложите готовый соус в удобную посуду и подавайте к столу."}, {"id": "cat_07", "prompt": "Хочу приготовить что-нибудь из категории «Вторые блюда», вкус: острый. Напиши рецепт.", "a_left": false, "left": "# Куриные голени в остром маринаде\n\n**Время приготовления:** 60 минут \n**Порций:** 4\n\n## Ингредиенты\n- Голень куриная — 8 шт\n- Соевый соус — 3 ст. л.\n- Чеснок — 2 зуб.\n- Перец чили — 1/2 ч. л.\n- Масло растительное — 2 ст. л.\n- Соль — по вкусу\n- Перец черный — по вкусу\n\n## Приготовление\n1. В миску наливаем соевый соус ТМ Kikkoman, добавляем измельченный чеснок, перец чили, соль, молотый черный перец и растительное масло. Перемешиваем.\n2. Выкладываем куриные голени в маринад, перемешиваем и оставляем мариноваться минимум на 30 минут.\n3. Затем выкладываем голени вместе с маринадом в форму для запекания и отправляем в разогретую до 190 градусов духовку на 35-40 минут.\n4. Подаем к столу!", "right": "### Куриные крылышки в остром соусе\n\n**Описание:** это блюдо порадует любителей острой кухни. Сочные куриные крылышки, покрытые ароматным острым соусом, станут отличным дополнением к любому столу.\n\n**Время приготовления:** 40–50 минут.\n\n**Количество порций:** 4.\n\n### Ингредиенты\n* Куриные крылышки — 1 кг.\n* Растительное масло — 3 ст. л.\n* Чеснок — 4 зубчика.\n* Соевый соус — 3 ст. л.\n* Мёд — 2 ст. л.\n* Красный перец молотый — 1 ч. л.\n* Чёрный перец молотый — ½ ч. л.\n* Паприка молотая — 1 ч. л.\n* Соль — по вкусу.\n\n### Приготовление\n1. Подготовьте все ингредиенты. Куриные крылышки тщательно промойте и обсушите бумажным полотенцем.\n2. В небольшой миске смешайте соевый соус, мёд, красный и чёрный перец, паприку и соль.\n3. Очистите чеснок и пропустите его через пресс прямо в миску с соусом. Перемешайте всё до однородности.\n4. Разогрейте растительное масло на сковороде на среднем огне.\n5. Выложите куриные крылышки на сковороду и обжарьте их с каждой стороны до золотистой корочки (примерно по 5–7 минут с каждой стороны).\n6. Снимите крылышки со сковороды и переложите их в миску.\n7. На ту же сковороду вылейте приготовленный соус и дайте ему немного покипеть, чтобы он загустел.\n8. Верните крылышки обратно на сковороду, залейте их соусом и перемешайте.\n9. Уменьшите огонь и тушите крылышки в соусе ещё 5–7 минут, чтобы они пропитались ароматом соуса.\n10. Подавайте горячими. Приятного аппетита!"}, {"id": "ingr_11", "prompt": "Что приготовить из таких продуктов: баклажаны, помидоры и чеснок? Нужен подробный рецепт.", "a_left": false, "left": "# Баклажаны по-грузински\n\n**Время приготовления:** 60 минут \n**Порций:** 4\n\n## Ингредиенты\n- Баклажан — 2 шт\n- Лук репчатый — 1 шт\n- Чеснок — 3 зуб.\n- Кинза — 1 пуч.\n- Петрушка — 1 пуч.\n- Перец чили — 1/2 шт\n- Соль — 1 ч. л.\n- Сахар — 1 ст. л.\n- Уксус — 50 мл\n- Масло растительное — 70 мл\n- Помидоры — 2 шт\n\n## Приготовление\n1. Баклажаны нарезать кружочками толщиной примерно 1 см. Посолить и оставить на 30 мин., чтобы ушла горечь.\n2. Затем промыть в холодной воде и отжать.\n3. Обжарить баклажаны на растительном масле до золотистого цвета.\n4. Лук нарезать полукольцами и обжарить на растительном масле до прозрачности.\n5. Добавить к луку нарезанные кубиками помидоры и тушить 5 мин.\n6. Всыпать сахар и соль, перемешать.\n7. Добавить мелко нарезанную зелень петрушки и кинзы, измельченный чеснок и перец чили (по вкусу). Перемешать.\n8. Выложить обжаренные баклажаны в кастрюлю слоями, чередуя их с овощами. Залить уксусом и поставить на огонь. Довести до кипения и снять с огня.\n9. Дать остыть и убрать в холодильник минимум на 1 час.", "right": "### Баклажаны, запечённые с помидорами и чесноком\n\n**Описание:** это простое и вкусное блюдо, которое можно подать как гарнир или самостоятельное блюдо. Запечённые баклажаны приобретают нежный вкус, а сочетание с помидорами и чесноком делает их ещё более ароматными.\n\n**Время приготовления:** 40 минут.\n\n**Количество порций:** 2–4 (в зависимости от размера баклажанов).\n\n### Ингредиенты\n* баклажаны — 2 штуки;\n* помидоры — 2 штуки;\n* чеснок — 3–4 зубчика;\n* оливковое масло — 2 ст. ложки;\n* соль — по вкусу;\n* чёрный перец молотый — по вкусу;\n* свежая зелень (укроп или петрушка) для подачи — по вкусу.\n\n### Шаги приготовления\n1. Разогрейте духовку до 200 °C.\n2. Баклажаны вымойте, обсушите бумажным полотенцем и нарежьте кружочками толщиной около 0,5 см.\n3. Выложите баклажанные кружочки на противень, застеленный пергаментной бумагой. Сбрызните оливковым маслом, посолите и поперчите.\n4. Чеснок очистите и мелко нарубите. Распределите его сверху на баклажанах.\n5. Помидоры вымойте, нарежьте кружочками и выложите поверх баклажанов. Также слегка посолите и поперчите.\n6. Поставьте противень в разогретую духовку и запекайте баклажаны с помидорами примерно 20–25 минут, пока баклажаны не станут мягкими, а помидоры не подрумянятся.\n7. Готовые баклажаны с помидорами достаньте из духовки, дайте немного остыть и посыпьте свежей зеленью перед подачей на стол."}, {"id": "ingr_04", "prompt": "Придумай рецепт, в котором используются макароны, сливки и бекон.", "a_left": true, "left": "### Паста с беконом и сливками\n\n**Описание:** это сытное и ароматное блюдо, которое понравится всей семье. Макароны сочетаются с нежным сливочным соусом и хрустящим беконом, создавая гармоничный вкус.\n\n**Время приготовления:** 20–30 минут (не учитывая время варки макарон).\n\n**Количество порций:** 4 порции.\n\n### Ингредиенты\n* Макароны — 200 г;\n* Бекон — 100 г;\n* Сливки (20–30%) — 100 мл;\n* Сыр твёрдый (например, пармезан) — 50 г;\n* Чеснок — 1 зубчик;\n* Масло сливочное — 30 г;\n* Соль — по вкусу;\n* Перец чёрный молотый — по вкусу;\n* Зелень для подачи (петрушка или укроп) — по вкусу.\n\n### Шаги приготовления\n1. Вскипятите воду в большой кастрюле и добавьте соль. Отварите макароны до состояния аль денте согласно инструкции на упаковке. Слейте воду.\n2. На сковороде растопите сливочное масло. Добавьте измельчённый чеснок и обжарьте его до золотистого цвета.\n3. Тонко нарежьте бекон и добавьте его к чесноку. Обжаривайте бекон до хрустящей корочки.\n4. Влейте сливки в сковороду с беконом и чесноком. Перемешайте и доведите соус до кипения.\n5. Снимите соус с огня и добавьте тёртый сыр. Хорошо перемешайте, пока сыр не расплавится.\n6. Смешайте макароны с полученным соусом на сковороде. Посолите и поперчите по вкусу.\n7. Разложите пасту по тарелкам и украсьте свежей зеленью. Подавайте горячей.", "right": "# Макароны \"Аль денте\" со сливками\n\n**Время приготовления:** 20 минут \n**Порций:** 4\n\n## Ингредиенты\n- Бекон — 150 г\n- Сливки — 300 мл\n- Соль\n- Перец черный\n- Масло растительное\n- Макаронные изделия\n\n## Приготовление\n1. Отварить макароны до состояния аль денте (на 1 минуту меньше, чем указано на упаковке). Слить воду.\n2. Нарезать бекон небольшими кусочками и обжарить его на растительном масле до золотистого цвета.\n3. Добавить к бекону макароны, перемешать.\n4. Влить сливки, посолить, поперчить по вкусу, довести до кипения и снять с огня.\n5. Приятного аппетита!"}, {"id": "cat_05", "prompt": "Предложи рецепт постного блюда.", "a_left": true, "left": "### Рецепт: постный салат с авокадо и помидорами\n\n**Описание:** лёгкий и свежий салат, который станет отличным дополнением к любому гарниру или самостоятельным блюдом. Авокадо придаёт салату кремовую текстуру и полезные жиры, а помидоры — яркий вкус и свежесть.\n\n**Время приготовления:** 15–20 минут.\n\n**Количество порций:** 2–4 (в зависимости от размера порций).\n\n### Ингредиенты\n* Авокадо — 1 шт.\n* Помидоры — 2 шт.\n* Лимонный сок — 1 ст. л.\n* Оливковое масло — 2 ст. л.\n* Соль — по вкусу.\n* Чёрный перец молотый — по вкусу.\n* Свежая зелень (например, базилик или петрушка) для украшения — по желанию.\n\n### Шаги приготовления\n1. Очистите авокадо от кожуры и косточки. Нарежьте мякоть кубиками.\n2. Помидоры вымойте и нарежьте кубиками такого же размера, как авокадо.\n3. В небольшой миске смешайте лимонный сок и оливковое масло.\n4. В большой миске соедините нарезанные авокадо и помидоры.\n5. Полейте заправкой из лимонного сока и оливкового масла.\n6. Посолите и поперчите по вкусу.\n7. Аккуратно перемешайте все ингредиенты.\n8. Переложите салат в сервировочное блюдо и украсьте свежей зеленью.\n9. Подавайте сразу после приготовления.", "right": "# Постные котлеты из фасоли\n\n**Время приготовления:** 30 минут \n**Порций:** 4\n\n## Ингредиенты\n- Фасоль — 1 стак.\n- Лук репчатый — 2 шт\n- Чеснок — 5 зуб.\n- Соль — по вкусу\n- Перец черный — по вкусу\n- Масло растительное — 2 ст. л.\n- Мука пшеничная\n\n## Приготовление\n1. Замочить фасоль в холодной воде на ночь или хотя бы часа на три.\n2. Слить воду, промыть фасоль и отварить до готовности (около 1,5 часов).\n3. Откинуть на дуршлаг, дать стечь лишней жидкости.\n4. Пропустить через мясорубку фасоль, лук и чеснок.\n5. Добавить соль и перец по вкусу, перемешать.\n6. Всыпать муку и еще раз хорошо перемешать.\n7. Из полученной массы сформировать котлетки и обжарить их на растительном масле с двух сторон до румяной корочки.\n8. Приятного аппетита!"}, {"id": "ingr_17", "prompt": "Что приготовить из таких продуктов: куриная печень, лук и сметана? Нужен подробный рецепт.", "a_left": true, "left": "### Куриная печень в сметане с луком\n\n**Описание:** это простое и вкусное блюдо, которое можно приготовить за короткий промежуток времени. Нежная куриная печень, обжаренная вместе с луком и тушённая в сметанном соусе, порадует вас своим ароматом и вкусом.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** 4.\n\n### Ингредиенты\n* куриная печень — 500 г;\n* репчатый лук — 2 шт.;\n* сметана (жирностью 15–20%) — 200 мл;\n* растительное масло — для жарки;\n* соль — по вкусу;\n* чёрный перец молотый — по вкусу;\n* лавровый лист — 2 шт.;\n* мука — 1 ст. л. (по желанию).\n\n### Шаги приготовления\n1. Очистите лук и нарежьте его полукольцами или кубиками.\n2. Разогрейте сковороду с растительным маслом на среднем огне. Обжарьте нарезанный лук до золотистого цвета.\n3. Промойте куриную печень под холодной водой, обсушите бумажным полотенцем и нарежьте на небольшие кусочки.\n4. Добавьте нарезанную куриную печень к луку. Обжаривайте всё вместе, помешивая, пока печень не изменит цвет на коричневый.\n5. Если вы хотите сделать соус более густым, добавьте муку и перемешайте. Затем влейте сметану, тщательно перемешайте все ингредиенты.\n6. Посолите и поперчите по вкусу. Добавьте лавровый лист.\n7. Уменьшите огонь, накройте крышкой и тушите печень в течение 10–15 минут, чтобы она стала мягкой и пропиталась соусом.\n8. Подавайте готовое блюдо горячим, посыпав свежей зеленью по вкусу.", "right": "# Куриная печень в сметане\n\n**Время приготовления:** 30 минут \n**Порций:** 4\n\n## Ингредиенты\n- Печень куриная — 500 г\n- Лук репчатый — 1 шт\n- Сметана — 2 ст. л.\n- Соль\n- Перец черный\n- Масло растительное\n\n## Приготовление\n1. Печень промыть, удалить пленочки (если есть), нарезать небольшими кусочками.\n2. Обжарить на растительном масле до полуготовности.\n3. Добавить нарезанный кубиками лук, посолить, поперчить по вкусу.\n4. Жарить до готовности лука.\n5. Влить сметану, перемешать, накрыть крышкой и тушить еще 5 минут.\n6. Приятного аппетита!"}, {"id": "cat_00", "prompt": "Предложи рецепт из раздела «Выпечка сладкая».", "a_left": true, "left": "### Рецепт: медовый пирог с орехами\n\n**Описание:** нежный и ароматный медовый пирог с добавлением орехов — идеальный выбор для чаепития. Хрустящие орехи прекрасно сочетаются со сладким мёдом, создавая гармоничный вкус.\n\n**Время приготовления:** 1 час 30 минут (без учёта времени на пропитку).\n\n**Количество порций:** 6–8.\n\n### Ингредиенты\n* мука пшеничная — 250 г;\n* мёд — 100 г;\n* сахар — 100 г;\n* яйцо куриное — 1 шт.;\n* масло сливочное — 70 г;\n* разрыхлитель теста — 1 ч. л.;\n* ванилин — щепотка;\n* соль — щепотка;\n* орехи (грецкие или другие) — 50 г.\n\n### Шаги приготовления\n1. Разогреть духовку до 180 °C. Подготовить форму для выпечки, смазать её маслом или застелить пергаментом.\n2. В глубокой миске смешать муку, разрыхлитель, ванилин и соль.\n3. В другой миске соединить мёд, сахар, растопленное сливочное масло и яйцо. Тщательно перемешать до однородности.\n4. Постепенно добавлять сухие ингредиенты в медовую смесь, замешивая тесто.\n5. Измельчить орехи и добавить их в тесто, равномерно распределяя по всей массе.\n6. Выложить тесто в подготовленную форму и разровнять поверхность.\n7. Выпекать в духовке около 30–40 минут, пока зубочистка, вставленная в центр пирога, не будет выходить чистой.\n8. Дать пирогу немного остыть в форме, затем переложить на решётку для полного охлаждения.", "right": "# Пирог \"Нежность\"\n\n**Время приготовления:** 60 минут \n**Порций:** 8\n\n## Ингредиенты\n- Мука пшеничная\n- Сахар — 1 стак.\n- Яйцо куриное — 3 шт\n- Масло сливочное — 250 г\n- Разрыхлитель теста — 1 ч. л.\n- Ванилин — 1 пакет.\n- Молоко сгущенное — 1 бан.\n- Орехи грецкие — 1 стак.\n\n## Приготовление\n1. Взбить яйца с сахаром добела.\n2. Добавить размягченное масло (маргарин), ванилин, разрыхлитель, муку и замесить тесто.\n3. Тесто разделить на две части - одну больше, другую меньше.\n4. Большую часть раскатать в пласт толщиной 0,5 см и выложить в форму для выпечки, смазанную маслом или маргарином.\n5. Выложить вареную сгущенку.\n6. Сверху посыпать измельченными орехами.\n7. Раскатать вторую часть теста и накрыть начинку.\n8. Края защипнуть и смазать взбитым яйцом.\n9. Выпекать при температуре 180 градусов около 30 минут.\n10. Приятного аппетита!"}]};
const KEY = "sbs:" + DATA.a + ":" + DATA.b;
let votes = {};
try { votes = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
let i = DATA.items.findIndex(x => !(x.id in votes)); if (i < 0) i = DATA.items.length;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(votes)); } catch (e) {} }
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function md(t){
  const out=[]; let list=null;
  const close=()=>{ if(list){ out.push("</"+list+">"); list=null; } };
  for (const raw of t.split("\n")) {
    const l = raw.trim(); if (!l) { close(); continue; }
    let m;
    if ((m = l.match(/^#\s+(.*)/))) { close(); out.push("<h4>"+esc(m[1])+"</h4>"); }
    else if ((m = l.match(/^#{2,6}\s+(.*)/))) { close(); out.push("<h5>"+esc(m[1])+"</h5>"); }
    else if ((m = l.match(/^[-*•]\s+(.*)/))) { if(list!=="ul"){ close(); out.push("<ul>"); list="ul"; } out.push("<li>"+esc(m[1])+"</li>"); }
    else if ((m = l.match(/^\d+[.)]\s+(.*)/))) { if(list!=="ol"){ close(); out.push("<ol>"); list="ol"; } out.push("<li>"+esc(m[1])+"</li>"); }
    else { close(); out.push("<p>"+esc(l).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")+"</p>"); }
  }
  close(); return out.join("");
}
function render(){
  const n = DATA.items.length;
  document.getElementById("count").textContent = Math.min(i+1, n) + " / " + n;
  document.getElementById("bar").style.width = (100*Object.keys(votes).length/n) + "%";
  if (i >= n) return finish();
  const it = DATA.items[i], v = votes[it.id];
  document.getElementById("main").innerHTML =
    '<div class="prompt">'+esc(it.prompt)+'</div><p class="hint muted">Какой рецепт лучше: правильнее, понятнее, реально приготовить?</p>'+
    '<div class="cols"><div class="card'+(v==="L"?" chosen":"")+'"><h3>Левый</h3><div class="md">'+md(it.left)+'</div></div>'+
    '<div class="card'+(v==="R"?" chosen":"")+'"><h3>Правый</h3><div class="md">'+md(it.right)+'</div></div></div>';
  window.scrollTo(0,0);
}
function vote(c){ if (i >= DATA.items.length) return; votes[DATA.items[i].id] = c; save(); i++; render(); }
function back(){ if (i > 0) { i--; render(); } }
function finish(){
  document.getElementById("actions").style.display = "none";
  let a=0,b=0,t=0; const items=[];
  for (const it of DATA.items) {
    const v = votes[it.id]; if (!v) continue;
    const w = v==="T" ? "tie" : ((v==="L") === it.a_left ? "a" : "b");
    if (w==="a") a++; else if (w==="b") b++; else t++;
    items.push({id: it.id, prompt: it.prompt, winner: w});
  }
  const n=a+b+t, wr = n ? (b+0.5*t)/n : 0;
  const res = {a: DATA.a, b: DATA.b, a_wins: a, ties: t, b_wins: b, win_rate_b: wr, items};
  const blob = URL.createObjectURL(new Blob([JSON.stringify(res, null, 2)], {type:"application/json"}));
  document.getElementById("main").innerHTML = '<div class="result"><h2>Готово</h2><table>'+
    '<tr><td>'+esc(DATA.a)+' лучше</td><td><b>'+a+'</b></td></tr><tr><td>Одинаково</td><td><b>'+t+'</b></td></tr>'+
    '<tr><td>'+esc(DATA.b)+' лучше</td><td><b>'+b+'</b></td></tr><tr><td>Win rate '+esc(DATA.b)+'</td><td><b>'+Math.round(100*wr)+'%</b></td></tr></table>'+
    '<p><a download="sbs_'+DATA.a+'_vs_'+DATA.b+'_results.json" href="'+blob+'"><button class="primary">Скачать результаты</button></a> '+
    '<button onclick="votes={};save();location.reload()">Начать заново</button></p>'+
    '<p class="muted">Положите файл в папку eval/ проекта и запустите scripts/compare.py.</p></div>';
}
document.addEventListener("keydown", e => {
  if (e.key==="1"||e.key==="ArrowLeft") vote("L"); else if (e.key==="2"||e.key==="ArrowDown") vote("T");
  else if (e.key==="3"||e.key==="ArrowRight") vote("R"); else if (e.key==="Backspace") { e.preventDefault(); back(); }
});
render();
</script></body></html>
