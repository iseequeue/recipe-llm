<script>
const DATA = {"a": "yandex-base", "b": "yandex-ft", "items": [{"id": "cat_02", "prompt": "Хочу приготовить что-нибудь из категории «Салаты», повод: на праздничный стол. Напиши рецепт.", "a_left": false, "left": "# Салат \"Нежность\"\n\n**Время приготовления:** 20 минут \n**Порций:** 4\n\n## Ингредиенты\n- Капуста пекинская — 150 г\n- Огурец — 1 шт\n- Яйцо куриное — 3 шт\n- Крабовые палочки — 150 г\n- Майонез — по вкусу\n- Соль — по вкусу\n\n## Приготовление\n1. Пекинскую капусту нарезать тонкой соломкой.\n2. Добавить нарезанный соломкой огурец.\n3. Нарезать крабовые палочки.\n4. Яйца отварить вкрутую, очистить и нарезать кубиками.\n5. Все ингредиенты соединить, посолить по вкусу и заправить майонезом.\n6. Приятного аппетита!", "right": "### Салат «Цезарь» с курицей\n\n**Описание:** этот салат — классический пример праздничного блюда. Хрустящие листья салата, нежнейшая курица, ароматные сухарики и пикантный соус создают гармоничный вкус.\n\n**Время приготовления:** 30–40 минут (не считая времени подготовки ингредиентов).\n\n**Количество порций:** 4–6.\n\n### Ингредиенты\n* Куриное филе — 200 г.\n* Листья салата — 1 пучок.\n* Белый хлеб — 100 г.\n* Сыр пармезан — 50 г.\n* Яйца — 2 шт.\n* Оливковое масло — 3 ст. л.\n* Чеснок — 1 зубчик.\n* Горчица дижонская — 1 ч. л.\n* Лимонный сок — 1 ст. л.\n* Анчоусы — 50 г (по желанию).\n* Соль, перец — по вкусу.\n\n### Шаги приготовления\n1. Отварите яйца вкрутую (7–9 минут), остудите их и отделите желтки. Белки нарежьте мелкими кубиками или соломкой.\n2. Нарежьте куриное филе небольшими кусочками и обжарьте на оливковом масле до золотистой корочки. Посолите и поперчите по вкусу.\n3. Приготовьте сухарики: нарежьте белый хлеб кубиками, смешайте с измельчённым чесноком, посолите и сбрызните оливковым маслом. Выпекайте в духовке при температуре 180 °C до золотистого цвета.\n4. Пармезан нарежьте тонкими ломтиками или натрите на крупной тёрке.\n5. Для соуса соедините желтки, горчицу, лимонный сок и оливковое масло. Взбейте блендером до однородной консистенции. Если используете анчоусы, предварительно измельчите их и добавьте в соус.\n6. На тарелку выложите листья салата, сверху разместите курицу, затем сухарики и ломтики пармезана.\n7. Полейте всё соусом и подавайте к столу."}, {"id": "cat_01", "prompt": "Предложи рецепт супа на обед для семьи.", "a_left": false, "left": "# Суп \"Сытый\"\n\n**Время приготовления:** 60 минут \n**Порций:** 4\n\n## Ингредиенты\n- Картофель — 3 шт\n- Морковь — 1 шт\n- Лук репчатый — 1 шт\n- Колбаса — 250 г\n- Масло растительное — 2 ст. л.\n- Вода — 2 л\n- Соль — по вкусу\n- Перец черный — по вкусу\n- Зелень — по вкусу\n\n## Приготовление\n1. В кастрюлю налить воду, поставить на огонь. Пока вода закипает, почистить картофель, нарезать кубиками и отправить в кипящую воду.\n2. Нарезать лук, натереть морковь на крупной терке. Обжарить овощи на растительном масле до золотистого цвета.\n3. Колбасу нарезать соломкой и добавить к овощам. Жарить еще пару минут.\n4. Добавить зажарку в суп, посолить, поперчить по вкусу. Варить до готовности картофеля.\n5. Подавать со свежей зеленью. Приятного аппетита!", "right": "### Рецепт крем-супа из тыквы с имбирём и сливками\n\n**Описание:** нежный и ароматный тыквенный суп с лёгкой остринкой имбиря и сливочной текстурой. Отличный выбор для семейного обеда.\n\n**Время приготовления:** 40 минут.\n\n**Количество порций:** 4–6.\n\n### Ингредиенты\n* тыква (очищенная) — 500 г;\n* лук репчатый — 1 шт.;\n* чеснок — 2 зубчика;\n* имбирь свежий (корень) — 20 г;\n* овощной или куриный бульон — 700 мл;\n* сливки 20% — 100 мл;\n* оливковое масло — 2 ст. л.;\n* соль — по вкусу;\n* перец чёрный молотый — по вкусу;\n* зелень для подачи (укроп, петрушка) — по вкусу.\n\n### Шаги приготовления\n1. Очистите тыкву от кожуры и семян, нарежьте кубиками среднего размера.\n2. Лук очистите и мелко нарежьте. Чеснок измельчите. Имбирь очистите и натрите на мелкой тёрке.\n3. В кастрюле разогрейте оливковое масло на среднем огне. Обжарьте лук до прозрачности, затем добавьте чеснок и имбирь, обжаривайте ещё пару минут.\n4. Добавьте в кастрюлю тыкву и овощной или куриный бульон. Доведите до кипения, затем уменьшите огонь и варите около 20 минут, пока тыква не станет мягкой.\n5. Снимите кастрюлю с огня и пюрируйте содержимое блендером до однородной консистенции.\n6. Верните пюре обратно в кастрюлю, добавьте сливки, соль и перец. Перемешайте и прогрейте на медленном огне ещё несколько минут.\n7. Разлейте суп по тарелкам и украсьте свежей зеленью. Приятного аппетита!"}, {"id": "dish_05", "prompt": "Дай рецепт блюда «Сельдь под шубой».", "a_left": false, "left": "# Сельдь под шубой\n\n**Время приготовления:** 60 минут \n**Порций:** 8\n\n## Ингредиенты\n- Свекла — 2 шт\n- Морковь — 1 шт\n- Картофель — 3 шт\n- Яйцо куриное — 4 шт\n- Лук репчатый — 1 шт\n- Сельдь — 1 шт\n- Майонез — по вкусу\n- Соль — по вкусу\n- Перец черный — по вкусу\n\n## Приготовление\n1. Отварить овощи (свеклу, морковь, картофель) в мундире до готовности. Остудить, очистить от кожуры и натереть на крупной терке.\n2. Яйца отварить вкрутую, остудить, очистить и натереть на мелкой терке.\n3. Филе сельди нарезать небольшими кубиками.\n4. Репчатый лук мелко нарезать и залить кипятком на пару минут, чтобы ушла лишняя горечь. Затем воду слить, а лук промыть холодной водой.\n5. На дно салатника выложить слой картофеля, посолить, поперчить и смазать майонезом.\n6. Далее выкладываем слой моркови, также солим, перчим и смазываем майонезом.\n7. Следующим слоем выкладываем свеклу, солим, перчим и смазываем майонезом.\n8. Сверху свеклы выкладываем слой лука.\n9. Далее выкладываем слой сельди и смазываем майонезом.\n10. Завершающим слоем выкладываем яйца и украшаем по желанию.\n11. Отправляем салат в холодильник минимум на час для пропитки слоев.\n12. Приятного аппетита!", "right": "### Сельдь под шубой\n\n**Описание:** слоёный салат из сельди с овощами и майонезом. Это классическое блюдо русской кухни, которое часто готовят на праздники.\n\n**Время приготовления:** 1 час 20 минут.\n\n**Количество порций:** зависит от размера формы для салата и аппетита едоков (примерно на 6–8 порций).\n\n### Ингредиенты\n* Селёдка слабосолёная — 300 г.\n* Картофель — 3 шт.\n* Морковь — 2 шт.\n* Свёкла — 2 шт.\n* Лук репчатый — 1 шт.\n* Яйца куриные — 3 шт.\n* Майонез — по вкусу.\n* Соль — по вкусу.\n* Чёрный перец молотый — по вкусу.\n\n### Приготовление\n1. Отварите картофель, морковь и свёклу до готовности. Остудите овощи и очистите их.\n2. Нарежьте лук мелкими кубиками и залейте его кипятком на несколько минут, чтобы убрать горечь. Затем слейте воду и промойте лук холодной водой.\n3. Очистите сельдь от костей и нарежьте её небольшими кусочками.\n4. Натрите картофель, морковь, свёклу и яйца на крупной тёрке в отдельные миски.\n5. Возьмите форму для салата и начните выкладывать ингредиенты слоями: сначала картофель, затем селёдку, сверху лук, немного майонеза, далее морковь, снова майонез, затем слой яиц, майонез, и наконец свёкла, также сдобренная майонезом. Каждый слой слегка утрамбовывайте ложкой или лопаткой.\n6. Посолите и поперчите каждый слой по вкусу.\n7. Поставьте салат в холодильник минимум на 1 час, чтобы он пропитался. Перед подачей можно украсить зеленью."}, {"id": "dish_13", "prompt": "Как приготовить «Окрошка на квасе»? Дай подробный рецепт.", "a_left": true, "left": "### Окрошка на квасе\n\n**Описание:** окрошка на квасе — это традиционный холодный суп русской кухни. Он освежает в жаркие дни и готовится из нарезанных свежих овощей, отварного мяса или колбасы, зелени и яиц, залитых квасом.\n\n**Время приготовления:** 30–40 минут (не считая времени варки картофеля и яиц).\n\n**Количество порций:** зависит от объёма используемой посуды и аппетита участников трапезы. Например, из указанного количества ингредиентов получится около 5–6 порций.\n\n### Ингредиенты\n* Картофель — 3–4 шт.\n* Яйца — 3–4 шт.\n* Редис — 1 пучок (около 100 г).\n* Огурцы свежие — 2–3 шт.\n* Колбаса варёная (или ветчина) — 200 г.\n* Зелёный лук — 1 пучок (около 50 г).\n* Укроп свежий — 1 пучок (около 50 г).\n* Петрушка свежая — 1 небольшой пучок (около 30 г).\n* Горчица (готовая) — по вкусу.\n* Соль — по вкусу.\n* Чёрный перец молотый — по вкусу.\n* Хрен (готовый) — по вкусу.\n* Квас — 1 л.\n\n### Приготовление\n1. Отварите картофель в мундире до готовности (примерно 20–25 минут после закипания воды), затем остудите его и очистите.\n2. Сварите яйца вкрутую (7–9 минут после закипания воды), затем охладите их под холодной водой и очистите.\n3. Нарежьте картофель мелкими кубиками.\n4. Нарежьте огурцы мелкими кубиками.\n5. Нарежьте редис мелкими кубиками.\n6. Нарежьте колбасу мелкими кубиками.\n7. Мелко нарежьте зелёный лук, укроп и петрушку.\n8. В глубокой миске смешайте все подготовленные ингредиенты: картофель, огурцы, редис, колбасу, зелень.\n9. Добавьте горчицу, соль, чёрный перец и хрен по вкусу. Перемешайте.\n10. Залейте всё квасом и ещё раз тщательно перемешайте.\n11. Попробуйте окрошку на вкус и при необходимости добавьте соль, перец или другие специи.\n\nПриятного аппетита!", "right": "# Окрошка на квасе\n\n**Время приготовления:** 20 минут \n**Порций:** 4\n\n## Ингредиенты\n- Квас — 1 л\n- Картофель — 3 шт\n- Яйцо куриное — 2 шт\n- Редис — 5 шт\n- Огурец — 2 шт\n- Лук зеленый — 1 пуч.\n- Укроп — 1 пуч.\n- Сметана — 1 ст. л.\n- Горчица — 1 ч. л.\n- Соль — по вкусу\n- Перец черный — по вкусу\n\n## Приготовление\n1. Отварить картофель в мундире до готовности (примерно 20 мин.). Яйца отварить вкрутую (8-10 мин.).\n2. Нарезать кубиками картофель, яйца, редис, огурцы.\n3. Мелко нарезать лук и укроп.\n4. В кастрюле смешать нарезанные овощи, зелень, сметану, горчицу, соль и перец.\n5. Залить все холодным квасом и перемешать.\n6. Поставить окрошку в холодильник минимум на час для охлаждения.\n7. Приятного аппетита!"}, {"id": "cat_08", "prompt": "Предложи рецепт из раздела «Блюда из рыбы».", "a_left": true, "left": "### Рецепт: запечённая треска с лимоном и травами\n\n**Описание:** это простое и вкусное блюдо из трески, которое идеально подойдёт для семейного ужина или приёма гостей. Рыба запекается с лимоном и ароматными травами, что придаёт ей неповторимый вкус.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** 4.\n\n### Ингредиенты\n* Треска филе — 500 г.\n* Лимон — 1 шт.\n* Оливковое масло — 2 ст. л.\n* Чеснок — 2 зубчика.\n* Розмарин свежий — 1 веточка.\n* Тимьян свежий — 1 веточка.\n* Соль — по вкусу.\n* Чёрный перец молотый — по вкусу.\n\n### Шаги приготовления\n1. Разогрейте духовку до 200 °C.\n2. Филе трески промойте под холодной водой и обсушите бумажным полотенцем.\n3. Лимон нарежьте тонкими ломтиками.\n4. В небольшой миске смешайте оливковое масло, измельчённый чеснок, мелко нарезанный розмарин и тимьян. Добавьте соль и чёрный перец по вкусу.\n5. Полученной смесью тщательно смажьте филе трески со всех сторон.\n6. Выложите рыбу в форму для запекания. Вокруг разложите ломтики лимона.\n7. Запекайте в духовке около 20–25 минут, пока рыба не станет золотистой и легко отделяется вилкой.\n8. Подавайте горячим, украсив свежей зеленью.", "right": "# Рыба в сырном кляре\n\n**Время приготовления:** 30 минут \n**Порций:** 4\n\n## Ингредиенты\n- Филе рыбное — 500 г\n- Майонез — 1 ст. л.\n- Яйцо куриное — 2 шт\n- Сыр твердый — 100 г\n- Мука пшеничная\n- Соль\n- Масло растительное\n\n## Приготовление\n1. Рыбу нарезать небольшими кусочками.\n2. Приготовить кляр. Яйца взбить вилкой с майонезом и солью.\n3. Добавить тертый сыр (я натерла на мелкой терке), перемешать.\n4. Всыпать муку и еще раз хорошо перемешать. Кляр должен получиться как густая сметана.\n5. Кусочки рыбы обмакнуть в кляр и обжарить на растительном масле до золотистого цвета.\n6. Приятного аппетита!"}, {"id": "cat_12", "prompt": "Предложи рецепт из раздела «Напитки».", "a_left": true, "left": "### Рецепт: холодный чай с лимоном и мятой\n\n**Описание:** освежающий напиток, который прекрасно утоляет жажду в жаркие дни. Лёгкий цитрусовый вкус и ароматная мята делают его идеальным выбором для летних вечеров.\n\n**Время приготовления:** 10 минут\n\n**Количество порций:** 2–4 (в зависимости от размера чашек)\n\n### Ингредиенты\n* Чёрный чай — 2 чайные ложки;\n* Вода — 500 мл;\n* Лимон — ½ шт.;\n* Свежая мята — несколько веточек;\n* Сахар или мёд — по вкусу.\n\n### Шаги приготовления\n1. Вскипятите воду в чайнике.\n2. Заварите чёрный чай в чашке или заварочном чайнике. Для этого залейте чайные листья кипятком и дайте настояться 3–5 минут.\n3. Процедите чай через ситечко, чтобы удалить чайные листья.\n4. Добавьте сахар или мёд по вкусу и хорошо перемешайте до полного растворения.\n5. Выжмите сок половины лимона в чашку с чаем.\n6. Добавьте несколько веточек свежей мяты и слегка подавите её ложкой, чтобы аромат раскрылся.\n7. Остудите чай до комнатной температуры, а затем переместите в холодильник на 30–60 минут, чтобы напиток охладился.\n8. Подавайте холодным, украсив долькой лимона и листиками мяты.", "right": "# Коктейль \"Пина колада\"\n\n**Время приготовления:** 10 минут \n**Порций:** 2\n\n## Ингредиенты\n- Ананас — 350 г\n- Сок апельсиновый — 4 ст. л.\n- Сахарная пудра — 1 ч. л.\n- Ром — 60 мл\n- Лед\n- Лайм — 1 шт\n\n## Приготовление\n1. Для начала нужно приготовить сироп. В кастрюльку наливаем сок ананаса (у меня был консервированный), добавляем сахарную пудру и доводим до кипения. Остужаем.\n2. Нарезаем ананас небольшими кусочками.\n3. Складываем в блендер кусочки ананаса, заливаем сиропом, добавляем ром и сок лайма. Взбиваем все ингредиенты до однородной массы.\n4. Разливаем по бокалам со льдом и наслаждаемся!"}, {"id": "dish_01", "prompt": "Как приготовить «Щи из свежей капусты»? Дай подробный рецепт.", "a_left": true, "left": "### Щи из свежей капусты\n\n**Описание:** традиционные русские щи из свежей капусты — это ароматный и насыщенный суп, который согреет в холодное время года. Вкусный и сытный, он станет отличным обедом для всей семьи.\n\n**Время приготовления:** около 1 часа.\n\n**Количество порций:** зависит от размера кастрюли, например, из указанного количества ингредиентов получится примерно 6–8 порций.\n\n### Ингредиенты\n* Вода — 2 л;\n* Свинина или говядина (на выбор) — 300 г;\n* Свежая капуста — 300 г;\n* Картофель — 3 шт.;\n* Морковь — 1 шт.;\n* Репчатый лук — 1 шт.;\n* Томатная паста — 2 ст. л.;\n* Лавровый лист — 2 шт.;\n* Чёрный перец горошком — 5–7 шт.;\n* Соль — по вкусу;\n* Растительное масло — для жарки;\n* Чеснок — 2 зубчика (по желанию);\n* Зелень (укроп, петрушка) — для подачи.\n\n### Приготовление\n1. Подготовьте все необходимые ингредиенты. Мясо нарежьте небольшими кусочками.\n2. В кастрюлю налейте воду и поставьте её на огонь. Когда вода закипит, добавьте мясо и варите его на медленном огне около 20 минут после повторного закипания. Снимите пену, чтобы бульон был прозрачным.\n3. Капусту тонко нашинкуйте. Картофель очистите и нарежьте кубиками среднего размера. Морковь натрите на крупной тёрке, а лук нарежьте мелкими кубиками.\n4. Извлеките мясо из бульона и переложите его на тарелку. Бульон верните на плиту и добавьте картофель. Варите картофель около 10 минут.\n5. На разогретом растительном масле обжарьте морковь и лук до золотистого цвета. Затем добавьте томатную пасту и перемешайте. Обжаривайте ещё пару минут.\n6. Переложите зажарку в кастрюлю с картофелем, добавьте капусту и лавровый лист. Верните мясо в кастрюлю.\n7. Посолите по вкусу, добавьте чёрный перец горошком и варите всё вместе ещё около 15 минут.\n8. За несколько минут до готовности добавьте измельчённый чеснок (если используете).\n9. Готовые щи снимите с огня, дайте им настояться под крышкой 10–15 минут. Подавайте со свежей зеленью.", "right": "# Щи из свежей капусты\n\n**Время приготовления:** 60 минут \n**Порций:** 4\n\n## Ингредиенты\n- Говядина — 500 г\n- Капуста белокочанная\n- Картофель — 3 шт\n- Морковь — 1 шт\n- Лук репчатый — 2 шт\n- Томатная паста — 2 ст. л.\n- Масло растительное — 2 ст. л.\n- Соль — по вкусу\n- Перец черный — по вкусу\n- Лист лавровый — 2 шт\n- Зелень — по вкусу\n\n## Приготовление\n1. Мясо промыть, залить холодной водой и поставить варить бульон. После закипания снять пену, посолить и варить до готовности мяса (около часа).\n2. Пока варится мясо, подготовить овощи. Очистить картофель, морковь и лук. Нарезать картофель кубиками, морковь натереть на крупной терке, лук нарезать полукольцами.\n3. Когда мясо сварится, вынуть его из бульона и нарезать небольшими кусочками.\n4. В кипящий бульон добавить нарезанный картофель и варить около 10 минут.\n5. Тем временем обжарить лук в растительном масле до золотистого цвета.\n6. Добавить к луку морковь и обжаривать еще пару минут.\n7. Затем добавить томатную пасту и тушить все вместе еще около 5 минут.\n8. К картофелю добавить нарезанное мясо и обжаренные овощи. Варить еще около 10 минут.\n9. Затем добавить нашинкованную капусту и варить до готовности капусты.\n10. За 5 минут до окончания варки добавить перец, лавровый лист и зелень.\n11. Приятного аппетита!"}, {"id": "dish_21", "prompt": "Напиши рецепт: Холодец", "a_left": true, "left": "### Холодец\n\n**Описание:** холодец — это традиционное праздничное блюдо русской кухни, которое представляет собой застывший мясной бульон с кусочками мяса. Он отличается насыщенным вкусом и требует длительного времени для застывания.\n\n**Время приготовления:** около 6–8 часов (включая время для застывания).\n\n**Количество порций:** зависит от размера формы, в которой будет застывать холодец. Обычно получается 6–8 порций.\n\n### Ингредиенты\n* Мясо (говядина, свинина или курица) — 2 кг.\n* Вода — 3 л.\n* Лук репчатый — 1 шт.\n* Морковь — 1 шт.\n* Лавровый лист — 4–5 шт.\n* Чёрный перец горошком — 10–15 шт.\n* Соль — по вкусу.\n* Чеснок — 4–5 зубчиков (для подачи).\n\n### Шаги приготовления\n1. Подготовьте мясо: нарежьте его крупными кусками.\n2. В кастрюлю налейте воду и поставьте её на огонь. Когда вода закипит, добавьте мясо и убавьте огонь до минимума. Варите мясо примерно 2–3 часа, снимая пену.\n3. Добавьте в кастрюлю очищенные луковицу и морковь, лавровый лист, чёрный перец горошком и соль. Продолжайте варить ещё 1–2 часа.\n4. Проверьте готовность мяса: оно должно быть мягким и легко отделяться от кости. Если мясо готово, выключите огонь и дайте бульону немного остыть.\n5. Процедите бульон через сито или марлю, чтобы удалить все мелкие кусочки и специи. Мясо разберите на небольшие кусочки.\n6. Разложите кусочки мяса по формам или контейнерам. Залейте их процеженным бульоном.\n7. Поставьте формы с холодцом в холодильник для застывания на несколько часов (обычно требуется не менее 4–6 часов).\n8. Перед подачей на стол можно добавить измельчённый чеснок в каждую порцию холодца. Подавайте с горчицей, хреном или другими соусами по вкусу.", "right": "# Холодец\n\n**Время приготовления:** 180 минут \n**Порций:** 6\n\n## Ингредиенты\n- Говядина — 500 г\n- Свинина — 300 г\n- Лук репчатый — 2 шт\n- Морковь — 1 шт\n- Чеснок — 4 зуб.\n- Соль — по вкусу\n- Перец черный — по вкусу\n- Лист лавровый — 2 шт\n- Вода — 2 л\n\n## Приготовление\n1. Мясо промыть, залить холодной водой и поставить варить. После закипания снять пену и убавить огонь до минимума. Варить при слабом кипении около 2 часов.\n2. За час до готовности добавить в бульон лук, морковь, перец горошком и лавровый лист. Посолить по вкусу.\n3. Готовое мясо вынуть из бульона, отделить от костей и нарезать небольшими кусочками.\n4. Бульон процедить через мелкое сито или марлю.\n5. В формы для холодца выложить кусочки мяса, измельченный чеснок и украсить морковью.\n6. Залить бульоном и убрать в холодильник до полного застывания (на ночь).\n7. Приятного аппетита!"}, {"id": "ingr_05", "prompt": "Что приготовить из таких продуктов: гречка и грибы? Нужен подробный рецепт.", "a_left": true, "left": "### Грибы с гречкой\n\n**Описание:** это сытное и ароматное блюдо, которое сочетает в себе простоту и насыщенность вкусов. Гречка известна своими полезными свойствами, а грибы придают блюду неповторимый грибной аромат.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** 2–4 (в зависимости от размера порций).\n\n### Ингредиенты\n* Гречка — 1 стакан;\n* Грибы (например, шампиньоны) — 200 г;\n* Репчатый лук — 1 шт.;\n* Морковь — 1 шт.;\n* Растительное масло — 2 ст. л.;\n* Соль — по вкусу;\n* Чёрный перец молотый — по вкусу;\n* Лавровый лист — 1–2 шт.;\n* Вода — 2 стакана.\n\n### Шаги приготовления\n1. Подготовьте все необходимые ингредиенты. Гречку промойте под проточной водой несколько раз, пока вода не станет прозрачной.\n2. Лук очистите и нарежьте мелкими кубиками. Морковь очистите и натрите на крупной тёрке.\n3. Грибы нарежьте пластинками или кубиками, в зависимости от вашего предпочтения.\n4. В сковороде разогрейте растительное масло на среднем огне. Обжарьте лук до золотистого цвета.\n5. Добавьте морковь и обжаривайте ещё 3–5 минут, чтобы овощи стали мягкими.\n6. Выложите грибы в сковороду и обжаривайте всё вместе около 5–7 минут, пока грибы не выпустят сок и он не испарится, а сами грибы не подрумянятся.\n7. Добавьте промытую гречку в сковороду, перемешайте с овощами и грибами.\n8. Посолите, поперчите по вкусу, добавьте лавровый лист.\n9. Залейте содержимое сковороды двумя стаканами горячей воды. Уровень воды должен быть выше уровня крупы примерно на палец.\n10. Доведите воду до кипения, затем уменьшите огонь до минимума, накройте крышкой и готовьте гречку 15–20 минут, пока вся вода не впитается.\n11. Снимите сковороду с огня, аккуратно перемешайте готовую гречку и дайте ей постоять под крышкой ещё 5 минут. Подавайте как самостоятельное блюдо или как гарнир к мясу или овощам.", "right": "# Гречневая каша с грибами\n\n**Время приготовления:** 30 минут \n**Порций:** 4\n\n## Ингредиенты\n- Крупа гречневая — 1 стак.\n- Грибы — 250 г\n- Лук репчатый — 1 шт\n- Масло растительное\n- Соль\n\n## Приготовление\n1. Отмеряем стакан гречки (стакан у меня объемом 250 мл). Промываем ее в холодной воде до тех пор, пока вода не станет прозрачной.\n2. Заливаем гречку водой в соотношении 1 к 2, солим по вкусу и ставим вариться на медленном огне под крышкой до готовности. У меня это занимает около 20 минут.\n3. Пока варится гречка, нарезаем лук кубиками и обжариваем его на растительном масле до золотистого цвета.\n4. Добавляем нарезанные грибы и жарим все вместе еще минут 7-10.\n5. Готовую гречку соединяем с обжаренными грибами и луком, перемешиваем и подаем к столу! Приятного аппетита!"}, {"id": "ingr_01", "prompt": "Придумай рецепт, в котором используются творог, яйца и мука.", "a_left": true, "left": "### Сырники из творога\n\n**Описание:** нежные сырники из творога — это отличный завтрак или десерт. Они имеют приятную текстуру и сливочный вкус. Подаются со сметаной или мёдом.\n\n**Время приготовления:** 30 минут.\n\n**Количество порций:** 4 порции.\n\n### Ингредиенты\n* Творог жирностью 9% — 500 г;\n* Яйцо куриное — 1 шт.;\n* Мука пшеничная — 4 ст. л.;\n* Сахар — 2–3 ст. л.;\n* Соль — щепотка;\n* Растительное масло для жарки — по вкусу.\n\n### Приготовление\n1. В глубокой миске разомните творог вилкой до однородной консистенции.\n2. Добавьте яйцо, сахар и соль. Тщательно перемешайте все ингредиенты.\n3. Постепенно введите муку, продолжая мешать, чтобы не образовались комочки.\n4. Сформируйте из творожной массы небольшие лепёшки.\n5. Разогрейте сковороду с растительным маслом на среднем огне.\n6. Выложите сырники на сковороду и обжарьте их с каждой стороны до золотистой корочки (примерно по 2–3 минуты с каждой стороны).\n7. Готовые сырники выложите на тарелку и подавайте к столу со сметаной или мёдом.", "right": "# Творожные булочки \"Нежность\"\n\n**Время приготовления:** 120 минут \n**Порций:** 8\n\n## Ингредиенты\n- Творог — 350 г\n- Яйцо куриное — 4 шт\n- Сахар — 6 ст. л.\n- Ванильный сахар — 1 пакет.\n- Разрыхлитель теста — 1 ч. л.\n- Мука пшеничная\n- Масло растительное — 1/2 стак.\n- Соль — по вкусу\n\n## Приготовление\n1. В миске соединить творог, яйцо, соль, ванильный сахар, разрыхлитель и сахар.\n2. Хорошо перемешать до однородности.\n3. Добавить муку и замесить тесто.\n4. Тесто получается мягким, не липнет к рукам.\n5. Отщипываем от теста кусочек размером с грецкий орех, скатываем шарик и выкладываем на противень, застеленный пергаментом или силиконовым ковриком.\n6. Выпекаем при температуре 180 градусов около 30 минут (ориентируйтесь на свою духовку).\n7. Готовые булочки остудить на решетке."}, {"id": "cat_13", "prompt": "Хочу приготовить что-нибудь из категории «Блюда из курицы», повод: ужин. Напиши рецепт.", "a_left": true, "left": "### Куриное филе в сметанном соусе с грибами\n\n**Описание:** нежное куриное филе, тушенное в сметанном соусе с грибами, луком и специями. Это блюдо отлично подойдёт для семейного ужина.\n\n**Время приготовления:** 40 минут.\n\n**Количество порций:** 4.\n\n### Ингредиенты\n* куриное филе — 500 г;\n* шампиньоны — 200 г;\n* сметана (жирность 15–20%) — 150 мл;\n* лук репчатый — 1 шт.;\n* мука пшеничная — 1 ст. л.;\n* масло растительное — 2 ст. л.;\n* соль — по вкусу;\n* перец чёрный молотый — по вкусу;\n* зелень свежая (укроп или петрушка) — для подачи.\n\n### Шаги приготовления\n1. Подготовьте все ингредиенты. Куриное филе нарежьте небольшими кусочками. Грибы нарежьте пластинками, а лук — кубиками.\n2. Разогрейте сковороду с растительным маслом на среднем огне. Обжарьте лук до золотистого цвета.\n3. Добавьте к луку грибы и обжаривайте вместе до тех пор, пока не выпарится жидкость, выделяемая грибами.\n4. В миске смешайте сметану с мукой, добавьте соль и перец. Перемешайте до однородности.\n5. Вылейте сметанную смесь в сковороду с грибами и луком. Хорошо перемешайте.\n6. Добавьте куриное филе, перемешайте и тушите на медленном огне под крышкой около 20 минут.\n7. Готовое блюдо посыпьте свежей зеленью. Подавайте горячим.", "right": "# Куриные отбивные в кляре\n\n**Время приготовления:** 30 минут \n**Порций:** 4\n\n## Ингредиенты\n- Филе куриное — 500 г\n- Яйцо куриное — 2 шт\n- Молоко — 1 стак.\n- Мука пшеничная\n- Соль\n- Перец черный\n- Масло растительное\n\n## Приготовление\n1. Филе нарезать на порционные куски, отбить через пленку (чтобы не было брызг). Посолить, поперчить по вкусу.\n2. Приготовить кляр: яйца взбить вилкой, добавить молоко, муку, соль, перец - все хорошо перемешать до однородной массы.\n3. Каждый кусочек филе обмакнуть в кляр и обжарить на растительном масле с двух сторон до золотистой корочки.\n4. Подавать с любым гарниром или овощами.\n5. Приятного аппетита!"}, {"id": "dish_03", "prompt": "Напиши рецепт: Салат Оливье", "a_left": false, "left": "# Салат Оливье\n\n**Время приготовления:** 30 минут \n**Порций:** 6\n\n## Ингредиенты\n- Картофель — 4 шт\n- Морковь — 1 шт\n- Яйцо куриное — 2 шт\n- Колбаса — 250 г\n- Горошек зеленый — 1 бан.\n- Майонез — 1 пач.\n- Соль — по вкусу\n- Перец черный — по вкусу\n- Лук репчатый — 1/2 шт\n- Укроп — 1 пуч.\n\n## Приготовление\n1. Отварить картофель в мундире, морковь и яйца. Дать остыть, очистить от кожуры и нарезать кубиками.\n2. Нарезать колбасу (у меня сервелат) и лук.\n3. Добавить консервированный горошек.\n4. Заправить майонезом, посолить и поперчить по вкусу. Перемешать.\n5. Выложить салат в салатник или порционные тарелки, украсить зеленью укропа. Приятного аппетита!", "right": "### Салат «Оливье»\n\n**Описание:** классический салат «Оливье» — это сытное и вкусное блюдо, которое часто готовят на праздники. Он состоит из отварных овощей, мяса или колбасы, яиц, маринованных огурцов, зелёного горошка и майонеза.\n\n**Время приготовления:** 40–60 минут.\n\n**Количество порций:** зависит от размера салата, например, на 4–6 порций.\n\n### Ингредиенты\n* Картофель — 3–4 шт.;\n* Морковь — 1–2 шт.;\n* Яйца куриные — 3–4 шт.;\n* Колбаса варёная (или мясо) — 300 г;\n* Маринованные огурцы — 3–4 шт.;\n* Зелёный горошек консервированный — 1 банка;\n* Майонез — по вкусу;\n* Соль — по вкусу;\n* Перец чёрный молотый — по вкусу.\n\n### Приготовление\n1. Отварите картофель и морковь в подсоленной воде до готовности. Время варки зависит от размера овощей, обычно это занимает около 20–30 минут после закипания воды. Проверьте готовность вилкой или ножом — овощи должны легко прокалываться.\n2. После варки остудите овощи и очистите их от кожуры. Нарежьте мелкими кубиками.\n3. Сварите яйца вкрутую (около 7–8 минут после закипания воды). Затем охладите их под холодной водой, очистите и нарежьте мелкими кубиками.\n4. Колбасу также нарежьте мелкими кубиками. Если используете мясо, предварительно отварите его и остудите перед нарезкой.\n5. Маринованные огурцы нарежьте мелкими кубиками.\n6. В глубокой миске смешайте все нарезанные ингредиенты: картофель, морковь, яйца, колбасу и маринованные огурцы.\n7. Добавьте зелёный горошек из банки, предварительно слив жидкость.\n8. Посолите и поперчите салат по вкусу.\n9. Заправьте салат майонезом и тщательно перемешайте.\n10. Дайте салату настояться в холодильнике около 30 минут перед подачей на стол."}, {"id": "dish_06", "prompt": "Напиши рецепт: Сырники", "a_left": true, "left": "### Сырники\n\n**Описание:** нежные сырники из творога, которые станут отличным завтраком или десертом. Подаются со сметаной, мёдом или ягодным соусом.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** зависит от размера сырников (примерно 6–8 штук).\n\n### Ингредиенты\n* Творог жирностью 5–9% — 500 г;\n* Яйцо куриное — 1 шт.;\n* Сахар — 2 ст. л.;\n* Мука пшеничная — 3 ст. л. + для панировки;\n* Соль — щепотка;\n* Ванилин — по вкусу;\n* Растительное масло для жарки — 2–3 ст. л.\n\n### Приготовление\n1. В глубокой миске разомните творог вилкой до однородной консистенции.\n2. Добавьте яйцо, сахар, соль и ванилин. Тщательно перемешайте все ингредиенты.\n3. Постепенно вводите муку, перемешивая массу до однородности. Тесто должно получиться мягким и не слишком крутым.\n4. Сформируйте из теста небольшие лепёшки и обваляйте их в муке с обеих сторон.\n5. Разогрейте сковороду с растительным маслом на среднем огне. Выложите сырники и обжаривайте их с каждой стороны до золотистой корочки (по 2–3 минуты с каждой стороны).\n6. Готовые сырники выложите на бумажное полотенце, чтобы удалить излишки масла.\n7. Подавайте сырники горячими со сметаной, мёдом или ягодным соусом.", "right": "# Сырники\n\n**Время приготовления:** 30 минут \n**Порций:** 4\n\n## Ингредиенты\n- Творог — 500 г\n- Яйцо куриное — 1 шт\n- Сахар — 2 ст. л.\n- Соль — 1 щепот.\n- Ванильный сахар — 1 пакет.\n- Мука пшеничная\n- Масло растительное — по вкусу\n\n## Приготовление\n1. В миску выложить творог, добавить яйцо, соль, сахар, ванильный сахар, перемешать вилкой до однородности.\n2. Добавить муку, замесить тесто.\n3. Сформировать сырники, обвалять в муке.\n4. Обжарить на растительном масле с двух сторон до золотистого цвета.\n5. Подавать со сметаной или вареньем. Приятного аппетита!"}, {"id": "cat_11", "prompt": "Предложи рецепт домашнего хлеба.", "a_left": false, "left": "# Хлеб \"Домашний\"\n\n**Время приготовления:** 120 минут \n**Порций:** 8\n\n## Ингредиенты\n- Мука пшеничная\n- Молоко — 350 мл\n- Сахар — 2 ст. л.\n- Соль — 1 ч. л.\n- Масло растительное — 4 ст. л.\n- Дрожжи — 7 г\n- Яйцо куриное — 1 шт\n\n## Приготовление\n1. В теплом молоке растворить дрожжи, сахар и соль. Добавить яйцо и масло растительное.\n2. Постепенно всыпая муку замесить тесто (мягкое, не липнущее к рукам). Накрыть полотенцем и поставить в теплое место для подъема на 1 час.\n3. Подошедшее тесто обмять и сформировать батон. Выложить в форму, смазанную маслом растительным.\n4. Дать подойти еще 30 мин. И выпекать при температуре 180 градусов 30-35 мин., до зарумянивания.\n5. Готовый хлеб остудить на решетке. Приятного аппетита!!!", "right": "### Домашний хлеб\n\n**Описание:** ароматный домашний хлеб, который станет отличным дополнением к любому столу. Простой в приготовлении и невероятно вкусный.\n\n**Время приготовления:** около 3 часов (включая расстойку).\n\n**Количество порций:** зависит от размера формы для выпечки, примерно на 6–8 ломтиков.\n\n### Ингредиенты\n* мука пшеничная высшего сорта — 500 г;\n* вода — 320 мл;\n* дрожжи сухие быстродействующие — 7 г;\n* соль — 10 г;\n* сахар — 15 г.\n\n### Шаги приготовления\n1. Подготовьте все ингредиенты. Муку просейте через сито.\n2. В тёплой воде растворите дрожжи, добавьте сахар и перемешайте до полного растворения. Оставьте на 10–15 минут, чтобы дрожжи активировались.\n3. В большой миске смешайте муку и соль. Сделайте в центре углубление и влейте дрожжевую смесь.\n4. Замесите тесто руками или при помощи миксера с насадкой для теста до однородности и эластичности. Это может занять несколько минут.\n5. Переложите тесто в смазанную маслом миску, накройте пищевой плёнкой или полотенцем и оставьте в тёплом месте для подъёма на 1–1,5 часа. Тесто должно увеличиться в объёме примерно вдвое.\n6. Разогрейте духовку до максимальной температуры (желательно использовать режим конвекции) и подготовьте форму для выпечки, смазав её маслом или выстелив бумагой для выпекания.\n7. Обмятое тесто переложите в форму, накройте и оставьте ещё на 30 минут для дополнительного подъёма.\n8. Перед выпечкой сделайте надрезы на поверхности хлеба острым ножом или лезвием.\n9. Выпекайте хлеб в предварительно разогретой духовке около 20–25 минут при высокой температуре, затем уменьшите температуру до 180 °C и продолжайте выпекать ещё 20–30 минут до золотистой корочки.\n10. Готовый хлеб остудите на решётке перед подачей."}, {"id": "dish_00", "prompt": "Напиши рецепт: Борщ", "a_left": false, "left": "# Борщ\n\n**Время приготовления:** 120 минут \n**Порций:** 6\n\n## Ингредиенты\n- Говядина — 500 г\n- Свекла — 3 шт\n- Капуста белокочанная\n- Картофель — 4 шт\n- Морковь — 1 шт\n- Лук репчатый — 1 шт\n- Чеснок — 3 зуб.\n- Томатная паста — 2 ст. л.\n- Масло растительное — 2 ст. л.\n- Соль — по вкусу\n- Перец черный — по вкусу\n- Лист лавровый — 2 шт\n- Вода — 2 л\n\n## Приготовление\n1. Мясо промыть, залить холодной водой и поставить варить бульон. После закипания снять пену, посолить и варить до готовности мяса (около часа).\n2. Пока варится мясо, подготовить овощи. Очистить свеклу, морковь, картофель, лук и чеснок.\n3. Натереть свеклу на крупной терке, а морковь - на средней.\n4. Мелко нарезать лук.\n5. Обжарить лук в растительном масле до золотистого цвета.\n6. Добавить к луку морковь и обжарить еще пару минут.\n7. Затем добавить томатную пасту и тушить все вместе около 5 минут.\n8. В готовый бульон положить нарезанный кубиками картофель и варить его до полуготовности.\n9. Затем добавить нашинкованную капусту и варить еще 10 минут.\n10. Далее выложить в кастрюлю зажарку и нарезанную соломкой свеклу. Варить еще 10 минут.\n11. За 5 минут до окончания варки добавить измельченный чеснок, перец и лавровый лист. Дать настояться борщу под крышкой 15 минут.", "right": "### Рецепт: борщ\n\n**Описание:** ароматный и насыщенный борщ — классическое блюдо русской кухни. Густой и вкусный суп с ярким свекольным цветом и приятной кислинкой станет отличным обедом для всей семьи.\n\n**Время приготовления:** около 1,5–2 часов.\n\n**Количество порций:** зависит от размера кастрюли, обычно хватает на 4–6 порций.\n\n### Ингредиенты\n* Свёкла — 3–4 штуки (среднего размера);\n* морковь — 2 штуки;\n* лук репчатый — 1 штука;\n* капуста белокочанная — 300 г;\n* картофель — 4–5 штук;\n* томатная паста — 2 столовые ложки;\n* растительное масло — 3–4 столовые ложки;\n* вода — примерно 2 литра;\n* соль — по вкусу;\n* сахар — 1 столовая ложка (для баланса вкуса);\n* уксус столовый 9% — 1–2 столовые ложки (для сохранения яркого цвета свёклы);\n* лавровый лист — 2–3 штуки;\n* чёрный перец горошком — 5–7 штук;\n* чеснок — 2 зубчика;\n* зелень (укроп, петрушка) — по вкусу.\n\n### Приготовление\n1. Очистите овощи. Нарежьте свёклу соломкой или натереть на крупной тёрке. Морковь также нарежьте соломкой или натрите. Лук нарежьте кубиками. Картофель нарежьте средними кусочками. Капусту нашинкуйте.\n\n2. В кастрюле разогрейте растительное масло и обжарьте лук до прозрачности.\n\n3. Добавьте морковь и обжаривайте ещё несколько минут.\n\n4. Затем добавьте томатную пасту и перемешайте. Обжаривайте всё вместе ещё пару минут.\n\n5. Добавьте в кастрюлю свёклу, уксус, сахар, соль и немного воды. Тушите под крышкой на медленном огне около 20–30 минут, чтобы свёкла стала мягкой и отдала свой цвет.\n\n6. Добавьте оставшуюся воду, картофель и капусту. Доведите до кипения, затем уменьшите огонь и варите около 20 минут, пока картофель и капуста не станут мягкими.\n\n7. Добавьте лавровый лист, чёрный перец горошком и измельчённый чеснок за 5–7 минут до готовности.\n\n8. Попробуйте борщ на вкус и при необходимости добавьте соль или сахар.\n\n9. Снимите борщ с огня, дайте ему настояться под крышкой 10–15 минут и подавайте горячим, посыпав зеленью."}, {"id": "dish_12", "prompt": "Напиши рецепт: Бефстроганов", "a_left": false, "left": "# Бефстроганов\n\n**Время приготовления:** 60 минут \n**Порций:** 4\n\n## Ингредиенты\n- Говядина — 500 г\n- Лук репчатый — 1 шт\n- Сметана — 2 ст. л.\n- Томатная паста — 1 ст. л.\n- Мука пшеничная\n- Соль — по вкусу\n- Перец черный — по вкусу\n- Масло растительное — 3 ст. л.\n\n## Приготовление\n1. Мясо нарезать тонкими полосками поперек волокон.\n2. Обжарить мясо в растительном масле до румяной корочки.\n3. Добавить нарезанный полукольцами лук и жарить еще 5 минут.\n4. В стакане воды размешать сметану, томатную пасту, муку, соль и перец.\n5. Залить соусом мясо и тушить под крышкой на медленном огне 30 минут.\n6. Подавать с любым гарниром. Приятного аппетита!", "right": "### Бефстроганов\n\n**Описание:** бефстроганов — это классическое блюдо русской кухни, представляющее собой мелко нарезанные кусочки говядины в сметанном соусе. Блюдо отличается нежной текстурой и насыщенным вкусом.\n\n**Время приготовления:** 40–50 минут.\n\n**Количество порций:** зависит от размера сковороды и аппетита едоков (примерно на 4 порции).\n\n### Ингредиенты\n* Говядина (вырезка или лопатка) — 500 г.\n* Лук репчатый — 1 шт. (среднего размера).\n* Мука пшеничная — 2 ст. л.\n* Сметана (жирностью не менее 20%) — 150 мл.\n* Томатная паста — 1 ст. л.\n* Вода — 100 мл.\n* Соль — по вкусу.\n* Чёрный перец (молотый) — по вкусу.\n* Лавровый лист — 2 шт.\n* Растительное масло — для жарки.\n\n### Шаги приготовления\n1. Нарежьте говядину тонкими полосками длиной около 3–4 см.\n2. Очистите лук и нарежьте его полукольцами.\n3. Разогрейте сковороду с растительным маслом на среднем огне.\n4. Обжарьте лук до золотистого цвета, затем добавьте мясо и жарьте, помешивая, до золотистой корочки.\n5. Присыпьте мясо мукой и перемешайте.\n6. Добавьте сметану, томатную пасту, воду, соль, перец и лавровый лист. Перемешайте все ингредиенты.\n7. Уменьшите огонь и тушите под крышкой примерно 20–30 минут, пока мясо не станет мягким.\n8. Подавайте бефстроганов с картофельным пюре, макаронами или рисом."}, {"id": "ingr_16", "prompt": "Придумай рецепт, в котором используются креветки, чеснок и сливки.", "a_left": true, "left": "### Креветки в сливочном соусе с чесноком\n\n**Описание:** нежные креветки в ароматном сливочном соусе с пикантным вкусом чеснока — это блюдо, которое понравится любителям морепродуктов. Оно идеально подойдёт как для повседневного ужина, так и для праздничного стола.\n\n**Время приготовления:** 20–30 минут.\n\n**Количество порций:** 4.\n\n### Ингредиенты\n* Креветки очищенные — 500 г.\n* Сливки (20% жирности) — 200 мл.\n* Чеснок — 3 зубчика.\n* Масло сливочное — 50 г.\n* Лимон — ½ шт.\n* Соль — по вкусу.\n* Перец чёрный молотый — по вкусу.\n* Петрушка свежая (для подачи) — по вкусу.\n\n### Приготовление\n1. Очистите креветки от панцирей и удалите кишечную вену.\n2. Разогрейте сковороду на среднем огне и растопите сливочное масло.\n3. Измельчите чеснок и обжарьте его на сковороде до золотистого цвета.\n4. Влейте сливки в сковороду с чесноком и перемешайте. Доведите смесь до кипения, затем уменьшите огонь и варите ещё 2–3 минуты, пока соус не загустеет.\n5. Добавьте соль и перец по вкусу. Попробуйте соус и при необходимости скорректируйте количество специй.\n6. Выложите креветки в сливочный соус и аккуратно перемешайте.\n7. Готовьте креветки в соусе примерно 5 минут, чтобы они прогрелись и пропитались ароматом соуса.\n8. Выдавите сок половины лимона прямо в сковороду. Это придаст блюду свежесть и яркость вкуса.\n9. Перемешайте креветки в соусе и снимите сковороду с огня.\n10. Разложите креветки в сливочном соусе по тарелкам и украсьте свежей петрушкой. Приятного аппетита!", "right": "# Креветки \"Ароматные\"\n\n**Время приготовления:** 15 минут \n**Порций:** 2\n\n## Ингредиенты\n- Креветки — 300 г\n- Чеснок — 4 зуб.\n- Сливки — 100 мл\n- Масло оливковое — 2 ст. л.\n- Соль\n- Перец черный\n- Зелень\n\n## Приготовление\n1. В сковороде разогреть масло, добавить измельченный чеснок и обжарить его до золотистого цвета.\n2. Добавить очищенные креветки, посолить, поперчить по вкусу и обжаривать их около 7 минут.\n3. Затем залить сливками и тушить еще 5 минут.\n4. Подавать блюдо горячим, посыпав зеленью. Приятного аппетита!"}, {"id": "cat_09", "prompt": "Предложи рецепт для детского меню.", "a_left": true, "left": "### Куриные котлетки с картофельным пюре и овощным салатом\n\n**Описание:** нежные куриные котлетки с хрустящей корочкой, воздушное картофельное пюре и свежий овощной салат — идеальный обед или ужин для детей. Это блюдо не только вкусное, но и полезное.\n\n**Время приготовления:** 40 минут.\n\n**Количество порций:** 4.\n\n### Ингредиенты\n* **Куриное филе** — 500 г.\n* **Белый хлеб (или панировочные сухари)** — 100 г.\n* **Молоко** — 50 мл.\n* **Яйцо** — 1 шт.\n* **Соль** — по вкусу.\n* **Перец чёрный молотый** — по вкусу.\n* **Масло растительное** — для жарки.\n\nДля картофельного пюре:\n* **Картофель** — 800 г.\n* **Молоко** — 100 мл.\n* **Сливочное масло** — 50 г.\n* **Соль** — по вкусу.\n\nДля овощного салата:\n* **Огурцы свежие** — 2 шт.\n* **Помидоры свежие** — 2 шт.\n* **Листья салата** — небольшой пучок.\n* **Соль** — по вкусу.\n* **Масло оливковое** — по вкусу.\n\n### Приготовление\n1. Куриное филе нарежьте небольшими кусочками. Белый хлеб залейте молоком на несколько минут.\n2. Пропустите куриное филе и размокший хлеб через мясорубку. Добавьте яйцо, соль и перец, тщательно перемешайте.\n3. Сформируйте из фарша котлеты и обжарьте их на растительном масле с двух сторон до золотистой корочки.\n4. Картофель очистите, нарежьте кубиками и отварите в подсоленной воде до готовности.\n5. Слейте воду, добавьте молоко, сливочное масло и разомните картофель в пюре.\n6. Огурцы и помидоры нарежьте кубиками, листья салата порвите руками. Смешайте овощи, посолите и заправьте оливковым маслом.\n7. Подавайте куриные котлетки с картофельным пюре и овощным салатом. Приятного аппетита!", "right": "# Куриные котлеты \"Нежность\"\n\n**Время приготовления:** 40 минут \n**Порций:** 6\n\n## Ингредиенты\n- Филе куриное — 500 г\n- Лук репчатый — 1 шт\n- Яйцо куриное — 2 шт\n- Сметана — 3 ст. л.\n- Мука пшеничная\n- Соль — по вкусу\n- Перец черный — по вкусу\n- Масло растительное — 3 ст. л.\n\n## Приготовление\n1. Куриное филе нарезать небольшими кусочками.\n2. Добавить нарезанный лук, яйца, сметану, муку, соль и перец. Хорошо перемешать.\n3. Выложить фарш в пакет и отбить его об стол (я отбивала около минуты).\n4. Разогреть масло на сковороде и выложить ложкой котлетки.\n5. Жарить до румяной корочки с двух сторон.\n6. Приятного аппетита!"}, {"id": "cat_14", "prompt": "Предложи вегетарианский рецепт на ужин.", "a_left": false, "left": "# Салат \"Овощной\"\n\n**Время приготовления:** 15 минут \n**Порций:** 4\n\n## Ингредиенты\n- Капуста белокочанная\n- Морковь — 2 шт\n- Огурец — 3 шт\n- Перец болгарский — 1 шт\n- Лук репчатый — 1 шт\n- Укроп — 0,5 пуч.\n- Соль — по вкусу\n- Масло растительное — 2 ст. л.\n- Сок лимонный — 1 ч. л.\n\n## Приготовление\n1. Нашинковать капусту.\n2. Добавить морковь, натертую на крупной терке.\n3. Затем огурцы, нарезанные соломкой.\n4. Болгарский перец - тоже соломкой.\n5. Репчатый лук нарезать полукольцами.\n6. Все перемешать, посолить по вкусу.\n7. Заправить растительным маслом и лимонным соком.\n8. Украсить зеленью укропа.\n9. Приятного аппетита!", "right": "### Вегетарианская паста с овощами и соусом песто\n\n**Описание:** это вкусное и ароматное блюдо, которое станет отличным ужином для всей семьи. Паста с яркими овощами и свежим соусом песто порадует вас своим вкусом и ароматом.\n\n**Время приготовления:** 20–30 минут (не учитывая время варки пасты).\n\n**Количество порций:** зависит от размера вашей порции пасты. Обычно из указанных ингредиентов получается достаточно для 4–6 порций.\n\n### Ингредиенты\n* Паста (например, спагетти) — 200 г.\n* Цукини — 1 шт.\n* Красный болгарский перец — 1 шт.\n* Жёлтый болгарский перец — 1 шт.\n* Помидоры черри — 150 г.\n* Чеснок — 2 зубчика.\n* Оливковое масло — 3 ст. л.\n* Листья базилика — небольшой пучок.\n* Кедровые орехи — 3 ст. л.\n* Пармезан или другой твёрдый сыр — 50 г.\n* Соль — по вкусу.\n* Перец чёрный молотый — по вкусу.\n\n### Шаги приготовления\n1. Вскипятите воду в большой кастрюле и отварите пасту до состояния аль денте согласно инструкции на упаковке. Слейте воду.\n2. Цукини нарежьте тонкими полукольцами или кубиками, помидоры черри разрежьте пополам. Болгарский перец очистите от семян и нарежьте полосками.\n3. Разогрейте оливковое масло на сковороде. Добавьте измельчённый чеснок и обжарьте его до золотистого цвета.\n4. Добавьте цукини и болгарский перец на сковороду и обжаривайте овощи около 5 минут до мягкости.\n5. Снимите листья базилика с веточек и мелко нарежьте их. Измельчите кедровые орехи.\n6. Смешайте базилик, кедровые орехи, натёртый пармезан, соль и перец в миске — это будет ваш соус песто.\n7. Добавьте соус песто к овощам на сковороде и перемешайте.\n8. Соедините овощи с соусом песто с готовой пастой в большой миске и тщательно перемешайте.\n9. Подавайте горячим, посыпав дополнительно тёртым сыром."}, {"id": "dish_22", "prompt": "Как приготовить «Рассольник»? Дай подробный рецепт.", "a_left": true, "left": "### Рассольник\n\n**Описание:** рассольник — это традиционный русский суп, который отличается насыщенным вкусом и ароматом. Он готовится на основе бульона с добавлением солёных огурцов, перловой крупы и овощей.\n\n**Время приготовления:** около 1,5–2 часов.\n\n**Количество порций:** зависит от объёма кастрюли, например, из указанного количества ингредиентов получается примерно 6–8 порций.\n\n### Ингредиенты\n* Вода — 3 л;\n* Мясо (например, говядина или курица) — 400 г;\n* Перловая крупа — 100 г;\n* Картофель — 4 шт.;\n* Морковь — 1 шт.;\n* Репчатый лук — 1 шт.;\n* Солёные огурцы — 3–4 шт.;\n* Огуречный рассол — по вкусу;\n* Томатная паста — 2 ст. л.;\n* Растительное масло — для жарки;\n* Лавровый лист — 2 шт.;\n* Чёрный перец горошком — 5–7 шт.;\n* Соль — по вкусу;\n* Зелень (укроп, петрушка) — для подачи.\n\n### Приготовление\n1. Подготовьте все необходимые ингредиенты. Мясо нарежьте небольшими кусочками.\n2. В кастрюлю налейте воду и положите мясо. Доведите до кипения, снимите пену и варите на медленном огне около 1 часа.\n3. Пока варится бульон, промойте перловую крупу несколько раз в холодной воде. Затем добавьте её в бульон и варите ещё 20 минут.\n4. Очистите картофель, морковь и репчатый лук. Нарежьте картофель кубиками, морковь — соломкой или кружочками, а лук — мелкими кубиками.\n5. Обжарьте лук и морковь на растительном масле до золотистого цвета. Добавьте томатную пасту и перемешайте.\n6. Нарежьте солёные огурцы кубиками и добавьте их к луку и моркови. Тушите всё вместе 5–7 минут.\n7. Добавьте обжаренные овощи в бульон, затем влейте огуречный рассол по вкусу. Посолите, поперчите, добавьте лавровый лист и варите ещё 10–15 минут.\n8. Попробуйте рассольник на вкус и при необходимости добавьте соль или специи.\n9. Снимите рассольник с огня, дайте ему настояться под крышкой 10–15 минут и подавайте горячим, посыпав зеленью.", "right": "# Рассольник\n\n**Время приготовления:** 60 минут \n**Порций:** 4\n\n## Ингредиенты\n- Огурец соленый — 3 шт\n- Крупа перловая — 1/2 стак.\n- Картофель — 5 шт\n- Морковь — 1 шт\n- Лук репчатый — 1 шт\n- Томатная паста — 2 ст. л.\n- Масло растительное — 2 ст. л.\n- Лист лавровый — 1 шт\n- Соль — по вкусу\n- Перец черный — по вкусу\n- Зелень — по вкусу\n- Вода — 2 л\n\n## Приготовление\n1. Перловую крупу промыть в холодной воде до прозрачности воды, залить кипятком и оставить набухать на 1 час.\n2. Соленые огурцы очистить от кожицы и семян, нарезать соломкой или натереть на крупной терке.\n3. В кипящую воду положить подготовленную перловку и варить при слабом кипении 15 мин.\n4. Добавить нарезанный кубиками картофель и варить еще 10 мин.\n5. Спассеровать мелко нарезанные лук и морковь.\n6. Добавить томатную пасту и тушить еще 5 мин.\n7. Выложить зажарку в рассольник, добавить соль, перец, лавровый лист и варить до готовности картофеля.\n8. Заправить зеленью и дать настояться под крышкой 10 мин."}, {"id": "dish_16", "prompt": "Как приготовить «Шарлотка с яблоками»? Дай подробный рецепт.", "a_left": true, "left": "### Шарлотка с яблоками\n\n**Описание:** нежная шарлотка с ароматными яблоками — это прекрасный десерт к чаю. Лёгкая в приготовлении и всегда вкусная.\n\n**Время приготовления:** около 1 часа.\n\n**Количество порций:** зависит от размера формы для выпечки (примерно 6–8 порций).\n\n### Ингредиенты\n* Яйца — 4 шт.;\n* Сахар — 150 г;\n* Мука — 150 г;\n* Яблоки — 3–4 шт.;\n* Ванильный сахар — 1 ч. л.;\n* Разрыхлитель теста — 1 ч. л.;\n* Корица (по желанию) — щепотка.\n\n### Шаги приготовления\n1. Подготовьте форму для выпечки, смажьте её маслом или застелите пергаментной бумагой.\n2. Разогрейте духовку до 180 °C.\n3. Отделите белки от желтков. Белки взбейте миксером в пышную пену.\n4. Постепенно добавляйте сахар к белкам, продолжая взбивать до образования устойчивых пиков.\n5. Желтки смешайте с ванильным сахаром и слегка взбейте.\n6. Аккуратно введите желтковую массу в белковую, перемешивая снизу вверх.\n7. Просеянную муку смешайте с разрыхлителем и аккуратно введите в яичную смесь, снова перемешивая снизу вверх.\n8. Очистите яблоки от кожуры и сердцевины, нарежьте тонкими ломтиками.\n9. Добавьте нарезанные яблоки в тесто, перемешайте так, чтобы они равномерно распределились. При желании можно посыпать корицей.\n10. Вылейте тесто в подготовленную форму.\n11. Выпекайте в разогретой духовке примерно 30–40 минут, пока зубочистка, вставленная в центр, не будет выходить чистой.\n12. Дайте шарлотке немного остыть в форме, затем переложите на тарелку.\n13. Подавайте шарлотку тёплой или комнатной температуры.", "right": "# Шарлотка с яблоками\n\n**Время приготовления:** 60 минут \n**Порций:** 8\n\n## Ингредиенты\n- Яйцо куриное — 4 шт\n- Сахар — 1 стак.\n- Мука пшеничная\n- Яблоко — 3 шт\n- Ванилин — по вкусу\n- Разрыхлитель теста — 1 ч. л.\n\n## Приготовление\n1. Яйца взбить миксером в пышную пену.\n2. Добавить сахар и ванилин, взбивать до растворения сахара.\n3. Всыпать муку, смешанную с разрыхлителем, перемешать лопаткой или ложкой.\n4. Яблоки очистить от кожуры и сердцевины, нарезать тонкими дольками.\n5. Форму для выпечки смазать растительным маслом, выложить яблоки.\n6. Сверху вылить тесто, разровнять.\n7. Выпекать в разогретой до 180 градусов духовке 40-45 минут (до сухой лучины).\n8. Готовую шарлотку остудить, посыпать сахарной пудрой. Приятного аппетита!"}, {"id": "dish_11", "prompt": "Дай рецепт блюда «Котлеты по-киевски».", "a_left": false, "left": "# Котлеты по-киевски\n\n**Время приготовления:** 60 минут \n**Порций:** 4\n\n## Ингредиенты\n- Масло сливочное — 150 г\n- Укроп — 2 ст. л.\n- Петрушка — 2 ст. л.\n- Чеснок — 3 зуб.\n- Соль — 1 ч. л.\n- Перец черный — 1/2 ч. л.\n- Яйцо куриное — 2 шт\n- Сухари панировочные\n- Мука пшеничная\n- Филе куриное — 800 г\n- Молоко — 1 стак.\n- Лук репчатый — 1 шт\n- Хлеб — 1 ломт.\n- Вода — 1 стак.\n\n## Приготовление\n1. Для начала приготовим начинку для котлет. Сливочное масло комнатной температуры смешиваем с мелко нарезанной зеленью укропа и петрушки, чесноком, солью и перцем. Все хорошо перемешиваем до однородной массы.\n2. Затем формируем из масла колбаску и отправляем в морозильную камеру на 1 час.\n3. Куриное филе разрезаем вдоль пополам, но не до конца. Раскрываем как книжку и слегка отбиваем.\n4. На середину каждой половинки выкладываем кусочек сливочного масла.\n5. И заворачиваем его в виде рулетика.\n6. Обваливаем каждый рулетик сначала в муке, затем во взбитом яйце и в конце в панировочных сухарях.\n7. Выкладываем котлеты на противень, застеленный пергаментом или фольгой. Отправляем в разогретую духовку при температуре 190 градусов на 30-35 минут.\n8. Пока котлеты запекаются, готовим соус. В сотейник наливаем молоко, добавляем нарезанный лук и хлебный мякиш. Ставим на огонь и варим до тех пор, пока хлеб полностью не размокнет. Затем снимаем с огня и даем остыть.\n9. Протираем через сито и снова ставим на огонь. Доводим до кипения и варим еще 5 минут. Соус готов!\n10. Готовые котлеты подаем к столу вместе с соусом! Приятного аппетита!!!", "right": "### Котлеты по-киевски\n\n**Описание:** нежные котлеты из куриного филе с масляно-грибной начинкой, обжаренные до золотистой корочки. Подаются обычно с гарниром из картофельного пюре или свежих овощей.\n\n**Время приготовления:** около 1 часа 20 минут.\n\n**Количество порций:** зависит от размера котлет (примерно 4–6 порций).\n\n### Ингредиенты\n* Куриное филе — 500 г.\n* Сливочное масло — 70 г.\n* Грибы (шампиньоны) — 100 г.\n* Лук репчатый — 1 шт.\n* Мука — 1 ст. л.\n* Сливки (20%) — 50 мл.\n* Соль — по вкусу.\n* Чёрный перец (молотый) — по вкусу.\n* Панировочные сухари — 3–4 ст. л.\n* Яйцо куриное — 1 шт.\n* Растительное масло для жарки — 3–4 ст. л.\n\n### Шаги приготовления\n1. Подготовьте все необходимые ингредиенты.\n2. Мелко нарежьте грибы и лук. Обжарьте их на сковороде до золотистого цвета.\n3. Добавьте муку к грибам и луку, перемешайте. Затем влейте сливки, посолите и поперчите по вкусу. Доведите смесь до загустения на среднем огне. Снимите с огня и дайте остыть.\n4. Размягчённое сливочное масло смешайте с грибной смесью до однородной консистенции. Это будет начинка для котлет.\n5. Разрежьте куриное филе вдоль пополам, но не до конца, чтобы получился «карман». Отбейте каждую половинку филе молотком для мяса, предварительно накрыв плёнкой, чтобы не брызгало. Посолите и поперчите обе стороны филе.\n6. В центр каждой отбитой части филе положите немного начинки. Аккуратно заверните начинку внутрь филе, формируя котлету. Закрепите форму котлет зубочистками, если необходимо.\n7. Взбейте яйцо в отдельной миске. В другой миске насыпьте панировочные сухари. Каждую котлету сначала обмакните во взбитое яйцо, затем обваляйте в сухарях.\n8. Разогрейте растительное масло на сковороде на среднем огне. Жарьте котлеты по несколько минут с каждой стороны до золотистой корочки.\n9. Готовые котлеты выложите на тарелку и подавайте горячими. Приятного аппетита!"}, {"id": "dish_20", "prompt": "Дай рецепт блюда «Пирожки с капустой».", "a_left": false, "left": "# Пирожки с капустой\n\n**Время приготовления:** 120 минут \n**Порций:** 6\n\n## Ингредиенты\n- Мука пшеничная\n- Молоко — 350 мл\n- Дрожжи — 7 г\n- Сахар — 4 ч. л.\n- Соль — 1 ч. л.\n- Масло растительное — 8 ст. л.\n- Капуста белокочанная\n- Лук репчатый — 1 шт\n- Морковь — 1 шт\n- Перец черный — по вкусу\n- Яйцо куриное — 1 шт\n- Кунжут — по вкусу\n\n## Приготовление\n1. В теплое молоко добавить сахар, дрожжи, соль, масло и муку. Замесить тесто. Накрыть полотенцем и поставить в теплое место для подъема на 1 час.\n2. Пока тесто поднимается, приготовим начинку. Нашинковать капусту, натереть морковь, нарезать лук. Обжарить овощи на растительном масле до готовности. Посолить, поперчить по вкусу.\n3. Подошедшее тесто обмять и разделить на кусочки (у меня получилось 12 штук). Каждый кусочек раскатать в лепешку, положить начинку и сформировать пирожок.\n4. Выложить пирожки на противень, застеленный пергаментом или силиконовым ковриком. Смазать взбитым яйцом и посыпать кунжутом. Поставить в разогретую духовку при температуре 180 градусов на 20-25 минут.\n5. Приятного аппетита!", "right": "### Пирожки с капустой\n\n**Описание:** нежные пирожки с сочной капустной начинкой, которые станут отличным дополнением к чаю или основным блюдом на обед.\n\n**Время приготовления:** около 1 часа 20 минут (без учёта времени на расстойку теста).\n\n**Количество порций:** зависит от размера пирожков, примерно 8–10 штук.\n\n### Ингредиенты\n* **Для теста:**\n    * мука пшеничная — 500 г;\n    * вода тёплая — 250 мл;\n    * дрожжи сухие быстродействующие — 7 г;\n    * сахар — 1 ст. л.;\n    * соль — 0,5 ч. л.;\n    * растительное масло — 3 ст. л.\n* **Для начинки:**\n    * капуста белокочанная — 400 г;\n    * лук репчатый — 1 шт.;\n    * морковь — 1 шт.;\n    * масло растительное — для жарки;\n    * соль, перец чёрный молотый — по вкусу;\n    * лавровый лист — 1–2 шт.;\n    * томатная паста — 1 ст. л. (по желанию).\n\n### Приготовление\n1. В тёплой воде растворите дрожжи, добавьте сахар и соль. Перемешайте.\n2. Постепенно вводите муку, замешивая тесто. Когда тесто станет упругим, добавьте растительное масло и продолжайте месить до однородности.\n3. Переложите тесто в смазанную маслом миску, накройте полотенцем или плёнкой и оставьте в тёплом месте для подъёма на 40–60 минут.\n4. Пока тесто подходит, приготовьте начинку. Капусту мелко нашинкуйте, лук нарежьте кубиками, морковь натрите на крупной тёрке.\n5. Обжарьте лук и морковь на растительном масле до золотистого цвета. Добавьте капусту, перемешайте и тушите под крышкой на среднем огне 15–20 минут.\n6. Приправьте солью, перцем, добавьте томатную пасту и лавровый лист, перемешайте и тушите ещё 5–7 минут. Снимите с огня и остудите.\n7. Подошедшее тесто обомните и разделите на равные части. Каждую часть раскатайте в лепёшку, в центр положите начинку и защипните края.\n8. Сформируйте пирожки и выложите их на противень, застеленный пергаментом. Накройте полотенцем и оставьте на 15–20 минут для расстойки.\n9. Разогрейте духовку до 180 °C и выпекайте пирожки 20–25 минут до золотистой корочки."}, {"id": "ingr_12", "prompt": "У меня есть: кефир, мука и сода. Что можно приготовить? Напиши рецепт.", "a_left": false, "left": "# Пирог \"Нежность\"\n\n**Время приготовления:** 60 минут \n**Порций:** 8\n\n## Ингредиенты\n- Яйцо куриное — 2 шт\n- Сахар — 1 стак.\n- Кефир — 1 стак.\n- Масло растительное — 3 ст. л.\n- Мука пшеничная\n- Сода — 1 ч. л.\n- Ванилин — 1 г\n- Яблоко — 4 шт\n- Изюм — 50 г\n- Орехи грецкие — 50 г\n- Корица — 1/2 ч. л.\n\n## Приготовление\n1. Яйца взбить с сахаром до пышной массы.\n2. Добавить кефир, масло, ванилин, перемешать.\n3. Всыпать муку, смешанную с содой, хорошо размешать.\n4. Яблоки очистить от кожуры и сердцевины, нарезать кубиками.\n5. Изюм промыть, обсушить.\n6. Грецкие орехи измельчить ножом.\n7. Смешать яблоки, изюм, орехи, корицу.\n8. Выложить в форму половину теста, сверху выложить начинку.\n9. На начинку выложить оставшееся тесто.\n10. Выпекать пирог при температуре 180 градусов около 40 минут (до сухой лучины).\n11. Готовый пирог остудить на решетке.", "right": "### Пышные оладьи на кефире\n\n**Описание:** нежные и пышные оладьи — идеальный завтрак или перекус. Они мягкие внутри и имеют золотистую корочку снаружи. Подаются обычно со сметаной, мёдом или джемом.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** зависит от размера оладьев, примерно 6–8 штук среднего размера.\n\n### Ингредиенты\n* Кефир — 250 мл.\n* Мука — 180 г.\n* Сода — 0,5 ч. л.\n* Сахар — 2 ст. л. (по вкусу).\n* Соль — щепотка.\n* Яйцо — 1 шт. (по желанию для более нежной текстуры).\n\n### Шаги приготовления\n1. В глубокой миске смешайте кефир с содой и оставьте на несколько минут, чтобы произошла реакция (кефир начнёт пузыриться).\n2. Добавьте яйцо (если используете), сахар, соль и хорошо перемешайте.\n3. Постепенно вводите муку, постоянно помешивая, чтобы избежать образования комочков.\n4. Разогрейте сковороду на среднем огне и смажьте её небольшим количеством масла.\n5. Выливайте тесто небольшими порциями на сковороду и обжаривайте оладьи с каждой стороны до золотистого цвета.\n6. Готовые оладьи выложите на тарелку и подавайте горячими. Приятного аппетита!"}, {"id": "dish_08", "prompt": "Дай рецепт блюда «Пельмени домашние».", "a_left": false, "left": "# Пельмени домашние\n\n**Время приготовления:** 60 минут \n**Порций:** 12\n\n## Ингредиенты\n- Мука пшеничная\n- Яйцо куриное — 3 шт\n- Вода — 1 стак.\n- Соль — 1 ч. л.\n- Фарш мясной — 500 г\n- Лук репчатый — 1 шт\n- Перец черный — по вкусу\n- Масло растительное — 4 ст. л.\n\n## Приготовление\n1. В миску просеять муку, добавить соль, яйца, воду и замесить тесто. Тесто должно быть эластичным и не липнуть к рукам. Накрыть полотенцем и оставить на 30 мин.\n2. Пока тесто отдыхает, приготовим начинку. Для этого в фарш добавляем мелко нарезанный лук, перец молотый, соль по вкусу и хорошо перемешиваем.\n3. Раскатываем тонко тесто, вырезаем кружочки (я это делаю стаканом). На каждый кружок кладем немного фарша и защипываем края.\n4. Варим пельмени в подсоленной воде до готовности. Подаем со сметаной или майонезом. Приятного аппетита!", "right": "### Пельмени домашние\n\n**Описание:** вкусные домашние пельмени с мясной начинкой, которые станут отличным обедом или ужином. Подаются с маслом и сметаной.\n\n**Время приготовления:** 1 час 30 минут (без учёта времени варки).\n\n**Количество порций:** зависит от размера пельменей и аппетита едоков, примерно 6–8 порций.\n\n### Ингредиенты\n* **Для теста:**\n    * мука пшеничная — 500 г;\n    * вода — 200 мл;\n    * яйцо куриное — 1 шт.;\n    * соль — 0,5 ч. л.\n* **Для начинки:**\n    * фарш мясной (например, свинина + говядина) — 400 г;\n    * лук репчатый — 1 шт.;\n    * соль — по вкусу;\n    * перец чёрный молотый — по вкусу;\n    * специи для фарша — по вкусу (по желанию).\n* **Дополнительно:**\n    * масло растительное — для раскатки теста;\n    * сметана — для подачи;\n    * сливочное масло — для подачи.\n\n### Приготовление\n1. Подготовьте все ингредиенты.\n2. Для начала приготовьте тесто. В глубокой миске смешайте муку, соль и яйцо. Постепенно вливайте воду, замешивая тесто. Тесто должно быть эластичным и не липнуть к рукам. Накройте миску с тестом полотенцем и оставьте на 20–30 минут.\n3. Пока тесто отдыхает, займитесь начинкой. Очистите луковицу и мелко нарежьте её. Обжарьте лук на растительном масле до золотистого цвета. Остудите обжаренный лук.\n4. Смешайте фарш с луком, добавьте соль, перец и специи по вкусу. Тщательно перемешайте начинку.\n5. Раскатайте тесто в тонкий пласт толщиной около 2 мм. Вырежьте кружочки стаканом или специальной формой.\n6. На каждый кружок выложите немного начинки и аккуратно защипните края, формируя пельмень.\n7. Варите пельмени в кипящей подсоленной воде 7–10 минут после того, как они всплывут.\n8. Готовые пельмени достаньте шумовкой и подавайте горячими со сливочным маслом и сметаной."}, {"id": "dish_04", "prompt": "Как приготовить «Винегрет»? Дай подробный рецепт.", "a_left": false, "left": "# Винегрет\n\n**Время приготовления:** 30 минут \n**Порций:** 4\n\n## Ингредиенты\n- Свекла — 1 шт\n- Морковь — 2 шт\n- Картофель — 2 шт\n- Огурец соленый — 5 шт\n- Горошек зеленый — 1 бан.\n- Лук репчатый — 1 шт\n- Масло растительное — 6 ст. л.\n- Уксус — 1 ч. л.\n- Соль — по вкусу\n- Перец черный — по вкусу\n\n## Приготовление\n1. Отварить свеклу, морковь и картофель в мундире до готовности. Дать остыть, очистить от кожуры и нарезать кубиками.\n2. Соленые огурцы также нарезать кубиками.\n3. Репчатый лук мелко порубить.\n4. В миске смешать все нарезанные овощи, добавить консервированный горошек (жидкость предварительно слить).\n5. Для заправки смешать растительное масло, уксус, соль и перец. Заправить салат и перемешать.\n6. Приятного аппетита!", "right": "### Винегрет\n\n**Описание:** винегрет — это классический овощной салат, который отличается ярким вкусом и пользой благодаря использованию разнообразных овощей. Он идеально подходит для постного меню или как гарнир к основным блюдам.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** зависит от размера посуды, обычно хватает на 4–6 порций.\n\n### Ингредиенты\n* Свёкла отварная — 2 штуки (среднего размера).\n* Морковь отварная — 2 штуки (среднего размера).\n* Картофель отварной — 4 штуки (среднего размера).\n* Огурцы солёные — 3–4 штуки (в зависимости от размера).\n* Лук репчатый (или зелёный лук) — 1 штука (средняя луковица) или небольшой пучок зелёного лука.\n* Горошек консервированный — 1 банка (200 г).\n* Масло растительное — 3–4 столовые ложки.\n* Соль — по вкусу.\n* Перец чёрный молотый — по вкусу.\n* Уксус столовый (9%) или лимонный сок — 1 столовая ложка (по желанию).\n\n### Приготовление\n1. Отварите овощи (свёклу, морковь и картофель) до готовности. Для этого положите их в кастрюлю, залейте холодной водой и варите до мягкости. Время варки может варьироваться в зависимости от размера овощей, но обычно составляет около 20–30 минут для моркови и картофеля, а для свёклы — немного дольше. Готовые овощи остудите и очистите.\n2. Нарежьте все отваренные овощи кубиками примерно одинакового размера.\n3. Солёные огурцы также нарежьте кубиками. Если используете репчатый лук, его нужно мелко нарезать. Зелёный лук можно просто измельчить.\n4. В глубокой миске смешайте нарезанные овощи: свёклу, морковь, картофель, огурцы и горошек.\n5. Добавьте растительное масло, соль и перец по вкусу. Тщательно перемешайте.\n6. При желании добавьте уксус или лимонный сок для придания дополнительной кислинки. Ещё раз перемешайте.\n7. Дайте салату настояться в холодильнике около 15–20 минут перед подачей. Это позволит вкусам лучше соединиться.\n\nПриятного аппетита!"}, {"id": "ingr_15", "prompt": "У меня есть: свекла, чеснок и майонез. Что можно приготовить? Напиши рецепт.", "a_left": true, "left": "### Салат из свёклы с чесноком и майонезом\n\n**Описание:** этот салат — простое и вкусное блюдо, которое может стать отличным дополнением к обеду или ужину. Свёкла придаёт ему сладость и насыщенность, а чеснок добавляет пикантности. Майонез служит заправкой, которая объединяет все вкусы.\n\n**Время приготовления:** 30 минут.\n\n**Количество порций:** 4.\n\n### Ингредиенты\n* свёкла — 500 г;\n* чеснок — 2 зубчика;\n* майонез — по вкусу;\n* соль — по вкусу;\n* чёрный перец молотый — по вкусу;\n* зелень для украшения (например, укроп или петрушка) — по желанию.\n\n### Шаги приготовления\n1. Отварите свёклу до готовности. Для этого поместите её в кастрюлю, залейте водой и варите около 40–60 минут (время зависит от размера свёклы). Проверьте готовность вилкой — она должна легко входить в овощ. Остудите свёклу и очистите её от кожуры.\n2. Натрите свёклу на крупной тёрке.\n3. Очистите чеснок и пропустите его через пресс или мелко нарежьте.\n4. В миске смешайте натёртую свёклу, измельчённый чеснок, майонез, соль и перец. Хорошо перемешайте все ингредиенты.\n5. Переложите салат в сервировочное блюдо и украсьте зеленью по желанию.\n\nПриятного аппетита!", "right": "# Салат \"Свекольный\"\n\n**Время приготовления:** 30 минут \n**Порций:** 4\n\n## Ингредиенты\n- Свекла — 1 шт\n- Чеснок — 2 зуб.\n- Майонез — 5 ст. л.\n- Соль — по вкусу\n- Перец черный — по вкусу\n- Зелень — по вкусу\n\n## Приготовление\n1. Отварить свеклу до готовности (я варю в микроволновке). Очистить от кожуры и натереть на крупной терке.\n2. Добавить к свекле пропущенный через пресс чеснок, соль, перец и майонез. Все хорошо перемешать.\n3. Выложить салат в порционные креманки или салатник. Украсить зеленью. Приятного аппетита!"}, {"id": "dish_02", "prompt": "Дай рецепт блюда «Солянка мясная сборная».", "a_left": false, "left": "# Солянка мясная сборная\n\n**Время приготовления:** 60 минут \n**Порций:** 4\n\n## Ингредиенты\n- Бульон — 2 л\n- Колбаса — 150 г\n- Сосиска — 3 шт\n- Ветчина — 150 г\n- Лук репчатый — 1 шт\n- Морковь — 1 шт\n- Огурец соленый — 2 шт\n- Томатная паста — 2 ст. л.\n- Маслины — 1 бан.\n- Лимон — 1/2 шт\n- Зелень — по вкусу\n- Соль — по вкусу\n- Перец черный — по вкусу\n- Масло растительное — 2 ст. л.\n\n## Приготовление\n1. Подготовить продукты для солянки. Мясные изделия нарезать соломкой или кубиками.\n2. В кастрюле разогреть масло и обжарить лук до мягкости, добавить морковь и жарить еще пару минут.\n3. Добавить мясные изделия и обжаривать все вместе около 5 минут.\n4. Затем влить бульон (или воду), довести до кипения и варить на медленном огне 15 минут.\n5. Тем временем нарезать огурцы соломкой.\n6. Добавить огурцы к супу, проварить 5 минут.\n7. Добавить маслины и томатную пасту, перемешать и готовить еще 5 минут.\n8. Приправить солью и перцем по вкусу.\n9. Подавать горячей, украсив ломтиками лимона и зеленью. Приятного аппетита!", "right": "### Солянка мясная сборная\n\n**Описание:** сытный и ароматный суп с богатым вкусом, который понравится всей семье. В солянке гармонично сочетаются несколько видов мяса и копчёности, придающие блюду неповторимый аромат.\n\n**Время приготовления:** около 1,5 часов.\n\n**Количество порций:** 6–8.\n\n### Ингредиенты\n* Вода — 3 л.\n* Говядина (или другой вид мяса, например, свинина или курица) — 400 г.\n* Копчёные рёбрышки — 200 г.\n* Колбаса варёная — 200 г.\n* Сосиски — 200 г.\n* Луковица — 1 шт.\n* Морковь — 1 шт.\n* Томатная паста — 2 ст. л.\n* Оливки без косточек — 1 банка.\n* Маслины без косточек — 1 банка.\n* Лимон — ½ шт.\n* Соль — по вкусу.\n* Чёрный перец горошком — 5–7 шт.\n* Лавровый лист — 2–3 шт.\n* Растительное масло — для жарки.\n* Зелень (укроп, петрушка) — для подачи.\n* Сметана — для подачи.\n\n### Приготовление\n1. Налейте воду в кастрюлю и поставьте её на огонь. Когда вода закипит, добавьте мясо и копчёные рёбрышки. Варите на медленном огне около 40 минут.\n2. Пока варится бульон, нарежьте лук мелкими кубиками, морковь — тонкой соломкой или натрите на крупной тёрке.\n3. Обжарьте лук и морковь на растительном масле до золотистого цвета.\n4. Добавьте томатную пасту к овощам и перемешайте. Тушите ещё 5–7 минут.\n5. Выньте из бульона мясо и рёбрышки, нарежьте их небольшими кусочками. Верните мясо в бульон.\n6. Добавьте в бульон обжаренные овощи с томатной пастой.\n7. Нарежьте колбасу и сосиски кружочками и добавьте в суп.\n8. Откройте банки с оливками и маслинами, слейте жидкость и добавьте их в суп.\n9. Посолите суп по вкусу, добавьте чёрный перец горошком и лавровый лист. Варите ещё 10–15 минут.\n10. Выдавите сок половины лимона в суп за пару минут до готовности. Это придаст солянке кислинку.\n11. Дайте супу настояться под крышкой после выключения огня. Подавайте солянку горячей, украсив зеленью и добавив сметану по вкусу."}, {"id": "dish_07", "prompt": "Как приготовить «Блины на молоке»? Дай подробный рецепт.", "a_left": false, "left": "# Блины на молоке\n\n**Время приготовления:** 60 минут \n**Порций:** 12\n\n## Ингредиенты\n- Молоко — 500 мл\n- Яйцо куриное — 3 шт\n- Сахар — 4 ст. л.\n- Соль — 1 ч. л.\n- Масло растительное — 4 ст. л.\n- Мука пшеничная\n\n## Приготовление\n1. Яйца взбить венчиком с сахаром и солью до однородной массы.\n2. Влить молоко и масло, перемешать.\n3. Добавить муку и хорошо перемешать тесто, чтобы не было комочков.\n4. Выпекать блины на разогретой сковороде с двух сторон до золотистого цвета.\n5. Приятного аппетита!", "right": "### Блины на молоке\n\n**Описание:** нежные и ароматные блины на молоке — идеальный выбор для завтрака или десерта. Они легко готовятся и радуют своим вкусом.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** зависит от размера сковороды и желаемого количества блинов. Обычно из указанного количества ингредиентов получается около 15–20 блинов.\n\n### Ингредиенты\n* молоко — 500 мл;\n* яйца — 2 шт.;\n* мука — 180 г;\n* сахар — 3 ст. л.;\n* соль — щепотка;\n* растительное масло — 3 ст. л. (для теста) + дополнительно для смазывания сковороды.\n\n### Приготовление\n1. В глубокой миске взбейте яйца с сахаром и солью до образования пены.\n2. Постепенно влейте молоко, продолжая взбивать смесь.\n3. Просейте муку и аккуратно введите её в яично-молочную смесь, замешивая тесто.\n4. Добавьте растительное масло и тщательно перемешайте. Тесто должно получиться однородным и без комочков.\n5. Разогрейте сковороду на среднем огне и смажьте её небольшим количеством растительного масла.\n6. Налейте немного теста на сковороду и равномерно распределите его по поверхности.\n7. Жарьте блин с одной стороны до золотистой корочки, затем переверните на другую сторону.\n8. Когда обе стороны станут золотистыми, снимите блин со сковороды.\n9. Повторяйте процесс, пока не закончится тесто. Подавайте блины горячими, можно добавить сливочное масло, мёд, варенье или сгущённое молоко по вкусу."}, {"id": "dish_10", "prompt": "Как приготовить «Голубцы»? Дай подробный рецепт.", "a_left": true, "left": "### Голубцы\n\n**Описание:** нежные голубцы с мясной начинкой в томатном соусе. Это блюдо станет отличным дополнением к семейному ужину или праздничному столу.\n\n**Время приготовления:** 1 час 30 минут.\n\n**Количество порций:** зависит от размера капустных листьев и ваших предпочтений (примерно на 4–6 порций).\n\n### Ингредиенты\n* Капуста — 1 кочан;\n* Фарш (смешанный свиной и говяжий) — 500 г;\n* Рис — 100 г;\n* Лук репчатый — 2 шт.;\n* Морковь — 2 шт.;\n* Томатная паста — 2 ст. л.;\n* Вода или бульон — 200 мл;\n* Растительное масло — для жарки;\n* Соль — по вкусу;\n* Чёрный перец молотый — по вкусу;\n* Лавровый лист — 2 шт.;\n* Паприка молотая — по вкусу;\n* Чеснок — 3 зубчика;\n* Сахар — щепотка (по желанию).\n\n### Приготовление\n1. Подготовьте капусту: удалите верхние листья, вырежьте кочерыжку и отварите капусту до мягкости в подсоленной воде (около 10–15 минут). Затем аккуратно разберите капусту на листья.\n2. Отварите рис до полуготовности.\n3. Очистите лук и морковь. Мелко нарежьте одну луковицу и натрите морковь на крупной тёрке. Обжарьте их на растительном масле до золотистого цвета.\n4. В фарш добавьте мелко нарезанный второй лук, отварной рис, соль, чёрный перец, паприку и измельчённый чеснок. Тщательно перемешайте.\n5. На подготовленные капустные листья выложите немного фарша и заверните конвертиком.\n6. Разогрейте растительное масло на сковороде. Выложите голубцы и обжарьте их с двух сторон до золотистой корочки.\n7. В отдельной посуде смешайте томатную пасту с водой или бульоном, добавьте сахар и хорошо перемешайте. Полученным соусом залейте голубцы в сковороде.\n8. Добавьте лавровый лист и тушите под крышкой на медленном огне около 20–30 минут.", "right": "# Голубцы\n\n**Время приготовления:** 60 минут \n**Порций:** 4\n\n## Ингредиенты\n- Капуста белокочанная\n- Фарш мясной — 500 г\n- Рис — 1 стак.\n- Лук репчатый — 2 шт\n- Морковь — 1 шт\n- Томатная паста — 3 ст. л.\n- Сметана — 3 ст. л.\n- Вода — 1 стак.\n- Соль\n- Перец черный\n- Масло растительное\n\n## Приготовление\n1. Отварить рис до полуготовности.\n2. Нашинковать капусту.\n3. Обжарить лук и морковь.\n4. Смешать фарш, рис, обжаренные овощи, соль, перец.\n5. Завернуть начинку в капустные листья.\n6. Выложить голубцы в кастрюлю.\n7. Приготовить соус из воды, томатной пасты, сметаны, соли, перца.\n8. Залить соусом голубцы.\n9. Тушить под крышкой около часа.\n10. Приятного аппетита!"}, {"id": "ingr_02", "prompt": "Что приготовить из таких продуктов: кабачки, фарш и сыр? Нужен подробный рецепт.", "a_left": false, "left": "# Кабачковые лодочки\n\n**Время приготовления:** 60 минут \n**Порций:** 4\n\n## Ингредиенты\n- Кабачок — 2 шт\n- Фарш мясной — 350 г\n- Лук репчатый — 1 шт\n- Морковь — 1 шт\n- Сыр твердый — 70 г\n- Соль — по вкусу\n- Перец черный — по вкусу\n- Масло растительное — 2 ст. л.\n\n## Приготовление\n1. Кабачки помыть, разрезать вдоль пополам, удалить мякоть, оставив стенки толщиной около 5 мм.\n2. Мякоть нарезать кубиками.\n3. Обжарить лук до прозрачности, добавить морковь, обжарить еще пару минут.\n4. Добавить фарш, жарить, разбивая комочки фарша лопаткой, пока не выпарится жидкость.\n5. Добавить соль, перец, мякоть кабачков, перемешать, снять с огня.\n6. Нафаршировать половинки кабачков фаршем.\n7. Выложить в форму для запекания, посыпать тертым сыром.\n8. Запекать при температуре 190 градусов 30 минут.\n9. Приятного аппетита!", "right": "### Фаршированные кабачки с сыром\n\n**Описание:** это вкусное и сытное блюдо, которое понравится всей семье. Кабачки, фаршированные фаршем и сыром, запекаются в духовке до золотистой корочки.\n\n**Время приготовления:** 40–50 минут.\n\n**Количество порций:** зависит от размера кабачков (примерно 4–6 порций).\n\n### Ингредиенты\n* Кабачки — 2 шт.\n* Фарш (любой по вкусу) — 300 г.\n* Сыр твёрдый — 100 г.\n* Лук репчатый — 1 шт.\n* Чеснок — 2 зубчика.\n* Томатная паста — 1 ст. л.\n* Масло растительное — для смазывания формы.\n* Соль — по вкусу.\n* Перец чёрный молотый — по вкусу.\n* Специи (например, паприка, кориандр) — по вкусу.\n\n### Шаги приготовления\n1. Подготовьте все необходимые ингредиенты. Кабачки вымойте и обсушите бумажным полотенцем.\n2. Разрежьте кабачки вдоль пополам и аккуратно извлеките мякоть, оставив стенки толщиной около 5 мм. Мякоть нарежьте мелкими кубиками.\n3. Очистите лук и чеснок. Лук нарежьте мелко, а чеснок пропустите через пресс.\n4. На разогретой с растительным маслом сковороде обжарьте лук и чеснок до золотистого цвета.\n5. Добавьте к луку фарш, томатную пасту, соль, перец и специи. Перемешайте и обжаривайте всё вместе 5–7 минут.\n6. Добавьте нарезанную мякоть кабачков к фаршу и перемешайте.\n7. Наполните «лодочки» из кабачков получившейся смесью. Сверху посыпьте тёртым сыром.\n8. Смажьте форму для запекания растительным маслом и выложите в неё фаршированные кабачки.\n9. Запекайте в предварительно разогретой до 180 °C духовке примерно 25–30 минут до золотистой корочки.\n10. Готовые фаршированные кабачки подавайте горячими. Приятного аппетита!"}, {"id": "dish_14", "prompt": "Дай рецепт блюда «Уха».", "a_left": false, "left": "# Уха\n\n**Время приготовления:** 60 минут \n**Порций:** 4\n\n## Ингредиенты\n- Рыба — 1 кг\n- Картофель — 3 шт\n- Морковь — 2 шт\n- Лук репчатый — 1 шт\n- Лист лавровый — 2 шт\n- Перец душистый — 5 шт\n- Соль — по вкусу\n- Зелень — по вкусу\n\n## Приготовление\n1. Рыбу почистить, выпотрошить, удалить жабры, промыть холодной водой. Нарезать крупными кусками.\n2. В кастрюлю налить воды (примерно 2 литра), положить рыбу, довести до кипения, снять пену, посолить и варить на медленном огне около 20 минут.\n3. По
