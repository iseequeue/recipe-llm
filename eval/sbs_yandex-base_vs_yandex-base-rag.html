<script>
const DATA = {"a": "yandex-base", "b": "yandex-base-rag", "items": [{"id": "cat_07", "prompt": "Хочу приготовить что-нибудь из категории «Вторые блюда», вкус: острый. Напиши рецепт.", "a_left": true, "left": "### Куриные крылышки в остром соусе\n\n**Описание:** это блюдо порадует любителей острой кухни. Сочные куриные крылышки, покрытые ароматным острым соусом, станут отличным дополнением к любому столу.\n\n**Время приготовления:** 40–50 минут.\n\n**Количество порций:** 4.\n\n### Ингредиенты\n* Куриные крылышки — 1 кг.\n* Растительное масло — 3 ст. л.\n* Чеснок — 4 зубчика.\n* Соевый соус — 3 ст. л.\n* Мёд — 2 ст. л.\n* Красный перец молотый — 1 ч. л.\n* Чёрный перец молотый — ½ ч. л.\n* Паприка молотая — 1 ч. л.\n* Соль — по вкусу.\n\n### Приготовление\n1. Подготовьте все ингредиенты. Куриные крылышки тщательно промойте и обсушите бумажным полотенцем.\n2. В небольшой миске смешайте соевый соус, мёд, красный и чёрный перец, паприку и соль.\n3. Очистите чеснок и пропустите его через пресс прямо в миску с соусом. Перемешайте всё до однородности.\n4. Разогрейте растительное масло на сковороде на среднем огне.\n5. Выложите куриные крылышки на сковороду и обжарьте их с каждой стороны до золотистой корочки (примерно по 5–7 минут с каждой стороны).\n6. Снимите крылышки со сковороды и переложите их в миску.\n7. На ту же сковороду вылейте приготовленный соус и дайте ему немного покипеть, чтобы он загустел.\n8. Верните крылышки обратно на сковороду, залейте их соусом и перемешайте.\n9. Уменьшите огонь и тушите крылышки в соусе ещё 5–7 минут, чтобы они пропитались ароматом соуса.\n10. Подавайте горячими. Приятного аппетита!", "right": "# Куриное филе в остром соусе\n\n**Описание:** это блюдо представляет собой сочное куриное филе, приготовленное в ароматном остром соусе. Оно станет отличным дополнением к любому гарниру.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** зависит от размера формы для запекания и аппетита участников трапезы (примерно на 4 порции).\n\n### Ингредиенты\n* Куриное филе — 500 г.\n* Красный жгучий перец — 2 шт.\n* Чеснок — 3 зубчика.\n* Томатная паста — 2 ст. л.\n* Растительное масло — 2 ст. л.\n* Вода или бульон — 100 мл.\n* Смесь специй (например, карри) — 1 ст. л.\n* Соль — по вкусу.\n* Сахар — щепотка (для баланса вкуса).\n\n### Приготовление\n1. Разогрейте духовку до 180 °C. Куриное филе нарежьте небольшими кусочками.\n2. Жгучий перец очистите от семян и мелко нарежьте. Чеснок измельчите.\n3. В сковороде разогрейте растительное масло, добавьте измельчённый чеснок и жгучий перец. Обжарьте в течение нескольких минут до появления аромата.\n4. Добавьте томатную пасту, перемешайте и обжаривайте ещё минуту.\n5. Влейте воду или бульон, добавьте смесь специй, соль и сахар. Доведите до кипения.\n6. Выложите куриное филе в форму для запекания, залейте соусом.\n7. Запекайте в духовке около 20–25 минут до готовности курицы.\n8. Подавайте горячим с любимым гарниром."}, {"id": "dish_00", "prompt": "Напиши рецепт: Борщ", "a_left": true, "left": "### Рецепт: борщ\n\n**Описание:** ароматный и насыщенный борщ — классическое блюдо русской кухни. Густой и вкусный суп с ярким свекольным цветом и приятной кислинкой станет отличным обедом для всей семьи.\n\n**Время приготовления:** около 1,5–2 часов.\n\n**Количество порций:** зависит от размера кастрюли, обычно хватает на 4–6 порций.\n\n### Ингредиенты\n* Свёкла — 3–4 штуки (среднего размера);\n* морковь — 2 штуки;\n* лук репчатый — 1 штука;\n* капуста белокочанная — 300 г;\n* картофель — 4–5 штук;\n* томатная паста — 2 столовые ложки;\n* растительное масло — 3–4 столовые ложки;\n* вода — примерно 2 литра;\n* соль — по вкусу;\n* сахар — 1 столовая ложка (для баланса вкуса);\n* уксус столовый 9% — 1–2 столовые ложки (для сохранения яркого цвета свёклы);\n* лавровый лист — 2–3 штуки;\n* чёрный перец горошком — 5–7 штук;\n* чеснок — 2 зубчика;\n* зелень (укроп, петрушка) — по вкусу.\n\n### Приготовление\n1. Очистите овощи. Нарежьте свёклу соломкой или натереть на крупной тёрке. Морковь также нарежьте соломкой или натрите. Лук нарежьте кубиками. Картофель нарежьте средними кусочками. Капусту нашинкуйте.\n\n2. В кастрюле разогрейте растительное масло и обжарьте лук до прозрачности.\n\n3. Добавьте морковь и обжаривайте ещё несколько минут.\n\n4. Затем добавьте томатную пасту и перемешайте. Обжаривайте всё вместе ещё пару минут.\n\n5. Добавьте в кастрюлю свёклу, уксус, сахар, соль и немного воды. Тушите под крышкой на медленном огне около 20–30 минут, чтобы свёкла стала мягкой и отдала свой цвет.\n\n6. Добавьте оставшуюся воду, картофель и капусту. Доведите до кипения, затем уменьшите огонь и варите около 20 минут, пока картофель и капуста не станут мягкими.\n\n7. Добавьте лавровый лист, чёрный перец горошком и измельчённый чеснок за 5–7 минут до готовности.\n\n8. Попробуйте борщ на вкус и при необходимости добавьте соль или сахар.\n\n9. Снимите борщ с огня, дайте ему настояться под крышкой 10–15 минут и подавайте горячим, посыпав зеленью.", "right": "# Борщ\n\n**Описание:** ароматный и насыщенный борщ — классическое блюдо русской кухни. Этот рецепт порадует вас своим ярким вкусом и цветом.\n\n**Время приготовления:** около 2 часов.\n\n**Количество порций:** зависит от размера кастрюли, примерно на 6–8 порций.\n\n### Ингредиенты\n* Мясо (например, говядина) — 400 г;\n* Картофель — 5 шт.;\n* Свёкла — 3 шт.;\n* Морковь — 3 шт.;\n* Капуста белокочанная — по вкусу;\n* Помидор — 1 шт.;\n* Уксус — 2 ст. л.;\n* Сахар — 1 ст. л.;\n* Соль — по вкусу;\n* Укроп — по вкусу;\n* Чеснок — по вкусу;\n* Растительное масло — для жарки.\n\n### Приготовление\n1. Мясо поставить вариться в кастрюле. Варить на медленном огне около 2 часов.\n2. Когда мясо сварится, добавить очищенный картофель.\n3. Через 5 минут после добавления картофеля добавить нашинкованную капусту. Крышку прикрыть не полностью.\n4. Разогреть сковороду, налить немного растительного масла. Выложить натёртые на крупной тёрке морковь и свёклу.\n5. Сразу влить 2 ст. л. уксуса (если используется эссенция, то нужно разбавить) и 1 ст. л. сахара. Перемешать, накрыть крышкой и оставить тушиться минут на 15. Важно именно тушить, а не жарить.\n6. Если свёкла не очень сочная, добавить пару ложек бульона.\n7. В конце положить тёртый на тёрке помидор.\n8. Когда капуста и картофель практически будут готовы, выложить к ним тушёные морковь и свёклу. Всё перемешать.\n9. Оставить томиться на очень медленном огне для насыщения. Главное, чтобы борщ не закипел, иначе теряются и вкус, и цвет.\n10. Готовый борщ посыпать рубленым укропом и чесноком.\n11. Накрыть крышкой и дать ещё немного настояться."}, {"id": "dish_09", "prompt": "Напиши рецепт: Плов с говядиной", "a_left": true, "left": "### Плов с говядиной\n\n**Описание:** ароматный плов с нежной говядиной, который станет отличным ужином для всей семьи. Рис получается рассыпчатым, а мясо — мягким и сочным.\n\n**Время приготовления:** около 1 часа 20 минут.\n\n**Количество порций:** зависит от размера казана или кастрюли, обычно хватает на 4–6 порций.\n\n### Ингредиенты\n* Говядина — 500 г.\n* Рис длиннозёрный — 500 г.\n* Морковь — 3–4 шт.\n* Лук репчатый — 2 шт.\n* Чеснок — 1 головка.\n* Растительное масло — 100 мл.\n* Специи для плова (зира, куркума, паприка, чёрный перец) — по вкусу.\n* Соль — по вкусу.\n\n### Шаги приготовления\n1. Подготовьте все ингредиенты. Мясо нарежьте небольшими кусочками.\n2. Очистите лук и морковь. Лук нарежьте полукольцами, морковь — соломкой или брусочками.\n3. Разогрейте казан или кастрюлю с толстым дном на сильном огне. Добавьте растительное масло и дайте ему нагреться.\n4. Обжарьте кусочки говядины до золотистой корочки. Убавьте огонь до среднего и добавьте нарезанный лук. Обжаривайте до прозрачности лука.\n5. Добавьте морковь и обжаривайте всё вместе ещё несколько минут, пока морковь не станет мягкой.\n6. Посолите и добавьте специи для плова. Перемешайте.\n7. Промойте рис под проточной водой несколько раз, пока вода не станет прозрачной.\n8. Выложите рис ровным слоем поверх мяса и овощей. Воткните в рис головку чеснока.\n9. Залейте горячей водой так, чтобы она покрывала рис примерно на палец. Доведите до кипения, затем уменьшите огонь и готовьте под крышкой около 20–30 минут, пока рис не впитает всю воду.\n10. Проверьте готовность риса. Если вода полностью испарилась, а рис стал мягким, плов готов. Дайте блюду настояться под крышкой ещё 10–15 минут.", "right": "# Плов с говядиной\n\n**Время приготовления:** 90 минут\n**Порций:** зависит от размера посуды и ваших предпочтений (например, на 6–8 порций)\n\n## Ингредиенты\n* Говядина — 500 г;\n* Репчатый лук — 300 г;\n* Морковь — 500 г;\n* Чеснок — 150 г (примерно 5–7 крупных головок);\n* Рис — 900 г;\n* Растительное масло — 200 мл;\n* Специи для плова (например, зира, куркума, паприка) — 5 г;\n* Соль — 10 г.\n\n## Приготовление\n1. Очистите и нарежьте лук полукольцами.\n2. Разогрейте растительное масло в казане или глубокой сковороде. Обжарьте лук до тёмно-золотистого цвета.\n3. Нарежьте говядину небольшими кусочками и добавьте к обжаренному луку. Обжаривайте, помешивая, до золотистой корочки.\n4. Добавьте специи, соль и продолжайте обжаривать всё вместе.\n5. Залейте содержимое казана водой так, чтобы она покрывала мясо, и протушите до тех пор, пока говядина не станет мягкой (это может занять около 20–30 минут).\n6. Крупно нарежьте морковь и добавьте её в казан. Проварите всё вместе примерно 5 минут.\n7. Очистите чеснок и воткните целые головки в середину моркови.\n8. Промойте рис несколько раз до прозрачности воды и выложите его ровным слоем поверх овощей и мяса.\n9. Залейте рис водой так, чтобы уровень воды был примерно на 1,5 см выше уровня риса.\n10. Поставьте казан на медленный огонь, накройте крышкой и оставьте томиться на 30 минут.\n11. Не перемешивайте плов в течение 30 минут. Затем аккуратно перемешайте верхний слой.\n12. Снова накройте крышкой и дайте плову постоять ещё 10 минут.\n13. Аккуратно перемешайте плов, не соскребая со дна, и подавайте к столу."}, {"id": "ingr_18", "prompt": "У меня есть: овсянка, банан и молоко. Что можно приготовить? Напиши рецепт.", "a_left": false, "left": "# Тёплый банановый коктейль с овсянкой\n\n**Время приготовления:** 30 минут\n**Количество порций:** зависит от объёма используемых ингредиентов (примерно на 1–2 порции)\n\n## Ингредиенты\n* Молоко — 500 мл;\n* Банан — 1 шт.;\n* Овсяные хлопья — 2 ст. л.;\n* Корица — 1 ч. л. (по желанию);\n* Мёд или сахар — по вкусу (можно заменить любым подсластителем по желанию).\n\n## Приготовление\n1. Налейте молоко в небольшой сотейник и поставьте на огонь.\n2. Пока молоко нагревается, очистите банан и нарежьте его на кусочки.\n3. Добавьте нарезанный банан и корицу в молоко. Можно также добавить мёд или сахар для сладости.\n4. Нагревайте смесь на маленьком огне до появления пара, но не кипятите, чтобы сохранить все полезные свойства и аромат ингредиентов.\n5. Снимите сотейник с огня и добавьте овсяные хлопья.\n6. Взбейте всё погружным блендером до однородной консистенции.\n7. Разлейте горячий коктейль по чашкам и наслаждайтесь тёплым напитком!", "right": "### Овсяная каша с бананом и молоком\n\n**Описание:** нежная овсяная каша с кусочками спелого банана — это идеальный завтрак или перекус в течение дня. Простое и полезное блюдо, которое понравится всей семье.\n\n**Время приготовления:** 10–15 минут.\n\n**Количество порций:** 1–2 порции.\n\n### Ингредиенты\n* Овсяные хлопья — 4–5 столовых ложек;\n* Молоко — 200 мл;\n* Банан — 1 шт.;\n* Соль — щепотка;\n* Сахар или мёд — по вкусу (по желанию).\n\n### Шаги приготовления\n1. Вскипятите молоко в небольшой кастрюле.\n2. Добавьте овсяные хлопья в кипящее молоко, перемешайте и убавьте огонь.\n3. Варите кашу на медленном огне, помешивая, около 5–7 минут до загустения. Время варки зависит от желаемой консистенции каши.\n4. Очистите банан и нарежьте его кружочками.\n5. Когда каша будет готова, добавьте кусочки банана, соль, сахар или мёд по вкусу. Перемешайте.\n6. Подавайте кашу горячей, при желании можно добавить ещё немного мёда или сахара. Приятного аппетита!"}, {"id": "cat_12", "prompt": "Предложи рецепт из раздела «Напитки».", "a_left": true, "left": "### Рецепт: холодный чай с лимоном и мятой\n\n**Описание:** освежающий напиток, который прекрасно утоляет жажду в жаркие дни. Лёгкий цитрусовый вкус и ароматная мята делают его идеальным выбором для летних вечеров.\n\n**Время приготовления:** 10 минут\n\n**Количество порций:** 2–4 (в зависимости от размера чашек)\n\n### Ингредиенты\n* Чёрный чай — 2 чайные ложки;\n* Вода — 500 мл;\n* Лимон — ½ шт.;\n* Свежая мята — несколько веточек;\n* Сахар или мёд — по вкусу.\n\n### Шаги приготовления\n1. Вскипятите воду в чайнике.\n2. Заварите чёрный чай в чашке или заварочном чайнике. Для этого залейте чайные листья кипятком и дайте настояться 3–5 минут.\n3. Процедите чай через ситечко, чтобы удалить чайные листья.\n4. Добавьте сахар или мёд по вкусу и хорошо перемешайте до полного растворения.\n5. Выжмите сок половины лимона в чашку с чаем.\n6. Добавьте несколько веточек свежей мяты и слегка подавите её ложкой, чтобы аромат раскрылся.\n7. Остудите чай до комнатной температуры, а затем переместите в холодильник на 30–60 минут, чтобы напиток охладился.\n8. Подавайте холодным, украсив долькой лимона и листиками мяты.", "right": "# Летний освежающий лимонад\n\n**Краткое описание:** этот лёгкий и ароматный лимонад прекрасно утоляет жажду в жару. Яркий вкус цитрусов гармонично сочетается с природной свежестью напитка.\n\n**Время приготовления:** 20 минут\n\n**Количество порций:** 4\n\n## Ингредиенты\n* Лимон — 3 шт.\n* Сахар — 150 г\n* Вода — 1,5 л\n* Лёд — по вкусу\n\n## Приготовление\n1. Тщательно вымойте лимоны. Снимите цедру с одного лимона мелкой тёркой, стараясь не затрагивать белый слой альбедо, который может придать горечь. Выдавите сок всех трёх лимонов.\n2. В кастрюле соедините сахар и воду. Добавьте лимонную цедру.\n3. Доведите смесь до кипения, затем уменьшите огонь и варите сироп около 5 минут, пока сахар полностью не растворится.\n4. Снимите кастрюлю с огня и дайте сиропу немного остыть. Затем добавьте лимонный сок.\n5. Перелейте всё в кувшин и оставьте остывать до комнатной температуры.\n6. Перед подачей разлейте лимонад по стаканам, добавив лёд.\n7. Подавайте лимонад сразу же после приготовления."}, {"id": "cat_01", "prompt": "Предложи рецепт супа на обед для семьи.", "a_left": true, "left": "### Рецепт крем-супа из тыквы с имбирём и сливками\n\n**Описание:** нежный и ароматный тыквенный суп с лёгкой остринкой имбиря и сливочной текстурой. Отличный выбор для семейного обеда.\n\n**Время приготовления:** 40 минут.\n\n**Количество порций:** 4–6.\n\n### Ингредиенты\n* тыква (очищенная) — 500 г;\n* лук репчатый — 1 шт.;\n* чеснок — 2 зубчика;\n* имбирь свежий (корень) — 20 г;\n* овощной или куриный бульон — 700 мл;\n* сливки 20% — 100 мл;\n* оливковое масло — 2 ст. л.;\n* соль — по вкусу;\n* перец чёрный молотый — по вкусу;\n* зелень для подачи (укроп, петрушка) — по вкусу.\n\n### Шаги приготовления\n1. Очистите тыкву от кожуры и семян, нарежьте кубиками среднего размера.\n2. Лук очистите и мелко нарежьте. Чеснок измельчите. Имбирь очистите и натрите на мелкой тёрке.\n3. В кастрюле разогрейте оливковое масло на среднем огне. Обжарьте лук до прозрачности, затем добавьте чеснок и имбирь, обжаривайте ещё пару минут.\n4. Добавьте в кастрюлю тыкву и овощной или куриный бульон. Доведите до кипения, затем уменьшите огонь и варите около 20 минут, пока тыква не станет мягкой.\n5. Снимите кастрюлю с огня и пюрируйте содержимое блендером до однородной консистенции.\n6. Верните пюре обратно в кастрюлю, добавьте сливки, соль и перец. Перемешайте и прогрейте на медленном огне ещё несколько минут.\n7. Разлейте суп по тарелкам и украсьте свежей зеленью. Приятного аппетита!", "right": "# Сырный суп с овощами\n\n**Время приготовления:** 40–50 минут\n**Порций:** 6\n\n## Ингредиенты\n* Сыр плавленый — 200 г;\n* Картофель — 4 шт.;\n* Морковь — 1 шт.;\n* Лук репчатый — 1 шт.;\n* Вермишель — 100 г;\n* Масло сливочное — 50 г;\n* Вода — 2 литра;\n* Соль — по вкусу;\n* Чёрный перец молотый — по вкусу;\n* Лавровый лист — 2 шт.;\n* Зелень свежая (укроп или петрушка) — для подачи.\n\n## Приготовление\n1. Очистите и нарежьте картофель кубиками, морковь — кружочками, а лук — мелкими квадратиками.\n2. В кастрюле доведите воду до кипения. Добавьте лавровый лист, соль и перец.\n3. Положите в кипящую воду картофель и варите его около 10 минут.\n4. На сковороде растопите сливочное масло и обжарьте на нём лук и морковь до золотистого цвета.\n5. Переложите обжаренные овощи в кастрюлю с картофелем.\n6. Плавленый сыр нарежьте кубиками или натрите на тёрке и добавьте в суп. Перемешивайте, пока сыр полностью не растворится.\n7. Добавьте вермишель и варите ещё 5–7 минут, пока вермишель не будет готова.\n8. Снимите суп с огня, дайте ему настояться под крышкой несколько минут. Подавайте, посыпав свежей зеленью."}, {"id": "dish_14", "prompt": "Дай рецепт блюда «Уха».", "a_left": false, "left": "# Уха\n\n**Время приготовления:** 45 минут\n**Порций:** 4\n\n## Ингредиенты\n- Вода — количество зависит от объёма кастрюли;\n- Картофель — 5–6 штук;\n- Морковь — 2 штуки;\n- Лук репчатый — 2–3 штуки;\n- Специи (например, сушёные травы);\n- Рыба — количество по вкусу.\n\n## Приготовление\n1. Выберите кастрюлю подходящего размера для нужного количества порций и наполните её водой. Добавьте немного соли и поставьте на огонь до закипания.\n2. Пока вода закипает, подготовьте овощи:\n    * Очистите картофель, помойте его и нарежьте продолговатыми дольками.\n    * Очистите морковь, помойте и нарежьте кружочками.\n    * Очистите лук (лучше брать некрупный), помойте и положите целиком.\n3. Когда вода закипит, добавьте подготовленные овощи.\n4. Подготовьте рыбу: разморозьте (если нужно), почистите, помойте и разрежьте на порционные кусочки.\n5. Добавьте специи в кастрюлю и дайте закипеть.\n6. Варите до готовности овощей и рыбы.\n7. Разлейте уху по тарелкам и посыпьте рубленой зеленью. Можно использовать свежую или сушёную.", "right": "### Уха\n\n**Описание:** уха — это традиционный русский суп из рыбы, который отличается насыщенным вкусом и ароматом. Это простое в приготовлении блюдо, которое порадует вас и ваших близких.\n\n**Время приготовления:** 40–60 минут.\n\n**Количество порций:** зависит от размера кастрюли и аппетита едоков. Например, из указанного количества ингредиентов получается примерно 5–6 порций.\n\n### Ингредиенты\n* Вода — 2 литра.\n* Рыба (например, судак, окунь или щука) — 500 г.\n* Картофель — 3–4 средних клубня.\n* Морковь — 1 штука.\n* Репчатый лук — 1 штука.\n* Лавровый лист — 2 штуки.\n* Чёрный перец горошком — 5–7 штук.\n* Соль — по вкусу.\n* Зелень (укроп, петрушка) — для подачи.\n* Лимон — для подачи (по желанию).\n\n### Шаги приготовления\n1. Подготовьте все необходимые ингредиенты. Очистите картофель, морковь и лук.\n2. В кастрюлю налейте воду и поставьте её на огонь. Доведите воду до кипения.\n3. Пока вода нагревается, нарежьте картофель кубиками среднего размера, морковь кружочками, а лук — мелкими кусочками.\n4. Когда вода закипит, добавьте в кастрюлю рыбу. Если используете целую рыбу, предварительно нарежьте её на порционные куски. Варите рыбу 5–7 минут после повторного закипания воды.\n5. Добавьте в кастрюлю нарезанный картофель, морковь и лук.\n6. Посолите бульон по вкусу, добавьте лавровый лист и чёрный перец горошком.\n7. Варите всё вместе ещё 15–20 минут, пока картофель не станет мягким.\n8. Снимите кастрюлю с огня и дайте ухе немного настояться под крышкой.\n9. Подавайте уху горячей, посыпав зеленью укропа и петрушки. При желании можно добавить ломтик лимона."}, {"id": "dish_06", "prompt": "Напиши рецепт: Сырники", "a_left": true, "left": "### Сырники\n\n**Описание:** нежные сырники из творога, которые станут отличным завтраком или десертом. Подаются со сметаной, мёдом или ягодным соусом.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** зависит от размера сырников (примерно 6–8 штук).\n\n### Ингредиенты\n* Творог жирностью 5–9% — 500 г;\n* Яйцо куриное — 1 шт.;\n* Сахар — 2 ст. л.;\n* Мука пшеничная — 3 ст. л. + для панировки;\n* Соль — щепотка;\n* Ванилин — по вкусу;\n* Растительное масло для жарки — 2–3 ст. л.\n\n### Приготовление\n1. В глубокой миске разомните творог вилкой до однородной консистенции.\n2. Добавьте яйцо, сахар, соль и ванилин. Тщательно перемешайте все ингредиенты.\n3. Постепенно вводите муку, перемешивая массу до однородности. Тесто должно получиться мягким и не слишком крутым.\n4. Сформируйте из теста небольшие лепёшки и обваляйте их в муке с обеих сторон.\n5. Разогрейте сковороду с растительным маслом на среднем огне. Выложите сырники и обжаривайте их с каждой стороны до золотистой корочки (по 2–3 минуты с каждой стороны).\n6. Готовые сырники выложите на бумажное полотенце, чтобы удалить излишки масла.\n7. Подавайте сырники горячими со сметаной, мёдом или ягодным соусом.", "right": "# Сырники\n\n**Время приготовления:** 20–30 минут\n**Порций:** зависит от размера сырников (примерно 4–6 штук)\n\n## Ингредиенты\n- Творог — 500 г\n- Яйцо куриное — 2 шт.\n- Сахар — 3 ст. л.\n- Мука пшеничная — 3 ст. л. + для панировки\n- Сметана — 1 ст. л. (по желанию)\n- Изюм — 1 горсть (по желанию)\n- Масло растительное для жарки\n\n## Приготовление\n1. Распарьте изюм в горячей воде, дайте ему обсохнуть.\n2. В глубокой миске смешайте творог, яйца, сахар и сметану до однородной консистенции. При желании добавьте изюм и перемешайте ещё раз.\n3. Просейте муку на рабочую поверхность. Добавьте муку в творожную массу и всё тщательно перемешайте.\n4. Влажными руками возьмите немного творожного теста, сформируйте лепёшку и обваляйте её в муке. Оставьте на 10 минут. Затем снова обваляйте сырник в муке.\n5. Разогрейте в сковороде растительное масло. Обжаривайте сырники с каждой стороны на медленном огне до образования румяной корочки.\n6. Подавайте готовые сырники горячими, например, со сметаной."}, {"id": "dish_04", "prompt": "Как приготовить «Винегрет»? Дай подробный рецепт.", "a_left": false, "left": "# Винегрет\n\n**Время приготовления:** 60–90 минут\n**Количество порций:** зависит от размера миски или салатника\n\n## Ингредиенты\n* Свёкла — 300 г;\n* Картофель — 200 г;\n* Морковь — 100 г;\n* Квашеная капуста — 100 г;\n* Солёные огурцы — 100 г;\n* Растительное масло — 3 ст. л.;\n* Репчатый лук — 1 шт.;\n* Соль — по вкусу;\n* Сахар — 1 ч. л.;\n* Чёрный перец (по желанию) — по вкусу.\n\n## Приготовление\n1. Заранее отварите или запеките свёклу, картофель и морковь. Дайте им полностью остыть и почистите.\n2. Нарежьте свёклу, картофель и морковь небольшими кубиками одинакового размера.\n3. Репчатый лук нарежьте мелкими кубиками.\n4. Смешайте нарезанную свёклу, картофель, морковь и квашеную капусту в глубокой миске.\n5. На отдельной сковороде разогрейте растительное масло, добавьте мелко нарезанный лук и обжарьте его до прозрачности. Можно также добавить немного чёрного перца для аромата.\n6. Готовую луковую заправку выложите к овощам, добавьте сахар, перемешайте.\n7. Попробуйте салат на вкус и посолите по необходимости.\n8. Добавьте растительное масло, ещё раз всё тщательно перемешайте.\n9. Ваш винегрет готов. Перед подачей можно дать ему настояться в холодильнике около получаса.", "right": "### Винегрет\n\n**Описание:** винегрет — это классический овощной салат, который отличается ярким вкусом и пользой благодаря использованию разнообразных овощей. Он идеально подходит для постного меню или как гарнир к основным блюдам.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** зависит от размера посуды, обычно хватает на 4–6 порций.\n\n### Ингредиенты\n* Свёкла отварная — 2 штуки (среднего размера).\n* Морковь отварная — 2 штуки (среднего размера).\n* Картофель отварной — 4 штуки (среднего размера).\n* Огурцы солёные — 3–4 штуки (в зависимости от размера).\n* Лук репчатый (или зелёный лук) — 1 штука (средняя луковица) или небольшой пучок зелёного лука.\n* Горошек консервированный — 1 банка (200 г).\n* Масло растительное — 3–4 столовые ложки.\n* Соль — по вкусу.\n* Перец чёрный молотый — по вкусу.\n* Уксус столовый (9%) или лимонный сок — 1 столовая ложка (по желанию).\n\n### Приготовление\n1. Отварите овощи (свёклу, морковь и картофель) до готовности. Для этого положите их в кастрюлю, залейте холодной водой и варите до мягкости. Время варки может варьироваться в зависимости от размера овощей, но обычно составляет около 20–30 минут для моркови и картофеля, а для свёклы — немного дольше. Готовые овощи остудите и очистите.\n2. Нарежьте все отваренные овощи кубиками примерно одинакового размера.\n3. Солёные огурцы также нарежьте кубиками. Если используете репчатый лук, его нужно мелко нарезать. Зелёный лук можно просто измельчить.\n4. В глубокой миске смешайте нарезанные овощи: свёклу, морковь, картофель, огурцы и горошек.\n5. Добавьте растительное масло, соль и перец по вкусу. Тщательно перемешайте.\n6. При желании добавьте уксус или лимонный сок для придания дополнительной кислинки. Ещё раз перемешайте.\n7. Дайте салату настояться в холодильнике около 15–20 минут перед подачей. Это позволит вкусам лучше соединиться.\n\nПриятного аппетита!"}, {"id": "ingr_09", "prompt": "У меня есть: фарш, томатная паста и спагетти. Что можно приготовить? Напиши рецепт.", "a_left": true, "left": "### Спагетти с фаршем в томатной пасте\n\n**Описание:** это простое и вкусное блюдо, которое подойдёт для быстрого ужина или обеда. Сочные кусочки фарша в сочетании с ароматным соусом из томатной пасты создают насыщенный вкус.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** зависит от размера вашей кастрюли и аппетита участников трапезы (например, из указанных количеств получится примерно на 4 порции).\n\n### Ингредиенты\n* Фарш — 400 г.\n* Томатная паста — 2 столовые ложки.\n* Спагетти — 200 г.\n* Соль — по вкусу.\n* Чёрный перец молотый — по вкусу.\n* Чеснок — 1–2 зубчика (по желанию).\n* Оливковое масло — 1 столовая ложка (для жарки).\n\n### Шаги приготовления\n1. Поставьте кастрюлю с водой на огонь и доведите воду до кипения. Подготовьте ёмкость с холодной водой и солью для последующего охлаждения спагетти после варки (если вы планируете использовать этот метод).\n2. В сковороде разогрейте оливковое масло на среднем огне.\n3. Измельчите чеснок и добавьте его в сковороду. Обжаривайте чеснок в течение нескольких секунд до появления аромата.\n4. Добавьте фарш в сковороду и обжаривайте, разбивая комочки вилкой, пока фарш не станет коричневым. Это займёт около 5–7 минут.\n5. Добавьте томатную пасту в сковороду и перемешайте с фаршем. Обжаривайте ещё пару минут, чтобы томатная паста равномерно распределилась и немного загустела.\n6. Посолите и поперчите соус по вкусу.\n7. Тем временем вода в кастрюле закипела. Отварите спагетти согласно инструкции на упаковке до состояния аль денте. Слейте воду через дуршлаг.\n8. Переложите спагетти в сковороду с соусом, тщательно перемешайте.\n9. Подавайте готовое блюдо горячим, украсив свежей зеленью по желанию.", "right": "# Спагетти с фаршем\n\n**Время приготовления:** 30 минут\n**Порций:** 2\n\n## Ингредиенты\n* Фарш мясной — 400 г;\n* Спагетти — количество по желанию;\n* Томатная паста — 4 ст. л.;\n* Лук репчатый — 1 шт.;\n* Сыр твёрдый — 200 г;\n* Соль — по вкусу;\n* Перец чёрный — по вкусу.\n\n## Приготовление\n1. Поставьте спагетти вариться в кипящей подсоленной воде до готовности. Обычно это занимает около 10 минут. Откиньте готовые спагетти на дуршлаг и промойте.\n2. Лук мелко порежьте и обжарьте на сковороде до золотистого цвета.\n3. Добавьте в сковороду фарш и жарьте на большом огне, хорошенько помешивая.\n4. Посолите и поперчите фарш по вкусу. Можно добавить другие приправы по желанию.\n5. Добавьте разведённую с водой томатную пасту (можно также влить немного красного вина). Уменьшите огонь, накройте крышкой и тушите примерно 10–15 минут.\n6. Тёртый сыр подготовьте заранее.\n7. Проверьте готовность фарша. Соуса должно быть не слишком много.\n8. Разложите спагетти на тарелки, сверху выложите фарш и посыпьте тёртым сыром.\n9. Приятного аппетита!"}, {"id": "cat_06", "prompt": "Предложи рецепт десерта без выпечки.", "a_left": false, "left": "# Десерт «Фруктовый рай» без выпечки\n\n**Описание:** лёгкий и освежающий десерт, который станет отличным дополнением к чаепитию. Сочетание фруктов и нежного крема делает его особенно вкусным.\n\n**Время приготовления:** 30 минут\n\n**Количество порций:** зависит от размера формы, примерно 6–8 порций\n\n## Ингредиенты\n* Печенье — 200 г;\n* Мягкий творог — 200 г;\n* Сливки 33% — 200 мл;\n* Сахарная пудра — 50 г;\n* Желатин — 10 г;\n* Вода — 50 мл;\n* Фрукты (например, клубника, киви, виноград) — по вкусу.\n\n## Приготовление\n1. Желатин залить водой и оставить для набухания согласно инструкции на упаковке.\n2. Печенье измельчить в крошку любым удобным способом.\n3. Сливки взбить с сахарной пудрой до устойчивых пиков.\n4. Творог переложить в глубокую миску, добавить к нему взбитые сливки и раскрошенное печенье. Всё тщательно перемешать.\n5. Распущенный на водяной бане или в микроволновке желатин ввести в творожно-сливочную массу, перемешивая до однородности.\n6. Подготовить форму для десерта, выстелить её изнутри пищевой плёнкой так, чтобы края плёнки свисали наружу.\n7. Фрукты нарезать небольшими кусочками.\n8. Выложить половину творожной массы в форму, разровнять. Сверху распределить кусочки фруктов. Затем выложить оставшуюся творожную массу и снова разровнять.\n9. Накрыть десерт плёнкой и убрать в холодильник минимум на 2 часа для застывания.\n10. Перед подачей перевернуть десерт из формы на тарелку и снять плёнку.", "right": "### Рецепт: «Фруктовый салат с йогуртом»\n\n**Описание:** лёгкий и освежающий десерт, который можно приготовить за считанные минуты. Идеально подходит для жаркого летнего дня.\n\n**Время приготовления:** 15 минут.\n\n**Количество порций:** 4 порции.\n\n### Ингредиенты\n* Банан — 1 шт.\n* Клубника — 200 г.\n* Киви — 2 шт.\n* Манго (можно заменить другим фруктом) — 200 г.\n* Йогурт без добавок — 200 мл.\n* Мёд или сахар — по вкусу (примерно 1–2 ст. л.).\n* Лимонный сок — 1 ст. л. (по желанию).\n\n### Шаги приготовления\n1. Очистите банан, киви и нарежьте фрукты кубиками среднего размера.\n2. Клубнику промойте, удалите плодоножки и нарежьте ягоды на половинки или четвертинки в зависимости от размера ягод.\n3. Нарежьте манго кубиками. Если у вас другой фрукт, нарежьте его соответствующим образом.\n4. В глубокой миске смешайте все нарезанные фрукты.\n5. Добавьте йогурт к фруктам. При желании добавьте мёд или сахар для сладости и лимонный сок для свежести. Хорошо перемешайте.\n6. Разложите фруктовый салат по порционным тарелкам и подавайте сразу же после приготовления."}, {"id": "cat_11", "prompt": "Предложи рецепт домашнего хлеба.", "a_left": false, "left": "# Домашний хлеб\n\n**Время приготовления:** 240 минут\n\n**Количество порций:** зависит от размера формы для выпечки\n\n## Ингредиенты\n* мука пшеничная — 500 г;\n* вода — 350 мл;\n* дрожжи сухие — 1 ч. л.;\n* соль — 1 ч. л.;\n* сахар — 1 ст. л.;\n* масло растительное — 2 ст. л.\n\n## Приготовление\n1. Просеять муку.\n2. В тёплой воде растворить сахар и дрожжи, оставить на 15 минут, чтобы дрожжи начали работать и появилась пенная шапочка.\n3. В глубокой миске смешать растворённые дрожжи с водой, соль и растительное масло. Перемешать и добавить муку. Замесить тесто руками или при помощи планетарного миксера. Тесто должно получиться эластичным, но слегка липким.\n4. Накрыть тесто плёнкой или тканью и оставить в тёплом месте на 2 часа для подъёма. За это время тесто должно увеличиться в объёме примерно вдвое.\n5. Разогреть духовку до 200 °C.\n6. Слегка смазать форму для выпечки растительным маслом, переложить туда подошедшее тесто и сформировать хлеб. Оставить тесто в форме на 30 минут для дополнительного подъёма.\n7. Выпекать хлеб в разогретой духовке около 30–40 минут до золотистой корочки. Готовность можно проверить зубочисткой: она должна выходить сухой.\n8. Готовый хлеб достать из формы и остудить на решётке.", "right": "### Домашний хлеб\n\n**Описание:** ароматный домашний хлеб, который станет отличным дополнением к любому столу. Простой в приготовлении и невероятно вкусный.\n\n**Время приготовления:** около 3 часов (включая расстойку).\n\n**Количество порций:** зависит от размера формы для выпечки, примерно на 6–8 ломтиков.\n\n### Ингредиенты\n* мука пшеничная высшего сорта — 500 г;\n* вода — 320 мл;\n* дрожжи сухие быстродействующие — 7 г;\n* соль — 10 г;\n* сахар — 15 г.\n\n### Шаги приготовления\n1. Подготовьте все ингредиенты. Муку просейте через сито.\n2. В тёплой воде растворите дрожжи, добавьте сахар и перемешайте до полного растворения. Оставьте на 10–15 минут, чтобы дрожжи активировались.\n3. В большой миске смешайте муку и соль. Сделайте в центре углубление и влейте дрожжевую смесь.\n4. Замесите тесто руками или при помощи миксера с насадкой для теста до однородности и эластичности. Это может занять несколько минут.\n5. Переложите тесто в смазанную маслом миску, накройте пищевой плёнкой или полотенцем и оставьте в тёплом месте для подъёма на 1–1,5 часа. Тесто должно увеличиться в объёме примерно вдвое.\n6. Разогрейте духовку до максимальной температуры (желательно использовать режим конвекции) и подготовьте форму для выпечки, смазав её маслом или выстелив бумагой для выпекания.\n7. Обмятое тесто переложите в форму, накройте и оставьте ещё на 30 минут для дополнительного подъёма.\n8. Перед выпечкой сделайте надрезы на поверхности хлеба острым ножом или лезвием.\n9. Выпекайте хлеб в предварительно разогретой духовке около 20–25 минут при высокой температуре, затем уменьшите температуру до 180 °C и продолжайте выпекать ещё 20–30 минут до золотистой корочки.\n10. Готовый хлеб остудите на решётке перед подачей."}, {"id": "dish_13", "prompt": "Как приготовить «Окрошка на квасе»? Дай подробный рецепт.", "a_left": true, "left": "### Окрошка на квасе\n\n**Описание:** окрошка на квасе — это традиционный холодный суп русской кухни. Он освежает в жаркие дни и готовится из нарезанных свежих овощей, отварного мяса или колбасы, зелени и яиц, залитых квасом.\n\n**Время приготовления:** 30–40 минут (не считая времени варки картофеля и яиц).\n\n**Количество порций:** зависит от объёма используемой посуды и аппетита участников трапезы. Например, из указанного количества ингредиентов получится около 5–6 порций.\n\n### Ингредиенты\n* Картофель — 3–4 шт.\n* Яйца — 3–4 шт.\n* Редис — 1 пучок (около 100 г).\n* Огурцы свежие — 2–3 шт.\n* Колбаса варёная (или ветчина) — 200 г.\n* Зелёный лук — 1 пучок (около 50 г).\n* Укроп свежий — 1 пучок (около 50 г).\n* Петрушка свежая — 1 небольшой пучок (около 30 г).\n* Горчица (готовая) — по вкусу.\n* Соль — по вкусу.\n* Чёрный перец молотый — по вкусу.\n* Хрен (готовый) — по вкусу.\n* Квас — 1 л.\n\n### Приготовление\n1. Отварите картофель в мундире до готовности (примерно 20–25 минут после закипания воды), затем остудите его и очистите.\n2. Сварите яйца вкрутую (7–9 минут после закипания воды), затем охладите их под холодной водой и очистите.\n3. Нарежьте картофель мелкими кубиками.\n4. Нарежьте огурцы мелкими кубиками.\n5. Нарежьте редис мелкими кубиками.\n6. Нарежьте колбасу мелкими кубиками.\n7. Мелко нарежьте зелёный лук, укроп и петрушку.\n8. В глубокой миске смешайте все подготовленные ингредиенты: картофель, огурцы, редис, колбасу, зелень.\n9. Добавьте горчицу, соль, чёрный перец и хрен по вкусу. Перемешайте.\n10. Залейте всё квасом и ещё раз тщательно перемешайте.\n11. Попробуйте окрошку на вкус и при необходимости добавьте соль, перец или другие специи.\n\nПриятного аппетита!", "right": "# Окрошка на квасе\n\n**Время приготовления:** 30–40 минут  \n**Порций:** зависит от размера посуды, например, получится около 4–6 порций\n\n## Ингредиенты\n- Квас — 1 литр\n- Картофель — 3–4 шт.\n- Яйцо куриное — 3–4 шт.\n- Лук зелёный — 1 пучок\n- Редис — 6–8 шт.\n- Огурец — 3–4 шт.\n- Укроп — 1 пучок\n- Сметана — 250 г (по желанию)\n- Соль — по вкусу\n- Сахар — 1–2 чайные ложки (по желанию)\n- Горчица — 1 столовая ложка (по желанию)\n- Перец чёрный молотый — по вкусу\n\n## Приготовление\n1. Отварить картофель и яйца. Остудить и нарезать мелкими кубиками.\n2. Мелко нарезать зелёный лук и укроп. Можно растереть их с щепоткой соли толкушкой до выделения сока.\n3. Нарезать огурцы и редис мелкими кубиками или натереть на крупной тёрке.\n4. Смешать все подготовленные овощи и зелень в большой миске.\n5. Добавить сметану, соль, сахар, горчицу и перец по вкусу, тщательно перемешать.\n6. Залить полученную смесь квасом. Количество кваса может варьироваться в зависимости от желаемой консистенции окрошки.\n7. Ещё раз аккуратно перемешать и попробовать на вкус. При необходимости добавить соль, сахар или горчицу.\n8. Дать окрошке настояться в холодильнике не менее 2 часов перед подачей."}, {"id": "ingr_00", "prompt": "У меня есть: курица, рис и морковь. Что можно приготовить? Напиши рецепт.", "a_left": true, "left": "### Куриный плов с морковью\n\n**Описание:** ароматный и насыщенный плов из курицы с добавлением моркови. Это блюдо порадует вас своим вкусом и станет отличным обедом или ужином.\n\n**Время приготовления:** 40–60 минут (время может варьироваться в зависимости от вашей плиты и посуды).\n\n**Количество порций:** 4 порции.\n\n### Ингредиенты\n* Курица (филе или кусочки) — 500 г.\n* Рис — 2 стакана.\n* Морковь — 2 штуки (примерно 150–200 г).\n* Репчатый лук — 1 штука (среднего размера).\n* Растительное масло — 3–4 столовые ложки.\n* Соль — по вкусу.\n* Специи для плова (например, куркума, зира, паприка) — по вкусу.\n\n### Шаги приготовления\n1. Подготовьте все ингредиенты. Курицу нарежьте небольшими кусочками. Морковь очистите и нарежьте соломкой или кубиками. Лук очистите и нарежьте полукольцами.\n2. Разогрейте сковороду или казан с растительным маслом на среднем огне.\n3. Обжарьте курицу до золотистой корочки. Выложите кусочки курицы на разогретую сковороду и обжаривайте, помешивая, до золотистого цвета.\n4. Добавьте нарезанный лук и обжарьте вместе с курицей до прозрачности лука.\n5. Добавьте морковь и жарьте всё вместе ещё несколько минут, пока морковь не станет мягкой.\n6. Промойте рис под проточной водой, чтобы удалить лишний крахмал. Затем добавьте промытый рис к курице и овощам.\n7. Посолите по вкусу и добавьте специи для плова. Перемешайте.\n8. Влейте необходимое количество горячей воды так, чтобы она покрывала содержимое сковороды примерно на палец.\n9. Доведите воду до кипения, затем уменьшите огонь до минимума, накройте крышкой и готовьте плов около 20–25 минут, пока вся вода не впитается, а рис не станет мягким.\n10. Готовый плов перемешайте и подавайте горячим. Приятного аппетита!", "right": "# Курица с рисом и морковью в духовке\n\n**Время приготовления:** 60–90 минут\n**Порций:** зависит от размера формы для запекания и порций курицы\n\n## Ингредиенты\n* Рис — 1 стакан (250 мл).\n* Курица (например, окорочок или бедро) — 600 г.\n* Морковь — 2–3 шт.\n* Репчатый лук — 1 шт. (по желанию).\n* Соль — по вкусу.\n* Чёрный перец — по вкусу.\n* Приправы (по желанию) — по вкусу.\n* Растительное масло — для жарки (по желанию).\n\n## Приготовление\n1. Морковь очистить и нарезать небольшими кусочками или натереть на крупной тёрке.\n2. Разогреть сковороду с растительным маслом и обжарить морковь до мягкости.\n3. Курицу промыть, обсушить, нарезать на куски при необходимости и натереть специями, солью и перцем.\n4. В форму для запекания выложить обжаренную морковь.\n5. Промытый рис равномерно распределить поверх моркови. Посолить.\n6. Выложить кусочки курицы на рис.\n7. Залить всё бульоном или водой так, чтобы жидкость покрывала содержимое формы.\n8. Накрыть форму фольгой и поставить в разогретую до 180 °C духовку на 1 час.\n9. Блюдо готово! Подавайте горячим."}, {"id": "cat_13", "prompt": "Хочу приготовить что-нибудь из категории «Блюда из курицы», повод: ужин. Напиши рецепт.", "a_left": true, "left": "### Куриное филе в сметанном соусе с грибами\n\n**Описание:** нежное куриное филе, тушенное в сметанном соусе с грибами, луком и специями. Это блюдо отлично подойдёт для семейного ужина.\n\n**Время приготовления:** 40 минут.\n\n**Количество порций:** 4.\n\n### Ингредиенты\n* куриное филе — 500 г;\n* шампиньоны — 200 г;\n* сметана (жирность 15–20%) — 150 мл;\n* лук репчатый — 1 шт.;\n* мука пшеничная — 1 ст. л.;\n* масло растительное — 2 ст. л.;\n* соль — по вкусу;\n* перец чёрный молотый — по вкусу;\n* зелень свежая (укроп или петрушка) — для подачи.\n\n### Шаги приготовления\n1. Подготовьте все ингредиенты. Куриное филе нарежьте небольшими кусочками. Грибы нарежьте пластинками, а лук — кубиками.\n2. Разогрейте сковороду с растительным маслом на среднем огне. Обжарьте лук до золотистого цвета.\n3. Добавьте к луку грибы и обжаривайте вместе до тех пор, пока не выпарится жидкость, выделяемая грибами.\n4. В миске смешайте сметану с мукой, добавьте соль и перец. Перемешайте до однородности.\n5. Вылейте сметанную смесь в сковороду с грибами и луком. Хорошо перемешайте.\n6. Добавьте куриное филе, перемешайте и тушите на медленном огне под крышкой около 20 минут.\n7. Готовое блюдо посыпьте свежей зеленью. Подавайте горячим.", "right": "# Курица с овощами в фольге\n\n**Описание:** это блюдо сочетает в себе нежное куриное мясо и ароматные овощи. Оно отлично подойдёт для семейного ужина.\n\n**Время приготовления:** 45–50 минут.\n\n**Количество порций:** 4.\n\n## Ингредиенты\n* Куриная грудка — 450 г;\n* Лимон — 1/2 шт.;\n* Приправа — 1 ч. л.;\n* Соль — по вкусу;\n* Перец душистый — по вкусу;\n* Картофель — 800 г;\n* Тыква — 500 г;\n* Чеснок — 4 зуб.;\n* Базилик сушёный — по вкусу;\n* Масло оливковое — 3 ст. л.;\n* Сыр твёрдый — 20 г.\n\n## Приготовление\n1. Нарежьте куриную грудку на порционные кусочки. Натрите каждый кусочек смесью соли, перца, приправы для курицы и сока половины лимона. Оставьте мариноваться, пока будете подготавливать овощи.\n2. Очистите картофель и тыкву. Нарежьте крупными кубиками размером не менее 2,5 см.\n3. Присыпьте овощи солью и перцем, добавьте сушёный базилик и оливковое масло, всё хорошо перемешайте.\n4. Подготовьте 4 куска фольги (можно сделать двойной слой). Подогните края, чтобы потом их свернуть конвертиком. В каждый кусок фольги положите картошку с тыквой, в каждый конвертик порежьте по 1 зубчику чеснока, лучше порезать пластинками.\n5. Сверху положите по кусочку курицы.\n6. Хорошо заверните края фольги, чтобы получились конвертики.\n7. Отправьте конвертики в хорошо разогретую духовку примерно на 40–45 минут.\n8. За несколько минут до готовности раскрошите сверху твёрдый сыр."}, {"id": "ingr_04", "prompt": "Придумай рецепт, в котором используются макароны, сливки и бекон.", "a_left": false, "left": "# Макароны с беконом в сливочном соусе\n\n**Время приготовления:** 30–40 минут\n**Порций:** 4\n\n## Ингредиенты\n* Макаронные изделия — по вкусу;\n* Пармезан — 50 г;\n* Сливки — 300 мл;\n* Бекон — 100 г;\n* Масло сливочное — 1 ст. л.;\n* Лук репчатый — 1 шт.;\n* Чеснок — 1 зубчик;\n* Петрушка — по вкусу;\n* Соль — по вкусу;\n* Перец чёрный молотый — по вкусу.\n\n## Приготовление\n1. Подготовьте все необходимые ингредиенты. Пармезан натрите на мелкой тёрке, ломтики бекона нарежьте на небольшие кусочки, петрушку измельчите. Репчатый лук очистите и нарежьте мелкими кубиками, чеснок измельчите.\n2. Отварите макаронные изделия в подсоленной воде согласно инструкции на упаковке. Слейте воду, оставив немного для соуса.\n3. Разогрейте сливочное масло на сковороде. Добавьте нарезанный лук и обжаривайте его до прозрачности.\n4. Добавьте измельчённый чеснок и обжаривайте ещё несколько секунд.\n5. Выложите на сковороду кусочки бекона и жарьте до хрустящей корочки. Вытопившийся жир используйте для дальнейшего приготовления соуса.\n6. Влейте сливки в сковороду, добавьте соль и чёрный молотый перец по вкусу. Перемешайте и готовьте на среднем огне, пока соус немного не загустеет.\n7. Снимите соус с огня и добавьте натёртый пармезан. Хорошо перемешайте, чтобы сыр расплавился.\n8. Верните макароны на сковороду, перемешайте с соусом. При необходимости добавьте немного отвара, в котором варились макароны, для достижения нужной консистенции.\n9. Разложите готовое блюдо по тарелкам, посыпьте свежей петрушкой и подавайте к столу.", "right": "### Паста с беконом и сливками\n\n**Описание:** это сытное и ароматное блюдо, которое понравится всей семье. Макароны сочетаются с нежным сливочным соусом и хрустящим беконом, создавая гармоничный вкус.\n\n**Время приготовления:** 20–30 минут (не учитывая время варки макарон).\n\n**Количество порций:** 4 порции.\n\n### Ингредиенты\n* Макароны — 200 г;\n* Бекон — 100 г;\n* Сливки (20–30%) — 100 мл;\n* Сыр твёрдый (например, пармезан) — 50 г;\n* Чеснок — 1 зубчик;\n* Масло сливочное — 30 г;\n* Соль — по вкусу;\n* Перец чёрный молотый — по вкусу;\n* Зелень для подачи (петрушка или укроп) — по вкусу.\n\n### Шаги приготовления\n1. Вскипятите воду в большой кастрюле и добавьте соль. Отварите макароны до состояния аль денте согласно инструкции на упаковке. Слейте воду.\n2. На сковороде растопите сливочное масло. Добавьте измельчённый чеснок и обжарьте его до золотистого цвета.\n3. Тонко нарежьте бекон и добавьте его к чесноку. Обжаривайте бекон до хрустящей корочки.\n4. Влейте сливки в сковороду с беконом и чесноком. Перемешайте и доведите соус до кипения.\n5. Снимите соус с огня и добавьте тёртый сыр. Хорошо перемешайте, пока сыр не расплавится.\n6. Смешайте макароны с полученным соусом на сковороде. Посолите и поперчите по вкусу.\n7. Разложите пасту по тарелкам и украсьте свежей зеленью. Подавайте горячей."}, {"id": "ingr_11", "prompt": "Что приготовить из таких продуктов: баклажаны, помидоры и чеснок? Нужен подробный рецепт.", "a_left": false, "left": "# Баклажаны с помидорами и чесноком\n\n**Время приготовления:** 40–50 минут\n**Порций:** 4\n\n## Ингредиенты\n* Баклажаны — 3 штуки;\n* Помидоры — 2 штуки;\n* Чеснок — 3 зубчика;\n* Растительное масло — для жарки;\n* Соль — по вкусу;\n* Приправы (по желанию) — по вкусу.\n\n## Приготовление\n1. Нарежьте баклажаны пластинками толщиной около сантиметра. Посолите их и оставьте на некоторое время, чтобы они пустили сок. Затем обсушите баклажаны бумажным полотенцем.\n2. Разогрейте сковороду с растительным маслом. Обжарьте баклажаны с обеих сторон до золотистой корочки. Переложите их на бумажное полотенце, чтобы убрать лишний жир.\n3. Очистите чеснок и пропустите его через пресс или мелко нарежьте.\n4. Помидоры нарежьте тонкими полукольцами или дольками.\n5. Смешайте чеснок с небольшим количеством майонеза или сметаны (по желанию) и добавьте приправы по вкусу. Можно также использовать соль и перец.\n6. Намажьте получившуюся смесь на обжаренные баклажаны.\n7. Сверху на баклажаны выложите ломтики помидоров.\n8. Подавайте блюдо сразу после приготовления. Приятного аппетита!", "right": "### Баклажаны, запечённые с помидорами и чесноком\n\n**Описание:** это простое и вкусное блюдо, которое можно подать как гарнир или самостоятельное блюдо. Запечённые баклажаны приобретают нежный вкус, а сочетание с помидорами и чесноком делает их ещё более ароматными.\n\n**Время приготовления:** 40 минут.\n\n**Количество порций:** 2–4 (в зависимости от размера баклажанов).\n\n### Ингредиенты\n* баклажаны — 2 штуки;\n* помидоры — 2 штуки;\n* чеснок — 3–4 зубчика;\n* оливковое масло — 2 ст. ложки;\n* соль — по вкусу;\n* чёрный перец молотый — по вкусу;\n* свежая зелень (укроп или петрушка) для подачи — по вкусу.\n\n### Шаги приготовления\n1. Разогрейте духовку до 200 °C.\n2. Баклажаны вымойте, обсушите бумажным полотенцем и нарежьте кружочками толщиной около 0,5 см.\n3. Выложите баклажанные кружочки на противень, застеленный пергаментной бумагой. Сбрызните оливковым маслом, посолите и поперчите.\n4. Чеснок очистите и мелко нарубите. Распределите его сверху на баклажанах.\n5. Помидоры вымойте, нарежьте кружочками и выложите поверх баклажанов. Также слегка посолите и поперчите.\n6. Поставьте противень в разогретую духовку и запекайте баклажаны с помидорами примерно 20–25 минут, пока баклажаны не станут мягкими, а помидоры не подрумянятся.\n7. Готовые баклажаны с помидорами достаньте из духовки, дайте немного остыть и посыпьте свежей зеленью перед подачей на стол."}, {"id": "ingr_01", "prompt": "Придумай рецепт, в котором используются творог, яйца и мука.", "a_left": false, "left": "# Творожный пирог с сыром и зеленью\n\n**Описание:** нежный и ароматный пирог с творогом, сыром и зеленью. Это отличный вариант для семейного чаепития.\n\n**Время приготовления:** 50–60 минут\n\n**Количество порций:** зависит от размера формы для выпечки (примерно 6–8 порций)\n\n## Ингредиенты\n- Творог — 400 г\n- Мука пшеничная — примерно 150 г\n- Яйцо куриное — 4 шт.\n- Соль — 0,5 ч. л.\n- Сода — 0,5 ч. л.\n- Сыр твёрдый — 100 г\n- Зелёный лук — 1 пучок\n- Майонез — 3 ст. л.\n- Сметана — 2 ст. л.\n\n## Приготовление\n1. Творог хорошо растереть с солью.\n2. Добавить яйца, соду или разрыхлитель, перемешать.\n3. Постепенно ввести муку, замешивая эластичное, нетугое тесто. Завернуть в плёнку и убрать на холод на 15–20 минут.\n4. Подготовить продукты для начинки. Сыр и варёные яйца натереть на крупной тёрке. Зелёный лук нарезать.\n5. Смешать сыр, яйца, лук, майонез, немного посолить, если требуется.\n6. Тесто разделить на две части, одна из которых должна быть поменьше.\n7. Форму застелить пекарской бумагой, смазать жиром. Большую часть теста раскатать в круг, выложить в форму и руками сформировать лепёшку с высокими бортиками.\n8. На тесто равномерно разложить начинку.\n9. Вторую часть теста раскатать в блин толщиной 3 мм и нарезать на широкие полоски.\n10. Полоски выложить на пирог слегка внахлёст.\n11. Бортики загнуть на пирог и прижать черенком ложки.\n12. В середине сделать небольшое отверстие. Смазать взбитым яйцом. Можно посыпать пирог кунжутными семечками.\n13. Выпекать при температуре 180 °C в течение 25–30 минут.\n14. Готовый пирог вынуть из формы и остудить на решётке.", "right": "### Сырники из творога\n\n**Описание:** нежные сырники из творога — это отличный завтрак или десерт. Они имеют приятную текстуру и сливочный вкус. Подаются со сметаной или мёдом.\n\n**Время приготовления:** 30 минут.\n\n**Количество порций:** 4 порции.\n\n### Ингредиенты\n* Творог жирностью 9% — 500 г;\n* Яйцо куриное — 1 шт.;\n* Мука пшеничная — 4 ст. л.;\n* Сахар — 2–3 ст. л.;\n* Соль — щепотка;\n* Растительное масло для жарки — по вкусу.\n\n### Приготовление\n1. В глубокой миске разомните творог вилкой до однородной консистенции.\n2. Добавьте яйцо, сахар и соль. Тщательно перемешайте все ингредиенты.\n3. Постепенно введите муку, продолжая мешать, чтобы не образовались комочки.\n4. Сформируйте из творожной массы небольшие лепёшки.\n5. Разогрейте сковороду с растительным маслом на среднем огне.\n6. Выложите сырники на сковороду и обжарьте их с каждой стороны до золотистой корочки (примерно по 2–3 минуты с каждой стороны).\n7. Готовые сырники выложите на тарелку и подавайте к столу со сметаной или мёдом."}, {"id": "cat_04", "prompt": "Предложи рецепт быстрого завтрака, который готовится за 15 минут.", "a_left": true, "left": "### Омлет с сыром и зеленью\n\n**Описание:** быстрый и сытный завтрак, который можно приготовить всего за 15 минут. Нежный омлет с расплавленным сыром и свежей зеленью станет отличным началом дня.\n\n**Время приготовления:** 15 минут.\n\n**Количество порций:** 1.\n\n### Ингредиенты\n* Яйца — 2 шт.\n* Молоко — 50 мл.\n* Сыр твёрдый (например, голландский) — 30 г.\n* Соль — по вкусу.\n* Перец чёрный молотый — по вкусу.\n* Зелень свежая (укроп, петрушка) — 1–2 веточки.\n* Масло растительное или сливочное для жарки — по желанию.\n\n### Шаги приготовления\n1. Разбейте яйца в миску.\n2. Добавьте молоко и взболтайте смесь вилкой или венчиком до однородности.\n3. Посолите и поперчите яичную смесь по вкусу.\n4. Натрите сыр на мелкой тёрке.\n5. Мелко нарежьте зелень.\n6. Разогрейте сковороду на среднем огне. Если используете растительное масло, смажьте им дно сковороды. Если предпочитаете сливочное масло, растопите его на сковороде.\n7. Вылейте яичную смесь на сковороду.\n8. Жарьте омлет на среднем огне примерно 5–7 минут, пока он не начнёт схватываться сверху.\n9. Посыпьте омлет натёртым сыром и зеленью.\n10. Аккуратно перемешайте сыр и зелень в омлете лопаткой или ложкой.\n11. Продолжайте жарить ещё 2–3 минуты, чтобы омлет полностью приготовился.\n12. Переложите готовый омлет на тарелку и подавайте к столу.", "right": "# Быстрый завтрак «На скорую руку»\n\n**Время приготовления:** 15 минут\n**Порций:** 2–3\n\n## Ингредиенты\n- Яйцо куриное — 3 шт.;\n- Молоко — 50 мл;\n- Мука пшеничная — 3 ст. л.;\n- Разрыхлитель теста — 1 ч. л.;\n- Сахар — 1 ст. л.;\n- Соль — щепотка;\n- Сыр твёрдый — 50 г;\n- Колбаса или ветчина — 50 г;\n- Зелень (укроп или петрушка) — по вкусу.\n\n## Приготовление\n1. В глубокой миске взбейте яйца.\n2. Добавьте молоко, муку, разрыхлитель, сахар и соль. Всё тщательно перемешайте до однородной консистенции.\n3. Нарежьте колбасу мелкими кубиками, сыр — тонкими ломтиками, мелко порубите зелень.\n4. Разогрейте сковороду с небольшим количеством масла на среднем огне.\n5. Вылейте тесто на сковороду и равномерно распределите его по поверхности.\n6. Сверху выложите кусочки колбасы, ломтики сыра и зелень.\n7. Накройте сковороду крышкой и готовьте омлет примерно 7–10 минут, пока нижняя часть не зарумянится, а верх не пропечётся.\n8. Переверните омлет на другую сторону и обжарьте ещё пару минут.\n9. Ваш быстрый завтрак готов! Подавайте горячим."}, {"id": "cat_05", "prompt": "Предложи рецепт постного блюда.", "a_left": false, "left": "# Постный суп с овощами и зеленью\n\n**Краткое описание:** ароматный и вкусный суп, который станет отличным дополнением к постному столу. Лёгкий в приготовлении и насыщенный вкусом.\n\n**Время приготовления:** 30–40 минут\n\n**Количество порций:** 4\n\n## Ингредиенты\n* Картофель — 3–4 шт.;\n* Морковь — 1–2 шт.;\n* Репчатый лук — 1–2 шт.;\n* Чеснок — 4–5 зубчиков;\n* Томатная паста — 0,5 стакана;\n* Растительное масло — 0,3 стакана;\n* Лавровый лист — 1–2 шт.;\n* Хмели-сунели;\n* Красный жгучий перец (по вкусу);\n* Соль;\n* Корица (щепотка);\n* Петрушка;\n* Душистый перец;\n* Базилик;\n* Рис — 0,5 стакана.\n\n## Приготовление\n1. Очистите и нарежьте мелкими кубиками картофель.\n2. Мелко порубите лук.\n3. Морковь нарежьте мелкими кусочками или натрите на крупной тёрке.\n4. Чеснок нарежьте кружочками (1–2 зубчика оставьте для подачи).\n5. Разогрейте растительное масло в кастрюле (можно использовать казан) и обжарьте томатную пасту в течение 5–7 минут.\n6. Добавьте лук с чесноком и обжаривайте до полуготовности.\n7. Добавьте морковь, измельчённые орехи (если используете), специи — всё по вкусу. Щепотку корицы обязательно.\n8. Обжаривайте всё вместе ещё 3–5 минут.\n9. Добавьте 2–2,5 литра кипятка. Всыпьте рис и варите до готовности риса. Пробуйте на соль и специи.\n10. Добавьте картошку, дайте закипеть.\n11. Заправьте суп рубленой зеленью и давленым чесноком.\n12. Дайте супу настояться не менее 30 минут перед подачей.", "right": "### Рецепт: постный салат с авокадо и помидорами\n\n**Описание:** лёгкий и свежий салат, который станет отличным дополнением к любому гарниру или самостоятельным блюдом. Авокадо придаёт салату кремовую текстуру и полезные жиры, а помидоры — яркий вкус и свежесть.\n\n**Время приготовления:** 15–20 минут.\n\n**Количество порций:** 2–4 (в зависимости от размера порций).\n\n### Ингредиенты\n* Авокадо — 1 шт.\n* Помидоры — 2 шт.\n* Лимонный сок — 1 ст. л.\n* Оливковое масло — 2 ст. л.\n* Соль — по вкусу.\n* Чёрный перец молотый — по вкусу.\n* Свежая зелень (например, базилик или петрушка) для украшения — по желанию.\n\n### Шаги приготовления\n1. Очистите авокадо от кожуры и косточки. Нарежьте мякоть кубиками.\n2. Помидоры вымойте и нарежьте кубиками такого же размера, как авокадо.\n3. В небольшой миске смешайте лимонный сок и оливковое масло.\n4. В большой миске соедините нарезанные авокадо и помидоры.\n5. Полейте заправкой из лимонного сока и оливкового масла.\n6. Посолите и поперчите по вкусу.\n7. Аккуратно перемешайте все ингредиенты.\n8. Переложите салат в сервировочное блюдо и украсьте свежей зеленью.\n9. Подавайте сразу после приготовления."}, {"id": "ingr_13", "prompt": "Придумай рецепт, в котором используются говядина, картофель и морковь.", "a_left": false, "left": "# Тушёная говядина с картофелем и морковью\n\n**Время приготовления:** 120 минут\n**Порций:** 4\n\n## Ингредиенты\n- Говядина — 800 г\n- Картофель — 1 кг\n- Морковь — 400 г\n- Репчатый лук — 1 шт.\n- Томатная паста — 2 ст. л.\n- Растительное масло — 3 ст. л.\n- Соль — по вкусу\n- Чёрный перец — по вкусу\n- Лавровый лист — 2 шт.\n\n## Приготовление\n1. Нарезать говядину небольшими кусочками.\n2. Разогреть растительное масло в глубокой сковороде или казане, обжарить кусочки говядины до золотистой корочки на сильном огне.\n3. Мелко нарезать лук и добавить его к мясу после обжаривания говядины. Обжарить лук до прозрачности.\n4. Добавить томатную пасту, перемешать и слегка обжарить.\n5. Влить небольшое количество горячей воды (чтобы покрыло мясо), добавить соль, чёрный перец и лавровый лист. Уменьшить огонь и тушить под крышкой около 40–50 минут.\n6. Очистить картофель и морковь. Картофель нарезать крупными кусками, морковь — кружочками.\n7. Добавить овощи к мясу, залить небольшим количеством горячей воды так, чтобы она едва покрывала овощи.\n8. Тушить всё вместе ещё около 30 минут до готовности овощей и мяса.", "right": "### Рагу из говядины с картофелем и морковью\n\n**Описание:** это сытное и ароматное блюдо, которое идеально подходит для семейного ужина. Нежное мясо, мягкие овощи и насыщенный бульон создают гармоничный вкус.\n\n**Время приготовления:** 1 час 30 минут.\n\n**Количество порций:** 4–6.\n\n### Ингредиенты\n* Говядина (мякоть) — 500 г.\n* Картофель — 4 средних клубня.\n* Морковь — 2 средние моркови.\n* Репчатый лук — 1 большая луковица.\n* Томатная паста — 2 ст. л.\n* Растительное масло — 2 ст. л.\n* Вода — 2 стакана.\n* Лавровый лист — 2 шт.\n* Чёрный перец горошком — 5–7 шт.\n* Соль — по вкусу.\n* Специи (например, паприка, тимьян, розмарин) — по вкусу.\n\n### Шаги приготовления\n1. Нарежьте говядину небольшими кусочками.\n2. Очистите и нарежьте картофель кубиками среднего размера.\n3. Морковь нарежьте кружочками или полукружочками.\n4. Лук очистите и нарежьте мелкими кубиками.\n5. Разогрейте растительное масло в глубокой сковороде или кастрюле.\n6. Обжарьте кусочки говядины на среднем огне до золотистой корочки.\n7. Добавьте нарезанный лук и обжаривайте до прозрачности.\n8. Добавьте томатную пасту, перемешайте и обжарьте ещё пару минут.\n9. Влейте воду, добавьте лавровый лист, чёрный перец горошком, соль и специи. Доведите до кипения.\n10. Уменьшите огонь и тушите под крышкой около 30 минут.\n11. Добавьте картофель и морковь, аккуратно перемешайте.\n12. Тушите всё вместе ещё 30–40 минут до готовности овощей и мяса.\n13. Попробуйте рагу на вкус и при необходимости добавьте соль или специи.\n14. Подавайте горячим, посыпав свежей зеленью."}, {"id": "ingr_17", "prompt": "Что приготовить из таких продуктов: куриная печень, лук и сметана? Нужен подробный рецепт.", "a_left": false, "left": "# Куриная печень в сметанном соусе\n\n**Время приготовления:** 30 минут\n**Порций:** 4\n\n## Ингредиенты\n* Печень куриная — 350 г;\n* Лук репчатый — 1 шт.;\n* Сметана — 3 ст. л.;\n* Соль — по вкусу;\n* Перец чёрный — по вкусу;\n* Лавровый лист — 1 шт.;\n* Масло растительное.\n\n## Приготовление\n1. Подготовьте все необходимые ингредиенты.\n2. Очистите и нарежьте лук мелкими кубиками.\n3. Разогрейте сковороду с растительным маслом и обжарьте лук до полуготовности.\n4. Промойте куриную печень и обсушите её бумажным полотенцем. Удалите лишние плёнки и жилки.\n5. Добавьте нарезанную печень на сковороду к обжаренному луку.\n6. Сразу же добавьте сметану, соль, перец и лавровый лист.\n7. Тщательно перемешайте и тушите на медленном огне под закрытой крышкой 10–15 минут. Сметана соединится с соком, который выделит печень и лук, и получится вкусный соус.\n8. Подавайте готовое блюдо горячим, можно украсить свежей зеленью. Приятного аппетита!", "right": "### Куриная печень в сметане с луком\n\n**Описание:** это простое и вкусное блюдо, которое можно приготовить за короткий промежуток времени. Нежная куриная печень, обжаренная вместе с луком и тушённая в сметанном соусе, порадует вас своим ароматом и вкусом.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** 4.\n\n### Ингредиенты\n* куриная печень — 500 г;\n* репчатый лук — 2 шт.;\n* сметана (жирностью 15–20%) — 200 мл;\n* растительное масло — для жарки;\n* соль — по вкусу;\n* чёрный перец молотый — по вкусу;\n* лавровый лист — 2 шт.;\n* мука — 1 ст. л. (по желанию).\n\n### Шаги приготовления\n1. Очистите лук и нарежьте его полукольцами или кубиками.\n2. Разогрейте сковороду с растительным маслом на среднем огне. Обжарьте нарезанный лук до золотистого цвета.\n3. Промойте куриную печень под холодной водой, обсушите бумажным полотенцем и нарежьте на небольшие кусочки.\n4. Добавьте нарезанную куриную печень к луку. Обжаривайте всё вместе, помешивая, пока печень не изменит цвет на коричневый.\n5. Если вы хотите сделать соус более густым, добавьте муку и перемешайте. Затем влейте сметану, тщательно перемешайте все ингредиенты.\n6. Посолите и поперчите по вкусу. Добавьте лавровый лист.\n7. Уменьшите огонь, накройте крышкой и тушите печень в течение 10–15 минут, чтобы она стала мягкой и пропиталась соусом.\n8. Подавайте готовое блюдо горячим, посыпав свежей зеленью по вкусу."}, {"id": "dish_24", "prompt": "Напиши рецепт: Картофельное пюре", "a_left": false, "left": "# Картофельное пюре\n\n**Описание:** нежное и воздушное картофельное пюре — это классическое блюдо, которое может стать отличным гарниром к мясу, рыбе или овощам.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** зависит от размера формы или посуды, которую вы используете для подачи. Например, из указанных ингредиентов получится около 4–6 порций.\n\n### Ингредиенты\n* Картофель — 1 кг;\n* Молоко — по вкусу;\n* Сливочное масло — 50 г;\n* Яйцо куриное — 2 шт.;\n* Соль — по вкусу.\n\n### Приготовление\n1. Картофель помыть, почистить, порезать на некрупные кусочки.\n2. Залить картофель водой и поставить варить до полной готовности. Посолить воду после закипания.\n3. Когда картофель сварится, слить воду.\n4. Картофель размять в пюре.\n5. Добавить яйцо, молоко и сливочное масло.\n6. Тщательно перемешать до получения однородной массы.\n7. Подавать горячим, по желанию можно дополнительно посолить и поперчить.", "right": "**Название:** картофельное пюре\n\n**Описание:** воздушное и нежное картофельное пюре — это классическое блюдо, которое может стать отличным гарниром к мясу, рыбе или овощам. Оно легко готовится и имеет приятный вкус.\n\n**Время приготовления:** 30–40 минут\n\n**Количество порций:** зависит от размера кастрюли и желаемого количества пюре. Например, из 1 кг картофеля получится примерно 4–6 порций.\n\n**Ингредиенты:**\n* Картофель — 1 кг;\n* Молоко (или сливки) — 200 мл;\n* Сливочное масло — 50 г;\n* Соль — по вкусу;\n* Перец чёрный молотый — по вкусу.\n\n**Шаги приготовления:**\n1. Очистите картофель и нарежьте его на кусочки одинакового размера. Это поможет ему свариться равномерно.\n2. Вскипятите в кастрюле подсоленную воду и добавьте туда нарезанный картофель. Варите на среднем огне до готовности (примерно 20 минут). Готовность можно проверить вилкой или ножом — если они легко входят в картофель, он готов.\n3. Слейте воду из кастрюли, оставив немного для дальнейшего разбавления пюре.\n4. В отдельной посуде разогрейте молоко (или сливки) и сливочное масло.\n5. Разомните горячий картофель толкушкой до однородной массы. Если пюре получается слишком густым, постепенно добавляйте оставленную воду или горячее молоко до нужной консистенции.\n6. Добавьте разогретое молоко (сливки) и сливочное масло в размятый картофель, тщательно перемешайте.\n7. Посолите и поперчите пюре по вкусу. Ещё раз хорошо перемешайте.\n8. Подавайте горячим как гарнир к основному блюду."}, {"id": "dish_23", "prompt": "Дай рецепт блюда «Салат Цезарь с курицей».", "a_left": false, "left": "# Салат «Цезарь» с курицей\n\n**Время приготовления:** 20 минут\n**Порций:** 4\n\n## Ингредиенты\n* Грудка куриная — 1 шт.\n* Листья салата — по вкусу.\n* Сыр твёрдый — 100 г.\n* Батон — 1/2.\n* Желток яичный — 2 шт.\n* Горчица — 2 ч. л.\n* Сок лимонный — 1 ст. л.\n* Масло оливковое — 120 мл.\n* Чеснок — 2 зуб.\n* Уксус — 1 ч. л.\n* Соль — по вкусу.\n* Перец чёрный — по вкусу.\n\n## Приготовление\n1. Куриную грудку нарезать кубиками и обжарить до золотистого цвета.\n2. Листья салата промыть и просушить.\n3. Сделать сухарики. Половину батона нарезать кубиками. 20 мл оливкового масла смешать с зубчиком чеснока, выдавленным через чеснокодавилку. Обжарить на этом масле кубики батона.\n4. Нарвать крупными кусками листья салата и выложить на них кусочки курицы и сухарики.\n5. Сделать заправку. Горчицу растереть с желтками. Добавить сок лимона, оливковое масло, соль, перец, уксус. Перемешать. Выдавить через чеснокодавилку зубчик чеснока. Ещё раз перемешать.\n6. Полить заправкой салат. Посыпать тёртым сыром.\n7. Чтобы сухарики не размокли, можно выкладывать сразу не всё блюдо целиком.", "right": "### Салат «Цезарь» с курицей\n\n**Описание:** изысканный салат с нежными кусочками куриного филе, хрустящими листьями салата, ароматными сухариками и соусом на основе яиц, оливкового масла и горчицы. Это блюдо станет отличным выбором для праздничного стола или повседневного ужина.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** 4.\n\n### Ингредиенты\n* Куриное филе — 400 г.\n* Листья салата (например, романо) — 150 г.\n* Белый хлеб — 100 г.\n* Сыр пармезан — 70 г.\n* Яйца — 2 шт.\n* Оливковое масло — 3 ст. л.\n* Горчица дижонская — 1 ч. л.\n* Лимонный сок — 1 ст. л.\n* Чеснок — 1 зубчик.\n* Соль — по вкусу.\n* Чёрный перец молотый — по вкусу.\n\n### Приготовление\n1. Нарежьте куриное филе небольшими кубиками и посолите, поперчите по вкусу. Обжарьте на сковороде до готовности. Готовое мясо остудите и нарежьте ломтиками.\n2. Приготовьте сухарики: нарежьте белый хлеб кубиками, обжарьте их на сковороде с измельчённым чесноком до золотистой корочки.\n3. Отварите яйца вкрутую (около 7–8 минут), затем охладите их под холодной водой и отделите желтки от белков. Желтки понадобятся для соуса.\n4. Для соуса смешайте оливковое масло, горчицу, лимонный сок, соль и перец. Взбейте блендером до однородной консистенции.\n5. Натрите сыр пармезан на мелкой тёрке.\n6. На тарелку выложите листья салата, сверху разместите кусочки курицы, сухарики и посыпьте всё сыром.\n7. Полейте салат приготовленным соусом и подавайте к столу."}, {"id": "dish_07", "prompt": "Как приготовить «Блины на молоке»? Дай подробный рецепт.", "a_left": true, "left": "### Блины на молоке\n\n**Описание:** нежные и ароматные блины на молоке — идеальный выбор для завтрака или десерта. Они легко готовятся и радуют своим вкусом.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** зависит от размера сковороды и желаемого количества блинов. Обычно из указанного количества ингредиентов получается около 15–20 блинов.\n\n### Ингредиенты\n* молоко — 500 мл;\n* яйца — 2 шт.;\n* мука — 180 г;\n* сахар — 3 ст. л.;\n* соль — щепотка;\n* растительное масло — 3 ст. л. (для теста) + дополнительно для смазывания сковороды.\n\n### Приготовление\n1. В глубокой миске взбейте яйца с сахаром и солью до образования пены.\n2. Постепенно влейте молоко, продолжая взбивать смесь.\n3. Просейте муку и аккуратно введите её в яично-молочную смесь, замешивая тесто.\n4. Добавьте растительное масло и тщательно перемешайте. Тесто должно получиться однородным и без комочков.\n5. Разогрейте сковороду на среднем огне и смажьте её небольшим количеством растительного масла.\n6. Налейте немного теста на сковороду и равномерно распределите его по поверхности.\n7. Жарьте блин с одной стороны до золотистой корочки, затем переверните на другую сторону.\n8. Когда обе стороны станут золотистыми, снимите блин со сковороды.\n9. Повторяйте процесс, пока не закончится тесто. Подавайте блины горячими, можно добавить сливочное масло, мёд, варенье или сгущённое молоко по вкусу.", "right": "# Блины на молоке\n\n**Время приготовления:** 30 минут\n**Количество порций:** зависит от размера сковороды и желаемого количества блинов\n\n## Ингредиенты\n* Сахар — 1 ст. л.\n* Яйцо куриное — 3 шт.\n* Соль — 0,5 ч. л.\n* Мука пшеничная — количество зависит от объёма других ингредиентов и желаемой густоты теста\n* Молоко — 3 стакана\n* Масло растительное — 3 ст. л.\n* Разрыхлитель теста — 3/4 ч. л.\n\n## Приготовление\n1. Просейте муку в миску. Добавьте соль, сахар и разрыхлитель.\n2. Вбейте яйца и добавьте полстакана молока.\n3. Замесите густое тесто без комков.\n4. Постепенно добавляйте оставшееся молоко, замешивая тесто до консистенции жидкой сметаны.\n5. Влейте 3 столовые ложки растительного масла и тщательно перемешайте, чтобы тесто равномерно распределило масло.\n6. Разогрейте сковороду на сильном огне. Смажьте её маслом.\n7. Наливайте тесто на сковороду, быстро поворачивая её, чтобы тесто равномерно распределилось по поверхности.\n8. Когда одна сторона блина подрумянится, переверните его на другую сторону с помощью лопатки.\n9. Пеките блинчики на двух сковородах одновременно, чтобы ускорить процесс. Смазывайте сковороды маслом через раз.\n10. Подавайте готовые блинчики с вареньем, мёдом, сметаной или различными начинками: мясными, рыбными, творожными.\n\nПриятного аппетита!"}, {"id": "ingr_19", "prompt": "Придумай рецепт, в котором используются фасоль, фарш и помидоры.", "a_left": true, "left": "### Тушёная фасоль с фаршем и помидорами\n\n**Описание:** это сытное и ароматное блюдо, которое сочетает в себе вкус фасоли, сочность помидоров и нежность фарша. Отличный выбор для обеда или ужина.\n\n**Время приготовления:** 40–50 минут.\n\n**Количество порций:** 4.\n\n### Ингредиенты\n* Фасоль (сухая) — 200 г.\n* Фарш (любой по вкусу, например, свиной, говяжий или куриный) — 300 г.\n* Помидоры — 2 шт.\n* Репчатый лук — 1 шт.\n* Морковь — 1 шт.\n* Растительное масло — 2 ст. л.\n* Томатная паста — 1 ст. л.\n* Соль — по вкусу.\n* Чёрный перец молотый — по вкусу.\n* Специи (например, паприка, кориандр, чеснок порошок) — по вкусу.\n\n### Шаги приготовления\n1. Замочите фасоль в холодной воде на несколько часов (можно на ночь), затем отварите до готовности согласно инструкции на упаковке. Откиньте на дуршлаг и дайте стечь лишней жидкости.\n2. Очистите и мелко нарежьте лук. Морковь очистите и натрите на крупной тёрке.\n3. Разогрейте растительное масло в сковороде. Обжарьте нарезанный лук до золотистого цвета. Затем добавьте морковь и обжарьте ещё пару минут.\n4. Добавьте к овощам фарш и обжаривайте, разбивая комочки фарша лопаткой, до изменения цвета.\n5. Добавьте томатную пасту, соль, чёрный перец и специи. Перемешайте и жарьте ещё минуту.\n6. Верните фасоль в сковороду, перемешайте.\n7. Нарежьте помидоры кубиками и добавьте к остальным ингредиентам.\n8. Влейте немного воды (если нужно), чтобы добиться желаемой консистенции блюда. Тушите всё вместе под крышкой на медленном огне 10–15 минут.\n9. Попробуйте на вкус и при необходимости добавьте соль или специи. Подавайте горячим, украсив свежей зеленью.", "right": "# Фасоль с фаршем и помидорами\n\n**Время приготовления:** 60 минут\n**Количество порций:** 4\n\n## Ингредиенты\n- Фасоль — 200 г;\n- Фарш мясной — 200 г;\n- Помидоры — 2–3 шт.;\n- Томатная паста — 1–2 ст. л.;\n- Чеснок — 2 зубчика;\n- Растительное масло — для жарки;\n- Соль — по вкусу;\n- Перец чёрный молотый — по вкусу.\n\n## Приготовление\n1. Замочите фасоль в холодной воде на несколько часов или на ночь, чтобы она стала мягче. Затем отварите её до готовности согласно инструкции на упаковке.\n2. Очистите чеснок и пропустите его через пресс.\n3. На разогретом растительном масле обжарьте чеснок до золотистого цвета.\n4. Добавьте к чесноку фарш и жарьте, помешивая, до изменения цвета мяса.\n5. Помидоры нарежьте кубиками и добавьте к фаршу.\n6. Введите томатную пасту, перемешайте и тушите всё вместе пару минут.\n7. Добавьте в сковороду готовую фасоль, посолите и поперчите по вкусу.\n8. Тщательно перемешайте все ингредиенты и тушите под крышкой на медленном огне ещё около 10 минут.\n9. Приятного аппетита!"}, {"id": "ingr_16", "prompt": "Придумай рецепт, в котором используются креветки, чеснок и сливки.", "a_left": true, "left": "### Креветки в сливочном соусе с чесноком\n\n**Описание:** нежные креветки в ароматном сливочном соусе с пикантным вкусом чеснока — это блюдо, которое понравится любителям морепродуктов. Оно идеально подойдёт как для повседневного ужина, так и для праздничного стола.\n\n**Время приготовления:** 20–30 минут.\n\n**Количество порций:** 4.\n\n### Ингредиенты\n* Креветки очищенные — 500 г.\n* Сливки (20% жирности) — 200 мл.\n* Чеснок — 3 зубчика.\n* Масло сливочное — 50 г.\n* Лимон — ½ шт.\n* Соль — по вкусу.\n* Перец чёрный молотый — по вкусу.\n* Петрушка свежая (для подачи) — по вкусу.\n\n### Приготовление\n1. Очистите креветки от панцирей и удалите кишечную вену.\n2. Разогрейте сковороду на среднем огне и растопите сливочное масло.\n3. Измельчите чеснок и обжарьте его на сковороде до золотистого цвета.\n4. Влейте сливки в сковороду с чесноком и перемешайте. Доведите смесь до кипения, затем уменьшите огонь и варите ещё 2–3 минуты, пока соус не загустеет.\n5. Добавьте соль и перец по вкусу. Попробуйте соус и при необходимости скорректируйте количество специй.\n6. Выложите креветки в сливочный соус и аккуратно перемешайте.\n7. Готовьте креветки в соусе примерно 5 минут, чтобы они прогрелись и пропитались ароматом соуса.\n8. Выдавите сок половины лимона прямо в сковороду. Это придаст блюду свежесть и яркость вкуса.\n9. Перемешайте креветки в соусе и снимите сковороду с огня.\n10. Разложите креветки в сливочном соусе по тарелкам и украсьте свежей петрушкой. Приятного аппетита!", "right": "# Паста с креветками в сливочном соусе\n\n**Описание:** нежное сочетание пасты, ароматных сливок и креветок, дополненное вкусом чеснока и базилика. Это блюдо станет отличным выбором для ужина или обеда.\n\n**Время приготовления:** 20–25 минут\n\n**Количество порций:** 2–4 (в зависимости от размера порции)\n\n## Ингредиенты\n* Паста — 450 г\n* Сливки — 200 мл\n* Креветки — 400 г\n* Базилик свежий — небольшой пучок\n* Чеснок — 3 зубчика\n* Масло оливковое — 2 ст. л.\n* Соль — по вкусу\n* Перец чёрный молотый — по вкусу\n\n## Приготовление\n1. Отварите пасту согласно инструкции на упаковке. Обычно это занимает около 10 минут. Откиньте готовую пасту на дуршлаг и промойте её холодной водой.\n2. Разогрейте оливковое масло на сковороде. Измельчите чеснок и обжарьте его на среднем огне до золотистого цвета.\n3. Очистите креветки и добавьте их на сковороду к чесноку. Обжаривайте креветки 2–3 минуты, периодически помешивая.\n4. Влейте сливки в сковороду, добавьте соль и перец. Перемешайте и держите на слабом огне, пока соус не начнёт густеть.\n5. Добавьте мелко нарезанный базилик, перемешайте и снимите с огня.\n6. Смешайте пасту с соусом и подавайте на стол. Приятного аппетита!"}, {"id": "dish_18", "prompt": "Напиши рецепт: Вареники с картошкой", "a_left": false, "left": "# Вареники с картошкой\n\n**Время приготовления:** 60 минут\n**Порций:** 4\n\n## Ингредиенты\n- Мука пшеничная — около 3 стаканов (количество может варьироваться в зависимости от качества муки и размера яиц);\n- Яйцо куриное — 2 шт.;\n- Вода — небольшое количество для замешивания теста;\n- Соль — по вкусу;\n- Картофель — 500 г;\n- Лук репчатый — 1–2 шт.;\n- Масло растительное — 50 мл;\n- Масло сливочное — по вкусу (для подачи).\n\n## Приготовление\n1. Приготовьте тесто для вареников. Для этого смешайте муку, яйца, соль и воду до получения упругого, но не слишком крутого теста. Оставьте тесто отдохнуть на некоторое время.\n2. Очистите картофель и отварите его до готовности. Затем растолките в пюре.\n3. Мелко нарежьте лук и обжарьте его на растительном масле до золотистого цвета. Добавьте обжаренный лук к картофельному пюре, перемешайте. При желании добавьте сливочное масло для более насыщенного вкуса.\n4. Раскатайте тесто тонким слоем и вырежьте кружочки подходящего диаметра.\n5. На каждый кружок положите немного начинки и аккуратно слепите края, формируя вареник.\n6. Варите вареники в кипящей подсоленной воде примерно 8 минут после того, как они всплывут.\n7. Готовые вареники можно подавать со сливочным маслом или сметаной. Приятного аппетита!", "right": "**Название:** вареники с картошкой\n\n**Описание:** нежные вареники с картофельной начинкой — это вкусное блюдо, которое понравится всей семье. Картофельная начинка имеет насыщенный вкус, а тесто получается мягким и эластичным. Подавайте вареники со сметаной или сливочным маслом.\n\n**Время приготовления:** 1 час 20 минут (без учёта времени на заморозку)\n\n**Количество порций:** зависит от размера вареников, примерно 6–8 порций\n\n**Ингредиенты:**\n* мука пшеничная — 500 г;\n* вода — 250 мл;\n* яйцо куриное — 1 шт.;\n* соль — 0,5 ч. л.;\n* картофель — 1 кг;\n* лук репчатый — 2 шт.;\n* масло растительное — 3 ст. л.;\n* перец чёрный молотый — по вкусу;\n* соль — по вкусу.\n\n**Шаги приготовления:**\n1. Подготовьте все необходимые ингредиенты. Картофель тщательно вымойте щёткой или жёсткой стороной губки, очистите и нарежьте кубиками среднего размера. Лук очистите и нарежьте мелкими кубиками.\n2. В глубокой миске смешайте муку, соль и яйцо. Постепенно вливая воду, замесите тесто. Тесто должно быть упругим и не липнуть к рукам. Накройте тесто полотенцем и оставьте отдохнуть на 20 минут.\n3. Пока тесто отдыхает, приготовьте начинку. Отварите картофель в подсоленной воде до готовности. Слейте воду, разомните картофель толкушкой, добавьте обжаренный на растительном масле до золотистого цвета лук, поперчите и посолите по вкусу. Хорошо перемешайте.\n4. Раскатайте тесто толщиной около 2 мм. Вырежьте кружочки диаметром примерно 7–8 см. На середину каждого кружка положите немного начинки.\n5. Соедините края кружочка, формируя полумесяц или другой желаемый вид вареника. Защипните края, чтобы начинка не выпала во время
