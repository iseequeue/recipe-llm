овить из таких продуктов: кабачки, фарш и сыр? Нужен подробный рецепт.", "a_left": false, "left": "# Запечённые кабачки с фаршем и сыром\n\n**Время приготовления:** 40 минут\n**Порций:** 4\n\n## Ингредиенты\n* Кабачки — 4 штуки;\n* Фарш мясной — 400 г;\n* Лук репчатый — 1 штука;\n* Сыр твёрдый — 100 г;\n* Томатная паста — 2 столовые ложки;\n* Вода или бульон — 50 мл;\n* Соль — по вкусу;\n* Чёрный перец молотый — по вкусу;\n* Специи — по вкусу;\n* Растительное масло — для жарки.\n\n## Приготовление\n1. Очистите лук и нарежьте его мелкими кубиками. Обжарьте лук на растительном масле до золотистого цвета.\n2. Добавьте к луку фарш, перемешайте и жарьте до готовности. Приправьте солью, перцем и специями по вкусу.\n3. Кабачки вымойте, обсушите и нарежьте кружочками толщиной около 0,5–1 см.\n4. Выложите кабачки в форму для запекания, предварительно смазанную растительным маслом.\n5. Посолите и поперчите кабачки по вкусу.\n6. На каждый кружок кабачка выложите немного фарша.\n7. Смешайте томатную пасту с водой или бульоном и равномерно распределите эту смесь по всей поверхности формы.\n8. Твёрдый сыр натрите на крупной тёрке и посыпьте им сверху кабачки с фаршем.\n9. Поставьте форму в разогретую до 180 °C духовку и запекайте примерно 25–30 минут до золотистой корочки и расплавления сыра.\n10. Готовые кабачки с фаршем и сыром выньте из духовки и дайте немного остыть перед подачей на стол. Приятного аппетита!", "right": "### Фаршированные кабачки с сыром\n\n**Описание:** это вкусное и сытное блюдо, которое понравится всей семье. Кабачки, фаршированные фаршем и сыром, запекаются в духовке до золотистой корочки.\n\n**Время приготовления:** 40–50 минут.\n\n**Количество порций:** зависит от размера кабачков (примерно 4–6 порций).\n\n### Ингредиенты\n* Кабачки — 2 шт.\n* Фарш (любой по вкусу) — 300 г.\n* Сыр твёрдый — 100 г.\n* Лук репчатый — 1 шт.\n* Чеснок — 2 зубчика.\n* Томатная паста — 1 ст. л.\n* Масло растительное — для смазывания формы.\n* Соль — по вкусу.\n* Перец чёрный молотый — по вкусу.\n* Специи (например, паприка, кориандр) — по вкусу.\n\n### Шаги приготовления\n1. Подготовьте все необходимые ингредиенты. Кабачки вымойте и обсушите бумажным полотенцем.\n2. Разрежьте кабачки вдоль пополам и аккуратно извлеките мякоть, оставив стенки толщиной около 5 мм. Мякоть нарежьте мелкими кубиками.\n3. Очистите лук и чеснок. Лук нарежьте мелко, а чеснок пропустите через пресс.\n4. На разогретой с растительным маслом сковороде обжарьте лук и чеснок до золотистого цвета.\n5. Добавьте к луку фарш, томатную пасту, соль, перец и специи. Перемешайте и обжаривайте всё вместе 5–7 минут.\n6. Добавьте нарезанную мякоть кабачков к фаршу и перемешайте.\n7. Наполните «лодочки» из кабачков получившейся смесью. Сверху посыпьте тёртым сыром.\n8. Смажьте форму для запекания растительным маслом и выложите в неё фаршированные кабачки.\n9. Запекайте в предварительно разогретой до 180 °C духовке примерно 25–30 минут до золотистой корочки.\n10. Готовые фаршированные кабачки подавайте горячими. Приятного аппетита!"}, {"id": "dish_19", "prompt": "Как приготовить «Гречка по-купечески»? Дай подробный рецепт.", "a_left": false, "left": "# Гречка по-купечески\n\n**Описание:** вкусное и сытное блюдо, которое сочетает в себе мясо, гречку и овощи.\n\n**Время приготовления:** 40–60 минут.\n\n**Количество порций:** зависит от размера используемой посуды и аппетита участников трапезы. Например, из указанных ингредиентов может получиться около 4–6 порций.\n\n## Ингредиенты\n* Мясо (например, свинина или курица) — 300–400 г;\n* Крупа гречневая — 1 стакан;\n* Лук репчатый — 1 шт.;\n* Морковь — 1 шт.;\n* Чеснок — 1 зубчик;\n* Лавровый лист — 1 шт.;\n* Соль — по вкусу;\n* Растительное масло — для жарки.\n\n## Приготовление\n1. Мясо нарезать небольшими кубиками, слегка обжарить на сковороде с растительным маслом.\n2. Затем долить немного воды, добавить лавровый лист и тушить мясо под крышкой на маленьком огне до готовности.\n3. Гречку перебрать, залить кипятком минут на 5, затем воду слить.\n4. Отдельно обжарить мелко нарезанную луковицу и морковь, натёртую на тёрке, добавить к мясу овощи и измельчённый чеснок, посолить, поперчить.\n5. Добавить гречку, долить горячей воды, чтобы гречка была покрыта на высоту примерно пальца, довести до кипения.\n6. Накрыть крышкой и томить на маленьком огне, пока вся жидкость не впитается, а гречка не станет мягкой.\n7. Огонь выключить, можно добавить кусочек сливочного масла и перемешать.", "right": "### Гречка по-купечески\n\n**Описание:** это вкусное и сытное блюдо, которое сочетает в себе рассыпчатую гречку и ароматные овощи с мясом. Идеальное решение для обеда или ужина.\n\n**Время приготовления:** 40–50 минут.\n\n**Количество порций:** зависит от объёма используемой посуды и аппетита участников трапезы (например, из указанного количества ингредиентов получается примерно 4 порции).\n\n### Ингредиенты\n* Гречневая крупа — 200 г.\n* Свинина (можно использовать курицу или индейку) — 300 г.\n* Морковь — 1 шт. среднего размера.\n* Репчатый лук — 1 шт. среднего размера.\n* Томатная паста — 2 ст. л.\n* Растительное масло — 3 ст. л.\n* Вода — 400 мл.\n* Соль — по вкусу.\n* Чёрный перец молотый — по вкусу.\n* Лавровый лист — 1–2 шт.\n* Чеснок — 2 зубчика.\n\n### Приготовление\n1. Подготовьте все необходимые ингредиенты. Мясо нарежьте небольшими кусочками.\n2. Очистите морковь и лук. Морковь натрите на крупной тёрке, а лук нарежьте кубиками.\n3. Разогрейте растительное масло в глубокой сковороде или кастрюле. Обжарьте мясо на среднем огне до золотистой корочки.\n4. Добавьте нарезанный лук и морковь. Обжаривайте всё вместе до мягкости овощей.\n5. Добавьте томатную пасту, соль, чёрный перец и измельчённый чеснок. Перемешайте и обжаривайте ещё пару минут.\n6. Промойте гречневую крупу под проточной водой. Добавьте гречку в сковороду, равномерно распределив её по поверхности.\n7. Влейте воду, чтобы она покрывала содержимое сковороды. Добавьте лавровый лист.\n8. Доведите до кипения, затем уменьшите огонь и готовьте под крышкой около 20–25 минут, пока вода не впитается, а гречка не станет мягкой.\n9. Подавайте гречку по-купечески горячей, можно добавить свежую зелень по вкусу."}, {"id": "ingr_14", "prompt": "Что приготовить из таких продуктов: шпинат, яйца и сыр? Нужен подробный рецепт.", "a_left": true, "left": "### Омлет со шпинатом и сыром\n\n**Описание:** нежный и ароматный омлет с добавлением свежего шпината и сыра — это отличный завтрак или лёгкий ужин. Блюдо готовится быстро и просто, а его вкус порадует вас и ваших близких.\n\n**Время приготовления:** 20 минут.\n\n**Количество порций:** 2.\n\n### Ингредиенты\n* Яйца — 4 штуки;\n* Шпинат свежий — 100 г;\n* Сыр (например, твёрдый сыр типа пармезан или голландский) — 50 г;\n* Молоко — 60 мл;\n* Соль — по вкусу;\n* Перец чёрный молотый — по вкусу;\n* Масло растительное или сливочное для жарки — по желанию.\n\n### Шаги приготовления\n1. Подготовьте все необходимые ингредиенты. Шпинат промойте и обсушите. Сыр нарежьте мелкими кубиками или натрите на тёрке.\n2. В миске взбейте яйца с молоком до однородной массы. Добавьте соль и перец по вкусу.\n3. Разогрейте сковороду на среднем огне. Если используете растительное масло, смажьте им дно сковороды. Если предпочитаете сливочное масло, растопите его в сковороде.\n4. Вылейте яичную смесь на сковороду и равномерно распределите её по поверхности.\n5. Когда нижняя часть омлета начнёт схватываться, выложите сверху шпинат и кусочки сыра.\n6. Аккуратно перемешайте содержимое сковороды лопаткой, чтобы сыр расплавился, а шпинат равномерно распределился.\n7. Жарьте омлет ещё несколько минут, пока верх не станет золотистым и готовым.\n8. Готовый омлет переложите на тарелку и подавайте горячим. Приятного аппетита!", "right": "# Запеканка из шпината, яиц и сыра\n\n**Время приготовления:** 40 минут\n**Порций:** 6\n\n## Ингредиенты\n* Шпинат — 400 г;\n* Яйца куриные — 5 шт.;\n* Сыр твёрдый — 150 г;\n* Сливки — 100 мл;\n* Соль — по вкусу;\n* Чёрный перец молотый — по вкусу.\n\n## Приготовление\n1. Шпинат промыть, обсушить и крупно порезать.\n2. Яйца взбить в миске венчиком. Добавить сливки, соль и перец, перемешать.\n3. В форму для запекания выложить шпинат, залить яично-сливочной смесью.\n4. Твёрдый сыр натереть на крупной тёрке и равномерно распределить сверху.\n5. Поставить форму в предварительно разогретую до 180 °C духовку на 25–30 минут. Запекать до золотистой корочки."}, {"id": "cat_14", "prompt": "Предложи вегетарианский рецепт на ужин.", "a_left": true, "left": "### Вегетарианская паста с овощами и соусом песто\n\n**Описание:** это вкусное и ароматное блюдо, которое станет отличным ужином для всей семьи. Паста с яркими овощами и свежим соусом песто порадует вас своим вкусом и ароматом.\n\n**Время приготовления:** 20–30 минут (не учитывая время варки пасты).\n\n**Количество порций:** зависит от размера вашей порции пасты. Обычно из указанных ингредиентов получается достаточно для 4–6 порций.\n\n### Ингредиенты\n* Паста (например, спагетти) — 200 г.\n* Цукини — 1 шт.\n* Красный болгарский перец — 1 шт.\n* Жёлтый болгарский перец — 1 шт.\n* Помидоры черри — 150 г.\n* Чеснок — 2 зубчика.\n* Оливковое масло — 3 ст. л.\n* Листья базилика — небольшой пучок.\n* Кедровые орехи — 3 ст. л.\n* Пармезан или другой твёрдый сыр — 50 г.\n* Соль — по вкусу.\n* Перец чёрный молотый — по вкусу.\n\n### Шаги приготовления\n1. Вскипятите воду в большой кастрюле и отварите пасту до состояния аль денте согласно инструкции на упаковке. Слейте воду.\n2. Цукини нарежьте тонкими полукольцами или кубиками, помидоры черри разрежьте пополам. Болгарский перец очистите от семян и нарежьте полосками.\n3. Разогрейте оливковое масло на сковороде. Добавьте измельчённый чеснок и обжарьте его до золотистого цвета.\n4. Добавьте цукини и болгарский перец на сковороду и обжаривайте овощи около 5 минут до мягкости.\n5. Снимите листья базилика с веточек и мелко нарежьте их. Измельчите кедровые орехи.\n6. Смешайте базилик, кедровые орехи, натёртый пармезан, соль и перец в миске — это будет ваш соус песто.\n7. Добавьте соус песто к овощам на сковороде и перемешайте.\n8. Соедините овощи с соусом песто с готовой пастой в большой миске и тщательно перемешайте.\n9. Подавайте горячим, посыпав дополнительно тёртым сыром.", "right": "# Вегетарианский ужин\n\n**Время приготовления:** 40 минут\n**Порций:** 4\n\n## Ингредиенты\n* Баклажаны — 2 шт.\n* Болгарский перец — 2 шт.\n* Помидоры — 3 шт.\n* Репчатый лук — 1 шт.\n* Чеснок — 3 зубчика\n* Растительное масло — 3 ст. л.\n* Томатная паста — 2 ст. л.\n* Соль — по вкусу\n* Чёрный молотый перец — по вкусу\n* Специи (например, паприка, орегано) — по вкусу\n\n## Приготовление\n1. Баклажаны вымыть, нарезать кружочками толщиной около 0,5 см. Посолить, оставить на 10–15 минут, чтобы избавиться от горечи, затем промыть и обсушить бумажным полотенцем.\n2. Лук очистить и нарезать кубиками. Чеснок очистить и измельчить.\n3. Разогреть растительное масло на сковороде. Обжарить лук до золотистого цвета, добавить чеснок и обжаривать ещё пару минут.\n4. Добавить томатную пасту, соль, чёрный молотый перец и специи. Перемешать и готовить ещё 1–2 минуты.\n5. Баклажаны выложить на дно формы для запекания. Сверху распределить обжаренный лук с томатной пастой.\n6. Болгарский перец вымыть, удалить семена и перегородки, нарезать полосками и выложить поверх баклажанов.\n7. Помидоры вымыть и нарезать кружочками. Выложить помидоры сверху на перец.\n8. Запекать в предварительно разогретой до 180 °C духовке около 20–25 минут, пока овощи не станут мягкими, но сохранят свою форму.\n9. Вегетарианский ужин готов. Подавайте горячим, украсив свежей зеленью."}]};
const KEY = "sbs:" + DATA.a + ":" + DATA.b;
let votes = {};
try { votes = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
let i = DATA.items.findIndex(x => !(x.id in votes)); if (i < 0) i = DATA.items.length;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(votes)); } catch (e) {} }
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function md(t){
  const out=[]; let list=null;
  const close=()=>{ if(list){ out.push("</"+list+">"); list=null; } };
  for (const raw of t.split("\n")) {
    const l = raw.trim(); if (!l) { close(); continue; }
    let m;
    if ((m = l.match(/^#\s+(.*)/))) { close(); out.push("<h4>"+esc(m[1])+"</h4>"); }
    else if ((m = l.match(/^#{2,6}\s+(.*)/))) { close(); out.push("<h5>"+esc(m[1])+"</h5>"); }
    else if ((m = l.match(/^[-*•]\s+(.*)/))) { if(list!=="ul"){ close(); out.push("<ul>"); list="ul"; } out.push("<li>"+esc(m[1])+"</li>"); }
    else if ((m = l.match(/^\d+[.)]\s+(.*)/))) { if(list!=="ol"){ close(); out.push("<ol>"); list="ol"; } out.push("<li>"+esc(m[1])+"</li>"); }
    else { close(); out.push("<p>"+esc(l).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")+"</p>"); }
  }
  close(); return out.join("");
}
function render(){
  const n = DATA.items.length;
  document.getElementById("count").textContent = Math.min(i+1, n) + " / " + n;
  document.getElementById("bar").style.width = (100*Object.keys(votes).length/n) + "%";
  if (i >= n) return finish();
  const it = DATA.items[i], v = votes[it.id];
  document.getElementById("main").innerHTML =
    '<div class="prompt">'+esc(it.prompt)+'</div><p class="hint muted">Какой рецепт лучше: правильнее, понятнее, реально приготовить?</p>'+
    '<div class="cols"><div class="card'+(v==="L"?" chosen":"")+'"><h3>Левый</h3><div class="md">'+md(it.left)+'</div></div>'+
    '<div class="card'+(v==="R"?" chosen":"")+'"><h3>Правый</h3><div class="md">'+md(it.right)+'</div></div></div>';
  window.scrollTo(0,0);
}
function vote(c){ if (i >= DATA.items.length) return; votes[DATA.items[i].id] = c; save(); i++; render(); }
function back(){ if (i > 0) { i--; render(); } }
function finish(){
  document.getElementById("actions").style.display = "none";
  let a=0,b=0,t=0; const items=[];
  for (const it of DATA.items) {
    const v = votes[it.id]; if (!v) continue;
    const w = v==="T" ? "tie" : ((v==="L") === it.a_left ? "a" : "b");
    if (w==="a") a++; else if (w==="b") b++; else t++;
    items.push({id: it.id, prompt: it.prompt, winner: w});
  }
  const n=a+b+t, wr = n ? (b+0.5*t)/n : 0;
  const res = {a: DATA.a, b: DATA.b, a_wins: a, ties: t, b_wins: b, win_rate_b: wr, items};
  const blob = URL.createObjectURL(new Blob([JSON.stringify(res, null, 2)], {type:"application/json"}));
  document.getElementById("main").innerHTML = '<div class="result"><h2>Готово</h2><table>'+
    '<tr><td>'+esc(DATA.a)+' лучше</td><td><b>'+a+'</b></td></tr><tr><td>Одинаково</td><td><b>'+t+'</b></td></tr>'+
    '<tr><td>'+esc(DATA.b)+' лучше</td><td><b>'+b+'</b></td></tr><tr><td>Win rate '+esc(DATA.b)+'</td><td><b>'+Math.round(100*wr)+'%</b></td></tr></table>'+
    '<p><a download="sbs_'+DATA.a+'_vs_'+DATA.b+'_results.json" href="'+blob+'"><button class="primary">Скачать результаты</button></a> '+
    '<button onclick="votes={};save();location.reload()">Начать заново</button></p>'+
    '<p class="muted">Положите файл в папку eval/ проекта и запустите scripts/compare.py.</p></div>';
}
document.addEventListener("keydown", e => {
  if (e.key==="1"||e.key==="ArrowLeft") vote("L"); else if (e.key==="2"||e.key==="ArrowDown") vote("T");
  else if (e.key==="3"||e.key==="ArrowRight") vote("R"); else if (e.key==="Backspace") { e.preventDefault(); back(); }
});
render();
</script></body></html>
