 варки.\n6. Варите вареники в кипящей подсолённой воде 5–7 минут после того, как они всплывут. Готовые вареники достаньте шумовкой и подавайте горячими."}, {"id": "dish_08", "prompt": "Дай рецепт блюда «Пельмени домашние».", "a_left": true, "left": "### Пельмени домашние\n\n**Описание:** вкусные домашние пельмени с мясной начинкой, которые станут отличным обедом или ужином. Подаются с маслом и сметаной.\n\n**Время приготовления:** 1 час 30 минут (без учёта времени варки).\n\n**Количество порций:** зависит от размера пельменей и аппетита едоков, примерно 6–8 порций.\n\n### Ингредиенты\n* **Для теста:**\n    * мука пшеничная — 500 г;\n    * вода — 200 мл;\n    * яйцо куриное — 1 шт.;\n    * соль — 0,5 ч. л.\n* **Для начинки:**\n    * фарш мясной (например, свинина + говядина) — 400 г;\n    * лук репчатый — 1 шт.;\n    * соль — по вкусу;\n    * перец чёрный молотый — по вкусу;\n    * специи для фарша — по вкусу (по желанию).\n* **Дополнительно:**\n    * масло растительное — для раскатки теста;\n    * сметана — для подачи;\n    * сливочное масло — для подачи.\n\n### Приготовление\n1. Подготовьте все ингредиенты.\n2. Для начала приготовьте тесто. В глубокой миске смешайте муку, соль и яйцо. Постепенно вливайте воду, замешивая тесто. Тесто должно быть эластичным и не липнуть к рукам. Накройте миску с тестом полотенцем и оставьте на 20–30 минут.\n3. Пока тесто отдыхает, займитесь начинкой. Очистите луковицу и мелко нарежьте её. Обжарьте лук на растительном масле до золотистого цвета. Остудите обжаренный лук.\n4. Смешайте фарш с луком, добавьте соль, перец и специи по вкусу. Тщательно перемешайте начинку.\n5. Раскатайте тесто в тонкий пласт толщиной около 2 мм. Вырежьте кружочки стаканом или специальной формой.\n6. На каждый кружок выложите немного начинки и аккуратно защипните края, формируя пельмень.\n7. Варите пельмени в кипящей подсоленной воде 7–10 минут после того, как они всплывут.\n8. Готовые пельмени достаньте шумовкой и подавайте горячими со сливочным маслом и сметаной.", "right": "# Пельмени «Домашние»\n\n**Описание:** вкусные домашние пельмени с мясной начинкой, которые станут отличным обедом или ужином для всей семьи.\n\n**Время приготовления:** примерно 1,5 часа.\n\n**Количество порций:** зависит от размера пельменей, но обычно из указанного количества ингредиентов получается около 150 штук.\n\n## Ингредиенты\n* мука пшеничная — 500 г;\n* яйцо куриное — 4 шт.;\n* масло растительное — 2 ст. л.;\n* вода — 1,5 стакана;\n* молоко — 0,5 стакана;\n* соль — по вкусу;\n* свинина — 600 г;\n* говядина — 400 г;\n* лук репчатый — 4 шт.;\n* чеснок — 2–3 зубчика;\n* сливки — 200 мл.\n\n## Приготовление\n1. Просейте муку с солью, в горке сделайте углубление, туда разбейте яйца.\n2. Начните вымешивать тесто, постепенно добавляя остальную жидкость (воду и молоко).\n3. Тесто должно получиться упругим, пластичным и не прилипать к рукам.\n4. Оставьте тесто на час-полтора постоять, завернув его во влажную салфетку.\n5. Мясо прокрутите 2 раза. На второй раз в фарш добавьте лук, чеснок. Затем посолите и поперчите по вкусу.\n6. Постепенно добавляйте сливки и вымешивайте фарш до однородной массы, чтобы не было комочков.\n7. Раскатайте тесто тонким пластом, стаканом с тонкими краями или от руки вырежьте кружочки.\n8. На середину каждого кружка положите мясную начинку — полную кофейную или неполную чайную ложку.\n9. Слепите края пельменей. Если опасаетесь, что они плохо слепятся, промазывайте краешки яйцом.\n10. Готовые пельмени сложите на посыпанную мукой доску и отправьте в морозильник.\n11. После заморозки отварите пельмени в подсоленной воде с добавлением лаврового листа."}, {"id": "ingr_06", "prompt": "У меня есть: лосось, лимон и рис. Что можно приготовить? Напиши рецепт.", "a_left": true, "left": "### Лосось, запечённый с лимоном, с рисом на гарнир\n\n**Описание:** это простое и вкусное блюдо, которое подойдёт как для повседневного ужина, так и для праздничного стола. Нежный лосось, пропитанный лимонным соком, прекрасно сочетается с рассыпчатым рисом.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** зависит от размера формы для запекания и аппетита участников трапезы. Например, из указанных количеств получится около 4 порций.\n\n### Ингредиенты\n* Лосось (филе) — 500 г.\n* Лимон — 1 шт.\n* Соль — по вкусу.\n* Чёрный перец молотый — по вкусу.\n* Специи для рыбы (по желанию) — по вкусу.\n* Рис — 200 г.\n* Вода — 400 мл.\n* Масло растительное или сливочное (для варки риса) — по желанию.\n\n### Шаги приготовления\n1. Подготовьте все ингредиенты. Филе лосося промойте под холодной водой и обсушите бумажным полотенцем.\n2. Нарежьте лимон кружочками или дольками.\n3. Посолите и поперчите лосось с обеих сторон. При желании добавьте специи для рыбы.\n4. Выложите ломтики лимона на дно формы для запекания. Сверху положите филе лосося.\n5. Запекайте в предварительно разогретой до 180 °C духовке примерно 20–25 минут. Время может варьироваться в зависимости от толщины филе. Рыба должна стать золотистой и легко отделяться вилкой.\n6. Пока запекается рыба, займитесь рисом. Промойте его несколько раз в холодной воде, пока вода не станет прозрачной.\n7. В кастрюле доведите воду до кипения, добавьте соль по вкусу и масло (если используете).\n8. Всыпьте промытый рис в кипящую воду и варите на среднем огне согласно инструкции на упаковке (обычно это занимает около 15–20 минут).\n9. Когда рис будет готов, снимите кастрюлю с огня и дайте рису немного постоять под крышкой.\n10. Подавайте запечённого лосося с рисом и дольками лимона. Приятного аппетита!", "right": "# Лосось с рисом и лимоном\n\n**Описание:** это простое и вкусное блюдо, которое сочетает в себе нежный лосось и ароматный рис. Лимон придаёт свежесть и лёгкую кислинку.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** зависит от размера вашей посуды и аппетита, примерно на 2–4 порции.\n\n## Ингредиенты\n* Лосось — 200 г;\n* Рис — 1 стакан;\n* Лимон — ½ шт.;\n* Масло растительное — 2 ст. л.;\n* Соль — по вкусу;\n* Перец чёрный молотый — по вкусу.\n\n## Приготовление\n1. Подготовьте все необходимые ингредиенты.\n2. Промойте рис и отварите его согласно инструкции на упаковке. Обычно соотношение воды и риса составляет 1,5–2 части воды на 1 часть риса. Варите до полного впитывания воды.\n3. Пока варится рис, нарежьте лосось на небольшие кусочки.\n4. Разогрейте сковороду с растительным маслом. Выложите кусочки лосося и обжарьте их с обеих сторон до золотистой корочки. Посолите и поперчите по вкусу.\n5. Выдавите сок из половины лимона и сбрызните им готовые кусочки лосося. Это придаст рыбе свежий аромат и вкус.\n6. Готовый рис выложите на тарелки и сверху положите обжаренный лосось.\n7. Подавайте горячим."}, {"id": "ingr_15", "prompt": "У меня есть: свекла, чеснок и майонез. Что можно приготовить? Напиши рецепт.", "a_left": true, "left": "### Салат из свёклы с чесноком и майонезом\n\n**Описание:** этот салат — простое и вкусное блюдо, которое может стать отличным дополнением к обеду или ужину. Свёкла придаёт ему сладость и насыщенность, а чеснок добавляет пикантности. Майонез служит заправкой, которая объединяет все вкусы.\n\n**Время приготовления:** 30 минут.\n\n**Количество порций:** 4.\n\n### Ингредиенты\n* свёкла — 500 г;\n* чеснок — 2 зубчика;\n* майонез — по вкусу;\n* соль — по вкусу;\n* чёрный перец молотый — по вкусу;\n* зелень для украшения (например, укроп или петрушка) — по желанию.\n\n### Шаги приготовления\n1. Отварите свёклу до готовности. Для этого поместите её в кастрюлю, залейте водой и варите около 40–60 минут (время зависит от размера свёклы). Проверьте готовность вилкой — она должна легко входить в овощ. Остудите свёклу и очистите её от кожуры.\n2. Натрите свёклу на крупной тёрке.\n3. Очистите чеснок и пропустите его через пресс или мелко нарежьте.\n4. В миске смешайте натёртую свёклу, измельчённый чеснок, майонез, соль и перец. Хорошо перемешайте все ингредиенты.\n5. Переложите салат в сервировочное блюдо и украсьте зеленью по желанию.\n\nПриятного аппетита!", "right": "# Свекольный соус с чесноком\n\n**Время приготовления:** 10 минут\n**Порций:** 6\n\n## Ингредиенты\n- Свёкла — 1 штука;\n- Майонез — 100 г;\n- Чеснок — 3 зубчика;\n- Соль — по вкусу;\n- Перец чёрный — по вкусу.\n\n## Приготовление\n1. Отварите свёклу.\n2. Очистите чеснок.\n3. В чаше блендера сложите отваренную свёклу, чеснок, майонез.\n4. Всё взбейте до пышности.\n5. Добавьте соль и перец по вкусу.\n6. Охладите перед подачей.\n7. Соус готов.\n\nЗамечательно подходит к рыбным блюдам, например, к селёдке, а также к мясным закускам.\nПриятного аппетита!"}, {"id": "ingr_08", "prompt": "Что приготовить из таких продуктов: яблоки, тыква и корица? Нужен подробный рецепт.", "a_left": false, "left": "# Тыквенно-яблочный пудинг с корицей\n\n**Время приготовления:** 40 минут\n**Количество порций:** 4\n\n## Ингредиенты\n- Тыква — 400 г;\n- Яблоко — 400 г;\n- Молоко — 1 стакан;\n- Крупа манная — 3 ст. л.;\n- Сахар — 2 ст. л.;\n- Масло сливочное — 4 ст. л.;\n- Яйцо куриное — 2 шт.;\n- Корица — по вкусу.\n\n## Приготовление\n1. Тыкву промыть, нарезать небольшими кубиками. Яблоки промыть, разрезать пополам, удалить сердцевину и нарезать мелкими кубиками.\n2. Белки отделить от желтков.\n3. Тыкву и яблоки потушить в молоке до полуготовности 5–6 минут.\n4. Всыпать тонкой струйкой манную крупу, варить 5 минут.\n5. Охладить полученную массу, добавить сахар, яичные желтки. Присыпать корицей и хорошо перемешать.\n6. Затем ввести взбитые белки, ещё раз осторожно перемешать.\n7. Форму для запекания смазать 2 ст. л. масла, выложить в неё тыквенно-яблочную смесь.\n8. Запекать в духовке при температуре 180–186 °С примерно 15 минут.\n9. Перед подачей растопить оставшееся масло, полить им запеканку и подавать.", "right": "### Яблочно-тыквенный пирог с корицей\n\n**Описание:** ароматный и вкусный пирог с начинкой из тыквы и яблок, приправленный корицей. Это отличный выбор для чаепития или десерта.\n\n**Время приготовления:** 1 час 30 минут (не включая время на охлаждение).\n\n**Количество порций:** 6–8.\n\n### Ингредиенты\n* **Тыква** — 400 г;\n* **Яблоки** — 2 шт.;\n* **Сахар** — 150 г (75 г в начинку, 75 г для посыпки);\n* **Мука** — 200 г;\n* **Разрыхлитель теста** — 1 ч. л.;\n* **Корица** — 1 ч. л.;\n* **Гвоздика молотая** — щепотка (по желанию);\n* **Масло сливочное** — 100 г (50 г в начинку, 50 г для смазывания формы);\n* **Яйца** — 2 шт.;\n* **Ванильный сахар** — 1 ч. л.\n\n### Шаги приготовления\n1. Разогрейте духовку до 180 °C. Подготовьте форму для пирога, смажьте её сливочным маслом.\n2. Очистите тыкву от кожуры и семян, нарежьте небольшими кубиками. Яблоки очистите от сердцевины и нарежьте тонкими ломтиками.\n3. В миске смешайте муку, разрыхлитель, корицу и гвоздику.\n4. В другой миске взбейте яйца, добавьте сахар, ванильный сахар и растопленное сливочное масло. Хорошо перемешайте.\n5. Постепенно добавляйте сухие ингредиенты к яичной смеси, перемешивая до однородности.\n6. Добавьте тыкву и яблоки в тесто, аккуратно перемешайте.\n7. Вылейте тесто в подготовленную форму.\n8. Посыпьте сверху сахаром (для карамелизации).\n9. Поставьте форму в разогретую духовку и выпекайте примерно 40–50 минут, пока зубочистка, вставленная в центр пирога, не будет выходить чистой.\n10. Дайте пирогу немного остыть перед подачей. Приятного аппетита!"}, {"id": "ingr_05", "prompt": "Что приготовить из таких продуктов: гречка и грибы? Нужен подробный рецепт.", "a_left": true, "left": "### Грибы с гречкой\n\n**Описание:** это сытное и ароматное блюдо, которое сочетает в себе простоту и насыщенность вкусов. Гречка известна своими полезными свойствами, а грибы придают блюду неповторимый грибной аромат.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** 2–4 (в зависимости от размера порций).\n\n### Ингредиенты\n* Гречка — 1 стакан;\n* Грибы (например, шампиньоны) — 200 г;\n* Репчатый лук — 1 шт.;\n* Морковь — 1 шт.;\n* Растительное масло — 2 ст. л.;\n* Соль — по вкусу;\n* Чёрный перец молотый — по вкусу;\n* Лавровый лист — 1–2 шт.;\n* Вода — 2 стакана.\n\n### Шаги приготовления\n1. Подготовьте все необходимые ингредиенты. Гречку промойте под проточной водой несколько раз, пока вода не станет прозрачной.\n2. Лук очистите и нарежьте мелкими кубиками. Морковь очистите и натрите на крупной тёрке.\n3. Грибы нарежьте пластинками или кубиками, в зависимости от вашего предпочтения.\n4. В сковороде разогрейте растительное масло на среднем огне. Обжарьте лук до золотистого цвета.\n5. Добавьте морковь и обжаривайте ещё 3–5 минут, чтобы овощи стали мягкими.\n6. Выложите грибы в сковороду и обжаривайте всё вместе около 5–7 минут, пока грибы не выпустят сок и он не испарится, а сами грибы не подрумянятся.\n7. Добавьте промытую гречку в сковороду, перемешайте с овощами и грибами.\n8. Посолите, поперчите по вкусу, добавьте лавровый лист.\n9. Залейте содержимое сковороды двумя стаканами горячей воды. Уровень воды должен быть выше уровня крупы примерно на палец.\n10. Доведите воду до кипения, затем уменьшите огонь до минимума, накройте крышкой и готовьте гречку 15–20 минут, пока вся вода не впитается.\n11. Снимите сковороду с огня, аккуратно перемешайте готовую гречку и дайте ей постоять под крышкой ещё 5 минут. Подавайте как самостоятельное блюдо или как гарнир к мясу или овощам.", "right": "# Гречка с грибами под соусом\n\n**Время приготовления:** 40–50 минут\n**Порций:** 4\n\n## Ингредиенты\n* Крупа гречневая — 200 г;\n* Вода — 500 г;\n* Приправа — по вкусу;\n* Шампиньоны — 200 г;\n* Репчатый лук — 1 шт.;\n* Морковь — 1 шт.;\n* Растительное масло — для жарки;\n* Соль — по вкусу;\n* Чёрный перец — по вкусу;\n* Зелень (укроп или петрушка) — для подачи.\n\n## Приготовление\n1. Гречку промыть. Вскипятить воду, посолить, добавить приправы, затем положить гречку. Убавить огонь до минимального после закипания.\n2. Пока варится гречка, очистить и мелко нарезать лук.\n3. Морковь натереть на крупной тёрке.\n4. Шампиньоны вымыть и нарезать пластинками или кубиками.\n5. Разогреть растительное масло на сковороде и обжарить лук до прозрачности.\n6. Добавить морковь и обжаривать овощи вместе до мягкости моркови.\n7. Положить шампиньоны на сковороду и обжаривать всё вместе до испарения жидкости, выделяемой грибами. Посолить и поперчить по вкусу.\n8. Сваренную гречку переложить к грибам и овощам, тщательно перемешать.\n9. Потомить блюдо на огне пару минут.\n10. Готовое блюдо посыпать зеленью перед подачей на стол. Приятного аппетита!"}, {"id": "cat_03", "prompt": "Предложи рецепт из раздела «Закуски».", "a_left": false, "left": "# Закуска с творожным сыром и фруктами\n\n**Время приготовления:** 15 минут\n\n**Количество порций:** 4\n\n## Ингредиенты\n* Творожный сыр — 100 г;\n* Сёмга слабосолёная — 50 г;\n* Яблоко — 1 шт.;\n* Йогурт натуральный — 1 ст. л.;\n* Соевый соус — 1 ст. л.;\n* Сок лимонный — 1 ст. л.;\n* Укроп свежий — ½ пучка;\n* Хлеб бородинский (можно заменить другим видом хлеба) — несколько кусочков.\n\n## Приготовление\n1. Смешайте в миске творожный сыр, йогурт, лимонный сок и соевый соус.\n2. Добавьте в смесь очень мелко нарезанные яблоко и сёмгу. Также добавьте часть укропа.\n3. Ломтики бородинского хлеба без корок нарежьте треугольничками.\n4. Соедините попарно кусочки хлеба начинкой из творожного сыра с добавками и украсьте оставшимся укропом.", "right": "### Закуска «Сырные шарики в панировке»\n\n**Описание:** нежные сырные шарики в хрустящей панировке — это отличная закуска для любого случая. Они идеально подойдут как для праздничного стола, так и для повседневного перекуса. Сырные шарики имеют приятный сливочный вкус и аппетитный внешний вид.\n\n**Время приготовления:** 30 минут.\n\n**Количество порций:** 4–6.\n\n### Ингредиенты\n* твёрдый сыр — 200 г;\n* яйцо куриное — 1 шт.;\n* мука пшеничная — 50 г;\n* сухари панировочные — 50 г;\n* растительное масло для жарки — 50 мл;\n* соль — по вкусу;\n* перец чёрный молотый — по вкусу;\n* специи (по желанию) — по вкусу.\n\n### Шаги приготовления\n1. Натрите сыр на мелкой тёрке.\n2. В глубокой миске взбейте яйцо.\n3. Добавьте к яйцу муку, соль, перец и специи. Перемешайте до однородности.\n4. Сформируйте из сыра небольшие шарики.\n5. Обмакните каждый шарик сначала в яичную смесь, затем обваляйте в панировочных сухарях.\n6. Разогрейте растительное масло на сковороде.\n7. Выложите шарики на сковороду и обжарьте их до золотистой корочки с обеих сторон.\n8. Готовые шарики выложите на бумажное полотенце, чтобы удалить излишки масла.\n9. Подавайте закуску тёплой или комнатной температуры."}, {"id": "dish_01", "prompt": "Как приготовить «Щи из свежей капусты»? Дай подробный рецепт.", "a_left": false, "left": "# Щи из свежей капусты\n\n**Время приготовления:** 120 минут\n**Порций:** 5\n\n## Ингредиенты\n* Вода — 2 л;\n* Говядина — 500 г;\n* Капуста белокочанная;\n* Картофель — 3 шт.;\n* Морковь — 1 шт.;\n* Лук репчатый — 1 шт.;\n* Помидор — 1 шт.;\n* Масло сливочное — 50 г;\n* Лавровый лист — 2 шт.;\n* Чёрный перец горошком — 5 шт.;\n* Чеснок — 2 зуб.;\n* Соль;\n* Укроп;\n* Петрушка;\n* Сметана;\n* Приправа — 2 ст. л.\n\n## Приготовление\n1. Сварите бульон из говядины с косточкой (на это потребуется примерно 1,5 часа). Процедите бульон. Отделите мясо от кости и порежьте его, пока отложите в сторону.\n2. Нарежьте капусту и очищенный картофель кубиками. Ошпарьте помидор кипятком, затем облейте холодной водой и очистите от шкурки. Нарежьте его мельче, чем картофель. Очистите лук и мелко нарежьте его. Морковь натрите на крупной тёрке.\n3. Разогрейте на сковороде сливочное масло и обжарьте в нём лук и морковь.\n4. Поставьте бульон на огонь. Когда он закипит, опустите в него капусту и варите 5–7 минут.\n5. Добавьте картофель, а через 5 минут — помидоры. Варите 10 минут.\n6. Затем добавьте в суп морковь с луком, мясо, специи и приправу. Варите 3 минуты.\n7. Пропустите чеснок через пресс и разотрите его с солью.\n8. Когда щи будут готовы, положите в них рубленую зелень и чеснок с солью. Перемешайте. Если нужно, досолите по вкусу.\n9. Подавайте со сметаной.\n\nПриятного аппетита!", "right": "### Щи из свежей капусты\n\n**Описание:** традиционные русские щи из свежей капусты — это ароматный и насыщенный суп, который согреет в холодное время года. Вкусный и сытный, он станет отличным обедом для всей семьи.\n\n**Время приготовления:** около 1 часа.\n\n**Количество порций:** зависит от размера кастрюли, например, из указанного количества ингредиентов получится примерно 6–8 порций.\n\n### Ингредиенты\n* Вода — 2 л;\n* Свинина или говядина (на выбор) — 300 г;\n* Свежая капуста — 300 г;\n* Картофель — 3 шт.;\n* Морковь — 1 шт.;\n* Репчатый лук — 1 шт.;\n* Томатная паста — 2 ст. л.;\n* Лавровый лист — 2 шт.;\n* Чёрный перец горошком — 5–7 шт.;\n* Соль — по вкусу;\n* Растительное масло — для жарки;\n* Чеснок — 2 зубчика (по желанию);\n* Зелень (укроп, петрушка) — для подачи.\n\n### Приготовление\n1. Подготовьте все необходимые ингредиенты. Мясо нарежьте небольшими кусочками.\n2. В кастрюлю налейте воду и поставьте её на огонь. Когда вода закипит, добавьте мясо и варите его на медленном огне около 20 минут после повторного закипания. Снимите пену, чтобы бульон был прозрачным.\n3. Капусту тонко нашинкуйте. Картофель очистите и нарежьте кубиками среднего размера. Морковь натрите на крупной тёрке, а лук нарежьте мелкими кубиками.\n4. Извлеките мясо из бульона и переложите его на тарелку. Бульон верните на плиту и добавьте картофель. Варите картофель около 10 минут.\n5. На разогретом растительном масле обжарьте морковь и лук до золотистого цвета. Затем добавьте томатную пасту и перемешайте. Обжаривайте ещё пару минут.\n6. Переложите зажарку в кастрюлю с картофелем, добавьте капусту и лавровый лист. Верните мясо в кастрюлю.\n7. Посолите по вкусу, добавьте чёрный перец горошком и варите всё вместе ещё около 15 минут.\n8. За несколько минут до готовности добавьте измельчённый чеснок (если используете).\n9. Готовые щи снимите с огня, дайте им настояться под крышкой 10–15 минут. Подавайте со свежей зеленью."}, {"id": "cat_09", "prompt": "Предложи рецепт для детского меню.", "a_left": true, "left": "### Куриные котлетки с картофельным пюре и овощным салатом\n\n**Описание:** нежные куриные котлетки с хрустящей корочкой, воздушное картофельное пюре и свежий овощной салат — идеальный обед или ужин для детей. Это блюдо не только вкусное, но и полезное.\n\n**Время приготовления:** 40 минут.\n\n**Количество порций:** 4.\n\n### Ингредиенты\n* **Куриное филе** — 500 г.\n* **Белый хлеб (или панировочные сухари)** — 100 г.\n* **Молоко** — 50 мл.\n* **Яйцо** — 1 шт.\n* **Соль** — по вкусу.\n* **Перец чёрный молотый** — по вкусу.\n* **Масло растительное** — для жарки.\n\nДля картофельного пюре:\n* **Картофель** — 800 г.\n* **Молоко** — 100 мл.\n* **Сливочное масло** — 50 г.\n* **Соль** — по вкусу.\n\nДля овощного салата:\n* **Огурцы свежие** — 2 шт.\n* **Помидоры свежие** — 2 шт.\n* **Листья салата** — небольшой пучок.\n* **Соль** — по вкусу.\n* **Масло оливковое** — по вкусу.\n\n### Приготовление\n1. Куриное филе нарежьте небольшими кусочками. Белый хлеб залейте молоком на несколько минут.\n2. Пропустите куриное филе и размокший хлеб через мясорубку. Добавьте яйцо, соль и перец, тщательно перемешайте.\n3. Сформируйте из фарша котлеты и обжарьте их на растительном масле с двух сторон до золотистой корочки.\n4. Картофель очистите, нарежьте кубиками и отварите в подсоленной воде до готовности.\n5. Слейте воду, добавьте молоко, сливочное масло и разомните картофель в пюре.\n6. Огурцы и помидоры нарежьте кубиками, листья салата порвите руками. Смешайте овощи, посолите и заправьте оливковым маслом.\n7. Подавайте куриные котлетки с картофельным пюре и овощным салатом. Приятного аппетита!", "right": "# Куриные котлетки для детей\n\n**Время приготовления:** 30 минут\n**Порций:** 4\n\n## Ингредиенты\n* Филе куриной грудки — 500 г;\n* Белый хлеб — 2 ломтика;\n* Молоко — 50 мл;\n* Яйцо — 1 шт.;\n* Мука — 2 ст. л.;\n* Соль — по вкусу;\n* Растительное масло — для жарки.\n\n## Приготовление\n1. Филе куриной грудки промойте, обсушите бумажным полотенцем и нарежьте небольшими кусочками.\n2. Ломтики белого хлеба залейте молоком на несколько минут, чтобы они размякли.\n3. Мясо и размоченный в молоке хлеб пропустите через мясорубку.\n4. Добавьте в фарш яйцо, муку, соль по вкусу и тщательно перемешайте.\n5. Сформируйте небольшие котлетки.\n6. На сковороде разогрейте растительное масло и обжарьте котлетки с обеих сторон до золотистой корочки."}, {"id": "cat_00", "prompt": "Предложи рецепт из раздела «Выпечка сладкая».", "a_left": true, "left": "### Рецепт: медовый пирог с орехами\n\n**Описание:** нежный и ароматный медовый пирог с добавлением орехов — идеальный выбор для чаепития. Хрустящие орехи прекрасно сочетаются со сладким мёдом, создавая гармоничный вкус.\n\n**Время приготовления:** 1 час 30 минут (без учёта времени на пропитку).\n\n**Количество порций:** 6–8.\n\n### Ингредиенты\n* мука пшеничная — 250 г;\n* мёд — 100 г;\n* сахар — 100 г;\n* яйцо куриное — 1 шт.;\n* масло сливочное — 70 г;\n* разрыхлитель теста — 1 ч. л.;\n* ванилин — щепотка;\n* соль — щепотка;\n* орехи (грецкие или другие) — 50 г.\n\n### Шаги приготовления\n1. Разогреть духовку до 180 °C. Подготовить форму для выпечки, смазать её маслом или застелить пергаментом.\n2. В глубокой миске смешать муку, разрыхлитель, ванилин и соль.\n3. В другой миске соединить мёд, сахар, растопленное сливочное масло и яйцо. Тщательно перемешать до однородности.\n4. Постепенно добавлять сухие ингредиенты в медовую смесь, замешивая тесто.\n5. Измельчить орехи и добавить их в тесто, равномерно распределяя по всей массе.\n6. Выложить тесто в подготовленную форму и разровнять поверхность.\n7. Выпекать в духовке около 30–40 минут, пока зубочистка, вставленная в центр пирога, не будет выходить чистой.\n8. Дать пирогу немного остыть в форме, затем переложить на решётку для полного охлаждения.", "right": "# Шарлотка с яблоками  \n\n**Описание:** нежная шарлотка с яблоками — это простой и вкусный десерт, который понравится всей семье. Яблоки придают выпечке приятную кислинку и аромат.  \n\n**Время приготовления:** 40–50 минут.  \n\n**Количество порций:** зависит от размера формы для выпечки, примерно 6–8 порций.  \n\n### Ингредиенты  \n* Яйца — 3 шт.;  \n* Сахар — 150 г;  \n* Мука — 150 г;  \n* Разрыхлитель теста — 1 ч. л.;  \n* Ванилин — щепотка;  \n* Яблоки — 300 г.  \n\n### Приготовление  \n1. Разогреть духовку до 180 °C. Подготовить форму для выпечки, смазать её маслом или застелить пергаментом.  \n2. Взбить яйца с сахаром до образования пены.  \n3. Постепенно добавить муку, смешанную с разрыхлителем и ванилином, аккуратно перемешивая.  \n4. Яблоки очистить от кожуры, удалить сердцевину и нарезать тонкими ломтиками.  \n5. Выложить яблоки в тесто и перемешать.  \n6. Перелить тесто в подготовленную форму.  \n7. Выпекать в духовке около 30–40 минут, пока зубочистка, вставленная в центр, не выйдет чистой.  \n8. Готовую шарлотку остудить, затем нарезать на порции и подавать к чаю.  \n\nПриятного аппетита!"}, {"id": "dish_17", "prompt": "Дай рецепт блюда «Торт Наполеон».", "a_left": true, "left": "### Торт «Наполеон»\n\n**Описание:** нежный слоёный торт с кремом из сгущённого молока и сливочного масла. Классический десерт, который порадует вас и ваших близких.\n\n**Время приготовления:** около 2 часов (не учитывая время охлаждения).\n\n**Количество порций:** зависит от размера торта (примерно 8–10 порций).\n\n### Ингредиенты\n* **Для коржей:**\n    * мука — 500 г;\n    * сливочное масло (холодное) — 200 г;\n    * вода холодная — 150 мл;\n    * уксус столовый 9% — 1 ч. л.;\n    * соль — щепотка.\n* **Для крема:**\n    * молоко — 500 мл;\n    * сахар — 150 г;\n    * яйцо — 1 шт.;\n    * ванильный сахар — 10 г;\n    * кукурузный крахмал — 3 ст. л.;\n    * сливочное масло (размягчённое) — 100 г.\n\n### Приготовление\n1. Для коржей просейте муку в большую миску. Добавьте нарезанное кубиками холодное сливочное масло, перетрите руками до состояния крошки.\n2. В холодной воде растворите уксус и добавьте к масляно-мучной крошке, быстро замесите тесто. Сформируйте шар, заверните в пищевую плёнку и уберите в холодильник минимум на 30 минут.\n3. Охлаждённое тесто раскатайте в тонкий пласт толщиной примерно 2 мм и вырежьте круг нужного диаметра. Обрезки теста снова раскатайте и используйте для следующего коржа.\n4. Выпекайте коржи в предварительно разогретой до 200 °C духовке около 15–20 минут до золотистого цвета. Повторите процесс с оставшимся тестом. Всего должно получиться 4–6 коржей.\n5. Для крема в небольшой кастрюле смешайте молоко, сахар, яйцо, ванильный сахар и крахмал. Перемешайте венчиком до однородности.\n6. Поставьте кастрюлю на средний огонь и, постоянно помешивая, доведите смесь до загустения. Снимите с огня и остудите.\n7. Размягчённое сливочное масло взбейте миксером до пышности, затем постепенно введите остывшую молочную смесь, продолжая взбивать.\n8. Соберите торт, промазывая каждый корж кремом. Верхний корж и бока также смажьте кремом.\n9. Уберите торт в холодильник минимум на 2 часа для пропитки.", "right": "# Торт «Наполеон»\n\n**Время приготовления:** 300 минут\n**Порций:** 8\n\n## Ингредиенты\n* мука пшеничная — количество зависит от объёма используемых других ингредиентов;\n* масло сливочное — 200 г;\n* яйцо куриное — количество зависит от рецепта;\n* ванильный сахар — количество зависит от рецепта;\n* уксус — 1,5 ст. л.;\n* сода — 3/4 ч. л.;\n* соль — 3/4 ч. л.;\n* сахар — 300 г;\n* молоко — количество зависит от рецепта;\n* арахис — 100 г;\n* маргарин — 150 г.\n\n## Приготовление\n1. Начните с теста для торта. Размягчите маргарин, оставив его в помещении на пару часов. Мягкий маргарин нарежьте кусочками.\n2. Тщательно руками разотрите маргарин с мукой. В центре маргарина с мукой сделайте углубление и добавьте молоко, соду с уксусом, соль, вбейте яйца и высыпьте ванильный сахар.\n3. Всё тщательно перемешайте и замесите тесто в виде кома. Затем поставьте тесто в холодильник на 1 час.\n4. После этого разрежьте тесто на 8–10 кусков, в зависимости от того, какой у вас противень.\n5. Каждый кусок раскатайте как можно тоньше.\n6. Раскатанный кусок выложите на противень и наколите тесто вилкой.\n7. Выпекайте коржи согласно инструкции вашей духовки.\n8. Масло для крема растопите на водяной бане.\n9. Пока растапливается масло, займитесь кремом. Яйца разотрите с мукой и сахаром до однородной массы, залейте молоком и поставьте варить на медленном огне, всё время помешивая, чтобы не подгорело, в конце добавьте ванилин, доведите до кипения и дайте этой массе остыть.\n10. Растопленное масло постепенно вливайте в остывший крем, всё время помешивая, после чего взбейте ещё раз.\n11. Тщательно смажьте кремом каждый слой и накройте следующим коржом."}, {"id": "cat_08", "prompt": "Предложи рецепт из раздела «Блюда из рыбы».", "a_left": false, "left": "# Рецепт: запечённая камбала с овощным соусом\n\n**Описание:** нежное и ароматное блюдо из рыбы с ярким вкусом. Запечённая камбала подаётся с аппетитным овощным соусом, который дополняет основное блюдо.\n\n**Время приготовления:** 1 час 20 минут.\n\n**Количество порций:** зависит от размера формы для запекания и желаемого количества порций. Ориентировочно на 4 порции.\n\n## Ингредиенты\n* Камбала — 3 штуки;\n* Помидор — 7–10 штук;\n* Лук репчатый — 1 штука;\n* Черемша — 30 грамм;\n* Масло оливковое — 4 столовые ложки;\n* Шафран;\n* Перец чёрный;\n* Перец красный жгучий;\n* Петрушка — 1 пучок;\n* Базилик — 1 пучок;\n* Чеснок — 4–5 зубчиков;\n* Лимон — 1 штука.\n\n## Приготовление\n1. Рыбу промыть, почистить и посолить.\n2. Смешать зелень (петрушку и базилик), цедру лимона, приправы (шафран, перец чёрный, перец красный жгучий), оливковое масло и измельчённый чеснок.\n3. В полученной смеси замариновать тушки рыбы на 1 час.\n4. Помидоры ошпарить и снять кожицу.\n5. Мелко нарезать лук, черемшу и томаты.\n6. Посолить, добавить сахар, потушить на сковороде с 1 столовой ложкой оливкового масла до полуготовности. Добавить половину стакана воды, уменьшить огонь и тушить до готовности.\n7. Рыбу по истечении времени выложить на противень и поставить в разогретую до 200 °C духовку на 20 минут.\n8. Подавать с овощным соусом и зеленью.\n\nПриятного аппетита!", "right": "### Рецепт: запечённая треска с лимоном и травами\n\n**Описание:** это простое и вкусное блюдо из трески, которое идеально подойдёт для семейного ужина или приёма гостей. Рыба запекается с лимоном и ароматными травами, что придаёт ей неповторимый вкус.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** 4.\n\n### Ингредиенты\n* Треска филе — 500 г.\n* Лимон — 1 шт.\n* Оливковое масло — 2 ст. л.\n* Чеснок — 2 зубчика.\n* Розмарин свежий — 1 веточка.\n* Тимьян свежий — 1 веточка.\n* Соль — по вкусу.\n* Чёрный перец молотый — по вкусу.\n\n### Шаги приготовления\n1. Разогрейте духовку до 200 °C.\n2. Филе трески промойте под холодной водой и обсушите бумажным полотенцем.\n3. Лимон нарежьте тонкими ломтиками.\n4. В небольшой миске смешайте оливковое масло, измельчённый чеснок, мелко нарезанный розмарин и тимьян. Добавьте соль и чёрный перец по вкусу.\n5. Полученной смесью тщательно смажьте филе трески со всех сторон.\n6. Выложите рыбу в форму для запекания. Вокруг разложите ломтики лимона.\n7. Запекайте в духовке около 20–25 минут, пока рыба не станет золотистой и легко отделяется вилкой.\n8. Подавайте горячим, украсив свежей зеленью."}, {"id": "dish_21", "prompt": "Напиши рецепт: Холодец", "a_left": false, "left": "# Холодец\n\n**Время приготовления:** 120 минут\n\n**Количество порций:** зависит от размера форм, в которых будет застывать холодец\n\n## Ингредиенты\n* Мясо (например, свинина или говядина) — 1,2 кг;\n* Чеснок — 5 зубчиков;\n* Соль — по вкусу;\n* Чёрный перец (молотый или горошком) — по вкусу.\n\n## Приготовление\n1. Мясо нарезать на небольшие кусочки для удобства варки.\n2. Залить мясо холодной водой, посолить по вкусу и поставить варить. Можно использовать скороварку — в ней варить 1,5 часа. Если варить в обычной кастрюле, то время нужно увеличить примерно вдвое.\n3. После варки мясо вынуть из бульона, отделить от костей и порезать. Кто-то может любить однородный холодец — тогда можно пропустить через мясорубку, но для сохранения волокон мяса лучше резать ножом.\n4. Бульон процедить через сито или марлю, чтобы удалить мелкие косточки и другие возможные примеси.\n5. Чеснок почистить и пропустить через пресс.\n6. Дать бульону закипеть и добавить туда чёрный перец (можно использовать смесь перцев) и чеснок, сразу же выключить, чтобы сохранить насыщенный вкус чеснока.\n7. Добавить нарезанное мясо в бульон и перемешать.\n8. Разлить бульон с мясом по формам и оставить застывать.", "right": "### Холодец\n\n**Описание:** холодец — это традиционное праздничное блюдо русской кухни, которое представляет собой застывший мясной бульон с кусочками мяса. Он отличается насыщенным вкусом и требует длительного времени для застывания.\n\n**Время приготовления:** около 6–8 часов (включая время для застывания).\n\n**Количество порций:** зависит от размера формы, в которой будет застывать холодец. Обычно получается 6–8 порций.\n\n### Ингредиенты\n* Мясо (говядина, свинина или курица) — 2 кг.\n* Вода — 3 л.\n* Лук репчатый — 1 шт.\n* Морковь — 1 шт.\n* Лавровый лист — 4–5 шт.\n* Чёрный перец горошком — 10–15 шт.\n* Соль — по вкусу.\n* Чеснок — 4–5 зубчиков (для подачи).\n\n### Шаги приготовления\n1. Подготовьте мясо: нарежьте его крупными кусками.\n2. В кастрюлю налейте воду и поставьте её на огонь. Когда вода закипит, добавьте мясо и убавьте огонь до минимума. Варите мясо примерно 2–3 часа, снимая пену.\n3. Добавьте в кастрюлю очищенные луковицу и морковь, лавровый лист, чёрный перец горошком и соль. Продолжайте варить ещё 1–2 часа.\n4. Проверьте готовность мяса: оно должно быть мягким и легко отделяться от кости. Если мясо готово, выключите огонь и дайте бульону немного остыть.\n5. Процедите бульон через сито или марлю, чтобы удалить все мелкие кусочки и специи. Мясо разберите на небольшие кусочки.\n6. Разложите кусочки мяса по формам или контейнерам. Залейте их процеженным бульоном.\n7. Поставьте формы с холодцом в холодильник для застывания на несколько часов (обычно требуется не менее 4–6 часов).\n8. Перед подачей на стол можно добавить измельчённый чеснок в каждую порцию холодца. Подавайте с горчицей, хреном или другими соусами по вкусу."}, {"id": "dish_16", "prompt": "Как приготовить «Шарлотка с яблоками»? Дай подробный рецепт.", "a_left": true, "left": "### Шарлотка с яблоками\n\n**Описание:** нежная шарлотка с ароматными яблоками — это прекрасный десерт к чаю. Лёгкая в приготовлении и всегда вкусная.\n\n**Время приготовления:** около 1 часа.\n\n**Количество порций:** зависит от размера формы для выпечки (примерно 6–8 порций).\n\n### Ингредиенты\n* Яйца — 4 шт.;\n* Сахар — 150 г;\n* Мука — 150 г;\n* Яблоки — 3–4 шт.;\n* Ванильный сахар — 1 ч. л.;\n* Разрыхлитель теста — 1 ч. л.;\n* Корица (по желанию) — щепотка.\n\n### Шаги приготовления\n1. Подготовьте форму для выпечки, смажьте её маслом или застелите пергаментной бумагой.\n2. Разогрейте духовку до 180 °C.\n3. Отделите белки от желтков. Белки взбейте миксером в пышную пену.\n4. Постепенно добавляйте сахар к белкам, продолжая взбивать до образования устойчивых пиков.\n5. Желтки смешайте с ванильным сахаром и слегка взбейте.\n6. Аккуратно введите желтковую массу в белковую, перемешивая снизу вверх.\n7. Просеянную муку смешайте с разрыхлителем и аккуратно введите в яичную смесь, снова перемешивая снизу вверх.\n8. Очистите яблоки от кожуры и сердцевины, нарежьте тонкими ломтиками.\n9. Добавьте нарезанные яблоки в тесто, перемешайте так, чтобы они равномерно распределились. При желании можно посыпать корицей.\n10. Вылейте тесто в подготовленную форму.\n11. Выпекайте в разогретой духовке примерно 30–40 минут, пока зубочистка, вставленная в центр, не будет выходить чистой.\n12. Дайте шарлотке немного остыть в форме, затем переложите на тарелку.\n13. Подавайте шарлотку тёплой или комнатной температуры.", "right": "# Шарлотка с яблоками\n\n**Время приготовления:** 60 минут\n**Порций:** 8\n\n## Ингредиенты\n* мука пшеничная — 1 стакан;\n* сахар — 1 стакан;\n* яйцо куриное — 4 шт.;\n* ванильный сахар — по вкусу;\n* яблоко — 4 шт.;\n* сливочное масло для смазывания формы.\n\n## Приготовление\n1. Подготовьте все необходимые ингредиенты.\n2. Отделите желтки от белков. Растереть желтки с сахаром и ванильным сахаром до получения белой массы, постепенно добавляя муку.\n3. В отдельной посуде взбить белки до плотной пены.\n4. Постепенно ввести белковую массу в желтковую.\n5. Очистить яблоки, удалить сердцевину. Нарезать средними кубиками.\n6. Смазать форму для выпечки сливочным маслом. Выложить яблоки ровным слоем на дно формы.\n7. Сверху на яблоки выложить тесто, равномерно распределить его по форме.\n8. Выпекать в духовке при температуре 180–200 °C около 40 минут до готовности.\n9. Приятного аппетита!"}, {"id": "dish_05", "prompt": "Дай рецепт блюда «Сельдь под шубой».", "a_left": false, "left": "# Салат «Сельдь под шубой»\n\n**Время приготовления:** 60 минут\n**Порций:** 8\n\n## Ингредиенты\n- Сельдь — 2 шт.;\n- Картофель — 5 шт.;\n- Лук репчатый — 1 шт.;\n- Морковь — 2 шт.;\n- Яйцо куриное — 3 шт.;\n- Свёкла — 2 шт.;\n- Майонез — 250 г;\n- Зелень для украшения.\n\n## Приготовление\n1. Отварить картофель, морковь и свёклу до готовности. Остудить овощи и очистить их.\n2. Сварить яйца вкрутую, остудить и очистить.\n3. Сельдь очистить от костей и кожи, нарезать небольшими кусочками.\n4. Лук очистить и нарезать мелкими кубиками.\n5. Овощи и яйца натереть на крупной тёрке.\n6. Выложить слои салата в следующей последовательности:\n    * первый слой — тёртый картофель, смазать майонезом;\n    * второй слой — сельдь;\n    * третий слой — лук, смазать майонезом;\n    * четвёртый слой — тёртая морковь, смазать майонезом;\n    * пятый слой — тёртые яйца, смазать майонезом;\n    * шестой слой — тёртая свёкла, смазать майонезом.\n7. Сверху салат можно украсить майонезом и зеленью.\n8. Дать салату настояться в холодильнике минимум 1 час перед подачей на стол.", "right": "### Сельдь под шубой\n\n**Описание:** слоёный салат из сельди с овощами и майонезом. Это классическое блюдо русской кухни, которое часто готовят на праздники.\n\n**Время приготовления:** 1 час 20 минут.\n\n**Количество порций:** зависит от размера формы для салата и аппетита едоков (примерно на 6–8 порций).\n\n### Ингредиенты\n* Селёдка слабосолёная — 300 г.\n* Картофель — 3 шт.\n* Морковь — 2 шт.\n* Свёкла — 2 шт.\n* Лук репчатый — 1 шт.\n* Яйца куриные — 3 шт.\n* Майонез — по вкусу.\n* Соль — по вкусу.\n* Чёрный перец молотый — по вкусу.\n\n### Приготовление\n1. Отварите картофель, морковь и свёклу до готовности. Остудите овощи и очистите их.\n2. Нарежьте лук мелкими кубиками и залейте его кипятком на несколько минут, чтобы убрать горечь. Затем слейте воду и промойте лук холодной водой.\n3. Очистите сельдь от костей и нарежьте её небольшими кусочками.\n4. Натрите картофель, морковь, свёклу и яйца на крупной тёрке в отдельные миски.\n5. Возьмите форму для салата и начните выкладывать ингредиенты слоями: сначала картофель, затем селёдку, сверху лук, немного майонеза, далее морковь, снова майонез, затем слой яиц, майонез, и наконец свёкла, также сдобренная майонезом. Каждый слой слегка утрамбовывайте ложкой или лопаткой.\n6. Посолите и поперчите каждый слой по вкусу.\n7. Поставьте салат в холодильник минимум на 1 час, чтобы он пропитался. Перед подачей можно украсить зеленью."}, {"id": "ingr_10", "prompt": "Придумай рецепт, в котором используются нут, чеснок и лимон.", "a_left": false, "left": "# Нут с чесноком и лимоном\n\n**Краткое описание:** блюдо представляет собой ароматный гарнир из нута с пикантной цитрусовой ноткой. Нут придаёт блюду насыщенность, а чеснок и лимон – яркий вкус.\n\n**Время приготовления:** 40–60 минут.\n\n**Количество порций:** зависит от размера сковороды или кастрюли, которые вы используете для приготовления блюда. Ориентировочно на 3–4 порции.\n\n### Ингредиенты\n* Нут — 350 г;\n* Чеснок — 2 зубчика;\n* Лимон — ½ шт.;\n* Оливковое масло — 2 ст. л.;\n* Соль — по вкусу;\n* Чёрный перец — по вкусу.\n\n### Приготовление\n1. Нут необходимо замочить на ночь в большом количестве воды — он сильно увеличится в размере.\n2. Утром воду слить, нут промыть несколько раз под струёй холодной воды.\n3. Разогреть сковороду с оливковым маслом на среднем огне. Измельчить чеснок и обжарить его до золотистого цвета.\n4. Добавить нут к чесноку и обжаривать, помешивая, несколько минут, пока нут слегка не позолотится и не начнёт источать приятный ореховый аромат.\n5. Переложить нут в кастрюлю, залить горячей водой так, чтобы она покрывала нут на 2–3 см. Довести до кипения, уменьшить огонь и варить под крышкой около 40–60 минут до мягкости нута.\n6. Выдавить сок из половины лимона и добавить его в кастрюлю за 5–10 минут до готовности нута. Посолить и поперчить по вкусу.\n7. Подавать горячим, украсив свежей зеленью по желанию.", "right": "### Нут с чесноком и лимоном\n\n**Описание:** это ароматное и сытное блюдо из нута, которое станет отличным дополнением к вашему столу. Чеснок придаёт пикантность, а лимон — свежесть и лёгкость.\n\n**Время приготовления:** около 1 часа 20 минут.\n\n**Количество порций:** 4–5.\n\n### Ингредиенты\n* Нут — 200 г;\n* Вода — 600 мл;\n* Соль — по вкусу;\n* Чеснок — 3 зубчика;\n* Лимон — ½ шт.;\n* Оливковое масло — 2 ст. л.;\n* Свежая зелень (например, петрушка или кинза) — для подачи.\n\n### Шаги приготовления\n1. Промойте нут под проточной водой. Переложите его в кастрюлю и залейте водой. Оставьте на 1 час для замачивания.\n2. После замачивания переложите нут обратно в кастрюлю, добавьте соль по вкусу и залейте свежей водой так, чтобы она покрывала нут примерно на 5 см. Варите на среднем огне около 40–50 минут до мягкости.\n3. Пока варится нут, очистите чеснок и мелко нарежьте его.\n4. Разогрейте оливковое масло на сковороде. Обжарьте нарезанный чеснок на среднем огне до золотистого цвета. Это займёт несколько минут.\n5. Когда нут будет готов, слейте лишнюю воду и переложите его на сковороду с обжаренным чесноком. Перемешайте.\n6. Выдавите сок половины лимона прямо на нут. Перемешайте ещё раз. Попробуйте на вкус и при необходимости добавьте немного соли.\n7. Подавайте готовое блюдо, украсив свежей зеленью."}, {"id": "ingr_03", "prompt": "У меня есть: картофель, грибы и лук. Что можно приготовить? Напиши рецепт.", "a_left": false, "left": "# Жареная картошка с грибами и луком\n\n**Краткое описание:** это простое и сытное блюдо, которое отлично подойдёт для обеда или ужина. Вкусный аромат жареного лука и грибов прекрасно дополнит нежный картофель.\n\n**Время приготовления:** около 30–40 минут.\n\n**Количество порций:** зависит от размера сковороды и желаемого количества порций, например, на 4 порции.\n\n## Ингредиенты\n* Картофель — 500 г;\n* Лук репчатый — 1 шт.;\n* Грибы — 400 г;\n* Масло растительное — по вкусу;\n* Соль — по вкусу;\n* Лавровый лист — 1–2 шт.\n\n## Приготовление\n1. Очистите и нарежьте лук кубиками.\n2. Разогрейте сковороду с растительным маслом и обжарьте лук до золотистого цвета.\n3. Крупно (но не очень мелко) нарежьте грибы и добавьте их к обжаренному луку. Жарьте, пока грибы не выпустят сок, затем продолжайте жарить до испарения сока.\n4. Нарежьте соломкой картофель.\n5. Добавьте нарезанный картофель к грибам и луку, перемешайте. Накройте крышкой и оставьте на среднем огне, периодически помешивая. Не солите картошку сразу, чтобы она не превратилась в кашу.\n6. Когда картофель почти готов, посолите по вкусу и добавьте лавровый лист. Перемешайте и жарьте до готовности.\n\nПриятного аппетита!", "right": "### Картофельно-грибная запеканка\n\n**Описание:** это вкусное и сытное блюдо, которое понравится всей семье. Запеканка из картофеля и грибов под золотистой корочкой.\n\n**Время приготовления:** 1 час.\n\n**Количество порций:** 4–6.\n\n### Ингредиенты\n* Картофель — 800 г;\n* Грибы (например, шампиньоны) — 300 г;\n* Лук репчатый — 1 шт.;\n* Масло сливочное — 50 г;\n* Сыр твёрдый — 100 г;\n* Сливки (20%) — 100 мл;\n* Мука пшеничная — 2 ст. л.;\n* Соль — по вкусу;\n* Перец чёрный молотый — по вкусу;\n* Специи (по желанию) — по вкусу.\n\n### Шаги приготовления\n1. Очистите картофель и нарежьте его тонкими ломтиками или кружочками.\n2. Грибы промойте, обсушите и нарежьте пластинками.\n3. Лук очистите и нарежьте мелкими кубиками.\n4. Разогрейте духовку до 180 °C.\n5. В форме для запекания распределите слой картофеля, затем слой грибов и лука. Повторяйте слои, пока не закончатся ингредиенты.\n6. Растопите сливочное масло и смешайте его со сливками, мукой, солью, перцем и специями. Полученным соусом залейте содержимое формы.\n7. Твёрдый сыр натрите на крупной тёрке и посыпьте сверху.\n8. Накройте форму фольгой и поставьте в разогретую духовку на 30–40 минут. Затем снимите фольгу и дайте запеканке подрумяниться ещё 10–15 минут.\n9. Готовую запеканку достаньте из духовки и дайте немного остыть перед подачей на стол."}, {"id": "cat_10", "prompt": "Предложи рецепт из раздела «Соусы».", "a_left": false, "left": "# Томатный соус\n\n**Время приготовления:** 20 минут\n**Порций:** 4\n\n## Ингредиенты\n- Помидоры — 400 г;\n- Репчатый лук — 1 шт.;\n- Чеснок — 2 зуб.;\n- Оливковое масло — 2 ст. л.;\n- Томатная паста — 2 ст. л.;\n- Сахар — 1 ч. л.;\n- Соль — по вкусу;\n- Чёрный перец молотый — по вкусу;\n- Базилик свежий — небольшой пучок.\n\n## Приготовление\n1. Помидоры обдать кипятком, снять кожицу и нарезать кубиками.\n2. Лук очистить и мелко нарезать.\n3. Чеснок очистить и измельчить.\n4. Разогреть оливковое масло на сковороде, обжарить лук до прозрачности.\n5. Добавить чеснок и обжаривать ещё пару минут.\n6. Положить томатную пасту, сахар, соль и чёрный перец. Перемешать и готовить 2–3 минуты.\n7. Добавить помидоры, всё хорошо перемешать и тушить на медленном огне 15 минут.\n8. Мелко нарезать базилик и добавить в соус за пару минут до готовности.\n9. Снять с огня и дать соусу немного остыть. Подавать можно тёплым или холодным.", "right": "### Рецепт соуса песто\n\n**Описание:** ароматный соус песто идеально подходит для пасты, салатов или как добавка к различным блюдам. Его свежий вкус и яркий аромат сделают ваше блюдо незабываемым.\n\n**Время приготовления:** 10 минут.\n\n**Количество порций:** зависит от объёма посуды, в которой вы готовите соус, обычно хватает на несколько порций.\n\n### Ингредиенты\n* Базилик свежий — 50 г.\n* Кедровые орехи — 30 г.\n* Пармезан (или другой твёрдый сыр) — 30 г.\n* Чеснок — 2 зубчика.\n* Оливковое масло extra virgin — 70 мл.\n* Соль — по вкусу.\n* Перец чёрный молотый — по вкусу.\n\n### Шаги приготовления\n1. Подготовьте все ингредиенты. Листья базилика тщательно промойте и обсушите бумажным полотенцем. Чеснок очистите.\n2. В ступке или блендере измельчите кедровые орехи до состояния крошки.\n3. Добавьте чеснок и продолжайте измельчать.\n4. Натрите пармезан на мелкой тёрке и добавьте к орехам и чесноку.\n5. Постепенно вливайте оливковое масло, продолжая измельчать смесь до получения однородной консистенции.\n6. Посолите и поперчите по вкусу. Попробуйте соус и при необходимости скорректируйте количество соли и перца.\n7. Переложите готовый соус в удобную посуду и подавайте к столу."}, {"id": "dish_12", "prompt": "Напиши рецепт: Бефстроганов", "a_left": true, "left": "### Бефстроганов\n\n**Описание:** бефстроганов — это классическое блюдо русской кухни, представляющее собой мелко нарезанные кусочки говядины в сметанном соусе. Блюдо отличается нежной текстурой и насыщенным вкусом.\n\n**Время приготовления:** 40–50 минут.\n\n**Количество порций:** зависит от размера сковороды и аппетита едоков (примерно на 4 порции).\n\n### Ингредиенты\n* Говядина (вырезка или лопатка) — 500 г.\n* Лук репчатый — 1 шт. (среднего размера).\n* Мука пшеничная — 2 ст. л.\n* Сметана (жирностью не менее 20%) — 150 мл.\n* Томатная паста — 1 ст. л.\n* Вода — 100 мл.\n* Соль — по вкусу.\n* Чёрный перец (молотый) — по вкусу.\n* Лавровый лист — 2 шт.\n* Растительное масло — для жарки.\n\n### Шаги приготовления\n1. Нарежьте говядину тонкими полосками длиной около 3–4 см.\n2. Очистите лук и нарежьте его полукольцами.\n3. Разогрейте сковороду с растительным маслом на среднем огне.\n4. Обжарьте лук до золотистого цвета, затем добавьте мясо и жарьте, помешивая, до золотистой корочки.\n5. Присыпьте мясо мукой и перемешайте.\n6. Добавьте сметану, томатную пасту, воду, соль, перец и лавровый лист. Перемешайте все ингредиенты.\n7. Уменьшите огонь и тушите под крышкой примерно 20–30 минут, пока мясо не станет мягким.\n8. Подавайте бефстроганов с картофельным пюре, макаронами или рисом.", "right": "# Бефстроганов\n\n**Время приготовления:** 60 минут\n**Количество порций:** зависит от размера сковороды и предпочтений (например, 4 порции)\n\n## Ингредиенты\n- Говядина — 500 г\n- Репчатый лук — 1–2 шт.\n- Пшеничная мука — 1–2 ст. л.\n- Сметана — 150 г\n- Вода или бульон — 150 мл\n- Соль — по вкусу\n- Чёрный перец — по вкусу\n\n## Приготовление\n1. Мясо вымойте, обсушите бумажным полотенцем и нарежьте небольшими кусочками размером примерно 1–2 сантиметра.\n2. Очистите лук и нарежьте его полукольцами.\n3. Разогрейте сковороду с растительным маслом и обжарьте кусочки говядины до золотистой корочки. Переложите мясо в кастрюлю или казан.\n4. В той же сковороде обжарьте нарезанный лук до золотистого цвета.\n5. К луку добавьте муку, тщательно перемешайте и обжаривайте ещё несколько секунд.\n6. Добавьте в сковороду сметану, затем влейте воду или бульон. Перемешайте.\n7. Посолите и поперчите смесь по вкусу. Доведите всё до кипения.\n8. Вылейте соус в кастрюлю с мясом и поставьте на медленный огонь. Тушите блюдо до готовности мяса, около 20–30 минут."}, {"id": "dish_02", "prompt": "Дай рецепт блюда «Солянка мясная сборная».", "a_left": true, "left": "### Солянка мясная сборная\n\n**Описание:** сытный и ароматный суп с богатым вкусом, который понравится всей семье. В солянке гармонично сочетаются несколько видов мяса и копчёности, придающие блюду неповторимый аромат.\n\n**Время приготовления:** около 1,5 часов.\n\n**Количество порций:** 6–8.\n\n### Ингредиенты\n* Вода — 3 л.\n* Говядина (или другой вид мяса, например, свинина или курица) — 400 г.\n* Копчёные рёбрышки — 200 г.\n* Колбаса варёная — 200 г.\n* Сосиски — 200 г.\n* Луковица — 1 шт.\n* Морковь — 1 шт.\n* Томатная паста — 2 ст. л.\n* Оливки без косточек — 1 банка.\n* Маслины без косточек — 1 банка.\n* Лимон — ½ шт.\n* Соль — по вкусу.\n* Чёрный перец горошком — 5–7 шт.\n* Лавровый лист — 2–3 шт.\n* Растительное масло — для жарки.\n* Зелень (укроп, петрушка) — для подачи.\n* Сметана — для подачи.\n\n### Приготовление\n1. Налейте воду в кастрюлю и поставьте её на огонь. Когда вода закипит, добавьте мясо и копчёные рёбрышки. Варите на медленном огне около 40 минут.\n2. Пока варится бульон, нарежьте лук мелкими кубиками, морковь — тонкой соломкой или натрите на крупной тёрке.\n3. Обжарьте лук и морковь на растительном масле до золотистого цвета.\n4. Добавьте томатную пасту к овощам и перемешайте. Тушите ещё 5–7 минут.\n5. Выньте из бульона мясо и рёбрышки, нарежьте их небольшими кусочками. Верните мясо в бульон.\n6. Добавьте в бульон обжаренные овощи с томатной пастой.\n7. Нарежьте колбасу и сосиски кружочками и добавьте в суп.\n8. Откройте банки с оливками и маслинами, слейте жидкость и добавьте их в суп.\n9. Посолите суп по вкусу, добавьте чёрный перец горошком и лавровый лист. Варите ещё 10–15 минут.\n10. Выдавите сок половины лимона в суп за пару минут до готовности. Это придаст солянке кислинку.\n11. Дайте супу настояться под крышкой после выключения огня. Подавайте солянку горячей, украсив зеленью и добавив сметану по вкусу.", "right": "# Солянка сборная мясная\n\n**Время приготовления:** около 2 часов.\n\n**Количество порций:** зависит от размера кастрюли или выбранной посуды для варки супа.\n\n## Ингредиенты\n* Говядина — 400 г;\n* Морковь — 1 шт.;\n* Лук репчатый — 2–4 шт.;\n* Томатная паста — 3 ст. л.;\n* Оливки зелёные — 1 банка;\n* Колбаса — 250 г;\n* Огурец солёный — 3 шт.;\n* Картофель — 4 шт.;\n* Соль — по вкусу;\n* Зелень — 1 пучок;\n* Лавровый лист — 2 шт.;\n* Чёрный перец (молотый) — по вкусу;\n* Каперсы — 1 ст. л.\n\n## Приготовление\n1. Поставьте варить бульон. Для этого положите говядину в кастрюлю, залейте водой и поставьте на огонь. Снимите пену. Через час начинайте готовить зажарку (брез). Мелко нарежьте лук. Его должно быть много, и пассируйте его на сковороде.\n2. На крупной тёрке измельчите морковь и отправьте её к луку. Пока овощи тушатся, нарежьте помидоры и добавьте к моркови.\n3. Достаньте мясо из бульона, нарежьте и отправьте обратно в бульон. Нарежьте картофель и также отправьте в бульон. Картофель должен свариться к моменту готовности зажарки. Посолите бульон.\n4. Когда овощи потушились, добавьте к ним томатную пасту, нарезанные соломкой огурцы. Добавьте маслины без косточек и сок от маслин.\n5. Отправьте в бульон нарезанную соломкой колбасу.\n6. Перемешайте все ингредиенты в кастрюле и дайте супу покипеть ещё несколько минут. Попробуйте на соль и перец, при необходимости добавьте специи.\n7. Перед подачей посыпьте солянку зеленью."}, {"id": "dish_10", "prompt": "Как приготовить «Голубцы»? Дай подробный рецепт.", "a_left": true, "left": "### Голубцы\n\n**Описание:** нежные голубцы с мясной начинкой в томатном соусе. Это блюдо станет отличным дополнением к семейному ужину или праздничному столу.\n\n**Время приготовления:** 1 час 30 минут.\n\n**Количество порций:** зависит от размера капустных листьев и ваших предпочтений (примерно на 4–6 порций).\n\n### Ингредиенты\n* Капуста — 1 кочан;\n* Фарш (смешанный свиной и говяжий) — 500 г;\n* Рис — 100 г;\n* Лук репчатый — 2 шт.;\n* Морковь — 2 шт.;\n* Томатная паста — 2 ст. л.;\n* Вода или бульон — 200 мл;\n* Растительное масло — для жарки;\n* Соль — по вкусу;\n* Чёрный перец молотый — по вкусу;\n* Лавровый лист — 2 шт.;\n* Паприка молотая — по вкусу;\n* Чеснок — 3 зубчика;\n* Сахар — щепотка (по желанию).\n\n### Приготовление\n1. Подготовьте капусту: удалите верхние листья, вырежьте кочерыжку и отварите капусту до мягкости в подсоленной воде (около 10–15 минут). Затем аккуратно разберите капусту на листья.\n2. Отварите рис до полуготовности.\n3. Очистите лук и морковь. Мелко нарежьте одну луковицу и натрите морковь на крупной тёрке. Обжарьте их на растительном масле до золотистого цвета.\n4. В фарш добавьте мелко нарезанный второй лук, отварной рис, соль, чёрный перец, паприку и измельчённый чеснок. Тщательно перемешайте.\n5. На подготовленные капустные листья выложите немного фарша и заверните конвертиком.\n6. Разогрейте растительное масло на сковороде. Выложите голубцы и обжарьте их с двух сторон до золотистой корочки.\n7. В отдельной посуде смешайте томатную пасту с водой или бульоном, добавьте сахар и хорошо перемешайте. Полученным соусом залейте голубцы в сковороде.\n8. Добавьте лавровый лист и тушите под крышкой на медленном огне около 20–30 минут.", "right": "# Голубцы\n\n**Время приготовления:** 70 минут\n**Порций:** 8\n\n## Ингредиенты\n* Фарш мясной — 400 г;\n* капуста белокочанная;\n* лук репчатый — 2 шт.;\n* морковь — 1 шт.;\n* рис — 50 г;\n* соль — по вкусу;\n* перец чёрный — по вкусу;\n* сметана — 1 ст. л.;\n* томатная паста — 2 ст. л.;\n* вода — 500 мл.\n\n## Приготовление\n1. Морковь натереть на крупной тёрке, лук нарезать среднего размера.\n2. Удалить кочерыжку у капусты и положить в кастрюлю с кипятком. Варить до тех пор, пока верхние листья капусты не будут отделяться. Отделившиеся листья выложить на тарелку.\n3. Удалить у капусты толстую жилку при помощи ножа.\n4. Обжарить лук с морковью.\n5. Фарш посолить и поперчить.\n6. Добавить сырой рис и обжаренные овощи.\n7. Всё перемешать.\n8. Выложить немного фарша на капустный лист и завернуть его конвертиком.\n9. Нашинковать крупно капусту.\n10. Смешать сметану и томатную пасту, посолить, поперчить и добавить воды.\n11. Всё перемешать.\n12. В кастрюлю выложить нашинкованную капусту. Она нужна для того, чтобы голубцы не пригорели.\n13. На капусту выкладываем голубцы.\n14. Поливаем сверху приготовленным соусом.\n15. Накрываем сверху тарелкой и закрываем крышкой.\n16. Тушить на медленном огне 1 час.\n17. Тарелка нужна для того, чтобы голубцы приготовились равномерно и лежали плотно друг к другу.\n18. Приятного аппетита!"}, {"id": "dish_22", "prompt": "Как приготовить «Рассольник»? Дай подробный рецепт.", "a_left": false, "left": "# Рассольник\n\n**Описание:** традиционный русский суп с солёными огурцами, который отличается насыщенным вкусом и ароматом.\n\n**Время приготовления:** около 1 часа.\n\n**Количество порций:** зависит от объёма кастрюли.\n\n### Ингредиенты\n* Солёные огурцы — 300 г;\n* Репчатый лук — 150 г;\n* Морковь — 150 г;\n* Картошка — 300 г;\n* Перловка — 100 г (по желанию);\n* Растительное масло — 2 ст. л.;\n* Томатная паста — 1–2 ст. л.;\n* Лавровый лист — 1–2 шт.;\n* Чёрный перец горошком — 3–5 шт.;\n* Соль — по вкусу;\n* Вода — примерно 2 литра;\n* Зелень (укроп или петрушка) — для подачи.\n\n### Приготовление\n1. Подготовьте все необходимые ингредиенты.\n2. Перловку промойте и отварите до готовности согласно инструкции на упаковке. Это может занять некоторое время, поэтому начните с неё.\n3. Очистите и нарежьте мелкими кубиками лук.\n4. Морковь натрите на крупной тёрке.\n5. Картошку очистите и нарежьте небольшими кубиками.\n6. На разогретом растительном масле обжарьте лук до прозрачности. Затем добавьте морковь и жарьте ещё несколько минут.\n7. Добавьте томатную пасту, перемешайте и тушите пару минут.\n8. Переложите зажарку в кастрюлю, добавьте воду, доведите до кипения.\n9. Когда вода закипит, добавьте нарезанную картошку и перловку.\n10. Солёные огурцы нарежьте мелкими кубиками или соломкой и также добавьте в кастрюлю.\n11. Посолите по вкусу, добавьте лавровый лист и чёрный перец горошком.\n12. Варите на медленном огне до готовности картошки и перловки (примерно 20–25 минут).\n13. Попробуйте суп на вкус и при необходимости добавьте ещё соли или специй.\n14. Подавайте рассольник, посыпав свежей зеленью.", "right": "### Рассольник\n\n**Описание:** рассольник — это традиционный русский суп, который отличается насыщенным вкусом и ароматом. Он готовится на основе бульона с добавлением солёных огурцов, перловой крупы и овощей.\n\n**Время приготовления:** около 1,5–2 часов.\n\n**Количество порций:** зависит от объёма кастрюли, например, из указанного количества ингредиентов получается примерно 6–8 порций.\n\n### Ингредиенты\n* Вода — 3 л;\n* Мясо (например, говядина или курица) — 400 г;\n* Перловая крупа — 100 г;\n* Картофель — 4 шт.;\n* Морковь — 1 шт.;\n* Репчатый лук — 1 шт.;\n* Солёные огурцы — 3–4 шт.;\n* Огуречный рассол — по вкусу;\n* Томатная паста — 2 ст. л.;\n* Растительное масло — для жарки;\n* Лавровый лист — 2 шт.;\n* Чёрный перец горошком — 5–7 шт.;\n* Соль — по вкусу;\n* Зелень (укроп, петрушка) — для подачи.\n\n### Приготовление\n1. Подготовьте все необходимые ингредиенты. Мясо нарежьте небольшими кусочками.\n2. В кастрюлю налейте воду и положите мясо. Доведите до кипения, снимите пену и варите на медленном огне около 1 часа.\n3. Пока варится бульон, промойте перловую крупу несколько раз в холодной воде. Затем добавьте её в бульон и варите ещё 20 минут.\n4. Очистите картофель, морковь и репчатый лук. Нарежьте картофель кубиками, морковь — соломкой или кружочками, а лук — мелкими кубиками.\n5. Обжарьте лук и морковь на растительном масле до золотистого цвета. Добавьте томатную пасту и перемешайте.\n6. Нарежьте солёные огурцы кубиками и добавьте их к луку и моркови. Тушите всё вместе 5–7 минут.\n7. Добавьте обжаренные овощи в бульон, затем влейте огуречный рассол по вкусу. Посолите, поперчите, добавьте лавровый лист и варите ещё 10–15 минут.\n8. Попробуйте рассольник на вкус и при необходимости добавьте соль или специи.\n9. Снимите рассольник с огня, дайте ему настояться под крышкой 10–15 минут и подавайте горячим, посыпав зеленью."}, {"id": "dish_20", "prompt": "Дай рецепт блюда «Пирожки с капустой».", "a_left": true, "left": "### Пирожки с капустой\n\n**Описание:** нежные пирожки с сочной капустной начинкой, которые станут отличным дополнением к чаю или основным блюдом на обед.\n\n**Время приготовления:** около 1 часа 20 минут (без учёта времени на расстойку теста).\n\n**Количество порций:** зависит от размера пирожков, примерно 8–10 штук.\n\n### Ингредиенты\n* **Для теста:**\n    * мука пшеничная — 500 г;\n    * вода тёплая — 250 мл;\n    * дрожжи сухие быстродействующие — 7 г;\n    * сахар — 1 ст. л.;\n    * соль — 0,5 ч. л.;\n    * растительное масло — 3 ст. л.\n* **Для начинки:**\n    * капуста белокочанная — 400 г;\n    * лук репчатый — 1 шт.;\n    * морковь — 1 шт.;\n    * масло растительное — для жарки;\n    * соль, перец чёрный молотый — по вкусу;\n    * лавровый лист — 1–2 шт.;\n    * томатная паста — 1 ст. л. (по желанию).\n\n### Приготовление\n1. В тёплой воде растворите дрожжи, добавьте сахар и соль. Перемешайте.\n2. Постепенно вводите муку, замешивая тесто. Когда тесто станет упругим, добавьте растительное масло и продолжайте месить до однородности.\n3. Переложите тесто в смазанную маслом миску, накройте полотенцем или плёнкой и оставьте в тёплом месте для подъёма на 40–60 минут.\n4. Пока тесто подходит, приготовьте начинку. Капусту мелко нашинкуйте, лук нарежьте кубиками, морковь натрите на крупной тёрке.\n5. Обжарьте лук и морковь на растительном масле до золотистого цвета. Добавьте капусту, перемешайте и тушите под крышкой на среднем огне 15–20 минут.\n6. Приправьте солью, перцем, добавьте томатную пасту и лавровый лист, перемешайте и тушите ещё 5–7 минут. Снимите с огня и остудите.\n7. Подошедшее тесто обомните и разделите на равные части. Каждую часть раскатайте в лепёшку, в центр положите начинку и защипните края.\n8. Сформируйте пирожки и выложите их на противень, застеленный пергаментом. Накройте полотенцем и оставьте на 15–20 минут для расстойки.\n9. Разогрейте духовку до 180 °C и выпекайте пирожки 20–25 минут до золотистой корочки.", "right": "# Пирожки с капустой  \n\n## Ингредиенты  \n* Пшеничная мука — количество зависит от объёма других ингредиентов и консистенции теста;  \n* Маргарин — 200 г;  \n* Яйцо куриное — 1 шт.;  \n* Сахар — 1 ст. л.;  \n* Соль — 0,5 ч. л.;  \n* Дрожжи — 2 ч. л.;  \n* Молоко — 1/2 стакана;  \n* Капуста белокочанная;  \n* Сливочное масло — 2 ст. л.;  \n* Растительное масло — 2 ст. л.;  \n* Соль — по вкусу;  \n* Чёрный перец — по вкусу.  \n\n## Приготовление  \n1. Просейте муку в глубокую миску, смешайте с дрожжами.  \n2. Добавьте маргарин комнатной температуры кусочками и разотрите руками в однородную крошку.  \n3. Яйцо с сахаром взбейте в стакане.  \n4. Добавьте соль и долейте воду доверху.  \n5. Частями влейте содержимое стакана в мучную смесь.  \n6. Перемешивая рукой, замесите мягкое эластичное тесто, заверните его в плёнку и уберите в морозильник на 30 минут.  \n7. Капусту нашинкуйте. В глубокой сковороде растопите масло, разогрейте сковороду, выложите капусту и на сильном огне обжарьте её минут 6–8, затем посолите, поперчите, добавьте молоко и потушите капусту ещё минут 5–7. Остудите.  \n8. Разделите готовое тесто на длинные жгуты, а затем на кусочки величиной с яйцо. Раскатайте в кружки, положите начинку, края защипайте верёвочкой.  \n9. Выложите пирожки на противень и поставьте на расстойку на 20–25 минут.  \n10. Затем смажьте пирожки взбитым яйцом и выпекайте при 200 °С в течение примерно 20–25 минут, пока они красиво не зарумянятся.  \n11. Выньте, выложите на блюдо и накройте салфеткой на 10–15 минут."}, {"id": "dish_15", "prompt": "Напиши рецепт: Драники", "a_left": true, "left": "### Драники\n\n**Описание:** драники — это популярное блюдо белорусской кухни, представляющее собой оладьи из тёртого картофеля. Они имеют золотистую корочку и нежную текстуру внутри. Подаются горячими со сметаной, сливочным маслом или другими добавками по вкусу.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** зависит от размера сковороды и желаемого количества драников. Обычно получается около 6–8 штук среднего размера.\n\n### Ингредиенты\n* Картофель — 500 г;\n* Лук репчатый — 1 шт.;\n* Мука пшеничная — 2 ст. л.;\n* Яйцо куриное — 1 шт.;\n* Соль — по вкусу;\n* Перец чёрный молотый — по вкусу;\n* Масло растительное для жарки.\n\n### Приготовление\n1. Очистите картофель и лук. Натрите их на мелкой тёрке.\n2. Отожмите натёртый картофель и лук руками, чтобы удалить лишний сок.\n3. В миске смешайте картофельную массу, муку, яйцо, соль и перец. Хорошо перемешайте все ингредиенты до однородной консистенции.\n4. Разогрейте сковороду на среднем огне и добавьте растительное масло.\n5. Выкладывайте картофельную смесь на сковороду ложкой, формируя оладьи.\n6. Жарьте драники с каждой стороны до золотистой корочки, примерно по 2–3 минуты с каждой стороны.\n7. Готовые драники выкладывайте на бумажное полотенце, чтобы удалить излишки масла.\n8. Подавайте драники горячими со сметаной, сливочным маслом, зеленью или другими добавками по вкусу.", "right": "# Драники\n\n**Время приготовления:** 30 минут\n**Количество порций:** 4\n\n## Ингредиенты\n- Картофель — 1 кг;\n- Яйцо куриное — 2 шт.;\n- Мука пшеничная — 3–4 ст. л.;\n- Соль — по вкусу;\n- Перец чёрный молотый — по вкусу;\n- Масло растительное — для жарки;\n- Зелень (укроп или петрушка) — по желанию.\n\n## Приготовление\n1. Очистите картофель и натрите его на крупной тёрке. Сразу выложите натёртый картофель в сито или дуршлаг, чтобы избавиться от лишнего сока. Тщательно отожмите картошку.\n2. В миску с картофелем добавьте яйца, муку, соль и перец. Всё хорошо перемешайте до однородности.\n3. Разогрейте сковороду на среднем огне и налейте немного растительного масла.\n4. Выкладывайте картофельную массу на сковороду ложкой, формируя оладьи. Жарьте драники с обеих сторон до золотистой корочки.\n5. Готовые драники можно подавать со сметаной, зеленью или любым другим соусом по вашему вкусу."}, {"id": "ingr_12", "prompt": "У меня есть: кефир, мука и сода. Что можно приготовить? Напиши рецепт.", "a_left": true, "left": "### Пышные оладьи на кефире\n\n**Описание:** нежные и пышные оладьи — идеальный завтрак или перекус. Они мягкие внутри и имеют золотистую корочку снаружи. Подаются обычно со сметаной, мёдом или джемом.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** зависит от размера оладьев, примерно 6–8 штук среднего размера.\n\n### Ингредиенты\n* Кефир — 250 мл.\n* Мука — 180 г.\n* Сода — 0,5 ч. л.\n* Сахар — 2 ст. л. (по вкусу).\n* Соль — щепотка.\n* Яйцо — 1 шт. (по желанию для более нежной текстуры).\n\n### Шаги приготовления\n1. В глубокой миске смешайте кефир с содой и оставьте на несколько минут, чтобы произошла реакция (кефир начнёт пузыриться).\n2. Добавьте яйцо (если используете), сахар, соль и хорошо перемешайте.\n3. Постепенно вводите муку, постоянно помешивая, чтобы избежать образования комочков.\n4. Разогрейте сковороду на среднем огне и смажьте её небольшим количеством масла.\n5. Выливайте тесто небольшими порциями на сковороду и обжаривайте оладьи с каждой стороны до золотистого цвета.\n6. Готовые оладьи выложите на тарелку и подавайте горячими. Приятного аппетита!", "right": "# Пышные оладьи на кефире\n\n**Время приготовления:** около 40 минут.\n**Количество порций:** зависит от размера сковороды и ваших предпочтений.\n\n### Ингредиенты\n* Кефир — 0,5 л;\n* Яйцо куриное — 1 шт.;\n* Сахар — 1,5 ст. л.;\n* Соль — 1/3 ч. л.;\n* Мука пшеничная — количество зависит от консистенции теста (смотреть по густоте);\n* Сода — 0,5 ч. л.;\n* Масло растительное — для жарки.\n\n### Приготовление\n1. Достаньте кефир из холодильника заранее, чтобы он был комнатной температуры.\n2. В миску вылейте кефир, добавьте яйцо, соль и сахар. Перемешайте. Для удобства можно воспользоваться миксером.\n3. Просейте муку и добавьте её в миску вместе с содой.\n4. Тщательно перемешайте. Обычно соду добавляют в кефир для гашения, но в этом рецепте нужно добавлять её именно с мукой.\n5. Оставьте тесто на полчаса, чтобы произошла реакция кефира с содой. За это время на поверхности теста должны появиться пузырьки.\n6. Нагрейте растительное масло на сковороде.\n7. Возьмите тесто ложкой с края миски, стараясь не перемешивать его лишний раз, и выложите аккуратные порции на сковороду.\n8. Обжаривайте оладьи на среднем огне с каждой стороны до золотистой корочки.\n9. Подавайте оладьи горячими, можно со сметаной, мёдом, вареньем или просто так.\n\nПриятного аппетита!"}, {"id": "cat_02", "prompt": "Хочу приготовить что-нибудь из категории «Салаты», повод: на праздничный стол. Напиши рецепт.", "a_left": true, "left": "### Салат «Цезарь» с курицей\n\n**Описание:** этот салат — классический пример праздничного блюда. Хрустящие листья салата, нежнейшая курица, ароматные сухарики и пикантный соус создают гармоничный вкус.\n\n**Время приготовления:** 30–40 минут (не считая времени подготовки ингредиентов).\n\n**Количество порций:** 4–6.\n\n### Ингредиенты\n* Куриное филе — 200 г.\n* Листья салата — 1 пучок.\n* Белый хлеб — 100 г.\n* Сыр пармезан — 50 г.\n* Яйца — 2 шт.\n* Оливковое масло — 3 ст. л.\n* Чеснок — 1 зубчик.\n* Горчица дижонская — 1 ч. л.\n* Лимонный сок — 1 ст. л.\n* Анчоусы — 50 г (по желанию).\n* Соль, перец — по вкусу.\n\n### Шаги приготовления\n1. Отварите яйца вкрутую (7–9 минут), остудите их и отделите желтки. Белки нарежьте мелкими кубиками или соломкой.\n2. Нарежьте куриное филе небольшими кусочками и обжарьте на оливковом масле до золотистой корочки. Посолите и поперчите по вкусу.\n3. Приготовьте сухарики: нарежьте белый хлеб кубиками, смешайте с измельчённым чесноком, посолите и сбрызните оливковым маслом. Выпекайте в духовке при температуре 180 °C до золотистого цвета.\n4. Пармезан нарежьте тонкими ломтиками или натрите на крупной тёрке.\n5. Для соуса соедините желтки, горчицу, лимонный сок и оливковое масло. Взбейте блендером до однородной консистенции. Если используете анчоусы, предварительно измельчите их и добавьте в соус.\n6. На тарелку выложите листья салата, сверху разместите курицу, затем сухарики и ломтики пармезана.\n7. Полейте всё соусом и подавайте к столу.", "right": "# Салат «Праздничный»\n\n**Описание:** яркий и вкусный салат, который станет украшением праздничного стола. Сочетание куриного мяса, овощей и орехов делает его сытным и аппетитным.\n\n**Время приготовления:** 30–40 минут.\n\n**Количество порций:** зависит от размера блюда и аппетита участников застолья. Можно рассчитать ориентировочно на 4–6 порций.\n\n## Ингредиенты\n* Куриное филе — 300 г.\n* Огурцы свежие — 150 г.\n* Морковь — 150 г.\n* Грецкие орехи — 50 г.\n* Зелёный горошек (консервированный) — 150 г.\n* Майонез — по вкусу.\n* Соль — по вкусу.\n* Чёрный перец молотый — по вкусу.\n\n## Приготовление\n1. Куриное филе отварить в подсоленной воде до готовности, остудить и нарезать мелкими кубиками.\n2. Морковь отварить, охладить, очистить и натереть на крупной тёрке.\n3. Свежие огурцы вымыть, обсушить и нарезать мелкими кубиками.\n4. Грецкие орехи измельчить ножом или в блендере, но не слишком мелко.\n5. Смешать в миске нарезанное куриное филе, огурцы, морковь и зелёный горошек.\n6. Добавить майонез, соль и чёрный перец по вкусу, тщательно перемешать.\n7. Выложить салат на красивое блюдо и посыпать сверху измельчёнными грецкими орехами.\n8. Перед подачей дать салату настояться в холодильнике около 15–20 минут."}, {"id": "ingr_07", "prompt": "Придумай рецепт, в котором используются капуста, морковь и свинина.", "a_left": false, "left": "# Свинина с капустой и морковью\n\n**Время приготовления:** 60 минут\n**Порций:** 4\n\n## Ингредиенты\n- Свинина — 300 г;\n- Капуста белокочанная — 300 г;\n- Морковь — 150 г;\n- Лук репчатый — 1 шт.;\n- Растительное масло — 3 ст. л.;\n- Соль — по вкусу;\n- Чёрный перец молотый — по вкусу;\n- Вода — 50 мл (при необходимости).\n\n## Приготовление\n1. Свинину нарежьте небольшими кусочками.\n2. Разогрейте сковороду с растительным маслом на среднем огне. Обжарьте кусочки свинины до золотистой корочки. Это займёт примерно 5–7 минут.\n3. Пока жарится свинина, очистите и мелко нарежьте лук. Морковь натрите на крупной тёрке.\n4. Добавьте нарезанный лук на сковороду к мясу и обжарьте вместе ещё несколько минут, пока лук не станет прозрачным.\n5. Добавьте морковь на сковороду и обжарьте всё вместе ещё пару минут.\n6. Тонко нашинкуйте капусту.\n7. Переложите капусту на сковороду, добавьте соль и чёрный перец по вкусу. При необходимости добавьте немного воды, чтобы капуста стала мягче. Тушите под крышкой около 15–20 минут, пока капуста не достигнет желаемой мягкости.\n8. Смешайте все ингредиенты на сковороде. Попробуйте на соль и перец, при необходимости скорректируйте вкус.\n9. Подавайте горячим, посыпав свежей зеленью по желанию.", "right": "### Тушёная капуста с морковью и свининой\n\n**Описание:** это сытное и ароматное блюдо, которое сочетает в себе нежность свинины, сладость моркови и хрустящую текстуру капусты. Отличный выбор для семейного ужина или обеда.\n\n**Время приготовления:** 40–50 минут.\n\n**Количество порций:** 4.\n\n### Ингредиенты\n* Свинина (мякоть) — 300 г.\n* Капуста белокочанная — 400 г.\n* Морковь — 1 шт. (среднего размера).\n* Лук репчатый — 1 шт. (среднего размера).\n* Томатная паста — 2 ст. л.\n* Растительное масло — 2 ст. л.\n* Соль — по вкусу.\n* Чёрный перец молотый — по вкусу.\n* Лавровый лист — 2 шт.\n* Вода — 100 мл.\n\n### Шаги приготовления\n1. Нарежьте свинину небольшими кусочками. Очистите лук и нарежьте его кубиками. Морковь очистите и натрите на крупной тёрке.\n2. Разогрейте растительное масло в глубокой сковороде или кастрюле. Обжарьте кусочки свинины до золотистой корочки. Выньте мясо из сковороды.\n3. В той же сковороде обжарьте нарезанный лук до прозрачности. Добавьте натёртую морковь и обжаривайте ещё несколько минут, пока морковь не станет мягкой.\n4. Верните свинину обратно в сковороду. Добавьте томатную пасту, соль, чёрный перец и лавровый лист. Перемешайте.\n5. Нашинкуйте капусту и добавьте её к остальным ингредиентам. Влейте воду.\n6. Тушите всё вместе под крышкой на среднем огне около 20–30 минут, пока капуста не станет мягкой. При необходимости можно добавить немного воды.\n7. Подавайте тушёную капусту с морковью и свининой горячей, посыпав свежей зеленью по вкусу."}, {"id": "dish_03", "prompt": "Напиши рецепт: Салат Оливье", "a_left": true, "left": "### Салат «Оливье»\n\n**Описание:** классический салат «Оливье» — это сытное и вкусное блюдо, которое часто готовят на праздники. Он состоит из отварных овощей, мяса или колбасы, яиц, маринованных огурцов, зелёного горошка и майонеза.\n\n**Время приготовления:** 40–60 минут.\n\n**Количество порций:** зависит от размера салата, например, на 4–6 порций.\n\n### Ингредиенты\n* Картофель — 3–4 шт.;\n* Морковь — 1–2 шт.;\n* Яйца куриные — 3–4 шт.;\n* Колбаса варёная (или мясо) — 300 г;\n* Маринованные огурцы — 3–4 шт.;\n* Зелёный горошек консервированный — 1 банка;\n* Майонез — по вкусу;\n* Соль — по вкусу;\n* Перец чёрный молотый — по вкусу.\n\n### Приготовление\n1. Отварите картофель и морковь в подсоленной воде до готовности. Время варки зависит от размера овощей, обычно это занимает около 20–30 минут после закипания воды. Проверьте готовность вилкой или ножом — овощи должны легко прокалываться.\n2. После варки остудите овощи и очистите их от кожуры. Нарежьте мелкими кубиками.\n3. Сварите яйца вкрутую (около 7–8 минут после закипания воды). Затем охладите их под холодной водой, очистите и нарежьте мелкими кубиками.\n4. Колбасу также нарежьте мелкими кубиками. Если используете мясо, предварительно отварите его и остудите перед нарезкой.\n5. Маринованные огурцы нарежьте мелкими кубиками.\n6. В глубокой миске смешайте все нарезанные ингредиенты: картофель, морковь, яйца, колбасу и маринованные огурцы.\n7. Добавьте зелёный горошек из банки, предварительно слив жидкость.\n8. Посолите и поперчите салат по вкусу.\n9. Заправьте салат майонезом и тщательно перемешайте.\n10. Дайте салату настояться в холодильнике около 30 минут перед подачей на стол.", "right": "# Салат «Оливье»\n\n## Ингредиенты\n* Картофель — 4–5 шт.;\n* морковь — 2 шт.;\n* огурец свежий — 2 шт.;\n* колбаса варёная — 300 г;\n* горошек зелёный консервированный — 200 г;\n* лук репчатый — 1 шт.;\n* яйцо куриное — 4 шт.;\n* майонез — по вкусу;\n* соль — по вкусу;\n* перец чёрный молотый — по вкусу.\n\n## Приготовление\n1. Картофель и морковь отварить в мундире до готовности, охладить, очистить и нарезать мелкими кубиками.\n2. Яйца сварить вкрутую, охладить, очистить и нарезать мелкими кубиками.\n3. Огурцы нарезать мелкими кубиками.\n4. Колбасу нарезать мелкими кубиками.\n5. Репчатый лук очистить и мелко нарезать. При желании можно предварительно ошпарить кипятком, чтобы убрать горечь.\n6. В большой миске смешать нарезанный картофель, морковь, огурцы, колбасу, горошек и лук.\n7. Посолить и поперчить смесь по вкусу.\n8. Добавить майонез и тщательно перемешать все ингредиенты.\n9. Подавать салат охлаждённым."}, {"id": "dish_11", "prompt": "Дай рецепт блюда «Котлеты по-киевски».", "a_left": false, "left": "# Котлеты по-киевски классические\n\n**Время приготовления:** 45 минут\n**Порций:** 2\n\n## Ингредиенты\n* Грудка куриная — 2 шт.;\n* Масло сливочное — 50 г;\n* Мука пшеничная;\n* Яйцо куриное — 2 шт.;\n* Сухари панировочные;\n* Петрушка — 1 пучок;\n* Специи;\n* Сок лимонный — 1 шт.;\n* Масло растительное — 1 стакан.\n\n## Приготовление\n1. Снимите кожу с тушки в области грудки, срежьте грудку с двух сторон тушки вместе с крылышком.\n2. Отрежьте от крылышка часть до первого сустава и зачистите косточку от мяса.\n3. Разделите грудку на малое и большое филе.\n4. Удалите белое сухожилие из малого филе, так как при нагревании оно сокращается и деформирует котлету.\n5. Разрежьте малое и большое филе вдоль до половины, сохранив косточку.\n6. Заранее подготовьте масло для фарширования грудки: размягчённое масло смешайте с рубленой зеленью, солью и соком лимона, заверните в фольгу и оставьте в холодильнике до полного застывания.\n7. Раскройте малое филе, слегка отбейте, посолите, поперчите, положите внутрь масло, хорошо заверните.\n8. Поместите внутрь надрезанного большого филе, снова хорошо заверните.\n9. Скрепите деревянными палочками.\n10. Обваляйте в муке.\n11. Затем во взбитом яйце.\n12. После этого в сухарях.\n13. Обжарьте до румяной корочки в хорошо разогретом масле.", "right": "### Котлеты по-киевски\n\n**Описание:** нежные котлеты из куриного филе с масляно-грибной начинкой, обжаренные до золотистой корочки. Подаются обычно с гарниром из картофельного пюре или свежих овощей.\n\n**Время приготовления:** около 1 часа 20 минут.\n\n**Количество порций:** зависит от размера котлет (примерно 4–6 порций).\n\n### Ингредиенты\n* Куриное филе — 500 г.\n* Сливочное масло — 70 г.\n* Грибы (шампиньоны) — 100 г.\n* Лук репчатый — 1 шт.\n* Мука — 1 ст. л.\n* Сливки (20%) — 50 мл.\n* Соль — по вкусу.\n* Чёрный перец (молотый) — по вкусу.\n* Панировочные сухари — 3–4 ст. л.\n* Яйцо куриное — 1 шт.\n* Растительное масло для жарки — 3–4 ст. л.\n\n### Шаги приготовления\n1. Подготовьте все необходимые ингредиенты.\n2. Мелко нарежьте грибы и лук. Обжарьте их на сковороде до золотистого цвета.\n3. Добавьте муку к грибам и луку, перемешайте. Затем влейте сливки, посолите и поперчите по вкусу. Доведите смесь до загустения на среднем огне. Снимите с огня и дайте остыть.\n4. Размягчённое сливочное масло смешайте с грибной смесью до однородной консистенции. Это будет начинка для котлет.\n5. Разрежьте куриное филе вдоль пополам, но не до конца, чтобы получился «карман». Отбейте каждую половинку филе молотком для мяса, предварительно накрыв плёнкой, чтобы не брызгало. Посолите и поперчите обе стороны филе.\n6. В центр каждой отбитой части филе положите немного начинки. Аккуратно заверните начинку внутрь филе, формируя котлету. Закрепите форму котлет зубочистками, если необходимо.\n7. Взбейте яйцо в отдельной миске. В другой миске насыпьте панировочные сухари. Каждую котлету сначала обмакните во взбитое яйцо, затем обваляйте в сухарях.\n8. Разогрейте растительное масло на сковороде на среднем огне. Жарьте котлеты по несколько минут с каждой стороны до золотистой корочки.\n9. Готовые котлеты выложите на тарелку и подавайте горячими. Приятного аппетита!"}, {"id": "ingr_02", "prompt": "Что пригот
