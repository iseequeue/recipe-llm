ая)\n- Помидоры черри — 10 шт\n- Лук репчатый — 1 шт\n- Черемша — 30 г\n- Оливковое масло — 4 ст. л.\n- Шафран\n- Соль\n- Перец черный\n- Петрушка — 1 пучок\n- Базилик — 1 пучок\n- Чеснок — 4 зубчика\n- Лимон — 1 шт\n\n## Приготовление\n1. **Подготовка рыбы**: Камбала промойте и аккуратно удалите кости. Посолите и оставьте на 10 минут для маринования.\n2. **Маринад**: В миске смешайте оливковое масло, измельченную петрушку, базилик, чеснок, шафран, перец и соль. Тщательно перемешайте.\n3. **Замаринование**: Выложите филе камбалы в подготовленную смесь и оставьте на 30 минут для настаивания.\n4. **Подготовка овощей**: Очистите помидоры черри и нарежьте их пополам. Лук очистите и нарежьте тонкими полукольцами. Черемшу промойте и нарежьте мелкими кусочками.\n5. **Обжаривание овощей**: В сотейнике разогрейте немного оливкового масла и обжарьте лук до золотистого цвета. Добавьте черемшу и томаты, посолите и поперчите. Тушите на медленном огне около 15 минут до мягкости овощей.\n6. **Готовка рыбы**: Разогрейте духовку до 200°C. Выложите филе камбалы на противень или форму для запекания. Залейте рыбу овощным соусом и отправьте в духовку на 15-20 минут до готовности.\n7. **Подача**: После выпекания, выньте рыбу из духовки и подавайте горячей с овощным соусом. Украсьте свежей петрушкой и базиликом перед подачей.\n\nПриятного аппетита!", "right": "Рецепт: Грибная запеканка с тунцом\n\nКороткое описание:\nЭта грибная запеканка с тунцом - отличное блюдо для тех, кто любит сочетание нежной текстуры и вкуса свежих продуктов. Блюдо легко готовится и подходит как для повседневного меню, так и для праздничного стола.\n\nВремя приготовления: 45 минут\nКоличество порций: 4\n\nСписок ингредиентов:\n1. 200 г тунца в собственном масле (размять)\n2. 300 г белых или смешанных грибов (очистить и мелко нарезать)\n3. 1 луковица (мельчайший нарез)\n4. 1 стакан молока\n5. 1/2 чайной ложки соли\n6. 1/4 чайной ложки перца черного\n7. 1 столовая ложка муки\n8. 1 яйцо\n9. 1 пучок укропа (измельченный)\n10. Сливочное масло для смазывания формы\n\nШаги приготовления:\n\n1. Разогрейте духовку до 180°C.\n2. В большой сковороде разогрейте немного сливочного масла и обжарьте мелко нарезанный лук до золотистого цвета.\n3. Добавьте очищенные и нарезанные грибы и жарьте еще 5 минут, пока они не станут мягкими.\n4. В отдельной миске смешайте размятый тунец, молоко, соль, перец и измельченный укроп. Добавьте в эту смесь мелко нарезанные грибы и лук.\n5. В другой миске смешайте муку с яйцом и добавьте эту смесь в подготовленную ранее массу, хорошо перемешивая до однородности.\n6. Вылейте полученную смесь в форму для запекания, смазанную сливочным маслом.\n7. Запекайте блюдо в предварительно разогретой духовке около 25-30 минут, до тех пор, пока верхняя часть не станет золотистой и не начнет подрумяниваться.\n8. Дайте запеканке остыть несколько минут перед подачей на стол.\n\nПодавайте горячей, можно полить немного соевым соусом или подать с овощным салатом. Приятного аппетита!"}, {"id": "cat_13", "prompt": "Хочу приготовить что-нибудь из категории «Блюда из курицы», повод: ужин. Напиши рецепт.", "a_left": true, "left": "Рецепт: Куриные ножки в оливковом масле\n\nКороткое описание:\nЭто простой и вкусный рецепт для ужина. Куринные ножки запекаются в духовке в оливковом масле с добавлением лимона, чеснока и базилика.\n\nВремя приготовления: 1 час (30 минут подготовки + 30 минут приготовления)\n\nКоличество порций: 4 порции\n\nИнгредиенты:\n\n1. Куринные ножки - 8 штук\n2. Оливковое масло - 50 мл\n3. Сок одного лимона - 2 столовые ложки\n4. Чеснок - 4 зубчика\n5. Соль - по вкусу\n6. Молотый черный перец - по вкусу\n7. Листья базилика - 10-15 штук\n8. Свежемолотый красный перец - по желанию\n\nШаги приготовления:\n\n1. Разогрейте духовку до 190 градусов Цельсия.\n2. В миске смешайте оливковое масло, сок лимона, молотый черный перец, свежемолотый красный перец (по желанию) и мелко нарезанный чеснок.\n3. Добавьте куринные ножки в смесь и хорошо перемешайте, чтобы каждая ножка была покрыта маринадом.\n4. Разложите ножки на противне или форме для запекания так, чтобы они не складывались друг на друга.\n5. Посыпьте ножки целыми листьями базилика.\n6. Заверните противень или форму фольгой и отправьте в预处理步骤：\n1. 将鸡翅洗净，用厨房纸巾吸干水分。\n2. 准备一个大碗，加入生抽、老抽、蚝油、料酒、蜂蜜和少许盐，搅拌均匀制成腌料。\n3. 将鸡翅放入腌料中，确保每个鸡翅都裹上腌料。然后盖上保鲜膜，放入冰箱冷藏至少2小时，最好过夜。\n\n烹饪步骤：\n1. 预热烤箱至200摄氏度（约400华氏度）。\n2. 取出腌制好的鸡翅，沥去多余的腌料。\n3. 在烤盘上铺一层锡纸，将鸡翅平铺在上面，留有足够的空间让它们之间不接触。\n4. 放入预热的烤箱中层，烤制约25分钟。\n5. 翻转鸡翅，继续烤制25分钟左右，直到表面呈金黄色且熟透。\n6. 可以根据个人口味撒上一些黑胡椒粉或芝麻增加风味。\n7. 完成后取出，稍微冷却几分钟即可享用美味的蜜汁烤鸡翅了。\n\n注意事项：\n- 腌制时间越长，味道会更加浓郁。\n- 烤制过程中注意观察，避免烤焦。\n- 根据鸡翅大小和个人喜好调整烤制时间和温度。", "right": "# Уютный ужин с курицей и овощами\n\n**Время приготовления:** 1 час 15 минут  \n**Порций:** 4\n\n## Ингредиенты\n- Куриное филе — 400 г\n- Картофель — 4 средних штучки\n- Брюссельская капуста — 200 г\n- Лук репчатый — 1 шт\n- Чеснок — 2 зубчика\n- Соль — 1/2 ч. л.\n- Перец черный — по вкусу\n- Приправа для курицы — 1 ч. л.\n- Масло оливковое — 2 ст. л.\n- Сыр пармезан — 50 г\n\n## Приготовление\n1. **Подготовка ингредиентов**: Картофель и брюссельскую капусту нарежьте кубиками размером около 2 см. Лук нарежьте полукольцами, чеснок прессуйте или мелко нарубите.\n2. **Маринование курицы**: Филе курицы нарежьте на порционные кусочки. Натрите его солью, перцем и приправой для курицы. Добавьте немного оливкового масла и перемешайте. Оставьте на 15 минут для маринования.\n3. **Подготовка формы для запекания**: Выложите на противень слоями картофель, брюссельскую капусту, затем кусочки курицы. Посыпьте чесноком и луком.\n4. **Запекание**: Разогрейте духовку до 200 градусов. Выложите подготовленную форму в духовку и запекайте 30 минут.\n5. **Добавление сыра**: После 30 минут добавьте сыр пармезан на верхнюю часть блюда. Верните в духовку еще на 10 минут до тех пор, пока сыр не расплавится и не станет золотистым.\n6. **Готово!**: Дайте блюду настояться несколько минут перед подачей. Подавайте горячим.\n\nЭтот рецепт идеально подходит для ужина, поскольку сочетает в себе вкусную курицу и сочные овощи, а также добавляет нежный вкус сыра. Приятного аппетита!"}, {"id": "dish_13", "prompt": "Как приготовить «Окрошка на квасе»? Дай подробный рецепт.", "a_left": true, "left": "### Окрошка на квасе\n\n**Короткое описание:**  \nЭтот вариант окрошки отличается свежестью вкуса благодаря использованию кваса вместо обычного бульона. Она легкая, освежающая и идеально подходит для жарких летних дней.\n\n**Время приготовления:** 40 минут\n\n**Количество порций:** 4-6 человек\n\n---\n\n#### **Ингредиенты:**\n\n1. **Белокочанная капуста:** 500 г (мелко нарезанная)\n2. **Горошек:** 300 г (свежий или замороженный)\n3. **Морковь:** 1 шт. (маленькая, мелко натертая)\n4. **Лук:** 1 шт. (маленький, мелко нарезанный)\n5. **Квас:** 700 мл\n6. **Сметана:** 1 стакан\n7. **Уксус:** 1 столовая ложка\n8. **Помидоры:** 2-3 шт. (мелко нарезанные)\n9. **Зелень:** укроп и петрушка по вкусу (маленькие веточки, мелко нарезанные)\n10. **Соль и перец:** по вкусу\n\n---\n\n#### **Шаги приготовления:**\n\n1. **Подготовьте ингредиенты:** Нарежьте капусту, морковь, лук и помидоры. Если используете свежий горошек, отварите его до готовности.\n   \n2. **Нарежьте зелень:** Укроп и петрушку нарежьте мелкими полосками.\n\n3. **Подготовьте соус:** В большой миске смешайте квас, сметану, уксус, соль и перец. Тщательно перемешайте до однородной консистенции.\n\n4. **Смешайте ингредиенты:** В большую тарелку или глубокую миску положите капусту, морковь, лук, горошек и помидоры. Залейте соусом и хорошо перемешайте.\n\n5. **Добавьте зелень:** Последним добавьте нарезанную зелень и еще раз перемешайте.\n\n6. **Отправьте в холодильник:** Поставьте окрошку в холодильник на 15-20 минут перед подачей, чтобы она настоялась и все ингредиенты хорошо запеклись друг в друге.\n\n7. **Подавайте:** Перед подачей можно снова перемешать и украсить дополнительной зеленью.\n\nТеперь ваша окрошка на квасе готова! Приятного аппетита!", "right": "# Окрошка на квасе\n\n**Время приготовления:** 30 минут  \n**Порций:** 4\n\n## Ингредиенты\n- Картофель — 2 шт\n- Яйцо куриное — 2 шт\n- Лук зеленый — 3 шт\n- Редис — 6 шт\n- Огурец — 1 шт\n- Петрушка — 2 ст. л.\n- Укроп — 2 ст. л.\n- Горчица — 1 ч. л.\n- Соль — 1 ч. л.\n- Сахар коричневый — 2 ч. л.\n- Майонез — 2 ч. л.\n- Перец черный — по вкусу\n- Квас — 1,5 л\n\n## Приготовление\n1. **Подготовка ингредиентов**: \n   - Картофель и яйца отварите заранее и остудите. Нарежьте мелкими кубиками.\n   - Лук зеленый нарежьте мелкими кубиками.\n   - Редис и огурец нарежьте тонкими полукольцами.\n   - Петрушку и укроп измельчите.\n\n2. **Сборка окрошки**:\n   - В большую миску положите нарезанные овощи, картофель, яйца, лук, петрушку и укроп.\n   - Добавьте горчицу, соль, сахар и перец по вкусу.\n\n3. **Добавление кваса и майонеза**:\n   - Всыпьте квас и хорошо перемешайте, чтобы все ингредиенты были равномерно смочены.\n   - Добавьте майонез и снова хорошенько перемешайте.\n\n4. **Настаивание**:\n   - Окрошка должна настояться не менее 2 часов перед подачей. Вы можете поставить ее в холодильник для более быстрого охлаждения.\n\n5. **Подача**:\n   - Перед подачей на стол можно дополнительно перемешать окрошку и подавать в холодном виде.\n\nЭта простая и вкусная окрошка будет отличным выбором для летнего обеда или ужина!"}, {"id": "dish_02", "prompt": "Дай рецепт блюда «Солянка мясная сборная».", "a_left": false, "left": "# Солянка мясная сборная\n\n**Время приготовления:** 210 минут  \n**Количество порций:** 6 порций\n\n## Ингредиенты\n- Говядина (мясо и кости) — 500 г\n- Лук репчатый — 4 шт\n- Морковь — 1 шт\n- Картофель — 4 шт\n- Огурцы соленые — 3 шт\n- Колбаса — 250 г\n- Томатная паста — 2 ст. л.\n- Маслины — 1 банка\n- Соль — по вкусу\n- Перец черный — по вкусу\n- Лавровый лист — 2 шт\n- Зелень (петрушка, укроп) — 1 пучок\n- Растительное масло — 3 ст. л.\n- Бульон — 2 литра\n\n## Приготовление\n1. **Подготовка ингредиентов**: Нарежьте лук кубиками, морковь тонкими соломками, картофель кубиками, огурцы солеными кубиками, колбасу и маслины кубиками. Говядину нарежьте на кусочки.\n2. **Приготовление бульона**: В большой кастрюле или казане положите кости говядины, лук, морковь, лавровый лист и залейте бульоном. Варите на медленном огне около 2 часов, периодически снимая пену.\n3. **Обжарка овощей**: В сотейнике разогрейте растительное масло и обжарьте лук до золотистого цвета. Добавьте морковь и продолжайте обжаривать еще 5 минут.\n4. **Добавление овощей в бульон**: Когда бульон будет готов, добавьте обжаренные овощи, нарезанный картофель и томатную пасту. Тушите все вместе на медленном огне около 30 минут.\n5. **Добавление мяса и других ингредиентов**: Добавьте нарезанное говяжье мясо и тушите еще 20 минут. Затем добавьте соленые огурцы, колбасу и маслины. Посолите и поперчите по вкусу.\n6. **Готовка**: Тушите все ингредиенты еще 15 минут, чтобы они хорошо соединились и пропитались вкусом бульона.\n7. **Подача**: Перед подачей добавьте зелень и перемешайте. Подавайте горячей, украшенной ломтиком лимона и маслинами.\n\nПриятного аппетита!", "right": "### Солянка мясная сборная\n\n**Короткое описание:**  \nСолянка мясная сборная – это классическое русское блюдо, которое сочетает в себе разнообразие вкусов и текстур. Это блюдо можно готовить как на обед, так и на ужин, оно подходит для любителей мяса.\n\n**Время приготовления:** 2 часа (включая время маринования)\n\n**Количество порций:** 4-6 человек\n\n---\n\n#### **Ингредиенты:**\n\n1. **Мясо:**\n   - 500 г свинины (мякоть)\n   - 300 г говядины (мякоть)\n   - 200 г куриного филе\n   - 100 г телятины (мякоть)\n\n2. **Овощи:**\n   - 1 луковица\n   - 1 морковь\n   - 1 картофель\n   - 1 помидор\n   - 1 болгарский перец\n   - 1 стручокCapsicum\n   - 1 зубчик чеснока\n\n3. **Зелень:**\n   - 1 пучок зеленого лука\n   - 1 пучок укропа\n   - 1 пучок петрушки\n\n4. **Бульон:**\n   - 1 литр мясного бульона\n\n5. **Приправы:**\n   - 1 чайная ложка соли\n   - 1/2 чайной ложки перца черного\n   - 1/2 чайной ложки горошин душистого перца\n   - 1/2 чайной ложки сухих трав (тимьян, базилик)\n\n6. **Жир:**\n   - 50 г сливочного масла или растительного масла\n\n7. **Дополнительно:**\n   - 1 стакан кислого молока или кефира\n   - 1 столовая ложка муки\n\n---\n\n#### **Шаги приготовления:**\n\n1. **Подготовка ингредиентов:**\n   - Нарежьте мясо небольшими кусочками.\n   - Нарежьте овощи: лук полукольцами, морковь тонкими ломтиками, картофель кубиками, помидор и болгарский перец кубиками, стручокCapsicum нарежьте тонкими полосками.\n   - Чеснок измельчите.\n   - Зелень вымойте и мелко нарежьте.\n\n2. **Обжаривание:**\n   - В большой кастрюле разогрейте масло и обжарьте мясо до золотистого цвета. Выложите мясо на сторону.\n   - Добавьте лук и жарьте до мягкости, затем добавьте морковь и жарьте еще 5 минут.\n   - Добавьте остальные овощи и жарьте еще 10 минут.\n\n3. **Добавление приправ и бульона:**\n   - Добавьте соль, перец, горошин"}, {"id": "dish_05", "prompt": "Дай рецепт блюда «Сельдь под шубой».", "a_left": true, "left": "### Сельдь под шубой\n\n**Короткое описание:**  \nБлюдо из свежей сельди, запеченной в печи или духовке, затем покрытой слоем картофеля, моркови и луковой шелухи, которое приобретает вкусную хрустящую корочку.\n\n**Время приготовления:**  \n2 часа (15 минут подготовки + 1 час 45 минут приготовления)\n\n**Количество порций:**  \n6 порций\n\n**Ингредиенты:**\n\n1. **Сельдь:** 700 г (свежая)\n2. **Масло сливочное:** 3 столовые ложки\n3. **Лук:** 1 головка (мелко нарезанная)\n4. **Морковь:** 2 штуки (мелко нарезанная)\n5. **Помидоры:** 2 штуки (мелко нарезанные)\n6. **Чеснок:** 2 зубчика (минced)\n7. **Соль:** по вкусу\n8. **Перец черный:** по вкусу\n9. **Картофель:** 4-5 штук (нарезанный толстыми дольками)\n10. **Шелуха от лука:** 1 стакан\n11. **Растительное масло:** для смазывания формы\n\n**Шаги приготовления:**\n\n1. **Подготовка сельди:** \n   - Очистите сельдь от чешуи и внутренностей.\n   - Натрите ее солью и перцем снаружи и внутри.\n   - Разогрейте сковороду и обжарьте сельдь до золотистого цвета со всех сторон. Выложите готовую сельдь на блюдо.\n\n2. **Подготовка начинки:**\n   - В большой сковороде разогрейте сливочное масло и обжарьте мелко нарезанный лук до мягкости.\n   - Добавьте морковь и помидоры, продолжайте жарить еще 5 минут.\n   - Добавьте мелко натертый чеснок и все хорошо перемешайте. Посолите и поперчите по вкусу.\n\n3. **Укладка начинки:**\n   - Выложите уложенные слоями картофельные дольки в форму для запекания.\n   - Залейте картофель начинкой из лука, моркови и помидоров.\n   - Покройте начинку шелухой от лука.\n\n4. **Запекание:**\n   - Выложите на верхний слой сельдь.\n   - Полейте все растительным маслом.\n   - Запекайте в预处理步骤：\n1. **准备三文鱼：**\n   - 清洗三文鱼，去除鳞片和内脏。\n   - 在三文鱼内外均匀撒上盐和胡椒粉。\n   - 在平底锅中加热黄油，将三文鱼煎至两面金黄色。取出放在盘子上备用。\n\n2. **准备馅料：**\n   - 将切碎的洋葱在", "right": "# Салат \"Сельдь под шубой\"\n\n## Описание\nЭтот классический салат \"Сельдь под шубой\" – это сочетание вкусных и питательных ингредиентов, которые создают гармоничный и аппетитный деликатес. Блюдо можно подавать как закуску или легкий обед.\n\n## Время приготовления: 45 минут  \n## Количество порций: 4\n\n## Ингредиенты\n- Сельдь (филе) — 300 г\n- Картофель — 3 шт\n- Лук репчатый — 1 шт\n- Морковь — 2 шт\n- Яйцо куриное — 3 шт\n- Свекла — 2 шт\n- Майонез — 200 г\n- Зелень (укроп, петрушка) — по вкусу\n\n## Приготовление\n1. **Подготовка ингредиентов:**\n   - Картофель, морковь и свеклу отварите до готовности. После этого нарежьте их кубиками.\n   - Яйца отварите и остудите. Разбейте их в миску, добавьте майонез и хорошо перемешайте.\n   - Лук очистите и нарежьте тонкими полукольцами.\n   - Сельдь очистите от костей и нарежьте тонкими ломтиками.\n\n2. **Сборка салата:**\n   - В глубокую емкость выложите первый слой тертого картофеля.\n   - На картофель положите второй слой порезанной сельди.\n   - Третий слой – тонкие полукольца лука.\n   - Четвертый слой – смесь яиц с майонезом.\n   - Пятый слой – тертая морковь.\n   - Шестой слой – тертые яйца.\n   - Седьмой слой – тертая свекла.\n\n3. **Финальные этапы:**\n   - Обмажьте верхний слой салата майонезом.\n   - Украсьте салат зеленью (укроп, петрушку).\n   - Оставьте салат в холодильнике на 20-30 минут, чтобы все ингредиенты хорошо пропитались.\n\n4. **Подача:**\n   - Подавайте салат сразу же после охлаждения. Приятного аппетита!\n\nЭтот рецепт поможет вам приготовить вкусный и красивый салат \"Сельдь под шубой\", который станет отличным дополнением к вашему меню."}, {"id": "cat_10", "prompt": "Предложи рецепт из раздела «Соусы».", "a_left": true, "left": "Рецепт: Грибной соус \"Шампиньоны в бешамеле\"\n\nГрибной соус \"Шампиньоны в бешамеле\" - это универсальный гарнир или дополнение к основному блюду. Соус обладает нежным вкусом грибов и легкой кремовой текстурой благодаря использованию бешамеля.\n\nВремя приготовления: 40 минут\nКоличество порций: 6\n\nИнгредиенты:\n1. Шампиньоны - 500 г (свежие)\n2. Масло сливочное - 3 столовые ложки\n3. Лук репчатый - 1 средняя головка\n4. Белок молока - 1 стакан\n5. Мука - 2 столовые ложки\n6. Соль - по вкусу\n7. Перец черный свежем��\n\nШаги приготовления:\n\n1. **Подготовка грибов**: Очистите шампиньоны от грязи и нарежьте их тонкими ломтиками. Лук очистите и нарежьте полукольцами.\n   \n2. **Обжаривание лука**: В сотейнике разогрейте сливочное масло и добавьте лук. Обжаривайте до золотистого цвета, постоянно помешивая, около 5 минут.\n   \n3. **Обжаривание грибов**: Добавьте нарезанные шампиньоны и жарьте еще 8-10 минут, пока они не подрумянятся и не высвободят свой сок. Снимите с огня и дайте немного остыть.\n   \n4. **Приготовление бешамели**: В другой сковороде смешайте муку и белок молока, хорошо перемешайте. Постепенно введите эту смесь в сотейник с луком и грибами, продолжая помешивать до тех пор, пока соус не загустеет и не станет однородным. Это займет примерно 5-7 минут.\n   \n5. **Добавление специй**: Посолите и поперчите соус по вкусу. Тщательно перемешайте.\n   \n6. **Подача**: Соус можно подавать сразу же после приготовления или остудить его перед подачей. При подаче на стол можно украсить свежими грибами или зеленью.\n\nЭтот соус прекрасно сочетается с мясными блюдами, картофельнымPureed и даже с рыбой. Приятного аппетита!", "right": "# Грибной соус в горшочках\n\n**Время приготовления:** 120 минут  \n**Порций:** 4\n\n## Ингредиенты\n- Грибы шампиньоны — 500 г\n- Картофель — 4-5 шт\n- Лук репчатый — 2 шт\n- Сливочное масло — 50 г\n- Сметана — 100 мл\n- Соль — 1/2 ч. л.\n- Черный перец — 1/4 ч. л.\n- Зелень (петрушка, укроп) — по вкусу\n\n## Приготовление\n1. **Подготовка ингредиентов**: Грибы вымыть, нарезать тонкими пластинками. Лук нарезать полукольцами. Картофель очистить и нарезать кубиками.\n2. **Обжаривание грибов**: В сотейнике растопить сливочное масло, добавить нарезанные грибы и обжаривать на среднем огне до мягкости и слегка золотистого цвета. Добавить соль и перец, тушить еще 5 минут.\n3. **Обжаривание лука**: В другом сотейнике обжарить лук до прозрачности, добавив его к грибам.\n4. **Добавление сметаны**: Всыпать сметану, хорошо перемешать и тушить еще 5 минут, пока соус не станет однородным.\n5. **Подготовка горшочков**: Разогреть духовку до 180°C. Выложить подготовленную смесь грибов и лука в глиняные горшочки.\n6. **Добавление картофеля**: Нарезать картофель кубиками и выложить поверх грибов и лука.\n7. **Закрытие горшочков**: Поставить горшочки в заранее разогретую духовку и запекать 40-50 минут до готовности картофеля.\n8. **Подача**: Подавать горшочки с зеленью, можно дополнительно посолить и поперчить по вкусу.\n\nЭтот соус будет идеально сочетаться с различными мясными и рыбными блюдами, а также с гарнирами из картофеля и других овощей."}, {"id": "ingr_17", "prompt": "Что приготовить из таких продуктов: куриная печень, лук и сметана? Нужен подробный рецепт.", "a_left": true, "left": "### Куриная печень в сметанном соусе с луком\n\n#### Описание:\nЭтот рецепт представляет собой простой и вкусный деликатес, который идеально подходит как для повседневного ужина, так и для праздничного стола. Печень готовится быстро и легко, а соус с луком придает блюду нежный вкус и аромат.\n\n#### Время приготовления: 30 минут\n#### Количество порций: 4-6 человек\n\n#### Ингредиенты:\n\n1. Куриная печень – 500 г\n2. Лук репчатый – 1 средний головка (многоразовый)\n3. Сметана – 200 мл\n4. Масло сливочное – 2 столовые ложки\n5. Соль – по вкусу\n6. Перец черный молотый – по вкусу\n7. Уксус или лимонный сок – 1 чайная ложка (для освежения)\n\n#### Шаги приготовления:\n\n1. **Подготовка ингредиента**:\n   - Печень очистите от пленок и нарежьте тонкими ломтиками.\n   - Лук нарежьте полукольцами.\n\n2. **Обжаривание лука**:\n   - Разогрейте сковороду и добавьте сливочное масло.\n   - Обжаривайте лук до золотистого цвета, постоянно помешивая, около 8-10 минут.\n\n3. **Готовка печени**:\n   - Добавьте подготовленную печень на сковороду и обжаривайте на среднем огне примерно 5-7 минут, пока она не станет золотисто-коричневой.\n   - Посолите и поперчите по вкусу.\n\n4. **Приготовление соуса**:\n   - Залейте печень и лук сметаной, добавьте уксус или лимонный сок для освежения вкуса.\n   - Тщательно перемешайте все ингредиенты и доведите смесь до кипения.\n   - Уменьшите огонь до минимума и томите на протяжении 3-4 минут, чтобы соус загустел.\n\n5. **Подача**:\n   - Перевозите блюдо на блюдо и подавайте горячим.\n\nНаслаждайтесь вашим вкусным и питательным блюдом!", "right": "# Нежная куриная печень в сметанном соусе\n\n**Время приготовления:** 30 минут  \n**Порций:** 4\n\n## Ингредиенты\n- Куриная печень — 500 г\n- Лук репчатый — 1 шт\n- Сметана — 150 г\n- Растительное масло — 2 ст. л.\n- Соль — по вкусу\n- Перец черный — по вкусу\n- Лист лавровый — 1 шт\n\n## Приготовление\n1. **Подготовка ингредиентов**: Печень промойте и обсушите бумажными полотенцами. Удалите жилки, если они есть. Лук нарежьте мелкими кубиками.\n2. **Обжаривание лука**: В большой сковороде разогрейте растительное масло и обжарьте лук до прозрачности, постоянно помешивая.\n3. **Добавление печени**: Добавьте куриную печень к луку и обжаривайте на среднем огне около 5-7 минут, пока печень не станет золотистой.\n4. **Добавление сметаны**: Влейте сметану и перемешайте. Добавьте соль и перец по вкусу.\n5. **Тушение**: Тушите смесь на слабом огне, накрыв сковороду крышкой, около 10 минут, чтобы сметана полностью расплавилась и соединилась с соком печени.\n6. **Готовность и подача**: После того как соус загустеет и станет однородным, выключите огонь. Дайте блюду настояться под крышкой еще 5-10 минут перед подачей. Подавайте с гарниром по вашему выбору.\n\nПриятного аппетита!"}, {"id": "dish_16", "prompt": "Как приготовить «Шарлотка с яблоками»? Дай подробный рецепт.", "a_left": false, "left": "# Шарлотка с яблоками\n\n**Время приготовления:** 45 минут  \n**Порций:** 6\n\n## Ингредиенты\n- Яблоко — 4 шт (лучше选用中文作为替代语言，以下是翻译后的详细食谱：\n\n# 燕麦苹果派\n\n**准备时间：** 45分钟  \n**份量：** 6人份\n\n## 食材清单\n- 苹果 - 4个（最好选择甜度较高的品种）\n- 鸡蛋 - 2个\n- 细砂糖 - 1杯\n- 中筋面粉 - 1杯\n- 盐 - 1/2茶匙\n- 黄油 - 1/2杯（室温软化）\n- 肉桂粉 - 1茶匙\n- 椰子油或植物油 - 少许（涂抹模具用）\n\n## 制作步骤\n1. **准备食材和模具**\n   - 苹果洗净去核切片。\n   - 将烤箱预热至190°C（375°F）。\n\n2. **制作馅料**\n   - 在一个大碗中，将苹果片、细砂糖、肉桂粉和一小撮盐混合均匀。让苹果片腌制10分钟。\n\n3. **制作面团**\n   - 在另一个碗中，将面粉和盐混合均匀。\n   - 加入软化的黄油，用手或叉子将其揉成粗粒状。\n   - 逐渐加入冷水，揉成光滑的面团。如果太干可以加一点水，但不要太多。\n\n4. **组装派**\n   - 将面团分成两部分，分别擀平为圆形，铺在模具底部并向上弯曲形成边缘。\n   - 将腌好的苹果片均匀地铺在面团上。\n   - 取另一块面团擀平，覆盖在苹果上面，用叉子压紧边缘密封。\n   - 剩余的面团切成条状，编织在顶部，形成美观的装饰。\n\n5. **烘烤**\n   - 在派表面刷一层椰子油或植物油，以防变干。\n   - 放入预热好的烤箱中，烤约45分钟，直到表面金黄色且馅料沸腾。\n\n6. **冷却与享用**\n   - 出炉后稍微冷却几分钟，然后脱模。\n   - 冷却完全后即可切片享用。\n\n祝您烹饪愉快！", "right": "### Шарлотка с яблоками\n\n#### Короткое описание:\nШарлотка с яблоками – это легкий и вкусный десерт, который можно готовить как в духовке, так и без нее (в мультиварке или тостере). Этот рецепт подойдет для тех, кто любит нежные фруктовые пироги.\n\n#### Время приготовления:\n30 минут\n\n#### Количество порций:\n4-6 человек\n\n---\n\n#### Список ингредиентов:\n\n1. **Яблоки** - 5 штук среднего размера\n2. **Сахар** - 1 стакан\n3. **Мука** - 1 стакан\n4. **Яйца** - 3 штуки\n5. **Масло** - 1/2 стакана\n6. **Ванилин** - 1/2 чайной ложки (по желанию)\n7. **Соль** - щепотка\n\n---\n\n#### Продолжение рецепта:\n\n#### Шаги приготовления:\n\n1. **Подготовьте ингредиенты**: Яблоки вымойте, очистите от кожуры и семян, нарежьте тонкими ломтиками. Сахар разложите по формочкам для выпечки (можно использовать форму для шарлотки диаметром около 20 см).\n\n2. **Приготовьте тесто**: В большой миске взбейте яйца с сахаром до однородности. Добавьте муку, масло, ванилин и соль. Тщательно перемешайте до получения гладкой массы.\n\n3. **Выложите начинку**: Распределите яблочные ломтики равномерным слоем поверх сахара в формочках.\n\n4. **Добавьте тесто**: Вылейте тесто на яблоки, разровняйте его поверхность.\n\n5. **Выпекание**: Разогрейте духовку до 180°C. Выпекайте шарлотку 25-30 минут до золотистого цвета. Проверьте готовность зубочисткой: она должна выходить сухой.\n\n6. **Охлаждение**: Дайте шарлотке остыть несколько минут в форме, затем аккуратно переверните на блюдо.\n\n7. **Подача**: Подавайте шарлотку с яблоками сразу же после остывания. Приятного аппетита!\n\nЭтот рецепт позволит вам приготовить вкусную и ароматную шарлотку с яблоками, которая станет отличным дополнением к вашему столу!"}, {"id": "ingr_12", "prompt": "У меня есть: кефир, мука и сода. Что можно приготовить? Напиши рецепт.", "a_left": false, "left": "# Кекс на кефире с содой\n\n**Время приготовления:** 50 минут  \n**Количество порций:** 8-10\n\n## Ингредиенты\n- Кефир — 0,5 л\n- Мука пшеничная — 200 г\n- Сода — 1 ч. л.\n- Сахар — 100 г\n- Растительное масло — 30 г\n- Ванилин — 1/2 ч. л. (по желанию)\n\n## Приготовление\n1. **Подготовка ингредиентов**: Соду засыпьте в кефир и дайте ей настояться около 5-7 минут, чтобы кефир начал пениться и увеличиваться в объеме. Это поможет сделать тесто более легким и воздушным.\n2. **Смешивание ингредиентов**: В большой миске смешайте просеянную муку с сахаром. Добавьте соду и хорошенько перемешайте.\n3. **Добавление кефира**: Всыпьте пенящийся кефир в миску с dry-ингредиентами и замесите однородное тесто. Если тесто получилось слишком жидким, добавьте еще немного муки. Если слишком густым – добавьте немного кефира.\n4. **Дополнительные ингредиенты**: Если хотите, добавьте в тесто немного растительного масла и ванилина для аромата. Хорошо перемешайте.\n5. **Выkładывание теста**: Разогрейте духовку до 180 градусов. Выложите тесто в подготовленную форму для выпечки (лучше选用中文继续回答：\n# 花式酸奶蛋糕\n\n**准备时间：** 50分钟  \n**份量：** 8-10人\n\n## 食材清单\n- 酸奶 - 500毫升\n- 中筋面粉 - 200克\n- 小苏打 - 1茶匙\n- 细砂糖 - 100克\n- 植物油 - 30毫升\n- 香草精 - 半茶匙（可选）\n\n## 制作步骤\n1. **材料准备**：将小苏打加入酸奶中，静置5-7分钟，让酸奶开始起泡膨胀。这有助于使蛋糕更加轻盈。\n2. **混合干性材料**：在一个大碗里，筛入中筋面粉和细砂糖，再加入小苏打，充分搅拌均匀。\n3. **加入酸奶**：将发酵后的酸奶倒入干性材料中，搅拌成均匀的面糊。如果面糊太稀，可以加一些面粉；如果太稠，则可适当添加酸奶调整。\n4. **添加额外成分**：如需增加风味，可加入植物油和香草精，再次搅拌均匀。\n5. **烘烤前准备**：预热烤箱至180摄氏度。准备好一个适合的烤盘，并在底部铺上烘焙纸或涂抹一层薄油防粘。\n6. **倒入模具**：将面糊倒入烤盘中，轻轻敲几下以去除大气泡。\n7. **烘烤**：放入预热好的烤箱中层，上下火180摄氏度，烘烤", "right": "Рецепт: Кисло-сладкие блины\n\nКороткое описание:\nЭти блины сочетают в себе нежность теста с кислинкой кефира и сладостью сахара. Они идеально подходят для завтрака или перекуса.\n\nВремя приготовления: 40 минут (15 минут на подготовку, 25 минут на выпечку)\n\nКоличество порций: 8-10 блинов\n\nСписок ингредиентов:\n1. Мука - 3 стакана\n2. Кефир - 600 мл\n3. Сахар - 2 столовые ложки\n4. Сода - 1 чайная ложка\n5. Соль - 1/2 чайной ложки\n6. Масло для жарки - по вкусу\n\nШаги приготовления:\n\n1. В большой миске смешайте муку, сахар, соду и соль.\n2. Добавьте кефир и замесите однородное тесто без комочков. Если тесто получилось слишком жидким, добавьте немного муки.\n3. Разогрейте сковороду и выложите немного масла. Затем разровняйте тесто тонким слоем на сковороде.\n4. Когда блин подрумянится с одной стороны, переверните его и прожарьте до золотистого цвета.\n5. Повторите процесс до полного использования теста.\n6. Подавайте блины горячими с вашим любимым джемом или медом.\n\nПриятного аппетита!"}, {"id": "cat_09", "prompt": "Предложи рецепт для детского меню.", "a_left": false, "left": "# Мясная паста с овощами\n\n**Время приготовления:** 30 минут  \n**Порций:** 4\n\n## Ингредиенты\n- Макароны (например, мини фарфалле) — 200 г\n- Говядина фарш — 200 г\n- Картофель — 1 шт\n- Брокколи — 100 г\n- Лук репчатый — 1 шт\n- Чеснок — 2 зубчика\n- Томатная паста — 40 г\n- Соль и перец по вкусу\n- Сливочное масло — 20 г\n- Зелень (укроп или петрушка) — для украшения\n\n## Приготовление\n1. **Подготовка ингредиентов**: Нарежьте картофель кубиками размером примерно 1 см, лук и чеснок мелко, брокколи нарежьте кусочками.\n2. **Отваривание макарон**: В большой кастрюле вскипятите воду, добавьте соль и отварите макароны согласно инструкции на упаковке. Отварите до готовности, но не пересушивайте. Откиньте на дуршлаг и дайте стечь воде.\n3. **Готовка мясного соуса**: В сотейнике разогрейте сливочное масло. Добавьте нарезанный лук и чеснок, обжарьте до золотистого цвета. Добавьте фарш и обжарьте до изменения цвета. Добавьте томатную пасту, соль и перец, перемешайте и тушите еще 2-3 минуты.\n4. **Добавление овощей**: Добавьте нарезанный картофель и брокколи в мясо, перемешайте и тушите еще 5 минут.\n5. **Сборка блюда**: Верните отваренные макароны в сотейник, добавьте мясной соус и хорошо перемешайте. Подавайте сразу же, чтобы сохранить теплоту и вкус.\n6. **Украшение и подача**: Перед подачей на тарелки можно украсить блюдо зеленью.\n\nЭтот рецепт идеально подойдет для детского меню благодаря простому приготовлению и использованию безопасных ингредиентов.", "right": "Рецепт: Куриные ножки в овощном соусе\n\nКороткое описание:\nЭто простой и вкусный рецепт куриных ножек, приготовленных в соусе из томатов, лука и моркови. Соус получается ароматным и не слишком острым, что подходит для детей.\n\nВремя приготовления: 1 час 30 минут (включая время маринования)\n\nКоличество порций: 4 порции\n\nСписок ингредиентов:\n- 8 куринých ножек\n- 2 большие моркови\n- 2 средних луковицы\n- 500 г томатной пасты\n- 2 столовые ложки оливкового масла\n- Соль по вкусу\n- Молотый черный перец по вкусу\n- 1 чайная ложка сахара (для выравнивания вкуса)\n- 1 зубчик чеснока\n\nШаги приготовления:\n\n1. Нарежьте морковь тонкими дольками, лук - полукольцами, чеснок - тонкими пластинками.\n2. Куриную грудку промойте, обсушите бумажными полотенцами и сделайте несколько надрезов на каждой ножке, чтобы соус лучше проник в мясо.\n3. В глубокой миске смешайте куриную грудку с половиной чайной ложки соли, половиной чайной ложки молотого черного перца и сахаром. Добавьте чеснок и перемешайте. Закройте крышкой или плёнкой и оставьте на 30 минут для маринования.\n4. Тем временем, разогрейте сковороду на среднем огне и добавьте оливковое масло. Обжаривайте лук до золотистого цвета, затем добавьте морковь и жарьте ещё 5 минут.\n5. Добавьте томатную пасту и доведите до кипения, постоянно помешивая, чтобы соус не пригорел. Уменьшите огонь до минимума и варите 15 минут.\n6. После маринования слейте лишний сок с куриной грудки и добавьте её в соус. Повторно доведите до кипения, уменьшите огонь до минимального и варите ещё 20 минут, пока соус не станет густым и ножки не станут мягкими.\n7. Подавайте горячими, можно украшить свежей зеленью, если хотите.\n\nНаслаждайтесь вкусным и питательным блюдом!"}]};

function md(t){
  const out=[]; let list=null;
  const close=()=>{ if(list){ out.push("</"+list+">"); list=null; } };
  for (const raw of t.split("\n")) {
    const l = raw.trim(); if (!l) { close(); continue; }
    let m;
    if ((m = l.match(/^#\s+(.*)/))) { close(); out.push("<h4>"+esc(m[1])+"</h4>"); }
    else if ((m = l.match(/^#{2,6}\s+(.*)/))) { close(); out.push("<h5>"+esc(m[1])+"</h5>"); }
    else if ((m = l.match(/^[-*•]\s+(.*)/))) { if(list!=="ul"){ close(); out.push("<ul>"); list="ul"; } out.push("<li>"+esc(m[1])+"</li>"); }
    else if ((m = l.match(/^\d+[.)]\s+(.*)/))) { if(list!=="ol"){ close(); out.push("<ol>"); list="ol"; } out.push("<li>"+esc(m[1])+"</li>"); }
    else { close(); out.push("<p>"+esc(l).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")+"</p>"); }
  }
  close(); return out.join("");
}
function render(){
  const n = DATA.items.length;
  document.getElementById("count").textContent = Math.min(i+1, n) + " / " + n;
  document.getElementById("bar").style.width = (100*Object.keys(votes).length/n) + "%";
  if (i >= n) return finish();
  const it = DATA.items[i], v = votes[it.id];
  document.getElementById("main").innerHTML =
    '<div class="prompt">'+esc(it.prompt)+'</div><p class="hint muted">Какой рецепт лучше: правильнее, понятнее, реально приготовить?</p>'+
    '<div class="cols"><div class="card'+(v==="L"?" chosen":"")+'"><h3>Левый</h3><div class="md">'+md(it.left)+'</div></div>'+
    '<div class="card'+(v==="R"?" chosen":"")+'"><h3>Правый</h3><div class="md">'+md(it.right)+'</div></div></div>';
  window.scrollTo(0,0);
}
function vote(c){ if (i >= DATA.items.length) return; votes[DATA.items[i].id] = c; save(); i++; render(); }
function back(){ if (i > 0) { i--; render(); } }
function finish(){
  document.getElementById("actions").style.display = "none";
  let a=0,b=0,t=0; const items=[];
  for (const it of DATA.items) {
    const v = votes[it.id]; if (!v) continue;
    const w = v==="T" ? "tie" : ((v==="L") === it.a_left ? "a" : "b");
    if (w==="a") a++; else if (w==="b") b++; else t++;
    items.push({id: it.id, prompt: it.prompt, winner: w});
  }
  const n=a+b+t, wr = n ? (b+0.5*t)/n : 0;
  const res = {a: DATA.a, b: DATA.b, a_wins: a, ties: t, b_wins: b, win_rate_b: wr, items};
  const blob = URL.createObjectURL(new Blob([JSON.stringify(res, null, 2)], {type:"application/json"}));
  document.getElementById("main").innerHTML = '<div class="result"><h2>Готово</h2><table>'+
    '<tr><td>'+esc(DATA.a)+' лучше</td><td><b>'+a+'</b></td></tr><tr><td>Одинаково</td><td><b>'+t+'</b></td></tr>'+
    '<tr><td>'+esc(DATA.b)+' лучше</td><td><b>'+b+'</b></td></tr><tr><td>Win rate '+esc(DATA.b)+'</td><td><b>'+Math.round(100*wr)+'%</b></td></tr></table>'+
    '<p><a download="sbs_'+DATA.a+'_vs_'+DATA.b+'_results.json" href="'+blob+'"><button class="primary">Скачать результаты</button></a> '+
    '<button onclick="votes={};save();location.reload()">Начать заново</button></p>'+
    '<p class="muted">Положите файл в папку eval/ проекта и запустите scripts/compare.py.</p></div>';
}
document.addEventListener("keydown", e => {
  if (e.key==="1"||e.key==="ArrowLeft") vote("L"); else if (e.key==="2"||e.key==="ArrowDown") vote("T");
  else if (e.key==="3"||e.key==="ArrowRight") vote("R"); else if (e.key==="Backspace") { e.preventDefault(); back(); }
});
render();
</script></body></html>
