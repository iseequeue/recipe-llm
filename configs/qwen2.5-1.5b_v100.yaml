# Qwen2.5-1.5B-Instruct + LoRA on 1-2x Tesla V100 (16 GB or 32 GB).
# fp16 AMP on tensor cores; no bf16 / flash-attention 2 on Volta -> SDPA.
# Fits a 16 GB V100. On 32 GB add for ~25-30% speed:
#   gradient_checkpointing=false per_device_train_batch_size=8 gradient_accumulation_steps=2
model_name: Qwen/Qwen2.5-1.5B-Instruct
model_dtype: fp16

dataset_name: d0rj/povarenok_recipes_detail
max_train_samples: 20000   # top-viewed recipes; full set is ~150k
max_eval_samples: 300
max_seq_len: 1024

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

output_dir: outputs/qwen2.5-1.5b-recipes
num_train_epochs: 1
per_device_train_batch_size: 4
per_device_eval_batch_size: 8
gradient_accumulation_steps: 4   # effective batch 16 on 1 GPU, 32 on 2 GPUs
learning_rate: 2.0e-4
warmup_ratio: 0.03
gradient_checkpointing: true

logging_steps: 10
eval_steps: 200
save_steps: 200            # must be a multiple of eval_steps (best-checkpoint selection)

mlflow_experiment: recipe-llm
